schema_version: 2
id: G-OPS-05
name: "Evidence-Completeness und Audit-Trail-Integritaet"
dimension: "regulatorisch"
lifecycle_phase: "operations"
trigger: "kubectl apply — OPA Gatekeeper Admission Controller + Decision-Log-Validierung bei Cluster-Admission"

evidence_level:
  current: "E-0"
  target: "E-1"
  rationale: "Streng eingestuft auf den schwaechsten Bestandteil: der Gatekeeper-Anteil (genaiops.io/evidence-store-connected, .../hash-chain-enabled) prueft Pod-Annotationen — eine Annotation behauptet einen Zustand, sie beweist ihn nicht (SPEC-01 Abschnitt 2). Der Hash-Chain-Verifikationsanteil (verify_hash_chain.py, SHA-256-Kettenpruefung ueber die tatsaechlich gespeicherten Records) war bis 01.09.2026 als E-1 ausgewiesen; das trifft nicht zu (B-18, HISTORIE H4.21). E-1 verlangt Signatur UND gepruefte Erzeuger-Identitaet: SHA-256 ist eine Pruefsumme, kein Signaturverfahren, inserted_by ist eine selbstgewaehlte Zeichenkette, und die Faelschungskosten sind Schreibzugriff auf die Datenbank, nicht Kompromittierung der CI-Identitaet. Die Kette ist manipulationsevident gegen Teilaenderungen — eine Aussage ueber innere Konsistenz, nicht ueber Herkunft — und liegt damit auf E-0 mit einer Zusatzeigenschaft. C-02 ist deshalb auf E-0 zurueckgestuft; E-1 folgt mit SPEC-05 (signiertes Evidenz-Manifest, keyless, identitaetsgebunden verifiziert). Das Gate als Ganzes bleibt auf dem Niveau seines schwaechsten Checks."

policy_checks:
  - id: "C-01"
    policy: "policy_evidence_completeness"
    description: "Vollstaendigkeit aller Gate-Records — Gatekeeper-Annotationspruefung"
    severity: "MUST"
    legal_refs: ["Art. 12", "Art. 15"]
    evidence_level: "E-0"
    implementation: "implemented"
  - id: "C-02"
    policy: "policy_evidence_completeness"
    description: "Hash-Chain-Integritaet ueber alle Evidence-Records"
    severity: "MUST"
    legal_refs: ["Art. 12", "Art. 15"]
    evidence_level: "E-0"
    implementation: "implemented"
  - id: "C-03"
    policy: "policy_evidence_completeness"
    description: "Audit-Trail-Immutabilitaet"
    severity: "MUST"
    legal_refs: ["Art. 12", "Art. 15"]
    evidence_level: null
    implementation: "implemented"

# Frage 5 (HANDBUCH 3.4): was folgt aus dem Urteil? Ohne diese Angabe
# fuellt die Vorstellung die Luecke (B-13).
triggers:
- effect: halt_pipeline
  when: block
  implementation: implemented
  by: pipeline/gate_orchestrator.py — pipeline_halted
- effect: record_only
  when: warn
  implementation: implemented
  by: Evidence Store — jede Gate-Entscheidung wird als Record persistiert

evidence_required:
  - "decision_log_entries"
  - "hash_chain_validation_record"

decision: "derived"
automation: "AUTO"
role_scope: ["deployer"]
owner: "AI Governance Lead"
audit_trail:
  enabled: true
  evidence_store_ref: "evidence://gates/operations/G-OPS-05"
waiver:
  allowed: false
  requires: "Kein Waiver moeglich — Evidence-Integritaet ist Grundvoraussetzung fuer Auditierbarkeit"
links:
  requirements:
    - "R005"
  eu_ai_act_refs:
    - "Art. 12"
    - "Art. 15"
sources:
  - "requirements/R005.yaml"
notes: "PoC-Gate (★). AUTO: Dediziertes Gate fuer Evidence-Persistierung. Gatekeeper + Decision Logs pruefen Vollstaendigkeit aller Gate-Records und Hash-Chain-Integritaet. Jede Gate-Entscheidung — automatisiert oder manuell — wird als signierter, inhaltsadressierter Evidence-Record persistiert (Butt et al., 2026: Evidence Backbone). policy_evidence_completeness, policy_hash_chain_integrity und policy_audit_trail_immutability sind gebuendelt in policies/operations/policy_evidence_completeness.rego implementiert (eine Datei, mehrere Checks, hier als C-01/C-02/C-03 auf dieselbe Datei abgebildet). UPDATE (2026-08-14, schema_version 2 / SPEC-01): policy_checks auf Objektform migriert, Severity aus R005 (MUST) uebernommen. Erstes Beispiel fuer check-spezifisches evidence_level != Gate-Default (C-02 Hash-Chain-Verifikation auf E-1, C-01 Gatekeeper-Annotation auf E-0 — demonstriert genau die in SPEC-01 Abschnitt 2 beschriebene Orthogonalitaet von Automatisierbarkeit und Beweiskraft). UPDATE (2026-09-01, SPEC-05 Teil 1): diese E-1-Einstufung von C-02 ist zurueckgenommen (B-18 / HISTORIE H4.21). Sie war an der eigenen Definition gemessen falsch — eine Hash-Kette bindet keine Erzeuger-Identitaet. C-02 steht auf E-0; der Katalog traegt damit voruebergehend keinen einzigen E-1-Check, und das ist der ehrliche Zwischenzustand, bis SPEC-05 das signierte Evidenz-Manifest liefert. UPDATE (2026-08-25): die feste Zahl \"16/16\" aus Beschreibung und Notes entfernt. Sie stammte aus dem Thesis-Stand, war seit der Ueberfuehrung von G-OPS-06 (SPEC-03) falsch und haette bei jeder weiteren Gate-Aenderung erneut veralten muessen. Ein Vollstaendigkeits-Gate, das die erwartete Anzahl hart kodiert, prueft eine Konstante statt einer Eigenschaft — die Zahl gehoert aus dem Katalog abgeleitet, nicht in die Beschreibung geschrieben."
