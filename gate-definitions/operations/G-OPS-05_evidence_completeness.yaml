schema_version: 2
id: G-OPS-05
name: "Evidence-Completeness und Audit-Trail-Integritaet"
dimension: "regulatorisch"
lifecycle_phase: "operations"
trigger: "kubectl apply — OPA Gatekeeper Admission Controller + Decision-Log-Validierung bei Cluster-Admission"

evidence_level:
  current: "E-0"
  target: "E-1"
  rationale: "Streng eingestuft auf den schwaechsten Bestandteil: der Gatekeeper-Anteil (genaiops.io/evidence-store-connected, .../hash-chain-enabled) prueft Pod-Annotationen — eine Annotation behauptet einen Zustand, sie beweist ihn nicht (SPEC-01 Abschnitt 2). Der Hash-Chain-Verifikationsanteil (verify_hash_chain.py, SHA-256-Kettenpruefung ueber die tatsaechlich gespeicherten Records) ist fuer sich genommen bereits ein berechneter Integritaetsnachweis auf E-1-Niveau; das Gate als Ganzes bleibt aber auf dem Niveau seines schwaechsten Checks."

policy_checks:
  - id: "C-01"
    policy: "policy_evidence_completeness"
    description: "Vollstaendigkeit aller Gate-Records (16/16) — Gatekeeper-Annotationspruefung"
    severity: "MUST"
    legal_refs: ["Art. 12", "Art. 15"]
    evidence_level: "E-0"
  - id: "C-02"
    policy: "policy_evidence_completeness"
    description: "Hash-Chain-Integritaet ueber alle Evidence-Records"
    severity: "MUST"
    legal_refs: ["Art. 12", "Art. 15"]
    evidence_level: "E-1"
  - id: "C-03"
    policy: "policy_evidence_completeness"
    description: "Audit-Trail-Immutabilitaet"
    severity: "MUST"
    legal_refs: ["Art. 12", "Art. 15"]
    evidence_level: null

evidence_required:
  - "decision_log_entries"
  - "hash_chain_validation_record"

decision: "derived"
automation: "AUTO"
owner: "AI Governance Lead"
audit_trail:
  enabled: true
  evidence_store_ref: "evidence://gates/operations/G-OPS-05"
waiver:
  allowed: false
  requires: "Kein Waiver moeglich — Evidence-Integritaet ist Grundvoraussetzung fuer Auditierbarkeit"
links:
  requirements:
    - "R005"
  eu_ai_act_refs:
    - "Art. 12"
    - "Art. 15"
sources:
  - "requirements/R005.yaml"
notes: "PoC-Gate (★). AUTO: Dediziertes Gate fuer Evidence-Persistierung. Gatekeeper + Decision Logs pruefen Vollstaendigkeit aller Gate-Records (16/16) und Hash-Chain-Integritaet. Jede Gate-Entscheidung — automatisiert oder manuell — wird als signierter, inhaltsadressierter Evidence-Record persistiert (Butt et al., 2026: Evidence Backbone). policy_evidence_completeness, policy_hash_chain_integrity und policy_audit_trail_immutability sind gebuendelt in policies/operations/policy_evidence_completeness.rego implementiert (eine Datei, mehrere Checks, hier als C-01/C-02/C-03 auf dieselbe Datei abgebildet). UPDATE (2026-08-14, schema_version 2 / SPEC-01): policy_checks auf Objektform migriert, Severity aus R005 (MUST) uebernommen. Erstes Beispiel fuer check-spezifisches evidence_level != Gate-Default (C-02 Hash-Chain-Verifikation auf E-1, C-01 Gatekeeper-Annotation auf E-0 — demonstriert genau die in SPEC-01 Abschnitt 2 beschriebene Orthogonalitaet von Automatisierbarkeit und Beweiskraft)."
