schema_version: 2
id: G-OPS-02
name: "Incident Reporting"
dimension: "regulatorisch"
lifecycle_phase: "operations"
trigger: "kubectl apply — OPA Gatekeeper Admission Controller evaluiert Deployment-Manifest bei Cluster-Admission"

evidence_level:
  current: "E-0"
  target: "E-1"
  rationale: "Gatekeeper prueft Pod-Annotationen bei Cluster-Admission — eine Annotation behauptet einen Zustand, sie beweist ihn nicht (SPEC-01 Abschnitt 2)."

policy_checks:
  - id: "C-01"
    policy: "policy_incident_process_exists"
    description: "incident-response-configured, incident-contact, rollback-mechanism (3 Checks, 6 violation-Rules)"
    severity: "MUST"
    legal_refs: ["Art. 26 Abs. 5", "Art. 73"]
    evidence_level: null
    implementation: "implemented"

  - id: "C-02"
    policy: "policy_incident_thresholds"
    description: "Die Schwellenwert-Festlegung existiert und nennt, auf welche Vorfallarme sich die AI-Act-Pflicht nach Art. 73 Abs. 9 reduziert"
    severity: "MUST"
    legal_refs: ["Art. 73 Abs. 9", "Art. 3 Abs. 49"]
    evidence_level: "E-0"
    implementation: "implemented"
  - id: "C-03"
    policy: "policy_incident_thresholds"
    description: "Jede Schwelle ist gesetzt oder als offen begruendet und an einen Vorfallarm gebunden — eine offene Schwelle warnt, eine unbegruendete blockiert"
    severity: "SHOULD"
    legal_refs: ["Art. 3 Abs. 49 lit. c"]
    evidence_level: "E-0"
    implementation: "implemented"
  - id: "C-04"
    policy: "policy_incident_thresholds"
    description: "Die Meldefristen entsprechen dem Gesetz: 48h kritische Infrastruktur, 240h Tod, 360h Regelfall — je mit Rechtsgrundlage"
    severity: "MUST"
    legal_refs: ["Art. 73 Abs. 2", "Art. 73 Abs. 3", "Art. 73 Abs. 4"]
    evidence_level: "E-0"
    implementation: "implemented"
  - id: "C-05"
    policy: "policy_incident_thresholds"
    description: "Beweissicherung vor Korrekturmassnahme ist gefordert — ein Rollback kann die Aufzeichnung des Vorfalls zerstoeren"
    severity: "SHOULD"
    legal_refs: ["Art. 73 Abs. 6"]
    evidence_level: "E-0"
    implementation: "implemented"

# SPEC-04b Teil 3.2 — ohne dieses Dokument hat das Gate die
# Schwellenwertfrage nicht geprueft, sondern uebersprungen.
required_inputs:
  - kind: "incident_thresholds"
    # Beobachtet dieser Input den laufenden Betrieb? Nur dann deckt er
    # eine Laufzeitpflicht. Eine fachliche Festlegung, kein Messwert. Sie sagt, WANN ein Vorfall meldepflichtig waere — sie stellt nicht fest, DASS einer eingetreten ist. Der Betrieb wird damit nicht beobachtet, und die Laufzeitpflicht aus R009 bleibt offen (B-14).
    observes_runtime: false
    # Wer dieses Dokument liest. Ohne die Angabe raet der Orchestrator
    # die Policy aus dem ersten Check des Gates — und wertet damit im
    # falschen Namespace aus, also faktisch gar nicht.
    evaluated_by: "policies/operations/policy_incident_thresholds.rego"
    produced_by: "pipeline/prepare_inputs.py (aus governance/incident_thresholds.yaml)"
    rationale: "C-02 bis C-05 werten diese Festlegung aus. Fehlt sie, bleibt die Frage 'wann ist ein Vorfall meldepflichtig' unbeantwortet."

# Frage 5 (HANDBUCH 3.4): was folgt aus dem Urteil? Ohne diese Angabe
# fuellt die Vorstellung die Luecke (B-13).
triggers:
- effect: halt_pipeline
  when: block
  implementation: implemented
  by: pipeline/gate_orchestrator.py — pipeline_halted
- effect: start_deadline
  when: block
  implementation: declared_only
  by: Fristenuhr Art. 73 — existiert nicht (B-08 Luecke 5)
  rationale: >-
    Art. 73 Abs. 3: 48h bei schwerer und irreversibler Stoerung kritischer
    Infrastruktur, 240h bei Tod, 360h im Regelfall. G-OPS-02/C-04 prueft, dass
    die Fristen KORREKT WIEDERGEGEBEN sind; dass eine Frist LAEUFT, misst nichts.
- effect: open_incident
  when: block
  implementation: declared_only
  by: Vorfallerkennung — existiert nicht, Schwellenwerte auf unset
  rationale: >-
    Art. 26 Abs. 5 verlangt eine FOLGE — Anbieter informieren, dann Behoerde —
    kein Urteil. Ein Gate, das nur PASS/FAIL kann, bildet diese Pflicht
    konstruktiv nicht ab.

evidence_required:
  - "incident_process_documentation"
  - "rollback_verification_record"
  - "incident_threshold_decision"        # NEU 27.08. — governance/incident_thresholds.yaml

decision: "derived"
automation: "AUTO"
role_scope: ["deployer"]
owner: "DevOps Engineer"
audit_trail:
  enabled: true
  evidence_store_ref: "evidence://gates/operations/G-OPS-02"
waiver:
  allowed: false
  requires: "Kein Waiver moeglich. Das Gate-Template sah bis 2026-08-17 einen Ausnahmepfad mit Genehmiger und Befristung vor, aber es gab keine Implementierung: 'waiver' kam in pipeline/, evidence-store/, policies/ und .github/ in keiner Zeile Logik vor, und das Evidence-Schema kennt nur decision IN ('PASS','FAIL') — ein ausgesetztes Gate war von einem bestandenen nicht unterscheidbar. Ein Ausnahmepfad, der keine Spur hinterlaesst, entwertet die Lueckenlosigkeit der Hash-Kette; ein Kontrollsystem ohne Ausnahmepfad ist ehrlicher als eines mit einem, der nicht funktioniert. Entscheidung: abgeschafft statt implementiert."
links:
  requirements:
    - "R009"
  eu_ai_act_refs:
    - "Art. 26 Abs. 5"
    - "Art. 73"
sources:
  - "requirements/R009.yaml"
notes: "IMPLEMENTED (2026-03-28) — policy_incident_process_exists.rego: 3 Checks (incident-response-configured, incident-contact, rollback-mechanism), 6 violation-Rules (Gatekeeper-Konvention 'violation', nicht Conftest-'deny'). Fixtures: deployment_incident_pass.json, deployment_incident_fail.json. UPDATE (2026-08-14, schema_version 2 / SPEC-01): policy_checks auf Objektform migriert, Severity aus R009 (MUST) uebernommen. WAIVER ABGESCHAFFT (2026-08-17, Audit F-2): der bisherige Ausnahmepfad lautete \"AI Governance Lead Approval, befristet auf 14 Tage\" — als Governance-Absicht hier bewahrt, falls Waiver spaeter wirklich implementiert werden. Bis dahin gilt: keine Ausnahme. UPDATE (2026-08-27): Bis heute prueft dieses Gate DREI POD-ANNOTATIONEN bei der Zulassung — Incident-Prozess konfiguriert, Kontakt benannt, Rollback vorhanden. Alle drei E-0. Nichts sagte, WANN ein Vorfall meldepflichtig ist, und keine Frist war bekannt. Der Entwurf der Kommissionsleitlinien zu Art. 73 (26.09.2025, erschlossen in compliance-art73-vorfallmeldung.md) aendert die Fragestellung: Nach Art. 73 Abs. 9 reduziert sich fuer Annex-III-Nr.-2-Systeme, die bereits CER und NIS2 unterliegen, die AI-Act-Meldepflicht auf Art. 3 Abs. 49 lit. c — GRUNDRECHTE (Rn. 57, 60). Betriebsstoerungen laufen weiter ueber CER (24h) und NIS2 (24/72h). Fuer einen Netzbetreiber lautet die Frage also nicht \"ab welcher Fehlerrate\", sondern \"wann wird eine Lastabwurf-Entscheidung zur Diskriminierung\" — und genau das ist das Beispiel der Kommission (Rn. 58). Neu C-02 bis C-05 gegen governance/incident_thresholds.yaml. C-04 ist der einzige Check, bei dem das Dokument objektiv falsch sein kann: die Fristen sind Recht (48/240/360h), kein Ermessen; eine Fristenuhr auf einer falschen Frist meldet Konformitaet, nachdem das Fenster zu ist. C-03 warnt bei offenen Schwellen statt zu blockieren — beide Schwellen sind heute unset, weil ihre Festlegung eine Rechtsauslegung und eine Fairness-Messung im Betrieb voraussetzt, die es nicht gibt (B-08 Luecke 3). SPANNUNG, bewusst stehengelassen: C-01 wertet \"rollback-mechanism: true\" als erfuellt, waehrend Art. 73 Abs. 6 Veraenderungen verbietet, die die Ursachenbewertung beeintraechtigen — ein Rollback nach einem Vorfall kann selbst meldepflichtig sein (C-05 warnt darauf)."
