    severity: "MUST"
    legal_refs: ["Art. 14", "Art. 26 Abs. 2"]
    evidence_level: null

evidence_required:
  - "hitl_role_assignment_document"
  - "override_procedure_document"

decision: "derived"
automation: "HYBRID"
role_scope: ["deployer"]
owner: "AI Governance Lead"
audit_trail:
  enabled: true
  evidence_store_ref: "evidence://gates/operations/G-OPS-01"
