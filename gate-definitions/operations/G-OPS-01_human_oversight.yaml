notes: "IMPLEMENTED (2026-07-01) — policy_human_oversight_operational.rego (Conftest gegen app_documentation.json: oversight_roles, escalation_procedure, output_override, real_time_monitoring) + Gatekeeper ConstraintTemplate constraint-human-oversight.yaml (Runtime-Admission auf Pod-Annotationen). HYBRID: Gatekeeper validiert dass HITL-Mechanismen und Override-Prozeduren als K8s-Ressourcen konfiguriert sind; manueller Review prueft Wirksamkeit der Sterz-Bedingungen (Causal Power, Epistemic Access, Self-Control, Fitting Intentions). D3-Override (Laux, 2024): First-Degree Oversight → max. HYBRID. UPDATE (2026-08-14, schema_version 2 / SPEC-01): policy_checks auf Objektform migriert, Severity aus R008 (MUST) uebernommen. Siehe SPEC-02 Abschnitt 6: G-PRE-01/C-A7 verweist auf dieses Gate als Wirksamkeitsnachweis fuer Human-Oversight-Aufsicht."
