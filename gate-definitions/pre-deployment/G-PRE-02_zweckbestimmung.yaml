schema_version: 2
id: G-PRE-02
name: "Zweckbestimmung"
dimension: "regulatorisch"
lifecycle_phase: "pre-deployment"
trigger: "PR merge to main branch — Conftest evaluiert app_documentation.json und model_documentation.json im CI-Lauf"

evidence_level:
  current: "E-0"
  target: "E-1"
  rationale: "Conftest prueft Pflichtfelder im Dokumentationsmanifest (Selbstauskunft); keine signierte Attestierung."

policy_checks:
  - id: "C-01"
    policy: "policy_purpose_declaration"
    description: "application.description und application.domain deklariert; FRIA-Vervollstaendigung: stakeholder_groups und mitigation_documented (die Felder, die G-PRE-05 nicht abdeckt)"
    severity: "MUST"
    legal_refs: ["Art. 27"]
    evidence_level: null
    implementation: "implemented"

# Frage 5 (HANDBUCH 3.4): was folgt aus dem Urteil? Ohne diese Angabe
# fuellt die Vorstellung die Luecke (B-13).
triggers:
- effect: halt_pipeline
  when: block
  implementation: implemented
  by: pipeline/gate_orchestrator.py — pipeline_halted

evidence_required:
  - "purpose_declaration_document"
  - "intended_use_boundaries_document"

decision: "derived"
automation: "HYBRID"
role_scope: ["deployer"]
owner: "AI Governance Lead"
audit_trail:
  enabled: true
  evidence_store_ref: "evidence://gates/pre-deployment/G-PRE-02"
waiver:
  allowed: false
  requires: "Kein Waiver moeglich. Das Gate-Template sah bis 2026-08-17 einen Ausnahmepfad mit Genehmiger und Befristung vor, aber es gab keine Implementierung: 'waiver' kam in pipeline/, evidence-store/, policies/ und .github/ in keiner Zeile Logik vor, und das Evidence-Schema kennt nur decision IN ('PASS','FAIL') — ein ausgesetztes Gate war von einem bestandenen nicht unterscheidbar. Ein Ausnahmepfad, der keine Spur hinterlaesst, entwertet die Lueckenlosigkeit der Hash-Kette; ein Kontrollsystem ohne Ausnahmepfad ist ehrlicher als eines mit einem, der nicht funktioniert. Entscheidung: abgeschafft statt implementiert."
links:
  requirements:
    - "R012"
  eu_ai_act_refs:
    - "Art. 27"
sources:
  - "requirements/R012.yaml"
notes: "HYBRID: Conftest prueft Pflichtfelder (application.description, application.domain, FRIA stakeholder_groups, FRIA mitigation_documented); manueller Review bewertet inhaltliche Vollstaendigkeit der FRIA. Redundanz-Hinweis (Anhang M/H, aus dem Rego-Kommentar uebernommen): fria_completed und affected_rights werden von G-PRE-05 geprueft, dieses Gate deckt die davon nicht erfassten FRIA-Vollstaendigkeitsfelder ab. UPDATE (2026-08-14, schema_version 2 / SPEC-01): policy_checks auf Objektform migriert, Severity aus R012 (MUST) uebernommen. KORREKTUR EINER STALEN NOTIZ: die alte Notiz 'DESIGN-ONLY — Rego-Implementierung als Future Work' war veraltet/falsch — policies/pre-deployment/policy_purpose_declaration.rego existiert bereits mit 6 deny-Rules (die alten Policy-Namen 'policy_purpose_declaration_complete'/'policy_model_description_complete'/'policy_intended_use_boundaries' waren nie eingeloeste Platzhalter-Namen, die tatsaechliche Implementierung heisst policy_purpose_declaration und ist zu einem Check C-01 konsolidiert). WAIVER ABGESCHAFFT (2026-08-17, Audit F-2): der bisherige Ausnahmepfad lautete \"Governance Lead Approval, befristet auf 30 Tage\" — als Governance-Absicht hier bewahrt, falls Waiver spaeter wirklich implementiert werden. Bis dahin gilt: keine Ausnahme."
