notes: "HYBRID: Conftest prueft ob Risiken identifiziert und Mitigationen vorhanden; manueller Review bewertet Qualitaet des Risikoregisters. R001 wird zusaetzlich durch G-PRE-01 operationalisiert (Mehrfachzuordnung); Redundanz-Abgrenzung laut Rego-Kommentar: G-PRE-01 deckt risk_classification.* ab, dieses Gate das davon distincte Risikomanagement-Register und die Daten-Risikobewertung. UPDATE (2026-08-14, schema_version 2 / SPEC-01): policy_checks auf Objektform migriert, Severity aus R001 (MUST) uebernommen. KORREKTUR EINER STALEN NOTIZ: die alte Notiz 'DESIGN-ONLY — Rego-Implementierung als Future Work' war veraltet/falsch — policies/pre-deployment/policy_risk_management_complete.rego existiert bereits mit 7 deny-Rules; policy_data_risk_assessed war nie eine eigene Datei, sondern ist als Rule-Untergruppe (data_risk_assessment.assessed/data_classification) in derselben Datei enthalten, daher C-02 mit demselben policy-Dateinamen."
