schema_version: 2
id: G-PRE-05
name: "Strategische Governance-Freigabe"
dimension: "strategisch"
lifecycle_phase: "pre-deployment"
trigger: "ArgoCD Manual-Sync — Conftest evaluiert app_documentation.json; anschliessend manueller Approval-Workflow auf Leitungsebene"

evidence_level:
  current: "E-0"
  target: "E-1"
  rationale: "Conftest prueft Existenz eines Dokuments (Selbstauskunft); der manuelle Approval-Workflow ist nicht kryptographisch attestiert."

policy_checks:
  - id: "C-01"
    policy: "policy_governance_approval"
    description: "FRIA abgeschlossen mit affected_rights, human_oversight_model + oversight_lead definiert, kill_switch fuer High-Risk, Konformitaetserklaerung verfuegbar, Governance-Approval-Nachweis (approved_by, approved_at)"
    severity: "MUST"
    legal_refs: ["Art. 14"]
    evidence_level: null
    implementation: "implemented"

evidence_required:
  - "governance_policy_document"
  - "leadership_approval_record"

decision: "derived"
automation: "HYBRID"
role_scope: ["deployer"]
owner: "AI Governance Lead + CTO"
audit_trail:
  enabled: true
  evidence_store_ref: "evidence://gates/pre-deployment/G-PRE-05"
waiver:
  allowed: false
  requires: "Kein Waiver moeglich. Das Gate-Template sah bis 2026-08-17 einen Ausnahmepfad mit Genehmiger und Befristung vor, aber es gab keine Implementierung: 'waiver' kam in pipeline/, evidence-store/, policies/ und .github/ in keiner Zeile Logik vor, und das Evidence-Schema kennt nur decision IN ('PASS','FAIL') — ein ausgesetztes Gate war von einem bestandenen nicht unterscheidbar. Ein Ausnahmepfad, der keine Spur hinterlaesst, entwertet die Lueckenlosigkeit der Hash-Kette; ein Kontrollsystem ohne Ausnahmepfad ist ehrlicher als eines mit einem, der nicht funktioniert. Entscheidung: abgeschafft statt implementiert."
links:
  requirements:
    - "R004"
  eu_ai_act_refs:
    - "Art. 14"
sources:
  - "requirements/R004.yaml"
notes: "PoC-Gate (★). HYBRID: Kein Lucaj-Template-Feld (R004 operiert ausserhalb des technischen Dokumentationsrahmens). Conftest prueft FRIA-Vollstaendigkeit, Human-Oversight-Modell, Kill-Switch (High-Risk), Konformitaetserklaerung und Approval-Nachweis; manueller Approval-Workflow stellt strategische Verankerung sicher. D3-Override (Laux, 2024): First-Degree Oversight → max. HYBRID. UPDATE (2026-08-14, schema_version 2 / SPEC-01): policy_checks auf Objektform migriert, Severity aus R004 (MUST) uebernommen. KORREKTUR EINER STALEN NOTIZ: die alte Notiz beschrieb nur eine reine 'Existenz'-Pruefung ('policy_governance_approval_exists') — tatsaechlich implementiert policies/pre-deployment/policy_governance_approval.rego 17 deny-Rules mit deutlich groesserem Umfang (FRIA, Human Oversight, Kill-Switch, Konformitaet, Approval-Evidenz). WAIVER ABGESCHAFFT (2026-08-17, Audit F-2): der bisherige Ausnahmepfad lautete \"Vorstand-Approval, befristet auf 30 Tage, dokumentierte Begruendung\" — als Governance-Absicht hier bewahrt, falls Waiver spaeter wirklich implementiert werden. Bis dahin gilt: keine Ausnahme."
