schema_version: 2
id: G-XXX-00
name: ""
dimension: "regulatorisch|technisch|strategisch"
lifecycle_phase: "pre-deployment|deployment|operations"
trigger: ""

# Beweiskraft — IST und ZIEL (orthogonal zur Automatisierbarkeit)
evidence_level:
  current: "E-0"          # E-0 | E-1 | E-2 | E-3
  target: "E-1"           # E-0 | E-1 | E-2 | E-3
  rationale: ""           # warum dieses Ziel, was fehlt bis dahin

# Liste von Objekten statt Liste von Strings — Severity gehoert an den Check
policy_checks:
  - id: "C-01"                        # gate-lokal eindeutig
    policy: "policy_xxx"              # Rego-Package bzw. Dateiname
    description: ""
    severity: "MUST"                  # MUST -> deny (blockierend)
                                      # SHOULD -> warn (advisory)
    legal_refs: []                    # z. B. ["Art. 26 Abs. 4"]
    evidence_level: null              # optional; null = Gate-Default aus evidence_level.current
    # implementation: laeuft dieser Check tatsaechlich?
    #   implemented  -> eine Rego-Datei setzt ihn durch
    #   design_only  -> entworfen, aber noch nicht implementiert; das Gate
    #                   kann PASS melden, ohne dass dieser Check geprueft hat
    # Die Angabe macht den Unterschied zwischen "deklariert" und
    # "durchgesetzt" aus der Gate-Definition heraus ableitbar, statt ihn nur
    # im notes-Feld und im README zu erwaehnen.
    implementation: "implemented"     # implemented | design_only

# Frage 5 der Gate-Anatomie (HANDBUCH 3.4): WAS FOLGT AUS DEM URTEIL?
#
# Ein Gate erzeugt ein Urteil und einen Nachweis. Was daraus folgt — Rollout
# blockieren, Vorfall eroeffnen, Frist starten, jemanden benachrichtigen —
# stand bis 2026-08-27 nirgends. Der Orchestrator bricht bei FAIL ab, aber
# das ist eine Eigenschaft des Orchestrators, nicht des Gates.
#
# Wo nichts deklariert ist, fuellt die Vorstellung die Luecke (B-13): ein
# Beitragsentwurf beschrieb fuer G-OPS-02 eine Eskalationskaskade, weil das
# Gate ueber seine Wirkung schweigt und eine Meldepflicht ohne Wirkung
# sinnlos waere. Die Behauptung war der plausible Schluss aus einer Leerstelle.
#
# Fuer Art. 26 Abs. 5 ist das nicht optional: die Norm verlangt eine FOLGE,
# kein Urteil.
#
# effect:        halt_pipeline | record_only | open_incident | start_deadline
#                | notify
# implementation: implemented | declared_only
#   declared_only heisst: die Wirkung ist gewollt und beschrieben, aber noch
#   nicht gebaut — dieselbe Ehrlichkeit wie policy_checks[].implementation.
triggers:
  - effect: "halt_pipeline"
    # "when", nicht "on": YAML 1.1 liest einen unquotierten Schluessel `on`
    # als Boolean true. Der Schluessel hiesse dann True statt "on".
    when: "block"
    implementation: "implemented"
    by: "pipeline/gate_orchestrator.py — pipeline_halted"
# Beispiel fuer eine gewollte, noch nicht gebaute Wirkung:
#   - effect: "start_deadline"
#     when: "block"
#     implementation: "declared_only"
#     by: "Fristenuhr Art. 73 — existiert nicht (B-08 Luecke 5)"
#     rationale: "Art. 73 Abs. 3: 48h bei kritischer Infrastruktur"

# SPEC-04b Teil 3.2 — optional. Dokumente, die dem Gate vorgelegt werden
# MUESSEN, damit es ueberhaupt geprueft werden kann.
#
# Zwingend, sobald ein Check evidence_level E-2 oder E-3 traegt: solche
# Checks werten ein Dokument aus, das jemand erzeugen muss, und feuern
# nicht, wenn es fehlt. Ohne diese Deklaration waere die hohe Beweisstufe
# durch Weglassen des Inputs umgehbar — geprueft von
# tests/test_integrity_regression.py :: REQUIRED_INPUTS_ENFORCED.
#
# Das Szenario liefert die Pfade unter gates[].inputs.<kind>.
required_inputs: []
# Beispiel:
#   - kind: "drift_measurement"
#     produced_by: "monitoring/drift_detector.py --measurement-out <pfad>"
#     max_age_seconds: 900
#     rationale: "warum das Gate ohne dieses Dokument nichts geprueft hat"

evidence_required: []

# Nicht mehr gesetzt, sondern abgeleitet (siehe SPEC-01 Abschnitt 5):
# 1. Mindestens ein MUST-Check verletzt      -> block
# 2. Gate ist HYBRID (D3xD2-Override greift) -> manual_review
# 3. Mindestens ein SHOULD-Check verletzt     -> warn
# 4. Sonst                                    -> approve
decision: "derived"

# Automatisierungsklassifikation bleibt auf Gate-Ebene
automation: "AUTO|HYBRID|MANUAL"

# Rollenparameter (SPEC-03): welche Pflichtenmenge dieses Gate bedient.
# Der Anbieter schuldet die Beschaffenheit des Systems (Art. 8-15),
# der Betreiber die Beschaffenheit der Verwendung (Art. 26).
role_scope: ["deployer"]     # ["provider"] | ["deployer"] | ["provider","deployer"]

owner: ""
audit_trail:
  enabled: true
  evidence_store_ref: ""
# Waiver: seit 2026-08-17 (Audit F-2) gibt es keinen Ausnahmepfad.
# Das Template sah einen vor, aber nichts hat ihn je durchgesetzt: keine
# Logik in pipeline/, evidence-store/, policies/ oder .github/, und das
# Evidence-Schema kennt nur decision IN ('PASS','FAIL') — ein ausgesetztes
# Gate war von einem bestandenen nicht unterscheidbar.
#
# allowed: true erst wieder setzen, wenn es eine echte Kontrolle gibt:
# Waiver als eigener Evidence-Record mit Genehmiger, Begruendung und
# Ablaufdatum IN DER HASH-PAYLOAD, Ablaufdurchsetzung, und eine sichtbare
# Unterscheidung bestanden/ausgesetzt im Reporting. Die Integrity-Regression
# (WAIVER_NOT_DECLARATIVE) blockiert ein allowed: true ohne diese Kontrolle.
waiver:
  allowed: false
  requires: ""
links:
  requirements: []
  eu_ai_act_refs: []
sources: []
notes: ""
