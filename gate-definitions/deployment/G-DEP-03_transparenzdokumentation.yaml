notes: "PARTIALLY IMPLEMENTED (2026-03-28) — policy_transparency_docs_present.rego added: 5 Checks (deployer instructions, capabilities, limitations, AI content labeling). Fixtures: app_documentation_transparency_pass.json, app_documentation_transparency_fail.json. policy_explainability_documented still DESIGN-ONLY, severity konservativ MUST gesetzt (R007 ist MUST). UPDATE (2026-08-14, schema_version 2 / SPEC-01): policy_checks auf Objektform migriert. WAIVER ABGESCHAFFT (2026-08-17, Audit F-2): der bisherige Ausnahmepfad lautete \"Governance Lead Approval, befristet auf 30 Tage\" — als Governance-Absicht hier bewahrt, falls Waiver spaeter wirklich implementiert werden. Bis dahin gilt: keine Ausnahme."
