id: G-DEP-01
name: "Data Governance"
dimension: "technisch"
lifecycle_phase: "deployment"
trigger: "PR merge to main branch — Conftest evaluiert model_documentation.json und data_documentation.json im CI-Lauf"
policy_checks:
  - "policy_data_provenance_documented"
  - "policy_training_documented"
  - "policy_data_lineage_complete"
  - "policy_dataset_description_complete"
  - "policy_annotation_quality_verified"
  - "policy_data_license_valid"
evidence_required:
  - "data_governance_documentation"
  - "data_lineage_record"
  - "dataset_description_document"
decision: "block"
owner: "Data Engineer"
audit_trail:
  enabled: true
  evidence_store_ref: "evidence://gates/deployment/G-DEP-01"
waiver:
  allowed: true
  requires: "Data Governance Lead Approval, befristet auf 30 Tage"
links:
  requirements:
    - "R002"
    - "R006"
  eu_ai_act_refs:
    - "Art. 10"
    - "Art. 11"
sources:
  - "requirements/R002.yaml"
  - "requirements/R006.yaml"
notes: "PARTIALLY IMPLEMENTED (2026-03-28) — policy_data_provenance_documented.rego added: 5 Checks, 10 deny-Rules. Fixtures: data_documentation_provenance_pass.json, data_documentation_provenance_fail.json. Remaining 5 policies (training_documented, data_lineage, dataset_description, annotation_quality, data_license) still DESIGN-ONLY. UPDATE (2026-08-14): Art. 10 Abs. 5 wurde durch VO (EU) 2026/1744 (Digital Omnibus on AI) gestrichen und die Rechtsgrundlage fuer Verarbeitung besonderer Datenkategorien zur Bias-Erkennung/-Korrektur in einen neuen Art. 4a ueberfuehrt (erweitert auf Deployer/weitere KI-Systeme). Art. 11 Abs. 1 UAbs. 2 neu gefasst plus neue vereinfachte Doku-Form fuer SMEs/SMCs — fuer dieses Projekt nicht einschlaegig (kein SME-Fall). Materielle Data-Governance-Pflichten (Art. 10 Abs. 1/6) unveraendert; Anwendungsfrist fuer Annex-III-Hochrisiko-Systeme von 2. August 2026 auf 2. Dezember 2027 verschoben. policy_data_provenance_documented.rego bleibt gueltig, keine Code-Aenderung noetig."
