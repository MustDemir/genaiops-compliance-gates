schema_version: 2
id: G-DEP-01
name: "Data Governance"
dimension: "technisch"
lifecycle_phase: "deployment"
trigger: "PR merge to main branch — Conftest evaluiert model_documentation.json und data_documentation.json im CI-Lauf"

evidence_level:
  current: "E-0"
  target: "E-1"
  rationale: "Conftest prueft Selbstauskunft (data_documentation.json/model_documentation.json); keine signierte Attestierung der Datenherkunft."

policy_checks:
  - id: "C-01"
    policy: "policy_data_provenance_documented"
    description: "Datenherkunft (collection_methods, sources, preprocessing_steps, data_version) dokumentiert"
    severity: "MUST"
    legal_refs: ["Art. 10", "Art. 11"]
    evidence_level: null
    implementation: "implemented"
  - id: "C-02"
    policy: "policy_training_documented"
    description: "Trainingsprozess dokumentiert"
    severity: "MUST"
    legal_refs: ["Art. 10", "Art. 11"]
    evidence_level: null
    implementation: "design_only"
  - id: "C-03"
    policy: "policy_data_lineage_complete"
    description: "Data Lineage vollstaendig"
    severity: "MUST"
    legal_refs: ["Art. 10", "Art. 11"]
    evidence_level: null
    implementation: "design_only"
  - id: "C-04"
    policy: "policy_dataset_description_complete"
    description: "Dataset-Beschreibung vollstaendig"
    severity: "MUST"
    legal_refs: ["Art. 10", "Art. 11"]
    evidence_level: null
    implementation: "design_only"
  - id: "C-05"
    policy: "policy_annotation_quality_verified"
    description: "Annotationsqualitaet verifiziert"
    severity: "MUST"
    legal_refs: ["Art. 10", "Art. 11"]
    evidence_level: null
    implementation: "design_only"
  - id: "C-06"
    policy: "policy_data_license_valid"
    description: "Datenlizenz gueltig"
    severity: "MUST"
    legal_refs: ["Art. 10", "Art. 11"]
    evidence_level: null
    implementation: "design_only"

evidence_required:
  - "data_governance_documentation"
  - "data_lineage_record"
  - "dataset_description_document"

decision: "derived"
automation: "AUTO"
role_scope: ["deployer"]
owner: "Data Engineer"
audit_trail:
  enabled: true
  evidence_store_ref: "evidence://gates/deployment/G-DEP-01"
waiver:
  allowed: true
  requires: "Data Governance Lead Approval, befristet auf 30 Tage"
links:
  requirements:
    - "R002"
    - "R006"
  eu_ai_act_refs:
    - "Art. 10"
    - "Art. 11"
sources:
  - "requirements/R002.yaml"
  - "requirements/R006.yaml"
notes: "PARTIALLY IMPLEMENTED (2026-03-28) — policy_data_provenance_documented.rego added: 5 Checks, 10 deny-Rules. Fixtures: data_documentation_provenance_pass.json, data_documentation_provenance_fail.json. Remaining 5 policies (C-02..C-06: training_documented, data_lineage, dataset_description, annotation_quality, data_license) still DESIGN-ONLY, severity konservativ MUST gesetzt (R002/R006 sind beide MUST). UPDATE (2026-08-14): Art. 10 Abs. 5 wurde durch VO (EU) 2026/1744 (Digital Omnibus on AI) gestrichen und die Rechtsgrundlage fuer Verarbeitung besonderer Datenkategorien zur Bias-Erkennung/-Korrektur in einen neuen Art. 4a ueberfuehrt (erweitert auf Deployer/weitere KI-Systeme). Art. 11 Abs. 1 UAbs. 2 neu gefasst plus neue vereinfachte Doku-Form fuer SMEs/SMCs — fuer dieses Projekt nicht einschlaegig (kein SME-Fall). Materielle Data-Governance-Pflichten (Art. 10 Abs. 1/6) unveraendert; Anwendungsfrist fuer Annex-III-Hochrisiko-Systeme von 2. August 2026 auf 2. Dezember 2027 verschoben. policy_data_provenance_documented.rego bleibt gueltig, keine Code-Aenderung noetig. UPDATE (2026-08-14, schema_version 2 / SPEC-01): policy_checks auf Objektform migriert. OFFENER BEFUND (2026-08-15, Rollenabgrenzung): Dieses Gate traegt role_scope ['deployer'], referenziert in legal_refs aber Art. 10 UND Art. 11 — beides sind ANBIETERpflichten (Art. 16 lit. a i.V.m. Kapitel III Abschnitt 2). Die technische Dokumentation nach Art. 11 / Anhang IV ist zudem eine Pflicht des Anbieters GEGENUEBER BEHOERDEN und kein Anspruch des Betreibers; ein Gate, das sie vom Betreiber verlangt, pruefte eine Pflicht, die es fuer ihn nicht gibt. Betreiberseitig einschlaegig ist Art. 26 Abs. 4 (Relevanz der EINGABEdaten, soweit kontrolliert) — so auch R006. NICHT in dieser Iteration geaendert, weil die Korrektur die Requirement-Zuordnung (R002 ist Art.-11-verankert) mitbetrifft und zur Provider-Ableitung aus Art. 16 lit. a-l gehoert, die noch aussteht. Bis dahin ist die Referenz als zu weit gefasst zu lesen."
