schema_version: 2
id: G-DEP-02
name: "Safety-Metriken"
dimension: "technisch"
lifecycle_phase: "deployment"
trigger: "PR merge — eval/eval_runner.py ERZEUGT eval_results.json aus der laufenden App (Latenz/Durchsatz gemessen), Conftest evaluiert das Ergebnis (SPEC-04 Teil 2)"

evidence_level:
  current: "E-0"
  target: "E-1"
  rationale: "GEMISCHT seit SPEC-04 (2026-08-25), je Check ausgewiesen. Bis dahin war eval_results.json eine HANDDATEI: kein Code erzeugte sie, CI und lokale Pipeline lasen sie nur, und die geprueften Werte hatten mit den gemessenen nichts zu tun (HISTORIE 7.5 (1)). Jetzt erzeugt eval/eval_runner.py das Dokument: Latenz und Durchsatz stammen aus scribe_latency_seconds / scribe_requests_total der laufenden App (E-3-Herkunft), accuracy und safety_score bleiben deklariert (E-0) — ohne Ground Truth ist Genauigkeit im Betrieb nicht messbar (HISTORIE 7.6). Das Gate-weite Feld bleibt auf E-0, weil die beiden MUST-Schwellen accuracy und safety_score weiterhin auf deklarierten Werten stehen; genau darauf weist C-03 hin. E-1 (Signatur) folgt in SPEC-05 — erst Herkunft, dann Unterschrift."

policy_checks:
  - id: "C-01"
    policy: "policy_safety_metrics"
    description: "accuracy >= 0.85, latency_p95 <= 2000ms, safety_score >= 0.90, run_id vorhanden"
    severity: "MUST"
    legal_refs: ["Art. 15"]
    # E-0, obwohl latency_p95 seit SPEC-04 gemessen wird: der Check buendelt
    # drei Schwellen, zwei davon (accuracy, safety_score) stehen weiterhin auf
    # deklarierten Werten. Ein Check ist so stark wie seine schwaechste Quelle.
    # Die Aufspaltung in einen gemessenen und einen deklarierten Check waere
    # sauberer und bewegt die R003-Zuordnung mit — siehe offener Punkt.
    evidence_level: "E-0"
    implementation: "implemented"
  - id: "C-02"
    policy: "policy_safety_metrics"
    description: "subgroup_analysis und adversarial_tests durchgefuehrt"
    severity: "SHOULD"
    legal_refs: ["Art. 15"]
    evidence_level: "E-0"
    implementation: "implemented"
  - id: "C-03"
    policy: "policy_safety_metrics"
    description: "Warnt, wenn ein MUST-Schwellenwert auf einer Metrikgruppe mit provenance 'declared' angewandt wird — die Behauptung bleibt zulaessig, aber sie wird kenntlich"
    severity: "SHOULD"
    legal_refs: ["Art. 15", "Art. 72"]
    evidence_level: "E-0"
    implementation: "implemented"

# Frage 5 (HANDBUCH 3.4): was folgt aus dem Urteil? Ohne diese Angabe
# fuellt die Vorstellung die Luecke (B-13).
triggers:
- effect: halt_pipeline
  when: block
  implementation: implemented
  by: pipeline/gate_orchestrator.py — pipeline_halted

evidence_required:
  - "evaluation_metrics_report"
  - "adversarial_test_report"
  - "declared_metrics_source"          # NEU SPEC-04 — eval/declared_metrics.json

decision: "derived"
automation: "AUTO"
role_scope: ["deployer"]
owner: "ML Engineer"
audit_trail:
  enabled: true
  evidence_store_ref: "evidence://gates/deployment/G-DEP-02"
waiver:
  allowed: false
  requires: "Kein Waiver moeglich. Das Gate-Template sah bis 2026-08-17 einen Ausnahmepfad mit Genehmiger und Befristung vor, aber es gab keine Implementierung: 'waiver' kam in pipeline/, evidence-store/, policies/ und .github/ in keiner Zeile Logik vor, und das Evidence-Schema kennt nur decision IN ('PASS','FAIL') — ein ausgesetztes Gate war von einem bestandenen nicht unterscheidbar. Ein Ausnahmepfad, der keine Spur hinterlaesst, entwertet die Lueckenlosigkeit der Hash-Kette; ein Kontrollsystem ohne Ausnahmepfad ist ehrlicher als eines mit einem, der nicht funktioniert. Entscheidung: abgeschafft statt implementiert."
links:
  requirements:
    - "R003"
  eu_ai_act_refs:
    - "Art. 15"
sources:
  - "requirements/R003.yaml"
notes: "PoC-Gate (★). AUTO: Conftest prueft ob accuracy >= 0.85, latency_p95 <= 2000ms, safety_score >= 0.90 (Schwellenwerte aus eval_results.json). R003 wird zusaetzlich durch G-PRE-04 (Security-Baseline) und G-OPS-04 (Cybersecurity-Operations) operationalisiert (Mehrfachzuordnung phasenuebergreifend). UPDATE (2026-08-14, schema_version 2 / SPEC-01): Dies ist einer der beiden in SPEC-01 Abschnitt 3 dokumentierten Faelle mit heterogener Severity (Thesis-Limitation L12) — policy_robustness_tested (subgroup_analysis, adversarial_tests) war im Rego bereits korrekt als 'warn'/SHOULD implementiert (policies/deployment/policy_safety_metrics.rego), waehrend das alte Gate-weite decision:block dies auf MUST gezogen hat. Mit Check-Ebene-Severity ist das jetzt strukturell korrekt abgebildet: C-01 MUST (deny), C-02 SHOULD (warn). Keine Rego-Aenderung noetig, die Rego-Regeln waren schon richtig. WAIVER ABGESCHAFFT (2026-08-17, Audit F-2): der bisherige Ausnahmepfad lautete \"ML Lead + AI Governance Lead Approval, befristet auf 14 Tage\" — als Governance-Absicht hier bewahrt, falls Waiver spaeter wirklich implementiert werden. Bis dahin gilt: keine Ausnahme. UPDATE (2026-08-25, SPEC-04 Teil 2): eval_results.json war eine HANDDATEI und widersprach sich selbst — quality_metrics.accuracy 0.89, gleichzeitig gate_result.details \"value\": 0.91 fuer dieselbe Metrik. Kein Gate merkte es, weil die Schwellenregel input.quality_metrics.accuracy las und die vierte Regel input.gate_result.all_passed; die beiden Pfade wurden nie gegeneinander gehalten (HISTORIE 7.5 (1a)). Wo eine Zahl nicht erzeugt wird, kann sie nicht einmal mit sich selbst konsistent sein. Jetzt erzeugt eval/eval_runner.py das Dokument aus der laufenden App; gate_result ist ERSATZLOS ENTFALLEN (ein Pruefling bringt kein eigenes Zeugnis mit) samt der zugehoerigen deny-Regel und ihres Unit-Tests. Die Schwellenwerte und die Rego-Regeln sind UNVERAENDERT — falsch war nie die Regel, falsch war, woher die Zahl kam (HISTORIE 7.7). Neu C-03 (SHOULD): warnt, wenn eine MUST-Schwelle auf provenance \"declared\" steht. Bewusst SHOULD und nicht MUST — der gesamte Bestand ist heute deklariert, ein MUST faerbte ihn am Einfuehrungstag rot und bestrafte eine Luecke, die SPEC-04 ausdruecklich offen laesst; ein Gate, das immer fehlschlaegt, wird abgeschaltet."
