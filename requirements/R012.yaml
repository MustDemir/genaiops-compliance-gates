id: R012
title: "Grundrechte-Folgenabschaetzung muss vor Einsatz durchgefuehrt und dokumentiert sein"
kontrollmechanismus: "Pre-Deployment Gate-Pruefung auf abgeschlossene FRIA-Dokumentation"
lifecycle_phase: "pre-deployment"
governance_dimension: "strategisch"
eu_ai_act_refs:
  - "Art. 27"
must_should: "MUST"
description: "Deployer, die oeffentliche Stellen sind oder im oeffentlichen Auftrag handeln, muessen vor Erstverwendung eine Grundrechte-Folgenabschaetzung (FRIA) durchfuehren. Fuer private Deployer von High-Risk-Systemen empfohlen als Best Practice."
evidence_expected:
  - "fria_document"
  - "stakeholder_impact_assessment"
# DoD je Pflicht (ACCEPTANCE_CRITERIA_TRACED).
# status: met — mit evidence auf konkrete Gate-Checks
#         gap — mit Begruendung, was fehlt
#         unverified — noch nicht zurueckverfolgt
acceptance_criteria:
- criterion: FRIA ist abgeschlossen und versioniert.
  status: met
  evidence:
  - G-PRE-02/C-01
- criterion: Betroffene Grundrechte sind identifiziert und bewertet.
  status: unverified
- criterion: Mitigationsmassnahmen fuer identifizierte Risiken sind dokumentiert.
  status: unverified
linked_gates:
  - G-PRE-02
design_principles:
  - DP2
role: deployer
deployer_implication: "Zweckbestimmung und Einsatzgrenzen schriftlich dokumentieren und im Deployer-Kontext verankern."
provider_implication: ""
audit_trigger: "Pre-Deployment (einmalig pro Use-Case)"
sources:
  - "EU AI Act (VO 2024/1689) Art. 27"
  - "Huwyler (2025) [UE5LVI97] — Phase 4 Action 4.3: FRIA als Pre-Deployment-Pflicht, Stakeholder-Impact-Bewertung"
  - "Finch & Butt (2025) [HU5B664Q] — FRIA-Ontologie-Referenz (Pandit 2024), Fundamental Rights im AI Act Kontext"
  - "Burns et al. (2025) Dynamo [2GGF93BE] — Governance-Prozess inkl. Grundrechte-Bewertung"
notes: "v0.4 - Art. 27 Pflicht nur fuer bestimmte Deployer-Kategorien. Fuer Enterprise-Kontext als Best Practice aufgenommen. Huwyler ordnet FRIA in Phase 4 seines 6-Phasen-Frameworks ein."
