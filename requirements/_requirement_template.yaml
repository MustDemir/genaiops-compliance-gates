# role: Welche Pflichtenmenge dieses Requirement adressiert (SPEC-03).
# Merkformel: Der Anbieter schuldet die Beschaffenheit des SYSTEMS,
# der Betreiber die Beschaffenheit der VERWENDUNG.
# Art. 16 lit. a ist der Schluessel: Anbieter haben sicherzustellen, dass ihre
# Hochrisiko-KI-Systeme die Anforderungen aus Kapitel III Abschnitt 2
# (Art. 8-15) erfuellen. Damit sind Art. 9-15 ANBIETER-Pflichten;
# die Betreiberpflichten stehen in Art. 26 (und Art. 27 fuer die FRIA).
role: "provider|deployer|both"
# deployer_implication: 1-Satz-Zusammenfassung der konkreten Nachweis-Anforderung
# an den Deployer (Art. 26). Wird als Spalte in Tab A.1 (Anhang K4) gerendert.
# Inhalt muss aus description + kontrollmechanismus + acceptance_criteria
# ableitbar sein — keine neuen Claims.
deployer_implication: ""
# provider_implication: Gegenstueck zu deployer_implication fuer die
# Anbieterrolle (Art. 16 lit. a-l nebst Art. 17-20, 43, 47, 48, 49 Abs. 1).
# Bei den 14 bestehenden, deployer-gefilterten Requirements bewusst leer:
# die Ableitung der Provider-Requirements ist ein eigener Arbeitsblock und
# braucht zuerst die Primaerquellenrecherche zu diesen Artikeln (SPEC-03
# Abschnitt 6 — ausdruecklich NICHT Teil dieser SPEC).
provider_implication: ""
# audit_trigger: Wann wird die Evidenz ausgewertet? (Lifecycle-Phase + ggf.
# Post-Market-Verweis). Wird als Spalte in Tab A.1 gerendert. Mapping-Konvention:
# pre-deployment -> "Pre-Deployment CI/CD"
# deployment -> "Deployment CI/CD"
# operation -> "Runtime + Post-Market (Art. 72)"
