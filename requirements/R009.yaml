id: R009
title: Schwerwiegende Vorfaelle muessen erkannt, dokumentiert und gemeldet werden
kontrollmechanismus: Automatisierte Incident-Detection mit eskalationsbasiertem Meldeworkflow
lifecycle_phase: operation
governance_dimension: regulatorisch
eu_ai_act_refs:
- Art. 26 Abs. 5
- Art. 73
must_should: MUST
description: Deployer muessen schwerwiegende Vorfaelle (serious incidents) erkennen
  und den Provider sowie die zustaendige Marktueberwachungsbehoerde unverzueglich
  melden. Automatisierte Detection-Mechanismen unterstuetzen die Erkennung, der Meldeworkflow
  stellt Fristen sicher.
evidence_expected:
- incident_detection_config
- incident_report
- notification_timestamp_log
acceptance_criteria:
- Incident-Detection-Regeln sind konfiguriert und aktiv.
- Meldung erfolgt innerhalb der gesetzlichen Frist.
- Incident-Reports sind im Evidence Store versioniert.
linked_gates:
  - G-OPS-02
design_principles:
  - DP4
role: deployer
deployer_implication: "Incidents fristgerecht (Art. 73) an Behörden und Provider melden und Root-Cause-Analyse dokumentieren."
provider_implication: ""
# B-14 (27.08.2026): Dieses Requirement verlangt Laufzeitpruefung, und kein
# verlinktes Gate kann den Betrieb beobachten — alle feuern einmal bei der
# Zulassung. Die Luecke wird DEKLARIERT statt stillschweigend getragen,
# analog zu policy_checks[].implementation: design_only.
# Zulaessig: covered | declared_gap. Geprueft von TRIGGER_MATCHES_REQUIREMENT.
runtime_coverage: declared_gap
runtime_gap_reason: >-
  G-OPS-02 prueft drei Annotationen bei der Zulassung. Vorfallerkennung, Fristenuhr und Meldekaskade fehlen (HANDBUCH B-13, Ausbaustufe in HANDBUCH 6.1).
audit_trigger: "Runtime (Event-getriggert) + Post-Market"
sources:
- EU AI Act (VO 2024/1689) Art. 26 Abs. 5, Art. 73
- Kiejnich-Kruk (2025) [D6526468] — Deployer-Obligations-Analyse, Art. 26 Abs. 5 Incident
  Reporting
notes: v0.4 - Deployer-spezifische Meldepflicht. Art. 73 definiert Meldeverfahren.
  Kiejnich-Kruk analysiert Deployer-Pflichten systematisch.
