id: R013
title: "Bias- und Fairness-Monitoring muss im laufenden Betrieb implementiert sein"
kontrollmechanismus: "Continuous Monitoring mit automatisierter Bias-Detection und periodischer Fairness-Evaluation"
lifecycle_phase: "operation"
governance_dimension: "technisch"
eu_ai_act_refs:
  - "Art. 9 Abs. 2 lit. a"
  - "Art. 10 Abs. 2 lit. f"
  - "Art. 15"
must_should: "SHOULD"
description: "Im laufenden Betrieb sollen Bias-Metriken und Fairness-Indikatoren kontinuierlich erhoben werden. Signifikante Abweichungen von definierten Fairness-Schwellenwerten loesen Alerts und manuelle Review-Prozesse aus."
evidence_expected:
  - "bias_metrics_report"
  - "fairness_evaluation_log"
  - "alert_and_remediation_log"
acceptance_criteria:
  - "Bias-Metriken sind definiert und werden automatisch erhoben."
  - "Fairness-Schwellenwerte sind konfiguriert."
  - "Abweichungen ueber Schwellenwert loesen dokumentierte Alerts aus."
linked_gates:
  - G-DEP-05
design_principles:
  - DP5
role: deployer
deployer_implication: "Bias-/Fairness-Report vor Deployment bereitstellen; Mitigationsplan und Re-Evaluation dokumentieren."
provider_implication: ""
# B-14 (27.08.2026): Dieses Requirement verlangt Laufzeitpruefung, und kein
# verlinktes Gate kann den Betrieb beobachten — alle feuern einmal bei der
# Zulassung. Die Luecke wird DEKLARIERT statt stillschweigend getragen,
# analog zu policy_checks[].implementation: design_only.
# Zulaessig: covered | declared_gap. Geprueft von TRIGGER_MATCHES_REQUIREMENT.
runtime_coverage: declared_gap
runtime_gap_reason: >-
  G-DEP-05 prueft Bias einmal vor der Freigabe. Subgruppen-Performance ueber Zeit fehlt (HANDBUCH B-08 Luecke 3).
audit_trigger: "Deployment CI/CD + Runtime (periodische Re-Evaluation); Anwendungsfrist Art. 9/10/15 (Annex-III-Systeme) ab 2. Dezember 2027 gemaess VO (EU) 2026/1744"
sources:
  - "EU AI Act (VO 2024/1689) Art. 9, Art. 10 Abs. 2 lit. f, Art. 15"
  - "Díaz-Rodríguez et al. (2023) [NWJFNALE] — Trustworthy AI Requirements: Diversity, Non-Discrimination and Fairness Dimension, Lifecycle-Monitoring"
  - "Guldimann et al. (2025) COMPL-AI [QTQJ92VY] — Bias/Fairness-Benchmarks: alle LLMs zeigen Defizite bei Diversity/Non-Discrimination/Fairness"
notes: "v0.4 - SHOULD statt MUST da Deployer-Pflicht hier weniger explizit. Art. 10 primaer Provider, Deployer via Risikomanagement Art. 9. Díaz-Rodríguez liefert Taxonomie der Fairness-Dimensionen. Guldimann zeigt empirisch Bias-Defizite aller getesteten LLMs. v0.5 (2026-08-14): Gepruefte Artikel-Referenzen gegen VO (EU) 2026/1744 (Digital Omnibus on AI) — Art. 9, Art. 10 Abs. 2 lit. f und Art. 15 inhaltlich unveraendert; nur Anwendungsfrist verschoben. v0.6 (2026-08-15) — NEUBEWERTUNG GEPRUEFT, SHOULD BLEIBT: Es stand die These im Raum, die SHOULD-Herabstufung sei entfallen, weil der neue Art. 4a Abs. 2 Betreiber von Hochrisiko-KI-Systemen ausdruecklich nennt. Gegen den amtlichen deutschen Wortlaut geprueft (docs/legal/OJ_L_202601744_DE.pdf): Art. 4a Abs. 2 nennt sie zwar ausdruecklich ('Anbieter und Betreiber anderer KI-Systeme und KI-Modelle und Betreiber von Hochrisiko-KI-Systemen duerfen ausnahmsweise besondere Kategorien personenbezogener Daten verarbeiten'), schliesst aber mit dem Satz: 'Dieser Absatz begruendet keine Verpflichtung, eine solche Erkennung und Korrektur von Verzerrungen vorzunehmen.' Art. 4a ist damit eine ERLAUBNISNORM — er raeumt eine datenschutzrechtliche Schranke aus dem Weg, statt eine Bias-Pflicht zu begruenden. Die urspruengliche Begruendung ('Deployer-Pflicht hier weniger explizit') bleibt intakt; R013 bleibt SHOULD und G-DEP-05 bleibt advisory. Damit ist auch der in SPEC-01 Abschnitt 6 ausgeklammerte Punkt (Aufteilung von policy_bias_assessment_complete.rego auf gemischt MUST/SHOULD) beantwortet: es gibt keinen Anlass dafuer."
