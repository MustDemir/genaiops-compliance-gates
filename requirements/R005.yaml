id: R005
title: Evidence-Persistierung muss manipulationssicher und rueckverfolgbar erfolgen
kontrollmechanismus: Nachweispruefung auf unveraenderliche Ablage und referenzierbare
  Audit-Trail-Eintraege
lifecycle_phase: operation
governance_dimension: regulatorisch
eu_ai_act_refs:
- Art. 12
- Art. 15
must_should: MUST
description: Alle Gate-Entscheidungen muessen mit unveraenderlicher Evidence-Ablage
  und eindeutiger Referenz gespeichert werden.
evidence_expected:
- immutable_storage_reference
- audit_trail_entry
# DoD je Pflicht (ACCEPTANCE_CRITERIA_TRACED).
# status: met — mit evidence auf konkrete Gate-Checks
#         gap — mit Begruendung, was fehlt
#         unverified — noch nicht zurueckverfolgt
acceptance_criteria:
- criterion: Evidence-Referenzen sind fuer jeden Gate-Lauf vorhanden.
  status: met
  evidence:
  - G-OPS-05/C-01
- criterion: Aenderungen an bestehenden Evidence-Eintraegen sind technisch eingeschraenkt.
  status: met
  evidence:
  - G-OPS-05/C-03
linked_gates:
  - G-OPS-05
design_principles:
  - DP1
role: deployer
deployer_implication: "Audit-Trail vollständig und manipulationssicher (Hash-Chain) im Evidence Store persistieren."
provider_implication: ""
# B-14 (27.08.2026): Dieses Requirement verlangt Laufzeitpruefung, und kein
# verlinktes Gate kann den Betrieb beobachten — alle feuern einmal bei der
# Zulassung. Die Luecke wird DEKLARIERT statt stillschweigend getragen,
# analog zu policy_checks[].implementation: design_only.
# Zulaessig: covered | declared_gap. Geprueft von TRIGGER_MATCHES_REQUIREMENT.
runtime_coverage: declared_gap
runtime_gap_reason: >-
  G-OPS-05 prueft eine Pod-Annotation. Ob die Kette lueckenlos IST, steht in der eigenen Datenbank — Hash-Chain-Laenge und Luecken ueber Zeit waeren E-3 (HANDBUCH B-08).
audit_trigger: "Runtime (kontinuierlich) + Post-Market"
sources:
- EU AI Act (VO 2024/1689) Art. 12, Art. 15
- Eisenberg (2025) UCF [JUK36XAW] — Unified Control Framework, Evidence-Store-Konzept
notes: v0.4 - Eisenberg
  liefert Framework fuer Audit-Trail und Evidence-Persistierung.
