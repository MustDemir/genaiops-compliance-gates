id: R003
title: Robustheit, Genauigkeit und Sicherheitschecks muessen vor Promotion bestanden
  sein
kontrollmechanismus: Automatisierte Schwellenwertpruefung fuer Qualitaets- und Safety-Metriken
  in der Pipeline
lifecycle_phase: deployment
governance_dimension: technisch
eu_ai_act_refs:
- Art. 15
must_should: MUST
description: Ein Deployment darf nur erfolgen, wenn definierte technische Mindestkriterien
  nachweisbar erfuellt sind.
evidence_expected:
- eval_metrics_report
- safety_test_report
# DoD je Pflicht (ACCEPTANCE_CRITERIA_TRACED).
# status: met — mit evidence auf konkrete Gate-Checks
#         gap — mit Begruendung, was fehlt
#         unverified — noch nicht zurueckverfolgt
acceptance_criteria:
- criterion: Alle verpflichtenden Metriken liegen ueber den definierten Mindestwerten.
  status: met
  evidence:
  - G-DEP-02/C-01
- criterion: Fehlgeschlagene Safety-Checks fuehren zu blockierendem Gate-Entscheid.
  status: met
  evidence:
  - G-DEP-02/C-01
linked_gates:
  - G-PRE-04
  - G-DEP-02
  - G-OPS-04
design_principles:
  - DP1
role: deployer
deployer_implication: "Security-Baseline pre-deploy nachweisen, Safety-Metriken deploy-time validieren, Cybersecurity-Operations kontinuierlich überwachen."
provider_implication: ""
# B-14 (27.08.2026): Dieses Requirement verlangt Laufzeitpruefung, und kein
# verlinktes Gate kann den Betrieb beobachten — alle feuern einmal bei der
# Zulassung. Die Luecke wird DEKLARIERT statt stillschweigend getragen,
# analog zu policy_checks[].implementation: design_only.
# Zulaessig: covered | declared_gap. Geprueft von TRIGGER_MATCHES_REQUIREMENT.
runtime_coverage: declared_gap
runtime_gap_reason: >-
  G-PRE-04 prueft den Image-Build, G-DEP-02 die Freigabe-Metriken, G-OPS-04 die Runtime-Annotationen — keines beobachtet Robustheit im Betrieb. Fehlerrate unter Last und Timeout-Quote waeren die Messgroessen (HANDBUCH B-08 Luecke 7).
audit_trigger: "Pre-Deployment + Deployment + Runtime (kontinuierlich)"
sources:
- EU AI Act (VO 2024/1689) Art. 15
- Elia (2025) MQG4AI [QRW95D4X] — Robustness-Gate-Konzept, technische Qualitaetssicherung
notes: v0.4 - Elia definiert
  Gate-basierte Robustheits-Pruefung.
