id: R001
title: Risikomanagement fuer High-Risk GenAI muss nachweisbar operationalisiert sein
kontrollmechanismus: Policy-as-Code Pruefung auf dokumentiertes Risiko-Assessment
  vor Deployment
lifecycle_phase: pre-deployment
governance_dimension: regulatorisch
eu_ai_act_refs:
- Art. 9
must_should: MUST
description: Vor Freigabe muss ein versioniertes Risiko-Assessment mit benannten Mitigationsmassnahmen
  vorliegen.
evidence_expected:
- risk_assessment_report
- mitigation_plan
# DoD je Pflicht (ACCEPTANCE_CRITERIA_TRACED).
# status: met — mit evidence auf konkrete Gate-Checks
#         gap — mit Begruendung, was fehlt
#         unverified — noch nicht zurueckverfolgt
acceptance_criteria:
- criterion: Risiko-Assessment ist vorhanden, versioniert und dem Release zugeordnet.
  status: met
  evidence:
  - G-PRE-03/C-01
- criterion: Mindestens ein Mitigationsplan pro identifiziertem High-Risk-Risiko ist dokumentiert.
  status: unverified
linked_gates:
  - G-PRE-01
  - G-PRE-03
design_principles:
  - DP1
role: deployer
deployer_implication: "Versioniertes Risiko-Assessment mit Mitigationsplan pro identifiziertem High-Risk-Risiko vor Release-Freigabe bereitstellen."
provider_implication: ""
audit_trigger: "Pre-Deployment CI/CD; Re-Audit bei Release"
sources:
- EU AI Act (VO 2024/1689) Art. 9
- Elia (2025) MQG4AI [QRW95D4X] — Quality-Gate-Konzept fuer KI-Systeme, Risikomanagement-Methodik
notes: v0.4 - Elia liefert
  Gate-Konzept als Kontrollmechanismus fuer Art. 9.
