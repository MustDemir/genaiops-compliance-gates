id: R011
title: Konformitaetserklaerung und CE-Kennzeichnung muessen vor Einsatz geprueft sein
kontrollmechanismus: Pre-Deployment Gate-Pruefung auf vorhandene und gueltige Konformitaetsdokumentation
lifecycle_phase: pre-deployment
governance_dimension: regulatorisch
eu_ai_act_refs:
- Art. 26 Abs. 1
- Art. 47
- Art. 48
must_should: MUST
description: Vor Einsatz eines High-Risk-KI-Systems muss der Deployer pruefen, ob
  eine gueltige EU-Konformitaetserklaerung und CE-Kennzeichnung des Providers vorliegen.
  Ohne gueltige Konformitaetsdokumentation darf kein Deployment erfolgen.
evidence_expected:
- conformity_declaration_check
- ce_marking_verification
- provider_documentation_receipt
# DoD je Pflicht (ACCEPTANCE_CRITERIA_TRACED).
# status: met — mit evidence auf konkrete Gate-Checks
#         gap — mit Begruendung, was fehlt
#         unverified — noch nicht zurueckverfolgt
acceptance_criteria:
- criterion: EU-Konformitaetserklaerung liegt vor und ist gueltig.
  status: met
  evidence:
  - G-DEP-04/C-01
- criterion: CE-Kennzeichnung ist vorhanden.
  status: met
  evidence:
  - G-DEP-04/C-01
- criterion: Pruefergebnis ist im Evidence Store dokumentiert.
  status: met
  evidence:
  - G-OPS-05/C-01
linked_gates:
  - G-DEP-04
design_principles:
  - DP3
role: deployer
deployer_implication: "Konformitätserklärung und CE-Kennzeichnung vor Inbetriebnahme prüfen und dokumentieren."
provider_implication: ""
audit_trigger: "Deployment CI/CD + Re-Audit bei Substantial Modification"
sources:
- EU AI Act (VO 2024/1689) Art. 26 Abs. 1, Art. 47, Art. 48
- Kiejnich-Kruk (2025) [D6526468] — Deployer-Obligations-Analyse, Art. 26 Abs. 1 CE-Pruefpflicht
notes: v0.4 - reine Deployer-Pflicht. Keine eigene Konformitaetsbewertung, nur
  Pruefung der Provider-Dokumentation. Kiejnich-Kruk bestaetigt CE-Check als Deployer-Eingangspruefung.
