id: R007
title: "Nutzertransparenz und Informationspflichten muessen vor Einsatz erfuellt sein"
kontrollmechanismus: "Gate-Pruefung auf vorhandene Transparenzdokumentation und Nutzerkennzeichnung"
lifecycle_phase: "deployment"
governance_dimension: "regulatorisch"
eu_ai_act_refs:
  - "Art. 13"
  - "Art. 26 Abs. 7"
  - "Art. 50"
must_should: "MUST"
description: "Betroffene Personen und Nutzer muessen ueber den Einsatz des High-Risk-KI-Systems informiert werden. Transparenzhinweise muessen verstaendlich, zugaenglich und aktuell sein. Bei GenAI-Systemen gilt zusaetzlich Art. 50 (KI-generierte Inhalte kennzeichnen)."
evidence_expected:
  - "transparency_notice"
  - "user_information_document"
  - "ai_content_labeling_config"
# DoD je Pflicht (ACCEPTANCE_CRITERIA_TRACED).
# status: met — mit evidence auf konkrete Gate-Checks
#         gap — mit Begruendung, was fehlt
#         unverified — noch nicht zurueckverfolgt
acceptance_criteria:
- criterion: Transparenzhinweis ist fuer Endnutzer sichtbar und verstaendlich.
  status: gap
  gap_reason: Sichtbarkeit fuer Endnutzer ist eine Laufzeiteigenschaft der Oberflaeche. G-DEP-03 prueft Dokumente
    (B-14).
- criterion: Informationspflichten gemaess Art. 13 und Art. 26 Abs. 7 sind dokumentiert.
  status: met
  evidence:
  - G-DEP-03/C-01
- criterion: KI-generierte Inhalte werden gemaess Art. 50 gekennzeichnet.
  status: unverified
linked_gates:
  - G-DEP-03
design_principles:
  - DP5
role: deployer
deployer_implication: "Transparenzhinweise für Endnutzer bereitstellen; KI-generierte Inhalte gemäß Art. 50 kennzeichnen."
provider_implication: ""
# B-14 (27.08.2026): Dieses Requirement verlangt Laufzeitpruefung, und kein
# verlinktes Gate kann den Betrieb beobachten — alle feuern einmal bei der
# Zulassung. Die Luecke wird DEKLARIERT statt stillschweigend getragen,
# analog zu policy_checks[].implementation: design_only.
# Zulaessig: covered | declared_gap. Geprueft von TRIGGER_MATCHES_REQUIREMENT.
runtime_coverage: declared_gap
runtime_gap_reason: >-
  G-DEP-03 prueft die Transparenzdokumente. User-Interface-Checks im Betrieb finden nicht statt.
audit_trigger: "Deployment CI/CD + Runtime (User-Interface-Checks)"
sources:
  - "EU AI Act (VO 2024/1689) Art. 13, Art. 26 Abs. 7, Art. 50"
  - "Guldimann et al. (2025) COMPL-AI [QTQJ92VY] — Art. 13 Interpretability + Explainability Benchmarks (Abschn. 3.1.3, HR-Benchmarks)"
  - "Corrêa & Mönig (2024) [XVM65FRQ] — Ethical Requirements Catalog mit Transparenz-Dimension"
notes: "v0.4 - aus R002 ausgelagert. Art. 50 GenAI-spezifisch. Guldimann operationalisiert Art. 13 (1, 3b, 3d) mit messbaren Transparency-Benchmarks fuer LLMs."
