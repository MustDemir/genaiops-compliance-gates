# ================================================================
# cronjob-drift-detector.yaml — Kubernetes CronJob for Drift Detection
# ================================================================
# Phase 9.6: Runs drift_detector.py every 5 minutes in the cluster.
#
# What this does (Overview):
#   This CronJob is the automated "watchdog" for model quality.
#   Every 5 minutes, Kubernetes creates a new Pod that:
#   1. Fetches current metrics from the AI Scribe app
#   2. Compares them against the saved baseline (from ConfigMap)
#   3. Computes PSI + JSD scores
#   4. If drift exceeds thresholds → records FAIL to Evidence Store
#   5. Exports metrics to Prometheus (scraped by ServiceMonitor)
#
#   This is the operational embodiment of G-OPS-03:
#   "The system SHALL continuously monitor model performance
#    and detect data drift."
#
# Architecture mapping:
#   Pillar S5 → CronJob → drift_detector.py → Evidence Store (S4)
#   EU AI Act: Art. 72 (Post-Market Surveillance)
# ================================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-detector
  namespace: genaiops
  labels:
    app.kubernetes.io/name: drift-detector
    app.kubernetes.io/part-of: genaiops-compliance-gates
    app.kubernetes.io/component: monitoring
  annotations:
    genaiops.io/gate-id: "G-OPS-03"
    genaiops.io/pillar: "S5"
    genaiops.io/requirement: "R010"
    genaiops.io/eu-ai-act: "Art. 72"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: drift-detector
          annotations:
            genaiops.io/drift-detection-enabled: "true"
            genaiops.io/evidence-store-connected: "true"
        spec:
          containers:
            - name: drift-detector
              image: genaiops/drift-detector:latest
              imagePullPolicy: IfNotPresent
              # ── SPEC-04 (2026-08-25): image requirements changed ──
              # --record-evidence no longer lets this script decide. It
              # writes a measurement document, evaluates it through
              # G-OPS-03 with conftest, and records what Rego decided.
              #
              # The image therefore needs, in addition to the script:
              #   - monitoring/metrics_source.py  next to drift_detector.py
              #   - the `conftest` binary on PATH
              #   - policies/operations/ resolvable from the script's
              #     parent-of-parent (REPO_ROOT), i.e. lay the repo out as
              #     /app/monitoring/drift_detector.py + /app/policies/...
              #     rather than flattening the script to /app/.
              #
              # Until the image is rebuilt that way, this CronJob exits 2
              # with "conftest not found" instead of silently falling back
              # to a Python verdict — that fallback is exactly what SPEC-04
              # removes. NOT YET REBUILT: there is no Dockerfile for this
              # image in the repo (only the scribe app has one).
              command: ["python3", "/app/monitoring/drift_detector.py"]
              args:
                - "--source"
                - "http://ambient-ai-scribe.genaiops.svc:8080/metrics"
                - "--baseline"
                - "/data/baseline.json"
                - "--record-evidence"
              envFrom:
                - configMapRef:
                    name: drift-config
              env:
                - name: EVIDENCE_STORE_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: evidence-store-credentials
                      key: database-url
                      optional: true
              volumeMounts:
                - name: baseline
                  mountPath: /data
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: baseline
              configMap:
                name: drift-baseline
          restartPolicy: OnFailure
