    (EU) 2019/1020 beschließen, in Bezug auf diese Nichtkonformität eine Ermittlung einzuleiten. Im Zuge
    der Einleitung einer solchen Ermittlung unterrichtet das Büro für Künstliche Intelligenz den Akteur
    des betreffenden KI-Systems. Das Büro für Künstliche Intelligenz kann die in Absatz 1 dieses Artikels
    genannten Befugnisse von Amts wegen oder aufgrund einer gemäß Artikel 85 dieser Verordnung eingegangenen
