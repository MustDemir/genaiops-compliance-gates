  offset: 133003
  laenge: 2017
  saetze: 8
  beleg: e) betriebliche Räumlichkeiten und Bücher oder Unterlagen jeder Art für die Dauer der Inspektion
    in dem hierfür erforderlichen Ausmaß zu versiegeln. Stellt das Büro für Künstliche Intelligenz fest,
    dass sich eine natürliche oder juristische Person einer Inspektion widersetzt oder diese behindert,
    so gewährt die zuständige nationale Behörde des betreffenden Mitgliedstaats gegebenenfalls unter Einsatz
    von Polizeikräften oder einer entsprechenden vollziehenden Behörde die erforderliche Unterstützung,
    damit die Vor-Ort-Inspektion durchgeführt werden kann. Ist für eine Vor-Ort-Inspektion von Geschäftsräumen,
    Grundstücken oder Immobilien eine gerichtliche Genehmigung nach nationalem Recht erforderlich, so
    ersucht das Büro für Künstliche Intelligenz um eine solche Genehmigung. Das Büro für Künstliche Intelligenz
    kann die Genehmigung auch vorsorglich beantragen. Wird eine solche Genehmigung beantragt, so verifiziert
    die nationale Justizbehörde unverzüglich, dass die geplanten Zwangsmaßnahmen im Hinblick auf den Gegenstand
    der Untersuchung oder Inspektion und die vom Büro für Künstliche Intelligenz mit dem Beschluss vorgelegten
    Unterlagen weder willkürlich noch unverhältnismäßig sind. Bei der Prüfung der Verhältnismäßigkeit
    von Zwangsmaßnahmen kann die nationale Justizbehörde das Büro für Künstliche Intelligenz um detaillierte
    Erläuterungen bitten, insbesondere in Bezug auf die Gründe, die dem Büro für Künstliche Intelligenz
    Anlass zu der Vermutung geben, dass ein Verstoß gegen diese Verordnung vorliegt, sowie auf die Schwere
    des mutmaßlichen Verstoßes und die Art der Beteiligung der Person, gegen die sich die Zwangsmaßnahmen
    richten. Die nationale Justizbehörde darf weder die Notwendigkeit der Untersuchung oder Inspektion
    prüfen noch Auskünfte aus der Verfahrensakte des Büros für Künstliche Intelligenz verlangen. Gemäß
    den Verträgen unterliegt die Rechtmäßigkeit des Beschlusses des Büros für Künstliche Intelligenz ausschließlich
    der Kontrolle durch den Gerichtshof der Europäischen Union.
