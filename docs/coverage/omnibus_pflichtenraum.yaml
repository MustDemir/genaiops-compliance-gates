  satz: '1'
  offset: 153788
  laenge: 423
  saetze: 1
  beleg: Unbeschadet der Anwendung des Artikels 5 gemäß Artikel 113 Absatz 3 Buchstabe a gilt diese Verordnung
    für Akteure von Hochrisiko-KI-Systemen — mit Ausnahme der in Absatz 1 des vorliegenden Artikels genannten
    Systeme —, die vor dem Beginn der Anwendung des Kapitels III gemäß Artikel 113 in Verkehr gebracht
    oder in Betrieb genommen wurden, nur dann, wenn diese Systeme danach in ihrer Konzeption erheblich
    verändert wurden.
  anweisung: Omnibus Art. 1 Nr. 39 lit. a
  ziel: Art. 111 Abs. 2
  aenderung: neu_gefasst
  adressat: sonstige
  pflicht: Fuer vor Beginn der Anwendung von Kapitel III (Art. 113 Abs. 3 - fuer Anhang-III-Systeme der
    2.12.2027) in Verkehr gebrachte/in Betrieb genommene Hochrisiko-KI-Systeme (ausser Anhang-X-Systemen)
    gilt die Verordnung fuer deren AKTEURE nur bei danach erfolgter wesentlicher Konzeptionsaenderung;
    fuer von Behoerden bestimmungsgemaess genutzte Systeme treffen Anbieter UND Betreiber die erforderlichen
    Massnahmen in jedem Fall bis zum 2.8.2030.
  scope: in
  scope_grund: 'Steuernde Norm (T-13 Raster, Ausnahme von Schritt 3): Anwendbarkeitsregel fuer ''Akteure''
    (schliesst den Betreiber ein). Uebernimmt nach A-F2a die Einordnung von Art. 111 Abs. 2 Satz 1 der
    Grundfassung (PO 23.09.2026, 2b E1).'
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: null
  requirement: []
  gate: []
  befund: nicht_einschlaegig
  befund_grund: 'Steuernd: Anwendbarkeitsregel. Fuer Hochrisiko-KI-Systeme, die vor dem Beginn der Anwendung
    von Kapitel III (Anhang III: 2. Dezember 2027, Art. 113 Abs. 3 lit. c Ziff. i n.F.) in Betrieb genommen
    wurden, gilt die Verordnung nur nach erheblicher Veraenderung der Konzeption. Keine eigene pruefbare
    Pflicht; ob das eigene System darunter faellt, prueft die Massnahme P0 (G-PRE-01, Kopplung an G-OPS-06/C-25b).'
  po_bestaetigt: true
  po_entscheid:
  - 2026-09-29 · P2-F2 a (bestaetigte Einordnung gilt fuer die Neufassung weiter)
- uid: Art. 111 Abs. 2 Satz 2 n.F.@154212
  id: Art. 111 Abs. 2 Satz 2 n.F.
  artikel: '111'
  artikel_titel: Änderung der Verordnung (EU) 2024/1689
  abschnitt: null
  absatz: null
  nummer: null
  unterabsatz: null
  buchstabe: null
  ziffer: null
  satz: '2'
  offset: 154212
  laenge: 268
  saetze: 1
  beleg: In jedem Fall treffen die Anbieter und Betreiber von Hochrisiko-KI-Systemen, die bestimmungsgemäß
    von Behörden verwendet werden sollen, die erforderlichen Maßnahmen zur Erfüllung der in dieser Verordnung
    festgelegten Anforderungen und Pflichten bis zum 2. August 2030.
  anweisung: Omnibus Art. 1 Nr. 39 lit. a
  ziel: Art. 111 Abs. 2
  aenderung: neu_gefasst
  adressat: betreiber
  pflicht: Anbieter und Betreiber von Hochrisiko-KI-Systemen, die bestimmungsgemaess von Behoerden verwendet
    werden sollen, erfuellen die Anforderungen und Pflichten bis zum 2.8.2030.
  scope: in
  scope_grund: 'Adressat Betreiber (T-13 Schritt 4): ''treffen die Anbieter und Betreiber''. Uebernimmt
    nach A-F2a die Einordnung von Art. 111 Abs. 2 Satz 2 der Grundfassung; ob der Betreiber Behoerde ist,
    ist offen (S3-1, Paket 4).'
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: null
  requirement: []
  gate: []
  befund: luecke
  befund_grund: 'ZENTRALER BEFUND (im Abschlussbericht gesondert hervorzuheben), NACH OMNIBUS-PRUEFUNG
    PRAEZISIERT: Kapitel III (und damit Art. 26) gilt fuer bereits vor dem Stichtag in Verkehr gebrachte/in
    Betrieb genommene Anhang-III-Systeme erst ab dem 2. Dezember 2027 (Art. 113 Abs. 3 lit. c Ziff. i
    n.F.), AUSSER bei nachtraeglicher wesentlicher Konzeptionsaenderung oder bei einem Behoerden-Betreiber
    (Frist 2.8.2030 statt eines Bestandsschutzes). WENN das Redispatch-KI-System bereits vor diesem Stichtag
    in Verkehr gebracht/in Betrieb genommen wurde UND seither nicht wesentlich veraendert wurde UND der
    Netzbetreiber keine Behoerde ist, greifen die in diesem Pflichtenraum geprueften Art.-26-Betreiberpflichten
    fuer dieses spezifische System derzeit (Stand dieses Laufs: September 2026) noch gar nicht. Kein Requirement/Gate
    im Katalog prueft das Inverkehrbringungsdatum, die Aenderungshistorie oder die Rechtsnatur des Betreibers
    - die zeitliche Anwendbarkeit der gesamten uebrigen Deckungsanalyse (Art. 26 ff.) auf DIESES Projekt
    ist damit eine ungeklaerte Tatsachenfrage, die der PO vorab klaeren sollte.'
  po_bestaetigt: false
