- uid: Art. 25 Abs. 2 n.F.@94460
  id: Art. 25 Abs. 2 n.F.
  artikel: '25'
  artikel_titel: Änderung der Verordnung (EU) 2024/1689
  abschnitt: null
  absatz: null
  nummer: null
  unterabsatz: null
  buchstabe: null
  ziffer: null
  offset: 94460
  laenge: 767
  saetze: 3
  beleg: '(2) Unter den in Absatz 1 genannten Umständen gilt der Anbieter, der das KI-System ursprünglich
    in Verkehr gebracht oder in Betrieb genommen hatte, nicht mehr als Anbieter dieses spezifischen KI-Systems
    für die Zwecke dieser Verordnung. Dieser Erstanbieter arbeitet eng mit neuen Anbietern zusammen, stellt
    die erforderlichen Informationen zur Verfügung und sorgt für den nach vernünftigem Ermessen zu erwartenden
    technischen Zugang und sonstige Unterstützung, die für die Erfüllung der in dieser Verordnung festgelegten
    Pflichten, insbesondere in Bezug auf die Konformitätsbewertung von Hochrisiko-KI-Systemen, erforderlich
    sind. Die in Unterabsatz 2 festgelegte Verpflichtung umfasst, sofern dies für die dort genannten Zwecke
    relevant ist, insbesondere Folgendes:'
  anweisung: Omnibus Art. 1 Nr. 12 lit. a
  ziel: Art. 25 Abs. 2
  aenderung: neu_gefasst
  adressat: anbieter
  pflicht: Wird der Betreiber durch lit. a-c zum neuen Anbieter, muss der urspruengliche Anbieter (Erstanbieter)
    mit ihm kooperieren, Informationen, technischen Zugang und Unterstuetzung fuer die Konformitaetsbewertung
    bereitstellen - ausser der Erstanbieter hat den Uebergang zum Hochrisiko-System ausdruecklich ausgeschlossen.
  scope: in
  scope_grund: 'Anbieterpflicht mit Durchschlag (2b E4): trifft den Betreiber, wenn er nach Art. 25 Abs.
    1 zum neuen Anbieter wird. Uebernimmt nach A-F2a die Einordnung von Art. 25 Abs. 2 der Grundfassung
    (PO 28.09.2026, 2c F1: in, Teilabdeckung).'
  verifikation: HYPOTHESE
  hypothese_grund: Anbieterpflicht mit Durchschlag auf den Betreiber (2b E4); die Regel nennt fuer diesen
    Artikel weder Anker (a) noch (b). Ob einer traegt, prueft 2c (Leitfrage Q9).
  omnibus: null
  requirement: []
  gate:
  - G-OPS-06
  befund: teilabdeckung
  befund_grund: 'G-OPS-06/C-25d prueft, ob nach einem bindenden Ausloeser (C-25a/C-25c) die Uebergabeartefakte
    vorliegen bzw. der Carve-out belegt ist (MUST, implemented) - das deckt die praktische Nachweisseite
    dieser Pflicht fuer den Betreiber-als-neuen-Anbieter. Nicht gedeckt: der trigger ''notify'' (Anstossen
    der eigentlichen Kooperation/Uebergabe beim Erstanbieter) ist laut Gate-eigener Deklaration ''declared_only'',
    nicht durchgesetzt - das Gate stellt das Fehlen fest, loest die Kooperation aber nicht aus. Requirement
    fehlt (Befund 1).'
  po_bestaetigt: true
  po_entscheid:
  - 2026-09-29 · P2-F2 a (bestaetigte Einordnung gilt fuer die Neufassung weiter)
