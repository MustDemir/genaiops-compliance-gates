  offset: 138993
  laenge: 889
  saetze: 4
  beleg: (3) In dem Beschluss gemäß Absatz 1 dieses Artikels ordnet das Büro für Künstliche Intelligenz
    gegebenenfalls an, dass der betreffende Akteur die erforderlichen Maßnahmen ergreift, um die Einhaltung
    der einschlägigen Bestimmungen dieser Verordnung innerhalb einer angemessenen, darin genannten Frist
    sicherzustellen, und dass der Akteur Informationen über die Maßnahmen übermittelt, die er zu ergreifen
    beabsichtigt, um dem Beschluss nachzukommen. Der betreffende Akteur legt dem Büro für Künstliche Intelligenz
    eine Beschreibung der Maßnahmen vor, die er ergriffen hat, um die Einhaltung des Beschlusses durch
    ihre Umsetzung sicherzustellen. Bevor das Büro für Künstliche Intelligenz eine Maßnahme fordert, kann
    es einen strukturierten Dialog mit dem Akteur des betreffenden KI-Systems aufnehmen. Während dieses
    Dialogs kann der Akteur Verpflichtungszusagen gemäß Artikel 75b vorschlagen.
  anweisung: Omnibus Art. 1 Nr. 32
  ziel: Art. 75c Abs. 3
  aenderung: eingefuegt
