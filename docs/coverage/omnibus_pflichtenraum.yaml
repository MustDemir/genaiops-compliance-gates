    das gemäß den einschlägigen Harmonisierungsrechtsvorschriften der Union erforderlich ist. Die in Abschnitt
    2 dieses Kapitels festgelegten Anforderungen gelten für diese Hochrisiko-KI-Systeme und werden in
    diese Bewertung einbezogen. Die Bewertung des Qualitätsmanagementsystems gemäß Artikel 17 wird ebenfalls
    durchgeführt, und Anhang VII Nummern 3, 4.3, 4.4. und 4.5 sowie Nummer 4.6 Absatz 5 und Nummer 5 finden
    Anwendung. Für die Zwecke dieser Konformitätsbewertung sind die notifizierten Stellen, die gemäß den
    in Anhang I Abschnitt A aufgeführten Harmonisierungsrechtsvorschriften der Union notifiziert wurden,
    dazu befugt, die Konformität der Hochrisiko-KI-Systeme mit den in Abschnitt 2 dieses Kapitels festgelegten
    Anforderungen zu bewerten, sofern im Rahmen des gemäß den einschlägigen Harmonisierungsrechtsvorschriften
    der Union durchgeführten Notifizierungsverfahrens geprüft wurde, dass diese notifizierten Stellen
    die in Artikel 31 Absätze 4, 5, 10 und 11 festgelegten Anforderungen erfüllen, was im Zuge der Bewertung
    als Teil der bestehenden Notifizierung belegt wird. Unbeschadet des Artikels 28 beantragen solche
    notifizierten Stellen, die nach den in Anhang I Abschnitt A aufgeführten Harmonisierungsrechtsvorschriften
    der Union notifiziert wurden, ihre Benennung gemäß Abschnitt 4 dieses Kapitels bis 28. Januar 2028.
    Wenn eine in Anhang I Abschnitt A aufgeführte Harmonisierungsrechtsvorschrift der Union dem Hersteller
    des Produkts die Möglichkeit einräumt, auf eine Konformitätsbewertung zurückzugreifen, an der keine
    Dritten beteiligt sind, sofern dieser Hersteller harmonisierte Normen angewandt hat, um die Konformität
    mit allen relevanten Anforderungen zu gewährleisten, so darf dieser Hersteller nur dann von dieser
    Möglichkeit Gebrauch machen, wenn er auch harmonisierte Normen oder gegebenenfalls gemeinsame Spezifikationen
    gemäß Artikel 41, die alle in Abschnitt 2 dieses Kapitels festgelegten Anforderungen abdecken, angewandt
    hat. Die Einstufung eines Produkts als Hochrisiko-KI-System gemäß Artikel 6 Absatz 1 berührt nicht
    die Wahl des Konformitätsbewertungsverfahrens, das den Herstellern von Produkten zur Verfügung gestellt
    wird, die unter die in Anhang I Abschnitt A aufgeführten Harmonisierungsrechtsvorschriften der Union
    fallen, wobei dies gegebenenfalls eine Option, sich auf harmonisierte Normen zu stützen, umfassen
    kann. Die Hersteller solcher Produkte sind nicht verpflichtet, ein Konformitätsbewertungsverfahren
    mit einer Konformitätsbewertung durch Dritte zu wählen, nur weil das Produkt ein Hochrisiko-KI-System
    als Sicherheitsbauteil enthält, sofern dies nicht in den in Anhang I Abschnitt A aufgeführten Harmonisierungsrechtsvorschriften
    der Union vorgeschrieben ist. Wenn ein Hochrisiko-KI-System sowohl unter die in Anhang I Abschnitt
    A aufgeführten Harmonisierungsrechtsvorschriften der Union als auch unter eine der in Anhang III aufgeführten
    Kategorien fällt, befolgt der Anbieter dieses Systems das einschlägige Konformitätsbewertungsverfahren,
    das gemäß den in Anhang I Abschnitt A aufgeführten einschlägigen Harmonisierungsrechtsvorschriften
    der Union erforderlich ist.
  anweisung: Omnibus Art. 1 Nr. 19
  ziel: Art. 43 Abs. 3
