- uid: Art. 4 Abs. 1 n.F.@83595
  id: Art. 4 Abs. 1 n.F.
  artikel: '4'
  artikel_titel: Änderung der Verordnung (EU) 2024/1689
  abschnitt: null
  absatz: null
  nummer: null
  unterabsatz: null
  buchstabe: null
  ziffer: null
  offset: 83595
  laenge: 639
  saetze: 2
  beleg: (1) Die Anbieter und Betreiber von KI-Systemen ergreifen Maßnahmen, um die Entwicklung der KI-Kompetenz
    ihres Personals und anderer Personen zu unterstützen, die in ihrem Auftrag mit dem Betrieb und der
    Nutzung von KI-Systemen befasst sind, wobei ihre technischen Kenntnisse, ihre Erfahrung, ihre Aus-
    und Fortbildung und der Kontext, in dem die KI-Systeme eingesetzt werden sollen, sowie die Personen
    oder Personengruppen, bei denen die KI-Systeme eingesetzt werden sollen, zu berücksichtigen sind.
    Diese Verpflichtung verpflichtet Anbieter oder Betreiber nicht, für irgendeine Person ein bestimmtes
    Niveau an KI-Kompetenz zu garantieren.
  anweisung: Omnibus Art. 1 Nr. 5
  ziel: Art. 4 Abs. 1
  aenderung: neu_gefasst
  adressat: betreiber
  pflicht: Anbieter und Betreiber ergreifen Massnahmen, um die Entwicklung der KI-Kompetenz ihres Personals
    und anderer in ihrem Auftrag mit Betrieb und Nutzung befasster Personen zu unterstuetzen (Art. 4 Abs.
    1 n.F.); ein bestimmtes Kompetenzniveau muessen sie nicht garantieren.
  scope: in
  scope_grund: 'Adressat Betreiber (T-13 Schritt 4): ''Die Anbieter und Betreiber von KI-Systemen ergreifen
    Massnahmen''. Uebernimmt nach A-F2a die Einordnung von Art. 4 der Grundfassung (PO 23.09.2026, 2b
    E2 und E6: in, Luecke P2, geprueft am neuen Wortlaut).'
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: null
  requirement: []
  gate: []
  befund: luecke
  befund_grund: Kein Requirement und kein Gate prueft Massnahmen zur KI-Kompetenz des Personals. Geprueft
    wird nach der Neufassung, ob Massnahmen zur Unterstuetzung der Kompetenzentwicklung je Aufsichtsrolle
    bestehen - nicht, ob ein Niveau erreicht ist (P2, R016).
  po_bestaetigt: true
  po_entscheid:
  - 2026-09-29 · P2-F2 a (bestaetigte Einordnung gilt fuer die Neufassung weiter)
