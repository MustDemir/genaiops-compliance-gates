  offset: 129739
  laenge: 1560
  saetze: 5
  beleg: (3) Das Büro für Künstliche Intelligenz kann die in Artikel 14 Absatz 4 Buchstaben a, b und c
    der Verordnung (EU) 2019/1020 und in Artikel 74 Absätze 12 und 13 der vorliegenden Verordnung aufgeführten
    Befugnisse durch einfaches Ersuchen oder im Wege eines Beschlusses ausüben. Bei einem Informationsersuchen
    gibt das Büro für Künstliche Intelligenz die Rechtsgrundlage und den Zweck des Ersuchens an, gibt
    an, welche Informationen erforderlich sind, und legt die Frist fest, innerhalb deren die Informationen
    bereitzustellen sind. Handelt es sich bei dem Ersuchen um ein einfaches Ersuchen, weist das Büro für
    Künstliche Intelligenz zusätzlich darauf hin, dass zwar keine Verpflichtung zur Bereitstellung der
    angeforderten Informationen besteht, im Falle einer freiwilligen Antwort die Informationen jedoch
    richtig sein müssen und nicht irreführend sein dürfen, und es weist auf die möglichen Geldbußen gemäß
    Artikel 99 Absatz 5 für die Bereitstellung von Informationen hin, die unrichtig oder irreführend sind.
    Beruht das Ersuchen auf einem Beschluss, gibt das Büro für Künstliche Intelligenz zusätzlich die in
    Artikel 99 Absatz 5 vorgesehenen Geldbußen für die Bereitstellung unrichtiger, unvollständiger oder
    irreführender Informationen an und weist auf das Recht hin, den Beschluss durch den Gerichtshof der
    Europäischen Union überprüfen zu lassen. Das Büro für Künstliche Intelligenz übermittelt der Marktüberwachungsbehörde
    des Mitgliedstaats, in dessen Hoheitsgebiet sich der Akteur oder sein gesetzlicher Vertreter befindet,
    eine Kopie des Ersuchens.
