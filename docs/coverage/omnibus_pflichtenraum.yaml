  abschnitt: null
  absatz: null
  nummer: null
  unterabsatz: null
  buchstabe: null
  ziffer: null
  offset: 162696
  laenge: 1507
  saetze: 6
  beleg: '1. In Artikel 8 werden folgende Absätze angefügt: „Die Kommission erlässt gemäß Artikel 47 dieser
    Verordnung delegierte Rechtsakte zur Änderung des Anhangs III dieser Verordnung durch Hinzufügung
    von Sicherheits- und Gesundheitsschutzanforderungen in Bezug auf künstliche Intelligenz (KI)-Systeme,
    die gemäß Artikel 6 Absatz 1 der Verordnung (EU) 2024/1689 als hochriskant eingestuft werden, weil
    sie ein Sicherheitsbauteil eines unter diese Verordnung fallenden Produkts oder selbst ein unter diese
    Verordnung fallendes Produkt sind. Diese Anforderungen müssen sicherstellen, dass den einschlägigen
