- uid: Art. 28 Abs. 8 n.F.@97910
  id: Art. 28 Abs. 8 n.F.
  artikel: '28'
  artikel_titel: Änderung der Verordnung (EU) 2024/1689
  abschnitt: null
  absatz: null
  nummer: null
  unterabsatz: null
  buchstabe: null
  ziffer: null
  offset: 97910
  laenge: 2367
  saetze: 6
  beleg: (8) Die gemäß dieser Verordnung benannten notifizierenden Behörden, die für KI-Systeme zuständig
    sind, die unter die in Anhang I Abschnitt A aufgeführten Harmonisierungsrechtsvorschriften der Union
    fallen, stellen sicher, dass die Konformitätsbewertungsstelle, die ihre Benennung sowohl gemäß dieser
    Verordnung als auch gemäß den in Anhang I Abschnitt A aufgeführten Harmonisierungsrechtsvorschriften
    der Union beantragt, die Möglichkeit erhält, einen einzigen Antrag zu stellen, und sich einem einheitlichen
    Bewertungsverfahren unterzieht, um gemäß dieser Verordnung und den in Anhang I Abschnitt A aufgeführten
    Harmonisierungsrechtsvorschriften der Union benannt zu werden, sofern die einschlägigen Harmonisierungsrechtsvorschriften
    der Union einen solchen einzigen Antrag und ein solches einheitliches Bewertungsverfahren vorsehen.
    Zu diesem Zweck arbeiten die gemäß dieser Verordnung benannten notifizierenden Behörden und die gemäß
    den in Anhang I Abschnitt A aufgeführten Harmonisierungsrechtsvorschriften der Union benannten Behörden
    bei ihren Bewertungen zusammen. Der in diesem Absatz genannte einzige Antrag und das einheitliche
    Bewertungsverfahren steht auch notifizierten Stellen offen, die bereits gemäß den in Anhang I Abschnitt
    A aufgeführten Harmonisierungsrechtsvorschriften der Union benannt wurden, wenn diese notifizierten
    Stellen ihre Benennung gemäß dieser Verordnung beantragen, sofern die einschlägigen Harmonisierungsrechtsvorschriften
    der Union ein solches Verfahren vorsehen. Eine Konformitätsbewertungsstelle, die gemäß mehr als einer
    der in Anhang I Abschnitt A aufgeführten Harmonisierungsrechtsvorschriften der Union benannt wurde,
    muss nur einmal einen Antrag stellen, um gemäß dieser Verordnung benannt zu werden. Eine Benennung
    gemäß dieser Verordnung gilt für alle in Anhang I Abschnitt A aufgeführten Harmonisierungsrechtsvorschriften
    der Union, für die die Konformitätsbewertungsstelle benannt ist. Durch den einzigen Antrag und das
    einheitliche Bewertungsverfahren wird unnötige Doppelarbeit vermieden, auf den bestehenden Benennungsverfahren
    gemäß den in Anhang I Abschnitt A aufgeführten Harmonisierungsrechtsvorschriften der Union aufgebaut
    und die Einhaltung der Anforderungen an notifizierte Stellen sowohl gemäß dieser Verordnung als auch
    gemäß den einschlägigen Harmonisierungsrechtsvorschriften der Union gewährleistet.
  anweisung: Omnibus Art. 1 Nr. 14
