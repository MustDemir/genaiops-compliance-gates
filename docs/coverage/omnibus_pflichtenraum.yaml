  laenge: 673
  saetze: 2
  beleg: '(1) Soweit dies zur Erkennung und Korrektur von Verzerrungen im Zusammenhang mit Hochrisiko-KI-Systemen
    im Einklang mit Artikel 10 Absatz 2 Buchstaben f und g dieser Verordnung unbedingt erforderlich ist,
    dürfen die Anbieter solcher Systeme ausnahmsweise besondere Kategorien personenbezogener Daten verarbeiten,
    wobei sie angemessene Vorkehrungen zum Schutz der Grundrechte und Grundfreiheiten natürlicher Personen
    treffen müssen. Zusätzlich zu den Bestimmungen der Verordnungen (EU) 2016/679 und (EU) 2018/1725 und
    der Richtlinie (EU) 2016/680, soweit zutreffend, müssen sämtliche der folgenden Bedingungen erfüllt
    sein, damit eine solche Verarbeitung stattfinden darf:'
  anweisung: Omnibus Art. 1 Nr. 6
  ziel: Art. 4a Abs. 1
  aenderung: eingefuegt
  adressat: anbieter
  pflicht: 'Erlaubnis und Bedingungen fuer Anbieter von Hochrisiko-KI-Systemen, besondere Kategorien personenbezogener
    Daten zur Bias-Korrektur zu verarbeiten: Soweit dies zur Erkennung und Korrektur von Verzerrungen
    im Zusammenhang mit Hochrisiko-KI-Systemen im Einklang mit Artikel 10 Absatz 2 Buchstaben f …'
  scope: out
  scope_grund: 'Adressat (T-13 Schritt 1): Anbieter von Hochrisiko-KI-Systemen (Art. 10 Abs. 2 lit. f,
    g). Den Betreiber binden die Bedingungen nur ueber Abs. 2 lit. b, wenn er die Erlaubnis nutzt, besondere
    Kategorien personenbezogener Daten zur Bias-Erkennung zu verarbeiten - eine bedingte Pflicht (2c);
    fuer Redispatch nicht vorgesehen (PO 29.09.2026, P2-F4 c). Wiedervorlage maschinell: Manifest-Feld
    special_categories_for_bias, ein Check meldet diese Einheiten, sobald es true ist (Bau Paket 5).'
  verifikation: HYPOTHESE
  hypothese_grund: Durchschlag verneint, weil Abs. 2 lit. b die Bedingungen nur fuer den Fall der Nutzung
    der Erlaubnis anordnet. Dass der Betreiber sie fuer Redispatch nicht nutzt, hat der PO festgestellt
    (P2-F4 c); Auslegung bleibt die Einordnung als bedingte Pflicht.
  omnibus: null
  requirement: []
  gate: []
  befund: null
