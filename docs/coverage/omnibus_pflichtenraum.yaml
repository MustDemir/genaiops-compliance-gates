  saetze: 6
  beleg: (2) Die Verteidigungsrechte und das Recht auf Einsicht in die Akten von Akteuren, die in den
    Anwendungsbereich von Artikel 75 Absatz 1 fallen, werden in den Verfahren in vollem Umfang gewahrt.
    Im Hinblick auf den möglichen Erlass von Beschlüssen auf der Grundlage von Artikel 75c Absatz 1 haben
    diese Akteure das Recht auf Einsicht in die Akten des Büros für Künstliche Intelligenz im Rahmen einer
    einvernehmlichen Einsichtnahme, vorbehaltlich des berechtigten Interesses des Akteurs oder einer anderen
    betroffenen Person an der Wahrung ihrer Geschäftsgeheimnisse. Das Büro für Künstliche Intelligenz
    ist befugt, im Falle von Meinungsverschiedenheiten zwischen den Parteien Beschlüsse über die Bedingungen
    dieser Einsichtnahme zu fassen. Von der Einsicht in die Akten ausgenommen sind vertrauliche Informationen
    sowie interne Schriftstücke des Büros für Künstliche Intelligenz, anderer zuständiger Marktüberwachungsbehörden
    oder anderer öffentlicher Stellen der Mitgliedstaaten. Insbesondere ist die Korrespondenz zwischen
    dem Büro für Künstliche Intelligenz und diesen Behörden und Stellen von der Akteneinsicht ausgenommen.
    Die Regelung dieses Absatzes steht der Offenlegung und Nutzung der für den Nachweis einer Zuwiderhandlung
    notwendigen Informationen durch das Büro für Künstliche Intelligenz in keiner Weise entgegen.
