  saetze: 6
  beleg: (1e) Das Büro für Künstliche Intelligenz ist für Konformitätsbewertungen und Tests der in Absatz
    1 dieses Artikels genannten KI-Systeme zuständig, die als hochriskant eingestuft sind und einer Konformitätsbewertung
    durch Dritte gemäß Artikel 43 unterliegen, wobei diese Konformitätsbewertung durchzuführen ist, bevor
    solche KI-Systeme in Verkehr gebracht oder in Betrieb genommen werden. Bei diesen Tests und Bewertungen
    wird überprüft, ob die Systeme den einschlägigen Anforderungen dieser Verordnung entsprechen und gemäß
    dieser Verordnung in der Union in Verkehr gebracht bzw. in Betrieb genommen werden dürfen. Die Kommission
    betraut die gemäß dieser Verordnung benannten notifizierten Stellen mit der Durchführung dieser Tests
    oder Bewertungen; in diesem Fall handeln diese notifizierten Stellen im Namen der Kommission. Kommt
    eine notifizierte Stelle, der die Kommission Aufgaben gemäß diesem Absatz übertragen hat, diesen Aufgaben
    nicht angemessen nach, so kann die Kommission die Übertragung mit sofortiger Wirkung widerrufen. Die
    Gebühren für Test- und Bewertungstätigkeiten werden von dem Anbieter eines Hochrisiko-KI-Systems erhoben,
    der bei der Kommission eine Konformitätsbewertung durch Dritte beantragt hat. Der Anbieter zahlt die
    Kosten der Dienstleistungen, mit denen die Kommission die notifizierten Stellen gemäß diesem Artikel
    betraut hat, direkt an die notifizierte Stelle.
