    des Europäischen Parlaments und des Rates (*) Rechnung getragen wird. Beim Erlass der in Absatz 3
    genannten delegierten Rechtsakte berücksichtigt die Kommission die Ziele der Verordnung (EU) 2024/1689
    und gewährleistet ein Schutzniveau, das mit der genannten Verordnung im Einklang steht. Diese delegierten
    Rechtsakte gelten ab dem 2. August 2028. (*) Verordnung (EU) 2024/1689 des Europäischen Parlaments
    und des Rates vom 13. Juni 2024 zur Festlegung harmonisierter Vorschriften für künstliche Intelligenz
