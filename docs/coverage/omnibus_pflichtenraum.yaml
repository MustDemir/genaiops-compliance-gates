  laenge: 2018
  saetze: 9
  beleg: '3. Artikel 47 wird wie folgt geändert: a) Absätze 2 und 3 erhalten folgende Fassung: „(2) Die
    Befugnis zum Erlass delegierter Rechtsakte gemäß Artikel 6 Absätze 2 und 11 und Artikel 7 Absatz 2
    wird der Kommission für einen Zeitraum von fünf Jahren ab dem 19. Juli 2023 übertragen. Die Befugnis
    zum Erlass delegierter Rechtsakte gemäß Artikel 8 Absatz 3 wird der Kommission für einen Zeitraum
    von fünf Jahren ab dem 27. Juli 2026 übertragen. Die Kommission erstellt spätestens neun Monate vor
    Ablauf des Zeitraums von fünf Jahren einen Bericht über die Befugnisübertragung. Die Befugnisübertragung
    verlängert sich stillschweigend um Zeiträume gleicher Länge, es sei denn, das Europäische Parlament
    oder der Rat widersprechen einer solchen Verlängerung spätestens drei Monate vor Ablauf des jeweiligen
    Zeitraums. (3) Die Befugnisübertragung gemäß Artikel 6 Absätze 2 und 11, Artikel 7 Absatz 2 und Artikel
    8 Absatz 3 kann vom Europäischen Parlament oder vom Rat jederzeit widerrufen werden. Der Beschluss
    über den Widerruf beendet die Übertragung der in diesem Beschluss angegebenen Befugnis. Er wird am
    Tag nach seiner Veröffentlichung im Amtsblatt der Europäischen Union oder zu einem im Beschluss über
    den Widerruf angegebenen späteren Zeitpunkt wirksam. Die Gültigkeit von delegierten Rechtsakten, die
    bereits in Kraft sind, wird von dem Beschluss über den Widerruf nicht berührt.“ b) Absatz 6 wird wie
    folgt geändert: „(6) Ein delegierter Rechtsakt, der gemäß Artikel 6 Absätze 2 und 11, Artikel 7 Absatz
    2 oder Artikel 8 Absatz 3 erlassen wurde, tritt nur in Kraft, wenn weder das Europäische Parlament
    noch der Rat innerhalb einer Frist von zwei Monaten nach Übermittlung dieses Rechtsakts an das Europäische
    Parlament und den Rat Einwände erhoben haben oder wenn vor Ablauf dieser Frist das Europäische Parlament
    und der Rat beide der Kommission mitgeteilt haben, dass sie keine Einwände erheben werden. Auf Initiative
    des Europäischen Parlaments oder des Rates wird diese Frist um zwei Monate verlängert.“'
