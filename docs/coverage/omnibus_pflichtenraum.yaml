  laenge: 1194
  saetze: 6
  beleg: Diese technische Dokumentation wird so erstellt, dass aus ihr der Nachweis hervorgeht, wie das
    Hochrisiko-KI-System die Anforderungen dieses Abschnitts erfüllt, und dass den zuständigen nationalen
    Behörden und den notifizierten Stellen die Informationen in klarer und verständlicher Form zur Verfügung
    stehen, die erforderlich sind, um zu beurteilen, ob das KI-System diese Anforderungen erfüllt. Sie
    enthält zumindest die in Anhang IV genannten Angaben. KMU, einschließlich Start-up-Unternehmen, und
    kleine Midcap-Unternehmen, können die in Anhang IV aufgeführten Elemente der technischen Dokumentation
    in vereinfachter Weise bereitstellen. Zu diesem Zweck erstellt die Kommission ein vereinfachtes Formular
    für die technische Dokumentation, das auf die Bedürfnisse von KMU, einschließlich Start-up-Unternehmen,
    und von kleinen Midcap-Unternehmen zugeschnitten ist. Entscheidet sich ein KMU, einschließlich Start-up-Unternehmen,
    oder ein kleines Midcap-Unternehmen für eine vereinfachte Bereitstellung der in Anhang IV vorgeschriebenen
    Angaben, so verwendet es das in diesem Absatz genannte Formular. Die notifizierten Stellen akzeptieren
    das Formular für die Zwecke der Konformitätsbewertung.
  anweisung: Omnibus Art. 1 Nr. 10
  ziel: Art. 11 Abs. 1 UAbs. 2
  aenderung: neu_gefasst
  adressat: anbieter
  pflicht: Inhalt und Zweck der technischen Dokumentation; vereinfachtes Formular auch fuer kleine Midcap-Unternehmen.
