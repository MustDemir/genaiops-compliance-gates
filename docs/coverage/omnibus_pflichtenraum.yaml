    begangen wird. Im Fall andauernder oder wiederholter Verstöße läuft die Verjährungsfrist jedoch ab
    dem Tag, an dem der Verstoß beendet wird. Die Befugnis des Büros für Künstliche Intelligenz zur Vollstreckung
    von Beschlüssen nach diesem Artikel verjährt nach Ablauf von fünf Jahren. Die Verjährungsfrist beginnt
    mit dem Tag, an dem der Beschluss rechtskräftig wird. In dem in Artikel 75d Absatz 3 genannten Durchführungsrechtsakt
    werden die Unterabsätze 1 und 2 dieses Absatzes näher festgelegt, einschließlich der Umstände, unter
    denen die Verjährungsfristen ausgesetzt werden.
