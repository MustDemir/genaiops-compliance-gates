- uid: Art. 89 Abs. 1@389282
  id: Art. 89 Abs. 1
  artikel: '89'
  artikel_titel: Garantien und Ausnahmen in Bezug auf die Verarbeitung zu im öffentlichen Interesse liegenden
    Archivzwecken, zu wissenschaftlichen oder historischen Forschungszwecken und zu statistischen Zwecken
  absatz: '1'
  buchstabe: null
  offset: 389282
  laenge: 813
  saetze: 4
  beleg: (1)   Die Verarbeitung zu im öffentlichen Interesse liegenden Archivzwecken, zu wissenschaftlichen
    oder historischen Forschungszwecken oder zu statistischen Zwecken unterliegt geeigneten Garantien
    für die Rechte und Freiheiten der betroffenen Person gemäß dieser Verordnung. Mit diesen Garantien
    wird sichergestellt, dass technische und organisatorische Maßnahmen bestehen, mit denen insbesondere
    die Achtung des Grundsatzes der Datenminimierung gewährleistet wird. Zu diesen Maßnahmen kann die
    Pseudonymisierung gehören, sofern es möglich ist, diese Zwecke auf diese Weise zu erfüllen. In allen
    Fällen, in denen diese Zwecke durch die Weiterverarbeitung, bei der die Identifizierung von betroffenen
    Personen nicht oder nicht mehr möglich ist, erfüllt werden können, werden diese Zwecke auf diese Weise
    erfüllt.
