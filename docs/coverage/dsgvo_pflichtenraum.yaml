    dass er nicht in der Lage ist, die betroffene Person zu identifizieren, so unterrichtet er die betroffene
    Person hierüber, sofern möglich. In diesen Fällen finden die Artikel 15 bis 20 keine Anwendung, es
    sei denn, die betroffene Person stellt zur Ausübung ihrer in diesen Artikeln niedergelegten Rechte
