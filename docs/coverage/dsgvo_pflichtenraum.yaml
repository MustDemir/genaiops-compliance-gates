    der Verarbeitung personenbezogener Daten werden in einer anderen Niederlassung des Verantwortlichen
    in der Union getroffen und diese Niederlassung ist befugt, diese Entscheidungen umsetzen zu lassen;
    in diesem Fall gilt die Niederlassung, die derartige Entscheidungen trifft, als Hauptniederlassung;
