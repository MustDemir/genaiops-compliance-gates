- uid: Art. 42 Abs. 2@287018
  id: Art. 42 Abs. 2
  artikel: '42'
  artikel_titel: Zertifizierung
  absatz: '2'
  buchstabe: null
  offset: 287018
  laenge: 869
  saetze: 2
  beleg: (2)   Zusätzlich zur Einhaltung durch die unter diese Verordnung fallenden Verantwortlichen oder
    Auftragsverarbeiter können auch datenschutzspezifische Zertifizierungsverfahren, Siegel oder Prüfzeichen,
    die gemäß Absatz 5 des vorliegenden Artikels genehmigt worden sind, vorgesehen werden, um nachzuweisen,
    dass die Verantwortlichen oder Auftragsverarbeiter, die gemäß Artikel 3 nicht unter diese Verordnung
    fallen, im Rahmen der Übermittlung personenbezogener Daten an Drittländer oder internationale Organisationen
    nach Maßgabe von Artikel 46 Absatz 2 Buchstabe f geeignete Garantien bieten. Diese Verantwortlichen
    oder Auftragsverarbeiter gehen mittels vertraglicher oder sonstiger rechtlich bindender Instrumente
    die verbindliche und durchsetzbare Verpflichtung ein, diese geeigneten Garantien anzuwenden, auch
    im Hinblick auf die Rechte der betroffenen Personen.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
  verifikation: null
  hypothese_grund: null
  omnibus: null
  requirement: *id001
