- uid: Art. 42 Abs. 1@286522
  id: Art. 42 Abs. 1
  artikel: '42'
  artikel_titel: Zertifizierung
  absatz: '1'
  buchstabe: null
  offset: 286522
  laenge: 496
  saetze: 2
  beleg: (1)   Die Mitgliedstaaten, die Aufsichtsbehörden, der Ausschuss und die Kommission fördern insbesondere
    auf Unionsebene die Einführung von datenschutzspezifischen Zertifizierungsverfahren sowie von Datenschutzsiegeln
    und -prüfzeichen, die dazu dienen, nachzuweisen, dass diese Verordnung bei Verarbeitungsvorgängen
    von Verantwortlichen oder Auftragsverarbeitern eingehalten wird. Den besonderen Bedürfnissen von Kleinstunternehmen
    sowie kleinen und mittleren Unternehmen wird Rechnung getragen.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
