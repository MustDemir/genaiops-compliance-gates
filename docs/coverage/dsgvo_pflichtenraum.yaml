  offset: 391416
  laenge: 786
  saetze: 2
  beleg: (1)   Die Mitgliedstaaten können die Befugnisse der Aufsichtsbehörden im Sinne des Artikels 58
    Absatz 1 Buchstaben e und f gegenüber den Verantwortlichen oder den Auftragsverarbeitern, die nach
    Unionsrecht oder dem Recht der Mitgliedstaaten oder nach einer von den zuständigen nationalen Stellen
    erlassenen Verpflichtung dem Berufsgeheimnis oder einer gleichwertigen Geheimhaltungspflicht unterliegen,
    regeln, soweit dies notwendig und verhältnismäßig ist, um das Recht auf Schutz der personenbezogenen
    Daten mit der Pflicht zur Geheimhaltung in Einklang zu bringen. Diese Vorschriften gelten nur in Bezug
    auf personenbezogene Daten, die der Verantwortliche oder der Auftragsverarbeiter bei einer Tätigkeit
    erlangt oder erhoben hat, die einer solchen Geheimhaltungspflicht unterliegt.
