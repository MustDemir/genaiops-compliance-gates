  saetze: 1
  beleg: b) im Falle eines Auftragsverarbeiters mit Niederlassungen in mehr als einem Mitgliedstaat den
    Ort seiner Hauptverwaltung in der Union oder, sofern der Auftragsverarbeiter keine Hauptverwaltung
    in der Union hat, die Niederlassung des Auftragsverarbeiters in der Union, in der die Verarbeitungstätigkeiten
    im Rahmen der Tätigkeiten einer Niederlassung eines Auftragsverarbeiters hauptsächlich stattfinden,
    soweit der Auftragsverarbeiter spezifischen Pflichten aus dieser Verordnung unterliegt; 17. „Vertreter“
    eine in der Union niedergelassene natürliche oder juristische Person, die von dem Verantwortlichen
    oder Auftragsverarbeiter schriftlich gemäß Artikel 27 bestellt wurde und den Verantwortlichen oder
    Auftragsverarbeiter in Bezug auf die ihnen jeweils nach dieser Verordnung obliegenden Pflichten vertritt;
    18. „Unternehmen“ eine natürliche und juristische Person, die eine wirtschaftliche Tätigkeit ausübt,
    unabhängig von ihrer Rechtsform, einschließlich Personengesellschaften oder Vereinigungen, die regelmäßig
    einer wirtschaftlichen Tätigkeit nachgehen; 19. „Unternehmensgruppe“ eine Gruppe, die aus einem herrschenden
    Unternehmen und den von diesem abhängigen Unternehmen besteht; 20. „verbindliche interne Datenschutzvorschriften“
    Maßnahmen zum Schutz personenbezogener Daten, zu deren Einhaltung sich ein im Hoheitsgebiet eines
    Mitgliedstaats niedergelassener Verantwortlicher oder Auftragsverarbeiter verpflichtet im Hinblick
    auf Datenübermittlungen oder eine Kategorie von Datenübermittlungen personenbezogener Daten an einen
    Verantwortlichen oder Auftragsverarbeiter derselben Unternehmensgruppe oder derselben Gruppe von Unternehmen,
    die eine gemeinsame Wirtschaftstätigkeit ausüben, in einem oder mehreren Drittländern; 21. „Aufsichtsbehörde“
    eine von einem Mitgliedstaat gemäß Artikel 51 eingerichtete unabhängige staatliche Stelle; 22. „betroffene
    Aufsichtsbehörde“ eine Aufsichtsbehörde, die von der Verarbeitung personenbezogener Daten betroffen
    ist, weil
