- uid: Art. 60 Abs. 9@339056
  id: Art. 60 Abs. 9
  artikel: '60'
  artikel_titel: Zusammenarbeit zwischen der federführenden Aufsichtsbehörde und den anderen betroffenen
    Aufsichtsbehörden
  absatz: '9'
  buchstabe: null
  offset: 339056
  laenge: 929
  saetze: 2
  beleg: (9)   Sind sich die federführende Aufsichtsbehörde und die betreffenden Aufsichtsbehörden darüber
    einig, Teile der Beschwerde abzulehnen oder abzuweisen und bezüglich anderer Teile dieser Beschwerde
    tätig zu werden, so wird in dieser Angelegenheit für jeden dieser Teile ein eigener Beschluss erlassen.
    Die federführende Aufsichtsbehörde erlässt den Beschluss für den Teil, der das Tätigwerden in Bezug
    auf den Verantwortlichen betrifft, teilt ihn der Hauptniederlassung oder einzigen Niederlassung des
    Verantwortlichen oder des Auftragsverarbeiters im Hoheitsgebiet ihres Mitgliedstaats mit und setzt
    den Beschwerdeführer hiervon in Kenntnis, während die für den Beschwerdeführer zuständige Aufsichtsbehörde
    den Beschluss für den Teil erlässt, der die Ablehnung oder Abweisung dieser Beschwerde betrifft, und
    ihn diesem Beschwerdeführer mitteilt und den Verantwortlichen oder den Auftragsverarbeiter hiervon
    in Kenntnis setzt.
