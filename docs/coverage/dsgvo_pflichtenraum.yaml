  absatz: '-'
  buchstabe: null
  offset: 398051
  laenge: 464
  saetze: 2
  beleg: Die Kommission legt gegebenenfalls Gesetzgebungsvorschläge zur Änderung anderer Rechtsakte der
    Union zum Schutz personenbezogener Daten vor, damit ein einheitlicher und kohärenter Schutz natürlicher
    Personen bei der Verarbeitung sichergestellt wird. Dies betrifft insbesondere die Vorschriften zum
    Schutz natürlicher Personen bei der Verarbeitung solcher Daten durch die Organe, Einrichtungen, Ämter
    und Agenturen der Union und zum freien Verkehr solcher Daten.
