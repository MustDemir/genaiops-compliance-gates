    spezifischere Vorschriften zur Gewährleistung des Schutzes der Rechte und Freiheiten hinsichtlich
    der Verarbeitung personenbezogener Beschäftigtendaten im Beschäftigungskontext, insbesondere für Zwecke
    der Einstellung, der Erfüllung des Arbeitsvertrags einschließlich der Erfüllung von durch Rechtsvorschriften
    oder durch Kollektivvereinbarung en festgelegten Pflichten, des Managements, der Planung und der Organisation
    der Arbeit, der Gleichheit und Diversität am Arbeitsplatz, der Gesundheit und Sicherheit am Arbeitsplatz,
    des Schutzes des Eigentums der Arbeitgeber oder der Kunden sowie für Zwecke der Inanspruchnahme der
    mit der Beschäftigung zusammenhängenden individuellen oder kollektiven Rechte und Leistungen und für
    Zwecke der Beendigung des Beschäftigungsverhältnisses vorsehen.
