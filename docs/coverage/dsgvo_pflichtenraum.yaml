  absatz: '1'
  buchstabe: null
  offset: 335991
  laenge: 323
  saetze: 2
  beleg: (1)   Die federführende Aufsichtsbehörde arbeitet mit den anderen betroffenen Aufsichtsbehörden
    im Einklang mit diesem Artikel zusammen und bemüht sich dabei, einen Konsens zu erzielen. Die federführende
    Aufsichtsbehörde und die betroffenen Aufsichtsbehörden tauschen untereinander alle zweckdienlichen
    Informationen aus.
