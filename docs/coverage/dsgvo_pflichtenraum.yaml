    das einem Kind direkt gemacht wird, so ist die Verarbeitung der personenbezogenen Daten des Kindes
    rechtmäßig, wenn das Kind das sechzehnte Lebensjahr vollendet hat. Hat das Kind noch nicht das sechzehnte
    Lebensjahr vollendet, so ist diese Verarbeitung nur rechtmäßig, sofern und soweit diese Einwilligung
    durch den Träger der elterlichen Verantwortung für das Kind oder mit dessen Zustimmung erteilt wird.
