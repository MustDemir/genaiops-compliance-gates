  beleg: (3)   Der Verantwortliche stellt der betroffenen Person Informationen über die auf Antrag gemäß
    den Artikeln 15 bis 22 ergriffenen Maßnahmen unverzüglich, in jedem Fall aber innerhalb eines Monats
    nach Eingang des Antrags zur Verfügung. Diese Frist kann um weitere zwei Monate verlängert werden,
    wenn dies unter Berücksichtigung der Komplexität und der Anzahl von Anträgen erforderlich ist. Der
    Verantwortliche unterrichtet die betroffene Person innerhalb eines Monats nach Eingang des Antrags
    über eine Fristverlängerung, zusammen mit den Gründen für die Verzögerung. Stellt die betroffene Person
    den Antrag elektronisch, so ist sie nach Möglichkeit auf elektronischem Weg zu unterrichten, sofern
    sie nichts anderes angibt.
