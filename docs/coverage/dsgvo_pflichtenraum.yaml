  absatz: '3'
  buchstabe: null
  offset: 297984
  laenge: 946
  saetze: 4
  beleg: (3)   Nach der Beurteilung der Angemessenheit des Schutzniveaus kann die Kommission im Wege eines
    Durchführungsrechtsaktes beschließen, dass ein Drittland, ein Gebiet oder ein oder mehrere spezifische
    Sektoren in einem Drittland oder eine internationale Organisation ein angemessenes Schutzniveau im
    Sinne des Absatzes 2 des vorliegenden Artikels bieten. In dem Durchführungsrechtsakt ist ein Mechanismus
    für eine regelmäßige Überprüfung, die mindestens alle vier Jahre erfolgt, vorzusehen, bei der allen
    maßgeblichen Entwicklungen in dem Drittland oder bei der internationalen Organisation Rechnung getragen
    wird. Im Durchführungsrechtsakt werden der territoriale und der sektorale Anwendungsbereich sowie
    gegebenenfalls die in Absatz 2 Buchstabe b des vorliegenden Artikels genannte Aufsichtsbehörde bzw.
    genannten Aufsichtsbehörden angegeben. Der Durchführungsrechtsakt wird gemäß dem in Artikel 93 Absatz
    2 genannten Prüfverfahren erlassen.
