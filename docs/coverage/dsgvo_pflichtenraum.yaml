  absatz: '-'
  buchstabe: null
  offset: 294732
  laenge: 799
  saetze: 2
  beleg: Jedwede Übermittlung personenbezogener Daten, die bereits verarbeitet werden oder nach ihrer
    Übermittlung an ein Drittland oder eine internationale Organisation verarbeitet werden sollen, ist
    nur zulässig, wenn der Verantwortliche und der Auftragsverarbeiter die in diesem Kapitel niedergelegten
    Bedingungen einhalten und auch die sonstigen Bestimmungen dieser Verordnung eingehalten werden; dies
    gilt auch für die etwaige Weiterübermittlung personenbezogener Daten durch das betreffende Drittland
    oder die betreffende internationale Organisation an ein anderes Drittland oder eine andere internationale
    Organisation. Alle Bestimmungen dieses Kapitels sind anzuwenden, um sicherzustellen, dass das durch
    diese Verordnung gewährleistete Schutzniveau für natürliche Personen nicht untergraben wird.
