  artikel: '60'
  artikel_titel: Zusammenarbeit zwischen der federführenden Aufsichtsbehörde und den anderen betroffenen
    Aufsichtsbehörden
  absatz: '4'
  buchstabe: null
  offset: 337046
  laenge: 537
  saetze: 1
  beleg: (4)   Legt eine der anderen betroffenen Aufsichtsbehörden innerhalb von vier Wochen, nachdem
    sie gemäß Absatz 3 des vorliegenden Artikels konsultiert wurde, gegen diesen Beschlussentwurf einen
    maßgeblichen und begründeten Einspruch ein und schließt sich die federführende Aufsichtsbehörde dem
    maßgeblichen und begründeten Einspruch nicht an oder ist der Ansicht, dass der Einspruch nicht maßgeblich
    oder nicht begründet ist, so leitet die federführende Aufsichtsbehörde das Kohärenzverfahren gemäß
    Artikel 63 für die Angelegenheit ein.
