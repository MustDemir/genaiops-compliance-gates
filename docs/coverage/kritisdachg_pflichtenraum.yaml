  buchstabe: null
  offset: 46925
  laenge: 819
  saetze: 3
  beleg: (4) Die zuständige Behörde kann die Einhaltung der Verpflichtungen nach § 13 Absatz 1 bei den
    nach Absatz 2 Satz 3 ausgewählten Betreibern kritischer Anlagen überprüfen. Bei der Durchführung der
    Überprüfung kann die zuständige Behörde sich eines qualifizierten unabhängigen Dritten bedienen. Der
    Betreiber kritischer Anlagen hat der zuständigen Behörde und den in ihrem Auftrag handelnden Personen
    zum Zweck der Überprüfung das Betreten der Geschäfts- und Betriebsräume sowie Zugang zu Informationen,
    Systemen und Anlagen im Zusammenhang mit der Erbringung ihrer kritischen Dienstleistung während der
    üblichen Betriebszeiten zu gestatten und auf Verlangen die in Betracht kommenden Aufzeichnungen, Schriftstücke
    und sonstigen Unterlagen vorzulegen, Auskunft zu erteilen und die erforderliche Unterstützung zu gewähren.
