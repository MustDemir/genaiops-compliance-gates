- uid: § 10 Abs. 1@28282
  id: § 10 Abs. 1
  artikel: § 10
  artikel_titel: Beratungsmission bei Einrichtungen von besonderer Bedeutung für Europa
  absatz: '1'
  buchstabe: null
  offset: 28282
  laenge: 1296
  saetze: 5
  beleg: (1) Das Bundesministerium des Innern kann einen Antrag bei der Europäischen Kommission auf Einrichtung
    einer Beratungsmission zur Bewertung der Maßnahmen stellen, die eine kritische Einrichtung von besonderer
    Bedeutung für Europa ergriffen hat, um ihre Verpflichtungen nach den §§ 12, 13 und 18 zu erfüllen.
    Einer Beratungsmission im Sinne des Satzes 1, die die Europäische Kommission vorschlägt oder ein anderer
    Mitgliedstaat der Europäischen Union beantragt, kann das Bundesministerium des Innern zustimmen. Falls
    für die betroffene Dienstleistung eine Behörde des Bundes die zuständige Behörde ist, erfolgen der
    Antrag nach Satz 1 und die Zustimmung nach Satz 2 im Einvernehmen mit dem Bundesministerium, zu dessen
    Geschäftsbereich die Behörde gehört. Liegt die Fach- oder Rechtsaufsicht für den Teil einer Behörde,
    der für die betroffene kritische Dienstleistung zuständig ist, nicht bei dem Bundesministerium, zu
    dessen Geschäftsbereich sie gehört, erfolgen der Antrag nach Satz 1 und die Zustimmung nach Satz 2
    im Einvernehmen mit dem Bundesministerium, dessen Fach- oder Rechtsaufsicht der betreffende Teil dieser
    Behörde untersteht. Im Übrigen erfolgen sie im Benehmen mit dem Landesministerium, zu dessen Geschäftsbereich
    die für die betroffene Dienstleistung zuständige Behörde gehört.
