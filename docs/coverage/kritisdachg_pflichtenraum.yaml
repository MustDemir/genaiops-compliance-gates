  buchstabe: null
  offset: 51931
  laenge: 867
  saetze: 4
  beleg: (7) Das Bundesamt für Bevölkerungsschutz und Katastrophenhilfe übermittelt den zuständigen Behörden,
    den nach § 3 Absatz 5 benannten Landesbehörden sowie den nach § 11 Absatz 1 zuständigen Stellen Auswertungen
    zu Meldungen von Vorfällen im Rahmen vorab zwischen dem Bundesamt für Bevölkerungsschutz und Katastrophenhilfe
    und den Empfängern abgestimmter Prozesse zur Weitergabe und Wahrung der notwendigen Vertraulichkeit.
    Das Bundesministerium des Innern wird ermächtigt, durch Rechtsverordnung, die der Zustimmung des Bundesrates
    bedarf, die Prozesse zur Weitergabe der Meldungen an die Länder zu regeln. Die Rechtsverordnung beschreibt
    die Rahmenbedingungen, insbesondere die technischen und personellen Voraussetzungen, Kriterien für
    eine Weiterleitung von Meldungen und die Prozessbeschreibung für den Informationsaustausch. § 4 Absatz
    4 und 5 gilt entsprechend.
