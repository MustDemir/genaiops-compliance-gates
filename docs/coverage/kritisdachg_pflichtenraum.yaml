  artikel_titel: Meldewesen für Vorfälle; Verordnungsermächtigung
  absatz: '2'
  buchstabe: null
  offset: 51335
  laenge: 551
  saetze: 2
  beleg: '(2) Die Meldungen müssen die zu ihrem Zeitpunkt verfügbaren Informationen enthalten, die erforderlich
    sind, damit Art, Ursache und mögliche, auch grenzüberschreitende, Auswirkungen und Folgen des Vorfalls
    ermittelt und nachvollzogen werden können. Insbesondere sind folgende Angaben zu machen: 1. die Anzahl
    und der Anteil der von dem Vorfall Betroffenen, 2. die bisherige und voraussichtliche Dauer des Vorfalls
    sowie 3. das betroffene geografische Gebiet des Vorfalls, unter Berücksichtigung des Umstands, ob
    das Gebiet geografisch isoliert ist.'
