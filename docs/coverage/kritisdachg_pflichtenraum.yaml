  saetze: 3
  beleg: (3) Ein Nachweis zur Einhaltung der Verpflichtung nach § 13 Absatz 1 kann durch Audits erfolgen.
    Der Betreiber kritischer Anlagen übermittelt der zuständigen Behörde auf deren Verlangen die Ergebnisse
    des Audits einschließlich der dabei aufgedeckten Mängel. Die zuständige Behörde kann die Vorlage der
    Dokumentation, die der Überprüfung durch ein Audit oder auf andere Weise zugrunde gelegt wurde, verlangen.
