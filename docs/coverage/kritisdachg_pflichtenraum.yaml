- uid: § 5 Abs. 2@14005
  id: § 5 Abs. 2
  artikel: § 5
  artikel_titel: Erheblichkeit einer Anlage für die Erbringung kritischer Dienstleistungen; Feststellungsbefugnis;
    Verordnungsermächtigungen
  absatz: '2'
  buchstabe: null
  offset: 14005
  laenge: 1536
  saetze: 2
  beleg: '(2) Bei der Bestimmung der Schwellenwerte zum Versorgungsgrad nach Absatz 1 Satz 1 Nummer 2
    werden die nationalen Risikoanalysen und Risikobewertungen sowie die folgenden Kriterien berücksichtigt:
    1. die Zahl der Einwohner, die die von der Anlage erbrachte kritische Dienstleistung in Anspruch nehmen,
    2. das Ausmaß der Abhängigkeit anderer Sektoren oder Branchen von der betreffenden kritischen Dienstleistung,
    3. die Dauer und das Ausmaß möglicher Auswirkungen von Ausfällen und Beeinträchtigungen der Anlage
    auf wichtige wirtschaftliche Tätigkeiten, die für die Aufrechterhaltung wichtiger gesellschaftlicher
    Funktionen, die öffentliche Sicherheit oder Ordnung, die Gesundheit der Bevölkerung oder die Erhaltung
    der natürlichen Lebensgrundlagen von entscheidender Bedeutung sind, 4. den Marktanteil des Betreibers
    der Anlage auf dem Markt für kritische Dienstleistungen, 5. das geografische Gebiet, das von einem
    Vorfall betroffen sein könnte, einschließlich etwaiger grenzüberschreitender Auswirkungen, unter Berücksichtigung
    der Schwachstellen, die mit dem Grad der Isolierung bestimmter Arten geografischer Gebiete verbunden
    sind, und 6. die Bedeutung des Betreibers der Anlage für die Aufrechterhaltung der kritischen Dienstleistung
    in ausreichendem Umfang, unter Berücksichtigung der Verfügbarkeit von alternativen Mitteln für die
    Erbringung der betreffenden kritischen Dienstleistung. Der Regelwert für Schwellenwerte nach Absatz
    1 Satz 1 Nummer 2 beträgt grundsätzlich 500 000 von einer Anlage zu versorgende Einwohner.'
  adressat: null
