- uid: § 3 Abs. 3@6836
  id: § 3 Abs. 3
  artikel: § 3
  artikel_titel: Zentrale Anlaufstelle; zuständige Behörde; behördliche Zusammenarbeit; Verordnungsermächtigung
  absatz: '3'
  buchstabe: null
  offset: 6836
  laenge: 760
  saetze: 4
  beleg: (3) Das Bundesministerium des Innern wird ermächtigt, durch Rechtsverordnung, die nicht der Zustimmung
    des Bundesrates bedarf, für weitere kritische Dienstleistungen, die in der Rechtsverordnung nach §
    4 Absatz 3 festgelegt werden, zuständige Bundesbehörden festzulegen. Für die kritische Dienstleistung
    des Betriebs von Bodeninfrastrukturen für die Erbringung weltraumgestützter Dienste im Sektor Weltraum
    wird das Bundesministerium für Forschung, Technologie und Raumfahrt ermächtigt, durch Rechtsverordnung,
    die nicht der Zustimmung des Bundesrates bedarf, eine oder mehrere zuständige Bundesbehörden festzulegen.
    § 4 Absatz 4 und 5 gilt entsprechend. Die Rechtsverordnung nach Satz 2 ergeht zusätzlich im Einvernehmen
    mit dem Bundesministerium des Innern.
