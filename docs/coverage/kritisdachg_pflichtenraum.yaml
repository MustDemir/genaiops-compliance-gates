  absatz: '4'
  buchstabe: null
  offset: 15646
  laenge: 857
  saetze: 4
  beleg: (4) Falls für die betroffene Dienstleistung eine Behörde des Bundes die zuständige Behörde ist,
    erfolgt die Feststellung nach Absatz 3 Satz 1 und 2 im Einvernehmen mit dem Bundesministerium, zu
    dessen Geschäftsbereich die Behörde gehört. Liegt die Fach- oder Rechtsaufsicht für den Teil einer
    Behörde, der für die betroffene kritische Dienstleistung zuständig ist, nicht bei dem Bundesministerium,
    zu dessen Geschäftsbereich sie gehört, erfolgt die Feststellung nach Absatz 3 Satz 1 und 2 im Einvernehmen
    mit dem Bundesministerium, dessen Fach- oder Rechtsaufsicht der betreffende Teil dieser Behörde untersteht.
    Im Übrigen erfolgt sie im Benehmen mit dem Landesministerium, zu dessen Geschäftsbereich die für die
    betroffene Dienstleistung zuständige Behörde gehört. Die zuständigen Behörden machen Vorschläge für
    Feststellungen nach Absatz 3 Satz 1 und 2.
