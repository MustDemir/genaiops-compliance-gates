  beleg: (7) Das Bundesministerium des Innern wird ermächtigt, in einer Rechtsverordnung, die der Zustimmung
    des Bundesrates bedarf, Kriterien und Verfahren festzulegen, mit denen die Länder feststellen können,
    ob eine Anlage für die Erbringung einer kritischen Dienstleistung erheblich ist, ohne die Voraussetzungen
    der Rechtsverordnung des Absatzes 1 Satz 1 zu erfüllen. Die Länder können dies für Anlagen feststellen,
    bei denen für die betroffene Dienstleistung eine Landesbehörde die zuständige Behörde ist. Bei der
