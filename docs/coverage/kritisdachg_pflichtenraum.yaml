  saetze: 2
  beleg: (8) Das Bundesamt für Bevölkerungsschutz und Katastrophenhilfe konsultiert in regelmäßigen Abständen,
    unter Einbindung der zuständigen Behörden, die zuständigen Behörden anderer Mitgliedstaaten der Europäischen
    Union, wenn 1. eine kritische Anlage physisch mit einer Einrichtung eines anderen Mitgliedstaates
    der Europäischen Union verbunden ist, 2. ein Betreiber kritischer Anlagen Teil von Unternehmensstrukturen
    ist, die mit einer kritischen Einrichtung im Sinne des Artikels 2 Nummer 1 der Richtlinie (EU) 2022/2557
    in einem anderen Mitgliedstaat der Europäischen Union verbunden sind oder zu ihnen in Bezug stehen
    oder 3. ein Betreiber kritischer Anlagen in einem anderen Mitgliedstaat der Europäischen Union als
    kritische Einrichtung im Sinne des Artikels 2 Nummer 1 der Richtlinie (EU) 2022/2557 eingestuft wurde
    und wesentliche Dienste im Sinne des Artikels 2 Nummer 5 der Richtlinie (EU) 2022/2557 und des Artikels
    2 der Delegierten Verordnung (EU) 2023/2450 für einen anderen oder in einem anderen Mitgliedstaat
    der Europäischen Union erbringt. zum Seitenanfang Impressum Datenschutz Barrierefreiheitserklärung
