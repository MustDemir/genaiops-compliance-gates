  id: § 11 Abs. 1
  artikel: § 11
  artikel_titel: Nationale Risikoanalysen und Risikobewertungen; Verordnungsermächtigung
  absatz: '1'
  buchstabe: null
  offset: 30908
  laenge: 1028
  saetze: 4
  beleg: (1) Als Grundlage für die Erstellung nationaler Risikoanalysen und Risikobewertungen führen die
    Bundesministerien und Landesministerien jeweils für die kritischen Dienstleistungen, für die eine
    Behörde ihres Geschäftsbereichs die zuständige Behörde ist und soweit sie die Fach- oder Rechtsaufsicht
    für die zuständige Behörde ausüben, Risikoanalysen und Risikobewertungen durch. Für kritische Dienstleistungen
    der Einrichtungen der Bundesverwaltung führt das Bundesministerium des Innern die Risikoanalyse und
    Risikobewertung auf der Grundlage fachspezifischer Bewertungen durch die übrigen Einrichtungen der
    Bundesverwaltung durch. Liegt die Fach- oder Rechtsaufsicht für die zuständige Behörde hinsichtlich
    der betroffenen kritischen Dienstleistung bei einem anderen Bundesministerium, führt dieses Bundesministerium
    die entsprechenden Risikoanalysen und Risikobewertungen durch. Die Sätze 1 und 2 gelten nicht für
    kritische Dienstleistungen, die vom Auswärtigen Amt und vom Bundesministerium der Verteidigung erbracht
    werden.
