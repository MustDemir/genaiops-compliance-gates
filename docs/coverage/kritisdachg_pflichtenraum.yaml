  offset: 56428
  laenge: 1170
  saetze: 5
  beleg: (2) Das Bundesministerium des Innern kann bei der Europäischen Kommission mit Zustimmung des
    betroffenen Betreibers kritischer Anlagen einen Antrag auf Organisation einer Beratungsmission zur
    Bewertung der Maßnahmen stellen, die der Betreiber kritischer Anlagen ergriffen hat, um seine Verpflichtungen
    nach den §§ 12, 13 und 18 zu erfüllen. Falls für die betroffene Dienstleistung eine Behörde des Bundes
    die zuständige Behörde ist, erfolgt die Antragstellung im Einvernehmen mit dem Bundesministerium,
    zu dessen Geschäftsbereich die Behörde gehört. Liegt die Fach- oder Rechtsaufsicht für den Teil einer
    Behörde, der für die betroffene kritische Dienstleistung zuständig ist, nicht bei dem Bundesministerium,
    zu dessen Geschäftsbereich sie gehört, erfolgt die Antragstellung nach Satz 1 im Einvernehmen mit
    dem Bundesministerium, dessen Fach- oder Rechtsaufsicht der betreffende Teil dieser Behörde untersteht.
    Im Übrigen erfolgt sie im Benehmen mit dem Landesministerium, zu dessen Geschäftsbereich die für die
