- uid: § 14 Abs. 2@42875
  id: § 14 Abs. 2
  artikel: § 14
  artikel_titel: Sektorenübergreifende und sektorspezifische Mindestanforderungen; branchenspezifische
    Resilienzstandards; Verordnungsermächtigungen
  absatz: '2'
  buchstabe: null
  offset: 42875
  laenge: 1352
  saetze: 5
  beleg: (2) Betreiber kritischer Anlagen oder ihre Branchenverbände können branchenspezifische Resilienzstandards
    zur Konkretisierung der Verpflichtungen nach § 13 Absatz 1 vorschlagen. Soweit das Bundesamt für Sicherheit
    in der Informationstechnik branchenspezifische Standards nach § 30 Absatz 8 des BSI-Gesetzes hat,
    sollen diese die Grundlage für branchenspezifische Resilienzstandards nach Satz 1 sein. Das Bundesamt
    für Bevölkerungsschutz und Katastrophenhilfe stellt auf Antrag die Geeignetheit dieser branchenspezifischen
    Resilienzstandards zur Gewährleistung der Anforderungen nach Absatz 1 fest und veröffentlicht diese
    auf seiner Internetseite. Die Feststellung erfolgt 1. im Einvernehmen mit dem Bundesamt für Sicherheit
    in der Informationstechnik, 2. falls für die betroffene Dienstleistung eine Behörde des Bundes die
    zuständige Behörde ist, in deren Einvernehmen, 3. falls für die betroffene Dienstleistung Behörden
    der Länder die zuständigen Behörden sind, in deren Benehmen und 4. im Sektor Energie im Benehmen mit
    dem Bundesamt für Seeschifffahrt und Hydrographie, soweit maritime Infrastrukturen in der ausschließlichen
    Wirtschaftszone betroffen sind. Aus Gründen des öffentlichen Interesses werden für die Feststellung
    keine Gebühren oder Auslagen für die Tätigkeit des Bundesamtes für Bevölkerungsschutz und Katastrophenhilfe
    erhoben.
