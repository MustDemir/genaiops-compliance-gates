- uid: § 16 Abs. 2@45618
  id: § 16 Abs. 2
  artikel: § 16
  artikel_titel: Nachweise und behördliche Anordnungen zu Resilienzpflichten
  absatz: '2'
  buchstabe: null
  offset: 45618
  laenge: 898
  saetze: 5
  beleg: (2) Sofern die nach Absatz 1 übermittelten Informationen zur Feststellung der Einhaltung der
    Verpflichtungen nach § 13 Absatz 1 nicht ausreichen, kann die zuständige Behörde einzelne Betreiber
    kritischer Anlagen zur Vorlage weiterer Informationen und geeigneter Nachweise auffordern. Insbesondere
    kann sie die Vorlage des Resilienzplans verlangen. Bei der Auswahl, von welchen Betreibern kritischer
    Anlagen Nachweise nach Satz 1 angefordert werden, verfolgt die zuständige Behörde einen risikobasierten
    Ansatz. Sie wählt die zu kontrollierenden Betreiber kritischer Anlagen anhand des Ausmaßes der Risikoexposition,
    der Größe des Betreibers kritischer Anlagen und der Eintrittswahrscheinlichkeit und Schwere von möglichen
    Vorfällen sowie deren möglichen gesellschaftlichen und wirtschaftlichen Auswirkungen aus. Der Grundsatz
    der Wirtschaftlichkeit der Verwaltung soll dabei berücksichtigt werden.
  adressat: null
