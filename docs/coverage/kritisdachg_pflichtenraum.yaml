  beleg: (3) Ist eine Anlage für die Erbringung einer kritischen Dienstleistung erheblich, ohne die Voraussetzungen
    der Rechtsverordnung des Absatzes 1 Satz 1 zu erfüllen, so stellt das Bundesministerium des Innern
    dies im Einzelfall fest. Ist eine Anlage für die Erbringung einer kritischen Dienstleistung nicht
    erheblich, obwohl sie die Voraussetzungen der Rechtsverordnung des Absatzes 1 Satz 1 erfüllt, so stellt
    das Bundesministerium des Innern dies im Einzelfall fest. Für die Beurteilung der Erheblichkeit einer
    Anlage für die Erbringung einer kritischen Dienstleistung gilt Absatz 2 entsprechend.
