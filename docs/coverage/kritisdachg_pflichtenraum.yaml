  beleg: (6) Das Bundesamt für Bevölkerungsschutz und Katastrophenhilfe übermittelt dem von dem Vorfall
    betroffenen Betreiber kritischer Anlagen unverzüglich eine Bestätigung über den Eingang der Meldung
    nach Absatz 1 und unverzüglich nach seiner Meldung sachdienliche Folgeinformationen, unter anderem
    Informationen, die die wirksame Reaktion dieses Betreibers auf den betreffenden Vorfall unterstützen
    könnten. Dabei kann es sich um passende Leitlinien zu Reaktionsverfahren und zur Resilienzstärkung
    handeln.
