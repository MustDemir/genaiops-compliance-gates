  offset: 65057
  laenge: 946
  saetze: 2
  beleg: (2) Die Verarbeitung personenbezogener Daten durch die in Absatz 1 genannten Stellen zu anderen
    Zwecken als demjenigen, zu dem die Daten ursprünglich erhoben wurden, ist unbeschadet von § 23 des
    Bundesdatenschutzgesetzes und Artikel 6 Absatz 4 der Verordnung (EU) 2016/679 zulässig, soweit 1.
    die Verarbeitung erforderlich ist zur Sammlung, Auswertung oder Untersuchung von Informationen über
    nach § 18 gemeldete Vorfälle oder 2. dies der Unterstützung oder Beratung von Betreibern kritischer
    Anlagen bei der Gewährleistung ihrer Resilienz dient und kein Grund zu der Annahme besteht, dass das
    schutzwürdige Interesse der betroffenen Person an dem Ausschluss der Verarbeitung überwiegt. (2a)
    Die Erforderlichkeit der Verarbeitung personenbezogener Daten im Sinne der Absätze 1 und 2 ist insbesondere
    dann nicht gegeben, wenn durch eine Verarbeitung anonymisierter oder künstlich erzeugter Daten der
    Zweck in gleicher Weise erfüllt werden kann.
