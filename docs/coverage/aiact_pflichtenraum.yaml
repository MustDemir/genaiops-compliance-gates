- id: Art. 26 Abs. 1
  artikel: '26'
  artikel_titel: Pflichten der Betreiber von Hochrisiko-KI-Systemen
  absatz: '1'
  buchstabe: null
  offset: 358947
  laenge: 257
  saetze: 1
  beleg: (1)   Die Betreiber von Hochrisiko-KI-Systemen treffen geeignete technische und organisatorische
    Maßnahmen, um sicherzustellen, dass sie solche Systeme entsprechend der den Systemen beigefügten Betriebsanleitungen
    und gemäß den Absätzen 3 und 6 verwenden.
  adressat: betreiber
  pflicht: Der Betreiber trifft geeignete technische und organisatorische Massnahmen, damit das Hochrisiko-KI-System
    entsprechend der beigefuegten Betriebsanleitung verwendet wird.
  scope: in
  scope_grund: null
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: unveraendert — VO (EU) 2026/1744 Art. 1 aendert Art. 25 und Art. 27, Art. 26 ist in der Aenderungsliste
    nicht enthalten
  requirement:
  - R011
  gate:
  - G-DEP-04
  befund: teilabdeckung
  befund_grund: 'VERDACHT GEPRUEFT (T-12 Lauf 1): R011 zielt ausweislich seines Titels und seiner eu_ai_act_refs
    (Art. 26 Abs. 1, Art. 47, Art. 48) auf die CE-/Konformitaetserklaerungs-Eingangspruefung; G-DEP-04/C-01
    prueft genau das ("CE-Kennzeichnung verifiziert, Provider-Doku erhalten und kontaktierbar") und schliesst
    Art. 47/48 laut eigener notes ausdruecklich als Anbieterpflicht aus. Die Pflicht aus Abs. 1 selbst
    - geeignete technische und organisatorische Massnahmen fuer den betriebsanleitungskonformen Einsatz
    - ist etwas anderes: eine allgemeine Umsetzungspflicht, kein CE-Check. Im gesamten Katalog (G-PRE-01..05,
    G-DEP-01..06, G-OPS-01..06) prueft kein Gate diese allgemeine Umsetzungspflicht als solche; die naechstliegenden
    Gates (G-OPS-01 Human Oversight, G-PRE-05 Governance-Freigabe) decken jeweils nur einen Teilaspekt
    (Aufsicht, Freigabe), nicht die Betriebsanleitungskonformitaet im Allgemeinen. Ergebnis: die Zuordnung
    R011/G-DEP-04 zu Art. 26 Abs. 1 ist eine Fehlzuordnung (die Pflicht, die G-DEP-04 tatsaechlich prueft,
    steht sachlich naeher bei Art. 47/48); die tatsaechliche Pflicht aus Abs. 1 ist im Katalog nicht gezielt
    abgebildet. PO-Entscheidung noetig: R011 auf Art. 47/48 als eu_ai_act_refs praezisieren (Anbieterpflicht,
    durchschlagend nur als Betreiber-Eingangspruefung) und fuer Abs. 1 selbst ein eigenes Requirement
    erwaegen, oder Abs. 1 als durch die Summe der uebrigen Art.-26-Gates (Abs. 2, 5, 6 u.a.) als hinreichend
    operationalisiert ansehen. befund bleibt auf ''teilabdeckung'' stehen, bis die PO entscheidet.'
  po_bestaetigt: false
