    aufgrund deren Reichweite oder aufgrund tatsächlicher oder vernünftigerweise vorhersehbarer negativer
    Folgen für die öffentliche Gesundheit, die Sicherheit, die öffentliche Sicherheit, die Grundrechte
    oder die Gesellschaft insgesamt erhebliche Auswirkungen auf den Unionsmarkt hat, die sich in großem
    Umfang über die gesamte Wertschöpfungskette hinweg verbreiten können; 66. „KI-System mit allgemeinem
    Verwendungszweck“ ein KI-System, das auf einem KI-Modell mit allgemeinem Verwendungszweck beruht und
    in der Lage ist, einer Vielzahl von Zwecken sowohl für die direkte Verwendung als auch für die Integration
    in andere KI-Systeme zu dienen; 67. „Gleitkommaoperation“ jede Rechenoperation oder jede Zuweisung
    mit Gleitkommazahlen, bei denen es sich um eine Teilmenge der reellen Zahlen handelt, die auf Computern
    typischerweise durch das Produkt aus einer ganzen Zahl mit fester Genauigkeit und einer festen Basis
    mit ganzzahligem Exponenten dargestellt wird; 68. „nachgelagerter Anbieter“ einen Anbieter eines KI-Systems,
