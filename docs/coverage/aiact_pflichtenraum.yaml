- id: Art. 15 Abs. 1
  artikel: '15'
  artikel_titel: Genauigkeit, Robustheit und Cybersicherheit
  absatz: '1'
  buchstabe: null
  offset: 332532
  laenge: 237
  saetze: 1
  beleg: (1)   Hochrisiko-KI-Systeme werden so konzipiert und entwickelt, dass sie ein angemessenes Maß
    an Genauigkeit, Robustheit und Cybersicherheit erreichen und in dieser Hinsicht während ihres gesamten
    Lebenszyklus beständig funktionieren.
  adressat: anbieter
  pflicht: Hochrisiko-KI-Systeme werden so konzipiert und entwickelt, dass sie ein angemessenes Mass an
    Genauigkeit, Robustheit und Cybersicherheit erreichen und waehrend ihres gesamten Lebenszyklus bestaendig
    funktionieren.
  scope: in
  scope_grund: null
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: 'unveraendert - Art. 15 ist in der Aenderungsliste des Art. 1 der VO (EU) 2026/1744 nicht enthalten
    (geprüft am verfügenden Teil, docs/legal/OJ_L_202601744_DE.pdf: die Liste geaenderter Artikel geht
    von Nr. 10 [Art. 11] direkt auf Nr. 11 [Art. 17] ueber).'
  requirement:
  - R003
  gate:
  - G-PRE-04
  - G-DEP-02
  - G-OPS-04
  befund: teilabdeckung
  befund_grund: 'Design-/Entwicklungspflicht des Anbieters (Modell-Ebene), aber scope: in, weil ein Teil
    der Betriebsumgebung, in der ''bestaendiges Funktionieren'' erreicht wird, unter der Kontrolle des
    Betreibers steht - G-PRE-04 (runAsNonRoot, resource limits, kein Klartext-Secret, keine Privilege
    Escalation) und G-OPS-04 (Image-Scanning, NetworkPolicies, Verschluesselung) pruefen genau diese Infrastruktur-seitige
    Haelfte und liegen echt beim Betreiber. Die Modell-Ebene (accuracy, safety_score in G-DEP-02) bleibt
    dagegen laut G-DEP-02s eigener rationale durchgehend E-0/deklariert - ''ohne Ground Truth ist Genauigkeit
    im Betrieb nicht messbar''. Ergebnis: Infrastruktur-Cybersicherheit ist real getestet, Modell-Genauigkeit/-Robustheit
    bleibt Selbstauskunft.'
  po_bestaetigt: false
