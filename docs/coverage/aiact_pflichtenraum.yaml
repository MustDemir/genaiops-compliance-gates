  saetze: 3
  beleg: (1)   Der Anbieter stellt für jedes Hochrisiko-KI-System eine schriftliche maschinenlesbare,
    physische oder elektronisch unterzeichnete EU-Konformitätserklärung aus und hält sie für einen Zeitraum
    von 10 Jahren ab dem Inverkehrbringen oder der Inbetriebnahme des Hochrisiko-KI-Systems für die zuständigen
    nationalen Behörden bereit. Aus der EU-Konformitätserklärung geht hervor, für welches Hochrisiko-KI-System
    sie ausgestellt wurde. Eine Kopie der EU-Konformitätserklärung wird den zuständigen nationalen Behörden
    auf Anfrage übermittelt.
