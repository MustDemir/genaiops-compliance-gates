  absatz: '3'
  buchstabe: null
  offset: 385196
  laenge: 968
  saetze: 4
  beleg: (3)   Beschließt eine notifizierte Stelle die Einstellung ihrer Konformitätsbewertungstätigkeiten,
    so informiert sie die betreffende notifizierende Behörde und die betreffenden Anbieter so bald wie
    möglich und im Falle einer geplanten Einstellung ihrer Tätigkeiten mindestens ein Jahr vor deren Einstellung
    darüber. Die Bescheinigungen der notifizierten Stelle können für einen Zeitraum von neun Monaten nach
    Einstellung der Tätigkeiten der notifizierten Stelle gültig bleiben, sofern eine andere notifizierte
    Stelle schriftlich bestätigt hat, dass sie die Verantwortung für die von diesen Bescheinigungen abgedeckten
    Hochrisiko-KI-Systeme übernimmt. Die letztgenannte notifizierte Stelle führt vor Ablauf dieser Frist
    von neun Monaten eine vollständige Bewertung der betroffenen Hochrisiko-KI-Systeme durch, bevor sie
    für diese neue Bescheinigungen ausstellt. Stellt die notifizierte Stelle ihre Tätigkeit ein, so widerruft
    die notifizierende Behörde die Benennung.
  adressat: null
