  scope: in
  scope_grund: null
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: 'unveraendert - Art. 14 ist in der Aenderungsliste des Art. 1 der VO (EU) 2026/1744 nicht enthalten
    (geprüft am verfügenden Teil, docs/legal/OJ_L_202601744_DE.pdf: die Liste geaenderter Artikel geht
    von Nr. 10 [Art. 11] direkt auf Nr. 11 [Art. 17] ueber).'
  requirement:
  - R004
  - R008
  gate:
  - G-PRE-05
  - G-OPS-01
  befund: teilabdeckung
  befund_grund: 'Design-/Entwicklungspflicht des Anbieters (Faehigkeit zur wirksamen Beaufsichtigung muss
    im System angelegt sein), Vorbedingung fuer die Betreiberpflicht aus Art. 26 Abs. 2 (Uebertragung
    der Aufsicht) - deshalb scope: in trotz Anbieter-Duty-Bearer, analog Art. 9 Abs. 5 lit. c. G-PRE-05/C-01
    prueft ''human_oversight_model + oversight_lead definiert, kill_switch fuer High-Risk'' (Selbstauskunft,
    E-0); G-OPS-01/C-01 prueft Rollen-/Eskalations-/Override-/Monitoring-Dokumentation (E-0). Beide pruefen
    Betreiber-seitige DOKUMENTATION der Aufsicht, nicht ob das SYSTEM selbst technisch wirksam beaufsichtigbar
    ist (das waere eine Anbieter-seitige, am System pruefbare Eigenschaft, E-2-faehig - HANDBUCH 4.5 nennt
    Beweiskraft als Rang-1-Achse, hier nicht erreicht).'
  po_bestaetigt: false
- id: Art. 14 Abs. 2
  artikel: '14'
  artikel_titel: Menschliche Aufsicht
  absatz: '2'
  buchstabe: null
  offset: 329155
  laenge: 412
  saetze: 1
  beleg: (2)   Die menschliche Aufsicht dient der Verhinderung oder Minimierung der Risiken für Gesundheit,
    Sicherheit oder Grundrechte, die entstehen können, wenn ein Hochrisiko-KI-System im Einklang mit seiner
    Zweckbestimmung oder im Rahmen einer vernünftigerweise vorhersehbaren Fehlanwendung verwendet wird,
    insbesondere wenn solche Risiken trotz der Einhaltung anderer Anforderungen dieses Abschnitts fortbestehen.
