  saetze: 3
  beleg: (4)   Die notifizierten Stellen müssen von dem Anbieter eines Hochrisiko-KI-Systems, zu dem sie
    Konformitätsbewertungstätigkeiten durchführen, unabhängig sein. Außerdem müssen die notifizierten
    Stellen von allen anderen Akteuren, die ein wirtschaftliches Interesse an den bewerteten Hochrisiko-KI-Systemen
