    zur Erfüllung seiner Aufgaben ausgestattet wurde, und ob es für die ordnungsgemäße Durchführung und
    Durchsetzung dieser Verordnung zweckmäßig und erforderlich wäre, das Büro für Künstliche Intelligenz
    und seine Durchsetzungskompetenzen zu erweitern und seine Ressourcen aufzustocken. Die Kommission
    übermittelt dem Europäischen Parlament und dem Rat einen Bericht über ihre Bewertung.
