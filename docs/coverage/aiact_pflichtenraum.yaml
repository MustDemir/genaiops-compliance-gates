  beleg: 'f) eine schriftliche Erklärung, dass derselbe Antrag bei keiner anderen notifizierten Stelle
    eingereicht wurde. 3.2. Das Qualitätssicherungssystem wird von der notifizierten Stelle bewertet,
    um festzustellen, ob es die in Artikel 17 genannten Anforderungen erfüllt. Die Entscheidung wird dem
    Anbieter oder dessen Bevollmächtigten mitgeteilt. Die Mitteilung enthält die Ergebnisse der Bewertung
    des Qualitätsmanagementsystems und die begründete Bewertungsentscheidung. 3.3. Das genehmigte Qualitätsmanagementsystem
    wird vom Anbieter weiter angewandt und gepflegt, damit es stets angemessen und effizient funktioniert.
    3.4. Der Anbieter unterrichtet die notifizierte Stelle über jede beabsichtigte Änderung des genehmigten
    Qualitätsmanagementsystems oder der Liste der unter dieses System fallenden KI-Systeme. Die notifizierte
    Stelle prüft die vorgeschlagenen Änderungen und entscheidet, ob das geänderte Qualitätsmanagementsystem
    die unter Nummer 3.2 genannten Anforderungen weiterhin erfüllt oder ob eine erneute Bewertung erforderlich
    ist. Die notifizierte Stelle teilt dem Anbieter ihre Entscheidung mit. Die Mitteilung enthält die
    Ergebnisse der Prüfung der Änderungen und die begründete Bewertungsentscheidung. 4.   Kontrolle der
