  beleg: (4)   Die Kommission kann ein KI-Modell mit allgemeinem Verwendungszweck von Amts wegen oder
    aufgrund einer qualifizierten Warnung des wissenschaftlichen Gremiums gemäß Artikel 90 Absatz 1 Buchstabe
