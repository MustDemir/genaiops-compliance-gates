- id: Art. 46 Abs. 1
  artikel: '46'
  artikel_titel: Ausnahme vom Konformitätsbewertungsverfahren
  absatz: '1'
  buchstabe: null
  offset: 411845
  laenge: 680
  saetze: 3
  beleg: (1)   Abweichend von Artikel 43 und auf ein hinreichend begründetes Ersuchen kann eine Marktüberwachungsbehörde
    das Inverkehrbringen oder die Inbetriebnahme bestimmter Hochrisiko-KI-Systeme im Hoheitsgebiet des
    betreffenden Mitgliedstaats aus außergewöhnlichen Gründen der öffentlichen Sicherheit, des Schutzes
    des Lebens und der Gesundheit von Personen, des Umweltschutzes oder des Schutzes wichtiger Industrie-
    und Infrastrukturanlagen genehmigen. Diese Genehmigung wird auf die Dauer der erforderlichen Konformitätsbewertungsverfahren
    befristet, wobei den außergewöhnlichen Gründen für die Ausnahme Rechnung getragen wird. Der Abschluss
    dieser Verfahren erfolgt unverzüglich.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
