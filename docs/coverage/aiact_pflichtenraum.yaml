  laenge: 871
  saetze: 3
  beleg: (3)   Die Mitgliedstaaten sorgen dafür, dass ihre zuständigen nationalen Behörden mit angemessenen
    technischen und finanziellen Mitteln sowie geeignetem Personal und Infrastrukturen ausgestattet werden,
    damit sie ihre Aufgaben im Rahmen dieser Verordnung wirksam erfüllen können. Insbesondere müssen die
    zuständigen nationalen Behörden zu jeder Zeit über eine ausreichende Zahl von Mitarbeitern verfügen,
    zu deren Kompetenzen und Fachwissen ein tiefes Verständnis der KI-Technologien, der Daten und Datenverarbeitung,
    des Schutzes personenbezogener Daten, der Cybersicherheit, der Grundrechte, der Gesundheits- und Sicherheitsrisiken
    sowie Kenntnis der bestehenden Normen und rechtlichen Anforderungen gehört. Die Mitgliedstaaten bewerten
    und aktualisieren, falls erforderlich, jährlich die in diesem Absatz genannten Erfordernisse bezüglich
    Kompetenzen und Ressourcen.
