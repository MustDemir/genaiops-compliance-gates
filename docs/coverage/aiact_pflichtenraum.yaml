  pflicht: Die menschliche Aufsicht dient der Verhinderung oder Minimierung von Risiken fuer Gesundheit,
    Sicherheit oder Grundrechte bei zweckbestimmungsgemaesser Verwendung oder vernuenftigerweise vorhersehbarer
    Fehlanwendung, insbesondere wenn Risiken trotz Einhaltung anderer Anforderungen fortbestehen.
  scope: in
  scope_grund: null
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: 'unveraendert - Art. 14 ist in der Aenderungsliste des Art. 1 der VO (EU) 2026/1744 nicht enthalten
    (geprüft am verfügenden Teil, docs/legal/OJ_L_202601744_DE.pdf: die Liste geaenderter Artikel geht
    von Nr. 10 [Art. 11] direkt auf Nr. 11 [Art. 17] ueber).'
  requirement:
  - R008
  gate: []
  befund: luecke
  befund_grund: 'Zweckbestimmungsnorm: Aufsicht MUSS Risiken tatsaechlich verhindern/minimieren - eine
    Wirksamkeitsfrage, keine Dokumentationsfrage. R008 fuehrt genau das bereits als declared_gap: ''periodische
    Wirksamkeitspruefung wird nicht ausgefuehrt'', ''es gibt keine Eskalation, weil es keine Messung der
    Sterz-Bedingungen (Causal Power, Epistemic Access, Self-Control, Fitting Intentions) gibt''. Kein
    Gate im Katalog prueft, ob Aufsicht wirkt statt nur existiert.'
  po_bestaetigt: false
