  absatz: '2'
  buchstabe: null
  offset: 395233
  laenge: 1766
  saetze: 9
  beleg: (2)   Gemäß Artikel 10 der Verordnung (EU) Nr. 1025/2012 erteilt die Kommission unverzüglich
    Normungsaufträge, die alle Anforderungen gemäß Abschnitt 2 des vorliegenden Kapitels abdecken und
    gegebenenfalls Normungsaufträge, die Pflichten gemäß Kapitel V Abschnitte 2 und 3 der vorliegenden
    Verordnung abdecken. In dem Normungsauftrag werden auch Dokumente zu den Berichterstattungs- und Dokumentationsverfahren
    im Hinblick auf die Verbesserung der Ressourcenleistung von KI-Systemen z. B. durch die Verringerung
    des Energie- und sonstigen Ressourcenverbrauchs des Hochrisiko-KI-Systems während seines gesamten
    Lebenszyklus und zu der energieeffizienten Entwicklung von KI-Modellen mit allgemeinem Verwendungszweck
    verlangt. Bei der Ausarbeitung des Normungsauftrags konsultiert die Kommission das KI-Gremium und
    die einschlägigen Interessenträger, darunter das Beratungsforum. Bei der Erteilung eines Normungsauftrags
    an die europäischen Normungsorganisationen gibt die Kommission an, dass die Normen klar und — u. a.
    mit den Normen, die in den verschiedenen Sektoren für Produkte entwickelt wurden, die unter die in
    Anhang I aufgeführten geltenden Harmonisierungsrechtsvorschriften der Union fallen — konsistent sein
    müssen und sicherstellen sollen, dass die in der Union in Verkehr gebrachten oder in Betrieb genommenen
    Hochrisiko-KI-Systeme oder KI-Modelle mit allgemeinem Verwendungszweck die in dieser Verordnung festgelegten
    einschlägigen Anforderungen oder Pflichten erfüllen. Die Kommission fordert die europäischen Normungsorganisationen
    auf, Nachweise dafür vorzulegen, dass sie sich nach besten Kräften bemühen, die in den Unterabsätzen
    1 und 2 dieses Absatzes genannten Ziele im Einklang mit Artikel 24 der Verordnung (EU) Nr. 1025/2012
    zu erreichen.
