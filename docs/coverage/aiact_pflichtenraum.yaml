  befund: teilabdeckung
  befund_grund: 'G-OPS-01/C-01 prueft, dass oversight_roles, escalation_procedure, output_override und
    real_time_monitoring dokumentiert sind (Pod-Annotation, E-0) - das deckt die UEBERTRAGUNG an eine
    benannte Rolle, nicht dass diese Person tatsaechlich ueber Kompetenz, Ausbildung und Befugnis verfuegt
    oder laufend Unterstuetzung erhaelt (R008 selbst fuehrt das als declared_gap: ''Wirksamkeit der Aufsicht
    ... wird nicht gemessen''). G-PRE-01/C-A7 (SHOULD) prueft zusaetzlich, ob eine behauptete menschliche
    Kontrolle einen Wirksamkeitsnachweis referenziert (Ziel G-OPS-01) - ASYMMETRIE: G-PRE-01 traegt in
    links.requirements nur R001, nicht R008, obwohl C-A7 legal_refs explizit Art. 26 Abs. 2 nennt; umgekehrt
    fuehrt R008.linked_gates nur G-OPS-01, nicht G-PRE-01 (SPEC-06 Abschnitt 1.2, Befund 2 - hier ein
    weiteres Beispiel derselben Asymmetrie-Klasse, PO-Entscheidung noetig).'
