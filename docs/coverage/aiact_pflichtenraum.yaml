    Betreibern und Betroffenen unter Berücksichtigung ihrer jeweiligen Rechte und Pflichten im Rahmen
    dieser Verordnung ermöglichen, KI-Systeme sachkundig einzusetzen sowie sich der Chancen und Risiken
    von KI und möglicher Schäden, die sie verursachen kann, bewusst zu werden. 57. „Test unter Realbedingungen“
    den befristeten Test eines KI-Systems auf seine Zweckbestimmung, der unter Realbedingungen außerhalb
    eines Labors oder einer anderweitig simulierten Umgebung erfolgt, um zuverlässige und belastbare Daten
