    der Union über Finanzdienstleistungen Anforderungen in Bezug auf ihre Regelungen oder Verfahren der
    internen Unternehmensführung unterliegen, bewahren die Protokolle als Teil der gemäß einschlägigem
    Unionsecht über Finanzdienstleistungen aufzubewahrenden Dokumentation auf.
