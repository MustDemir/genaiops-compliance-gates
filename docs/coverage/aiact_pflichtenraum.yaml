- id: Art. 15 Abs. 5
  artikel: '15'
  artikel_titel: Genauigkeit, Robustheit und Cybersicherheit
  absatz: '5'
  buchstabe: null
  offset: 334291
  laenge: 1001
  saetze: 4
  beleg: (5)   Hochrisiko-KI-Systeme müssen widerstandsfähig gegen Versuche unbefugter Dritter sein, ihre
    Verwendung, Ausgaben oder Leistung durch Ausnutzung von Systemschwachstellen zu verändern. Die technischen
    Lösungen zur Gewährleistung der Cybersicherheit von Hochrisiko-KI-Systemen müssen den jeweiligen Umständen
    und Risiken angemessen sein. Die technischen Lösungen für den Umgang mit KI-spezifischen Schwachstellen
    umfassen gegebenenfalls Maßnahmen, um Angriffe, mit denen versucht wird, eine Manipulation des Trainingsdatensatzes
    („data poisoning“) oder vortrainierter Komponenten, die beim Training verwendet werden („model poisoning“),
    vorzunehmen, Eingabedaten, die das KI-Modell zu Fehlern verleiten sollen („adversarial examples“ oder
    „model evasions“), Angriffe auf vertrauliche Daten oder Modellmängel zu verhüten, zu erkennen, darauf
    zu reagieren, sie zu beseitigen und zu kontrollieren. ABSCHNITT 3 Pflichten der Anbieter und Betreiber
    von Hochrisiko-KI-Systemen und anderer Beteiligter
  adressat: anbieter
  pflicht: Hochrisiko-KI-Systeme muessen widerstandsfaehig gegen Manipulationsversuche unbefugter Dritter
    sein; die technischen Loesungen umfassen ggf. Massnahmen gegen data poisoning, model poisoning, adversarial
    examples/model evasion sowie Angriffe auf vertrauliche Daten oder Modellmaengel.
  scope: in
  scope_grund: null
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: 'unveraendert - Art. 15 ist in der Aenderungsliste des Art. 1 der VO (EU) 2026/1744 nicht enthalten
    (geprüft am verfügenden Teil, docs/legal/OJ_L_202601744_DE.pdf: die Liste geaenderter Artikel geht
    von Nr. 10 [Art. 11] direkt auf Nr. 11 [Art. 17] ueber).'
  requirement:
  - R003
  gate:
  - G-OPS-04
  befund: teilabdeckung
  befund_grund: 'PRAEZISER BEFUND: G-OPS-04/C-01 prueft generische Infrastruktur-Cybersicherheit (Image-Scanning,
    NetworkPolicies, Verschluesselung at-rest/in-transit) - real und wirksam fuer ''Angriffe auf vertrauliche
    Daten''. Die von Abs. 5 NAMENTLICH genannten KI-spezifischen Bedrohungsklassen - data poisoning, model
    poisoning, adversarial examples/model evasion - haben dagegen KEINE Entsprechung in irgendeinem Gate
    des Katalogs. Weder G-DEP-02 (Safety-Metriken) noch G-DEP-05 (Bias) noch G-OPS-04 testen adversariale
    Robustheit im engeren Sinn (adversarial_tests wird in G-DEP-02/C-02 zwar als Feld erwaehnt, aber als
    SHOULD und nur ''durchgefuehrt''-Flag, keine inhaltliche Pruefung). Substantielle, nicht nur formale
    Luecke.'
  po_bestaetigt: false
