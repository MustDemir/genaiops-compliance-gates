  offset: 439927
  laenge: 764
  saetze: 3
  beleg: (2)   Anbieter von KI-Modellen mit allgemeinem Verwendungszweck mit systemischem Risiko können
    sich bis zur Veröffentlichung einer harmonisierten Norm auf Praxisleitfäden im Sinne des Artikels
    56 stützen, um die Einhaltung der in Absatz 1 des vorliegenden Artikels genannten Pflichten nachzuweisen.
    Die Einhaltung der harmonisierten europäischen Norm begründet für die Anbieter die Vermutung der Konformität,
    insoweit diese Normen diese Verpflichtungen abdecken. Anbieter von KI-Modellen mit allgemeinem Verwendungszweck
    mit systemischem Risiko, die einen genehmigten Praxisleitfaden nicht befolgen oder eine harmonisierte
    europäische Norm nicht einhalten, müssen geeignete alternative Verfahren der Einhaltung aufzeigen,
    die von der Kommission zu bewerten sind.
