- id: Art. 50 Abs. 4
  artikel: '50'
  artikel_titel: Transparenzpflichten für Anbieter und Betreiber bestimmter KI-Systeme
  absatz: '4'
  buchstabe: null
  offset: 423555
  laenge: 1366
  saetze: 5
  beleg: (4)   Betreiber eines KI-Systems, das Bild-, Ton- oder Videoinhalte erzeugt oder manipuliert,
    die ein Deepfake sind, müssen offenlegen, dass die Inhalte künstlich erzeugt oder manipuliert wurden.
    Diese Pflicht gilt nicht, wenn die Verwendung zur Aufdeckung, Verhütung, Ermittlung oder Verfolgung
    von Straftaten gesetzlich zugelassen ist. Ist der Inhalt Teil eines offensichtlich künstlerischen,
    kreativen, satirischen, fiktionalen oder analogen Werks oder Programms, so beschränken sich die in
    diesem Absatz festgelegten Transparenzpflichten darauf, das Vorhandensein solcher erzeugten oder manipulierten
    Inhalte in geeigneter Weise offenzulegen, die die Darstellung oder den Genuss des Werks nicht beeinträchtigt.
    Betreiber eines KI-Systems, das Text erzeugt oder manipuliert, der veröffentlicht wird, um die Öffentlichkeit
    über Angelegenheiten von öffentlichem Interesse zu informieren, müssen offenlegen, dass der Text künstlich
    erzeugt oder manipuliert wurde. Diese Pflicht gilt nicht, wenn die Verwendung zur Aufdeckung, Verhütung,
    Ermittlung oder Verfolgung von Straftaten gesetzlich zugelassen ist oder wenn die durch KI erzeugten
    Inhalte einem Verfahren der menschlichen Überprüfung oder redaktionellen Kontrolle unterzogen wurden
    und wenn eine natürliche oder juristische Person die redaktionelle Verantwortung für die Veröffentlichung
    der Inhalte trägt.
