- id: Art. 3
  artikel: '3'
  artikel_titel: Begriffsbestimmungen
  absatz: '-'
  buchstabe: null
  offset: 269531
  laenge: 10818
  saetze: 1
  beleg: Für die Zwecke dieser Verordnung bezeichnet der Ausdruck 1. „KI-System“ ein maschinengestütztes
    System, das für einen in unterschiedlichem Grade autonomen Betrieb ausgelegt ist und das nach seiner
    Betriebsaufnahme anpassungsfähig sein kann und das aus den erhaltenen Eingaben für explizite oder
    implizite Ziele ableitet, wie Ausgaben wie etwa Vorhersagen, Inhalte, Empfehlungen oder Entscheidungen
    erstellt werden, die physische oder virtuelle Umgebungen beeinflussen können; 2. „Risiko“ die Kombination
    aus der Wahrscheinlichkeit des Auftretens eines Schadens und der Schwere dieses Schadens; 3. „Anbieter“
    eine natürliche oder juristische Person, Behörde, Einrichtung oder sonstige Stelle, die ein KI-System
    oder ein KI-Modell mit allgemeinem Verwendungszweck entwickelt oder entwickeln lässt und es unter
    ihrem eigenen Namen oder ihrer Handelsmarke in Verkehr bringt oder das KI-System unter ihrem eigenen
    Namen oder ihrer Handelsmarke in Betrieb nimmt, sei es entgeltlich oder unentgeltlich; 4. „Betreiber“
    eine natürliche oder juristische Person, Behörde, Einrichtung oder sonstige Stelle, die ein KI-System
    in eigener Verantwortung verwendet, es sei denn, das KI-System wird im Rahmen einer persönlichen und
    nicht beruflichen Tätigkeit verwendet; 5. „Bevollmächtigter“ eine in der Union ansässige oder niedergelassene
    natürliche oder juristische Person, die vom Anbieter eines KI-Systems oder eines KI-Modells mit allgemeinem
    Verwendungszweck schriftlich dazu bevollmächtigt wurde und sich damit einverstanden erklärt hat, in
    seinem Namen die in dieser Verordnung festgelegten Pflichten zu erfüllen bzw. Verfahren durchzuführen;
    6. „Einführer“ eine in der Union ansässige oder niedergelassene natürliche oder juristische Person,
    die ein KI-System, das den Namen oder die Handelsmarke einer in einem Drittland niedergelassenen natürlichen
    oder juristischen Person trägt, in Verkehr bringt; 7. „Händler“ eine natürliche oder juristische Person
    in der Lieferkette, die ein KI-System auf dem Unionsmarkt bereitstellt, mit Ausnahme des Anbieters
    oder des Einführers; 8. „Akteur“ einen Anbieter, Produkthersteller, Betreiber, Bevollmächtigten, Einführer
    oder Händler; 9. „Inverkehrbringen“ die erstmalige Bereitstellung eines KI-Systems oder eines KI-Modells
    mit allgemeinem Verwendungszweck auf dem Unionsmarkt; 10. „Bereitstellung auf dem Markt“ die entgeltliche
    oder unentgeltliche Abgabe eines KI-Systems oder eines KI-Modells mit allgemeinem Verwendungszweck
    zum Vertrieb oder zur Verwendung auf dem Unionsmarkt im Rahmen einer Geschäftstätigkeit; 11. „Inbetriebnahme“
    die Bereitstellung eines KI-Systems in der Union zum Erstgebrauch direkt an den Betreiber oder zum
    Eigengebrauch entsprechend seiner Zweckbestimmung; 12. „Zweckbestimmung“ die Verwendung, für die ein
    KI-System laut Anbieter bestimmt ist, einschließlich der besonderen Umstände und Bedingungen für die
    Verwendung, entsprechend den vom Anbieter bereitgestellten Informationen in den Betriebsanleitungen,
    im Werbe- oder Verkaufsmaterial und in diesbezüglichen Erklärungen sowie in der technischen Dokumentation;
    13. „vernünftigerweise vorhersehbare Fehlanwendung“ die Verwendung eines KI-Systems in einer Weise,
    die nicht seiner Zweckbestimmung entspricht, die sich aber aus einem vernünftigerweise vorhersehbaren
    menschlichen Verhalten oder einer vernünftigerweise vorhersehbaren Interaktion mit anderen Systemen,
    auch anderen KI-Systemen, ergeben kann; 14. „Sicherheitsbauteil“ einen Bestandteil eines Produkts
    oder KI-Systems, der eine Sicherheitsfunktion für dieses Produkt oder KI-System erfüllt oder dessen
    Ausfall oder Störung die Gesundheit und Sicherheit von Personen oder Eigentum gefährdet; 15. „Betriebsanleitungen“
    die Informationen, die der Anbieter bereitstellt, um den Betreiber insbesondere über die Zweckbestimmung
    und die ordnungsgemäße Verwendung eines KI-Systems zu informieren; 16. „Rückruf eines KI-Systems“
    jede Maßnahme, die auf die Rückgabe an den Anbieter oder auf die Außerbetriebsetzung oder Abschaltung
    eines den Betreibern bereits zur Verfügung gestellten KI-Systems abzielt; 17. „Rücknahme eines KI-Systems“
    jede Maßnahme, mit der die Bereitstellung eines in der Lieferkette befindlichen KI-Systems auf dem
    Markt verhindert werden soll; 18. „Leistung eines KI-Systems“ die Fähigkeit eines KI-Systems, seine
    Zweckbestimmung zu erfüllen; 19. „notifizierende Behörde“ die nationale Behörde, die für die Einrichtung
    und Durchführung der erforderlichen Verfahren für die Bewertung, Benennung und Notifizierung von Konformitätsbewertungsstellen
    und für deren Überwachung zuständig ist; 20. „Konformitätsbewertung“ ein Verfahren mit dem bewertet
    wird, ob die in Titel III Abschnitt 2 festgelegten Anforderungen an ein Hochrisiko-KI-System erfüllt
    wurden; 21. „Konformitätsbewertungsstelle“ eine Stelle, die Konformitätsbewertungstätigkeiten einschließlich
    Prüfungen, Zertifizierungen und Inspektionen durchführt und dabei als Dritte auftritt; 22. „notifizierte
    Stelle“ eine Konformitätsbewertungsstelle, die gemäß dieser Verordnung und den anderen einschlägigen
    Harmonisierungsrechtsvorschriften der Union notifiziert wurde; 23. „wesentliche Veränderung“ eine
    Veränderung eines KI-Systems nach dessen Inverkehrbringen oder Inbetriebnahme, die in der vom Anbieter
    durchgeführten ursprünglichen Konformitätsbewertung nicht vorgesehen oder geplant war und durch die
    die Konformität des KI-Systems mit den Anforderungen in Kapitel III Abschnitt 2 beeinträchtigt wird
    oder die zu einer Änderung der Zweckbestimmung führt, für die das KI-System bewertet wurde; 24. „CE-Kennzeichnung“
    eine Kennzeichnung, durch die ein Anbieter erklärt, dass ein KI-System die Anforderungen erfüllt,
    die in Kapitel III Abschnitt 2 und in anderen anwendbaren Harmonisierungsrechtsvorschriften, die die
    Anbringung dieser Kennzeichnung vorsehen, festgelegt sind; 25. „System zur Beobachtung nach dem Inverkehrbringen“
    alle Tätigkeiten, die Anbieter von KI-Systemen zur Sammlung und Überprüfung von Erfahrungen mit der
    Verwendung der von ihnen in Verkehr gebrachten oder in Betrieb genommenen KI-Systeme durchführen,
    um festzustellen, ob unverzüglich nötige Korrektur- oder Präventivmaßnahmen zu ergreifen sind; 26.
    „Marktüberwachungsbehörde“ die nationale Behörde, die die Tätigkeiten durchführt und die Maßnahmen
    ergreift, die in der Verordnung (EU) 2019/1020 vorgesehen sind; 27. „harmonisierte Norm“ bezeichnet
    eine harmonisierte Norm im Sinne des Artikels 2 Absatz 1 Buchstabe c der Verordnung (EU) Nr. 1025/2012;
    28. „gemeinsame Spezifikation“ eine Reihe technischer Spezifikationen im Sinne des Artikels 2 Nummer
    4 der Verordnung (EU) Nr. 1025/2012, deren Befolgung es ermöglicht, bestimmte Anforderungen der vorliegenden
    Verordnung zu erfüllen; 29. „Trainingsdaten“ Daten, die zum Trainieren eines KI-Systems verwendet
    werden, wobei dessen lernbare Parameter angepasst werden; 30. „Validierungsdaten“ Daten, die zur Evaluation
    des trainierten KI-Systems und zur Einstellung seiner nicht erlernbaren Parameter und seines Lernprozesses
    verwendet werden, um unter anderem eine Unter- oder Überanpassung zu vermeiden; 31. „Validierungsdatensatz“
    einen separaten Datensatz oder einen Teil des Trainingsdatensatzes mit fester oder variabler Aufteilung;
    32. „Testdaten“ Daten, die für eine unabhängige Bewertung des KI-Systems verwendet werden, um die
    erwartete Leistung dieses Systems vor dessen Inverkehrbringen oder Inbetriebnahme zu bestätigen; 33.
    „Eingabedaten“ die in ein KI-System eingespeisten oder von diesem direkt erfassten Daten, auf deren
    Grundlage das System eine Ausgabe hervorbringt; 34. „biometrische Daten“ mit speziellen technischen
    Verfahren gewonnene personenbezogene Daten zu den physischen, physiologischen oder verhaltenstypischen
    Merkmalen einer natürlichen Person, wie etwa Gesichtsbilder oder daktyloskopische Daten; 35. „biometrische
    Identifizierung“ die automatisierte Erkennung physischer, physiologischer, verhaltensbezogener oder
    psychologischer menschlicher Merkmale zum Zwecke der Feststellung der Identität einer natürlichen
    Person durch den Vergleich biometrischer Daten dieser Person mit biometrischen Daten von Personen,
    die in einer Datenbank gespeichert sind; 36. „biometrische Verifizierung“ die automatisierte Eins-zu-eins-Verifizierung,
    einschließlich Authentifizierung, der Identität natürlicher Personen durch den Vergleich ihrer biometrischen
    Daten mit zuvor bereitgestellten biometrischen Daten; 37. „besondere Kategorien personenbezogener
    Daten“ die in Artikel 9 Absatz 1der Verordnung (EU) 2016/679, Artikel 10 der Richtlinie (EU) 2016/680
    und Artikel 10 Absatz 1 der Verordnung (EU) 2018/1725 aufgeführten Kategorien personenbezogener Daten;
    38. „sensible operative Daten“ operative Daten im Zusammenhang mit Tätigkeiten zur Verhütung, Aufdeckung,
    Untersuchung oder Verfolgung von Straftaten, deren Offenlegung die Integrität von Strafverfahren gefährden
    könnte; 39. „Emotionserkennungssystem“ ein KI-System, das dem Zweck dient, Emotionen oder Absichten
    natürlicher Personen auf der Grundlage ihrer biometrischen Daten festzustellen oder daraus abzuleiten;
    40. „System zur biometrischen Kategorisierung“ ein KI-System, das dem Zweck dient, natürliche Personen
    auf der Grundlage ihrer biometrischen Daten bestimmten Kategorien zuzuordnen, sofern es sich um eine
    Nebenfunktion eines anderen kommerziellen Dienstes handelt und aus objektiven technischen Gründen
    unbedingt erforderlich ist; 41. „biometrisches Fernidentifizierungssystem“ ein KI-System, das dem
    Zweck dient, natürliche Personen ohne ihre aktive Einbeziehung und in der Regel aus der Ferne durch
    Abgleich der biometrischen Daten einer Person mit den in einer Referenzdatenbank gespeicherten biometrischen
    Daten zu identifizieren; 42. „biometrisches Echtzeit-Fernidentifizierungssystem“ ein biometrisches
    Fernidentifizierungssystem, bei dem die Erfassung biometrischer Daten, der Abgleich und die Identifizierung
    ohne erhebliche Verzögerung erfolgen, und das zur Vermeidung einer Umgehung der Vorschriften nicht
    nur die sofortige Identifizierung, sondern auch eine Identifizierung mit begrenzten kurzen Verzögerungen
    umfasst; 43. „System zur nachträglichen biometrischen Fernidentifizierung“ ein biometrisches Fernidentifizierungssystem,
    das kein biometrisches Echtzeit-Fernidentifizierungssystem ist; 44. „öffentlich zugänglicher Raum“
    einen einer unbestimmten Anzahl natürlicher Personen zugänglichen physischen Ort in privatem oder
    öffentlichem Eigentum, unabhängig davon, ob bestimmte Bedingungen für den Zugang gelten, und unabhängig
    von möglichen Kapazitätsbeschränkungen; 45. „Strafverfolgungsbehörde“
