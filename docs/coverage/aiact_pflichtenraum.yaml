  befund: luecke
  befund_grund: 'EINZIGE STELLE IN ART. 9, DIE ''DIE BETREIBER'' NAMENTLICH NENNT - deshalb hier scope:
    in trotz Anbieter-Duty-Bearer (der Anbieter stellt bereit/schult; die Betreiber sind Empfaenger/Zweck
    der Massnahme, ein durchschlagender Beruehrungspunkt). Der Informationsteil ueberschneidet sich mit
    Art. 13 (Betriebsanleitung, R007/G-DEP-03); die SCHULUNG der Betreiber ist im Katalog nirgends abgebildet
    - kein Gate prueft, ob Betreiber-Personal tatsaechlich geschult wurde. Da ''gegebenenfalls'' (konditional)
    formuliert ist, waere selbst ein Nachweis der Konditionsprüfung (wann ist Schulung erforderlich) ein
    sinnvoller Ansatzpunkt fuer ein spaeteres Requirement.'
