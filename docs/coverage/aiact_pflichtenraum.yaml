    Ausgaben als kuenftige Eingaben) wird von keinem Gate erfasst - G-OPS-03 misst Drift (PSI/JSD) allgemein,
    nicht spezifisch selbstverstaerkende Rueckkopplungseffekte; G-DEP-05 (Bias) prueft einmalig vor Freigabe,
