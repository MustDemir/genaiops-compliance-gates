- id: Art. 108
  artikel: '108'
  artikel_titel: Änderungen der Verordnung (EU) 2018/1139
  absatz: '-'
  buchstabe: null
  offset: 575073
  laenge: 2819
  saetze: 3
  beleg: 'Die Verordnung (EU) 2018/1139 wird wie folgt geändert: 1. In Artikel 17 wird folgender Absatz
    angefügt: „(3)   Unbeschadet des Absatzes 2 werden beim Erlass von Durchführungsrechtsakten nach Absatz
    1, die sich auf Systeme der künstlichen Intelligenz beziehen, bei denen es sich um Sicherheitsbauteile
    im Sinne der Verordnung (EU) 2024/1689 des Europäischen Parlaments und des Rates (*) handelt, die
    in Kapitel III Abschnitt 2 jener Verordnung festgelegten Anforderungen berücksichtigt. (*)  Verordnung
    (EU) 2024/1689 des Europäischen Parlaments und des Rates vom 13. Juni 2024 zur Festlegung harmonisierter
    Vorschriften für künstliche Intelligenz und zur Änderung der Verordnungen (EG) Nr. 300/2008, (EU)
    Nr. 167/2013, (EU) Nr. 168/2013, (EU) 2018/858, (EU) 2018/1139 und (EU) 2019/2144 sowie der Richtlinien
    2014/90/EU, (EU) 2016/797 und (EU) 2020/1828 (Verordnung über künstliche Intelligenz) (ABl. L, 2024/1689,
    12.7.2024, ELI: http://data.europa.eu/eli/reg/2024/1689/oj).“ " 2. In Artikel 19 wird folgender Absatz
    angefügt: „(4)   Beim Erlass delegierter Rechtsakte nach den Absätzen 1 und 2, die sich auf Systeme
    der künstlichen Intelligenz beziehen, bei denen es sich um Sicherheitsbauteile im Sinne der Verordnung
    (EU) 2024/1689 handelt, werden die in Kapitel III Abschnitt 2 jener Verordnung festgelegten Anforderungen
    berücksichtigt.“ 3. In Artikel 43 wird folgender Absatz angefügt: „(4)   Beim Erlass von Durchführungsrechtsakten
    nach Absatz 1, die sich auf Systeme der künstlichen Intelligenz beziehen, bei denen es sich um Sicherheitsbauteile
    im Sinne der Verordnung (EU) 2024/1689 handelt, werden die in Kapitel III Abschnitt 2 jener Verordnung
    festgelegten Anforderungen berücksichtigt.“ 4. In Artikel 47 wird folgender Absatz angefügt: „(3)   Beim
    Erlass delegierter Rechtsakte nach den Absätzen 1 und 2, die sich auf Systeme der künstlichen Intelligenz
    beziehen, bei denen es sich um Sicherheitsbauteile im Sinne der Verordnung (EU) 2024/1689 handelt,
    werden die in Kapitel III Abschnitt 2 jener Verordnung festgelegten Anforderungen berücksichtigt.“
    5. In Artikel 57 wird folgender Unterabsatz angefügt: „Beim Erlass solcher Durchführungsrechtsakte,
    die sich auf Systeme der künstlichen Intelligenz beziehen, bei denen es sich um Sicherheitsbauteile
    im Sinne der Verordnung (EU) 2024/1689 handelt, werden die in Kapitel III Abschnitt 2 jener Verordnung
    festgelegten Anforderungen berücksichtigt.“ 6. In Artikel 58 wird folgender Absatz angefügt: „(3)   Beim
    Erlass delegierter Rechtsakte nach den Absätzen 1 und 2, die sich auf Systeme der künstlichen Intelligenz
    beziehen, bei denen es sich um Sicherheitsbauteile im Sinne der Verordnung (EU) 2024/1689 handelt,
    werden die in Kapitel III Abschnitt 2 jener Verordnung festgelegten Anforderungen berücksichtigt.“'
