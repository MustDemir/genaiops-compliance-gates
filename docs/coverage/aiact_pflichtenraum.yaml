- id: Art. 50 Abs. 2
  artikel: '50'
  artikel_titel: Transparenzpflichten für Anbieter und Betreiber bestimmter KI-Systeme
  absatz: '2'
  buchstabe: null
  offset: 421891
  laenge: 1030
  saetze: 3
  beleg: (2)   Anbieter von KI-Systemen, einschließlich KI-Systemen mit allgemeinem Verwendungszweck,
    die synthetische Audio-, Bild-, Video- oder Textinhalte erzeugen, stellen sicher, dass die Ausgaben
    des KI-Systems in einem maschinenlesbaren Format gekennzeichnet und als künstlich erzeugt oder manipuliert
    erkennbar sind. Die Anbieter sorgen dafür, dass — soweit technisch möglich — ihre technischen Lösungen
    wirksam, interoperabel, belastbar und zuverlässig sind und berücksichtigen dabei die Besonderheiten
    und Beschränkungen der verschiedenen Arten von Inhalten, die Umsetzungskosten und den allgemein anerkannten
    Stand der Technik, wie er in den einschlägigen technischen Normen zum Ausdruck kommen kann. Diese
    Pflicht gilt nicht, soweit die KI-Systeme eine unterstützende Funktion für die Standardbearbeitung
    ausführen oder die vom Betreiber bereitgestellten Eingabedaten oder deren Semantik nicht wesentlich
    verändern oder wenn sie zur Aufdeckung, Verhütung, Ermittlung oder Verfolgung von Straftaten gesetzlich
    zugelassen sind.
