  beleg: (3)   Die Kommission ist befugt, wenn dies nötig ist, gemäß Artikel 97 delegierte Rechtsakte
    zur Änderung des Anhangs IV zu erlassen, damit die technische Dokumentation in Anbetracht des technischen
    Fortschritts stets alle Informationen enthält, die erforderlich sind, um zu beurteilen, ob das System
    die Anforderungen dieses Abschnitts erfüllt.
  adressat: sonstige
  pflicht: Die Kommission ist ermaechtigt, bei Bedarf delegierte Rechtsakte nach Art. 97 zur Aenderung
    von Anhang IV zu erlassen, um die technische Dokumentation dem technischen Fortschritt anzupassen.
  scope: out
  scope_grund: Ermaechtigung der Kommission zum Erlass delegierter Rechtsakte; keine Anbieter- oder Betreiberpflicht.
  verifikation: VERIFIZIERT
