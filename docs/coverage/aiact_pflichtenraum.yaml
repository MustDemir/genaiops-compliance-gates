  beleg: (3)   Diese Verordnung gilt nur in den unter das Unionsrecht fallenden Bereichen und berührt
    keinesfalls die Zuständigkeiten der Mitgliedstaaten in Bezug auf die nationale Sicherheit, unabhängig
    von der Art der Einrichtung, die von den Mitgliedstaaten mit der Wahrnehmung von Aufgaben im Zusammenhang
    mit diesen Zuständigkeiten betraut wurde. Diese Verordnung gilt nicht für KI-Systeme, wenn und soweit
    sie ausschließlich für militärische Zwecke, Verteidigungszwecke oder Zwecke der nationalen Sicherheit
    in Verkehr gebracht, in Betrieb genommen oder, mit oder ohne Änderungen, verwendet werden, unabhängig
    von der Art der Einrichtung, die diese Tätigkeiten ausübt. Diese Verordnung gilt nicht für KI-Systeme,
    die nicht in der Union in Verkehr gebracht oder in Betrieb genommen werden, wenn die Ausgaben in der
    Union ausschließlich für militärische Zwecke, Verteidigungszwecke oder Zwecke der nationalen Sicherheit
    verwendet werden, unabhängig von der Art der Einrichtung, die diese Tätigkeiten ausübt.
