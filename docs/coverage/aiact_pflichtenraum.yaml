  laenge: 458
  saetze: 2
  beleg: c) Bereitstellung der gemäß Artikel 13 erforderlichen Informationen und gegebenenfalls entsprechende
    Schulung der Betreiber. Zur Beseitigung oder Verringerung der Risiken im Zusammenhang mit der Verwendung
    des Hochrisiko-KI-Systems werden die technischen Kenntnisse, die Erfahrungen und der Bildungsstand,
    die vom Betreiber erwartet werden können, sowie der voraussichtliche Kontext, in dem das System eingesetzt
    werden soll, gebührend berücksichtigt.
  adressat: anbieter
  pflicht: Der Anbieter stellt die nach Art. 13 erforderlichen Informationen bereit und schult gegebenenfalls
    die Betreiber, wobei deren voraussichtliche Kenntnisse, Erfahrung, Bildungsstand und Einsatzkontext
    zu beruecksichtigen sind.
