  offset: 383050
  laenge: 644
  saetze: 2
  beleg: (2)   Die notifizierten Stellen vermeiden bei der Durchführung ihrer Tätigkeiten unnötige Belastungen
    für die Anbieter und berücksichtigen gebührend die Größe des Anbieters, den Sektor, in dem er tätig
    ist, seine Struktur sowie die Komplexität des betreffenden Hochrisiko-KI-Systems, um insbesondere
    den Verwaltungsaufwand und die Befolgungskosten für Kleinstunternehmen und kleine Unternehmen im Sinne
    der Empfehlung 2003/361/EG zu minimieren. Die notifizierte Stelle muss jedoch den Grad der Strenge
    und das Schutzniveau einhalten, die für die Konformität des Hochrisiko-KI-Systems mit den Anforderungen
    dieser Verordnung erforderlich sind.
