- id: Art. 25 Abs. 4
  artikel: '25'
  artikel_titel: Verantwortlichkeiten entlang der KI-Wertschöpfungskette
  absatz: '4'
  buchstabe: null
  offset: 357203
  laenge: 1442
  saetze: 5
  beleg: (4)   Der Anbieter eines Hochrisiko-KI-Systems und der Dritte, der ein KI-System, Instrumente,
    Dienste, Komponenten oder Verfahren bereitstellt, die in einem Hochrisiko-KI-System verwendet oder
    integriert werden, legen in einer schriftlichen Vereinbarung die Informationen, die Fähigkeiten, den
    technischen Zugang und die sonstige Unterstützung nach dem allgemein anerkannten Stand der Technik
    fest, die erforderlich sind, damit der Anbieter des Hochrisiko-KI-Systems die in dieser Verordnung
    festgelegten Pflichten vollständig erfüllen kann. Dieser Absatz gilt nicht für Dritte, die Instrumente,
    Dienste, Verfahren oder Komponenten, bei denen es sich nicht um KI-Modelle mit allgemeinem Verwendungszweck
    handelt, im Rahmen einer freien und quelloffenen Lizenz öffentlich zugänglich machen. Das Büro für
    Künstliche Intelligenz kann freiwillige Musterbedingungen für Verträge zwischen Anbietern von Hochrisiko-KI-Systemen
    und Dritten, die Instrumente, Dienste, Komponenten oder Verfahren bereitstellen, die für Hochrisiko-KI-Systeme
    verwendet oder in diese integriert werden, ausarbeiten und empfehlen. Bei der Ausarbeitung dieser
    freiwilligen Musterbedingungen berücksichtigt das Büro für Künstliche Intelligenz mögliche vertragliche
    Anforderungen, die in bestimmten Sektoren oder Geschäftsfällen gelten. Die freiwilligen Musterbedingungen
    werden veröffentlicht und sind kostenlos in einem leicht nutzbaren elektronischen Format verfügbar.
  adressat: anbieter
  pflicht: Der Anbieter eines Hochrisiko-KI-Systems und der Dritte, der darin verwendete/integrierte KI-Systeme,
    Instrumente, Dienste, Komponenten oder Verfahren bereitstellt, legen die dafuer noetigen Informationen/Faehigkeiten/den
    technischen Zugang/die Unterstuetzung in einer schriftlichen Vereinbarung fest; Ausnahme fuer freie/quelloffene
    Nicht-GPAI-Komponenten. Das KI-Buero kann freiwillige Musterbedingungen ausarbeiten.
  scope: out
  scope_grund: Regelt das Verhaeltnis Anbieter/Dritter (Komponenten-/Werkzeuglieferant) im Chapter-III-Kontext,
    keine im Wortlaut erkennbare Betreiberpflicht in der Zukauf-Regelkonstellation K1 (HANDBUCH 4.4).
    Wuerde der Betreiber selbst zum Anbieter (Art. 25 Abs. 1), traefe ihn diese Norm erst in seiner neuen
    Anbieterrolle - die volle Anbieterpflichtenkette nach einem Rollenwechsel ist laut SPEC-06 Abschnitt
    4 ausdruecklich eine spaetere Ausbaustufe, hier nicht mitentschieden.
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: 'GEAENDERT durch VO (EU) 2026/1744 Art. 1 Nr. 12 lit. b: UAbs. 1 ergaenzt in der Aufzaehlung
    dessen, was der Dritte bereitstellen kann, ausdruecklich ''ein KI-Modell'' (vorher nur ''KI-System,
    Instrumente, Dienste, Komponenten oder Verfahren''). Inhaltlich eine Klarstellung/Erweiterung auf
    Modell-Lieferanten, sonst unveraendert.'
  requirement: []
  gate: []
  befund: null
  befund_grund: null
  po_bestaetigt: false
