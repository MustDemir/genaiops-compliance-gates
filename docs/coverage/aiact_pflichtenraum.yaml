  buchstabe: null
  offset: 454451
  laenge: 1038
  saetze: 4
  beleg: (16)   Die zuständigen nationalen Behörden übermitteln dem Büro für Künstliche Intelligenz und
    dem KI-Gremium jährliche Berichte, und zwar ab einem Jahr nach der Einrichtung des Reallabors und
    dann jedes Jahr bis zu dessen Beendigung, sowie einen Abschlussbericht. Diese Berichte informieren
    über den Fortschritt und die Ergebnisse der Umsetzung dieser Reallabore, einschließlich bewährter
    Verfahren, Vorfällen, gewonnener Erkenntnisse und Empfehlungen zu deren Aufbau, sowie gegebenenfalls
    über die Anwendung und mögliche Überarbeitung dieser Verordnung, einschließlich ihrer delegierten
    Rechtsakte und Durchführungsrechtsakte, sowie über die Anwendung anderen Unionsrechts, deren Einhaltung
    von den zuständigen Behörden innerhalb des Reallabors beaufsichtigt wird. Die zuständigen nationalen
    Behörden stellen diese jährlichen Berichte oder Zusammenfassungen davon der Öffentlichkeit online
    zur Verfügung. Die Kommission trägt den jährlichen Berichten gegebenenfalls bei der Wahrnehmung ihrer
    Aufgaben gemäß dieser Verordnung Rechnung.
