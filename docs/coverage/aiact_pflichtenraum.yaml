  absatz: '1'
  buchstabe: null
  offset: 354658
  laenge: 219
  saetze: 1
  beleg: '(1)   In den folgenden Fällen gelten Händler, Einführer, Betreiber oder sonstige Dritte als
    Anbieter eines Hochrisiko-KI-Systems für die Zwecke dieser Verordnung und unterliegen den Anbieterpflichten
    gemäß Artikel 16:'
  adressat: betreiber
  pflicht: Erfuellt der Haendler, Einfuehrer, Betreiber oder ein sonstiger Dritter einen der in lit. a-c
    genannten Tatbestaende, gilt er als Anbieter des Hochrisiko-KI-Systems und unterliegt den Anbieterpflichten
    nach Art. 16.
  scope: in
  scope_grund: null
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: unveraendert - VO (EU) 2026/1744 Art. 1 Nr. 12 aendert nur Art. 25 Abs. 2 lit. a und Abs. 4
    UAbs. 1 lit. b; Abs. 1 (Chapeau und lit. a-c) ist in der Aenderungsliste nicht enthalten.
  requirement: []
  gate:
  - G-OPS-06
  befund: teilabdeckung
  befund_grund: 'G-OPS-06/C-25a-c erkennt die drei Ausloeser aus lit. a-c (Rebranding, wesentliche Veraenderung,
    Zweckaenderung) und haelt bei MUST-Verstoss die Pipeline an; das ist die im Chapeau vorausgesetzte
    Statusfeststellung. Was der Chapeau als Folge anordnet - ''unterliegen den Anbieterpflichten gemaess
    Artikel 16'' - prueft kein Gate: Kapitel III Abschnitt 2 (Art. 8-15) und die Konformitaetsbewertung
    (Art. 43-49) fuer den nun-Anbieter-gewordenen Betreiber sind nach SPEC-06 Abschnitt 4 ausdruecklich
    eine spaetere Ausbaustufe. Kein R0xx nennt Art. 25 als eu_ai_act_refs (Befund 1 aus SPEC-06 Abschnitt
    1.2, hiermit am Wortlaut bestaetigt: G-OPS-06 haengt ohne Requirement in der Kette).'
  po_bestaetigt: false
