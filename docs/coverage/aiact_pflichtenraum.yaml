- id: Art. 57 Abs. 11
  artikel: '57'
  artikel_titel: KI-Reallabore
  absatz: '11'
  buchstabe: null
  offset: 451942
  laenge: 948
  saetze: 4
  beleg: (11)   Die KI-Reallabore lassen die Aufsichts- oder Abhilfebefugnisse der die Reallabore beaufsichtigenden
    zuständigen Behörden, einschließlich auf regionaler oder lokaler Ebene, unberührt. Alle erheblichen
    Risiken für die Gesundheit und Sicherheit und die Grundrechte, die bei der Entwicklung und Erprobung
    solcher KI-Systeme festgestellt werden, führen zur sofortigen und angemessenen Risikominderung. Die
    zuständigen nationalen Behörden sind befugt, das Testverfahren oder die Beteiligung am Reallabor vorübergehend
    oder dauerhaft auszusetzen, wenn keine wirksame Risikominderung möglich ist, und unterrichten das
    Büro für Künstliche Intelligenz über diese Entscheidung. Um Innovationen im Bereich KI in der Union
    zu fördern, üben die zuständigen nationalen Behörden ihre Aufsichtsbefugnisse im Rahmen des geltenden
    Rechts aus, indem sie bei der Anwendung der Rechtsvorschriften auf ein bestimmtes KI-Reallabor ihren
    Ermessensspielraum nutzen.
