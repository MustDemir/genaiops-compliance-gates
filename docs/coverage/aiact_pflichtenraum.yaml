- id: Art. 15 Abs. 4
  artikel: '15'
  artikel_titel: Genauigkeit, Robustheit und Cybersicherheit
  absatz: '4'
  buchstabe: null
  offset: 333319
  laenge: 972
  saetze: 4
  beleg: (4)   Hochrisiko-KI-Systeme müssen so widerstandsfähig wie möglich gegenüber Fehlern, Störungen
    oder Unstimmigkeiten sein, die innerhalb des Systems oder der Umgebung, in der das System betrieben
    wird, insbesondere wegen seiner Interaktion mit natürlichen Personen oder anderen Systemen, auftreten
    können. In diesem Zusammenhang sind technische und organisatorische Maßnahmen zu ergreifen. Die Robustheit
    von Hochrisiko-KI-Systemen kann durch technische Redundanz erreicht werden, was auch Sicherungs- oder
    Störungssicherheitspläne umfassen kann. Hochrisiko-KI-Systeme, die nach dem Inverkehrbringen oder
    der Inbetriebnahme weiterhin dazulernen, sind so zu entwickeln, dass das Risiko möglicherweise verzerrter
    Ausgaben, die künftige Vorgänge beeinflussen („Rückkopplungsschleifen“), beseitigt oder so gering
    wie möglich gehalten wird und sichergestellt wird, dass auf solche Rückkopplungsschleifen angemessen
    mit geeigneten Risikominderungsmaßnahmen eingegangen wird.
  adressat: anbieter
  pflicht: Hochrisiko-KI-Systeme muessen so widerstandsfaehig wie moeglich gegenueber Fehlern/Stoerungen/Unstimmigkeiten
    sein (technische und organisatorische Massnahmen, ggf. technische Redundanz); weiterlernende Systeme
    muessen das Risiko verzerrter Ausgaben durch Rueckkopplungsschleifen beseitigen oder minimieren.
