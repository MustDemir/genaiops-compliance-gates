    begangen wird; 62. „kritische Infrastrukturen“ kritische Infrastrukturen im Sinne von Artikel 2 Nummer
    4 der Richtlinie (EU) 2022/2557; 63. „KI-Modell mit allgemeinem Verwendungszweck“ ein KI-Modell —
    einschließlich der Fälle, in denen ein solches KI-Modell mit einer großen Datenmenge unter umfassender
    Selbstüberwachung trainiert wird —, das eine erhebliche allgemeine Verwendbarkeit aufweist und in
    der Lage ist, unabhängig von der Art und Weise seines Inverkehrbringens ein breites Spektrum unterschiedlicher
    Aufgaben kompetent zu erfüllen, und das in eine Vielzahl nachgelagerter Systeme oder Anwendungen integriert
    werden kann, ausgenommen KI-Modelle, die vor ihrem Inverkehrbringen für Forschungs- und Entwicklungstätigkeiten
    oder die Konzipierung von Prototypen eingesetzt werden; 64. „Fähigkeiten mit hoher Wirkkraft“ bezeichnet
    Fähigkeiten, die den bei den fortschrittlichsten KI-Modellen mit allgemeinem Verwendungszweck festgestellten
    Fähigkeiten entsprechen oder diese übersteigen; 65. „systemisches Risiko“ ein Risiko, das für die
