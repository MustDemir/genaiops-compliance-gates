  offset: 427812
  laenge: 676
  saetze: 3
  beleg: (1)   Erfüllt ein KI-Modell mit allgemeinem Verwendungszweck die Bedingung gemäß Artikel 51 Absatz
    1 Buchstabe a, so teilt der betreffende Anbieter dies der Kommission unverzüglich, in jedem Fall jedoch
    innerhalb von zwei Wochen, nachdem diese Bedingung erfüllt ist oder bekannt wird, dass sie erfüllt
    wird, mit. Diese Mitteilung muss die Informationen enthalten, die erforderlich sind, um nachzuweisen,
    dass die betreffende Bedingung erfüllt ist. Erlangt die Kommission Kenntnis von einem KI-Modell mit
    allgemeinem Verwendungszweck, das systemische Risiken birgt, die ihr nicht mitgeteilt wurden, so kann
    sie entscheiden, es als Modell mit systemischen Risiken auszuweisen.
