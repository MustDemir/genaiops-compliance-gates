  beleg: (3)   Gelangt die Kommission zu dem Schluss, dass die gemäß Absatz 2 vorgebrachten Argumente
    nicht hinreichend begründet sind, und konnte der betreffende Anbieter nicht nachweisen, dass das KI-Modell
    mit allgemeinem Verwendungszweck aufgrund seiner besonderen Merkmale keine systemischen Risiken aufweist,
