  laenge: 1197
  saetze: 5
  beleg: (5)   Ein Mitgliedstaat kann die Möglichkeit einer vollständigen oder teilweisen Ermächtigung
    zur Verwendung biometrischer Echtzeit-Fernidentifizierungssysteme in öffentlich zugänglichen Räumen
    zu Strafverfolgungszwecken innerhalb der in Absatz 1 Unterabsatz 1 Buchstabe h sowie Absätze 2 und
    3 aufgeführten Grenzen und unter den dort genannten Bedingungen vorsehen. Die betreffenden Mitgliedstaaten
    legen in ihrem nationalen Recht die erforderlichen detaillierten Vorschriften für die Beantragung,
    Erteilung und Ausübung der in Absatz 3 genannten Genehmigungen sowie für die entsprechende Beaufsichtigung
    und Berichterstattung fest. In diesen Vorschriften wird auch festgelegt, im Hinblick auf welche der
    in Absatz 1 Unterabsatz 1 Buchstabe h aufgeführten Ziele und welche der unter Buchstabe h Ziffer iii
    genannten Straftaten die zuständigen Behörden ermächtigt werden können, diese Systeme zu Strafverfolgungszwecken
    zu verwenden. Die Mitgliedstaaten teilen der Kommission diese Vorschriften spätestens 30 Tage nach
    ihrem Erlass mit. Die Mitgliedstaaten können im Einklang mit dem Unionsrecht strengere Rechtsvorschriften
    für die Verwendung biometrischer Fernidentifizierungssysteme erlassen.
