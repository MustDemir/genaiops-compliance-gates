  saetze: 4
  beleg: (5)   Stellt der Anbieter, dessen Modell gemäß Absatz 4 als KI-Modell mit allgemeinem Verwendungszweck
    mit systemischem Risiko ausgewiesen wurde, einen entsprechenden Antrag, berücksichtigt die Kommission
    den Antrag und kann entscheiden, erneut zu prüfen, ob beim KI-Modell mit allgemeinem Verwendungszweck
    auf der Grundlage der in Anhang XIII festgelegten Kriterien immer noch davon ausgegangen werden kann,
    dass es systemische Risiken aufweist. Dieser Antrag muss objektive, detaillierte und neue Gründe enthalten,
    die sich seit der Entscheidung zur Ausweisung ergeben haben. Die Anbieter können frühestens sechs
    Monate nach der Entscheidung zur Ausweisung eine Neubewertung beantragen. Entscheidet die Kommission
    nach ihrer Neubewertung, die Ausweisung als KI-Modell mit allgemeiner Zweckbestimmung mit systemischem
    Risiko beizubehalten, können die Anbieter frühestens sechs Monate nach dieser Entscheidung eine Neubewertung
    beantragen.
