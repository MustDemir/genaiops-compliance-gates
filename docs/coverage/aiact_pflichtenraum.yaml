  buchstabe: null
  offset: 421135
  laenge: 756
  saetze: 2
  beleg: (1)   Die Anbieter stellen sicher, dass KI-Systeme, die für die direkte Interaktion mit natürlichen
    Personen bestimmt sind, so konzipiert und entwickelt werden, dass die betreffenden natürlichen Personen
    informiert werden, dass sie mit einem KI-System interagieren, es sei denn, dies ist aus Sicht einer
    angemessen informierten, aufmerksamen und verständigen natürlichen Person aufgrund der Umstände und
    des Kontexts der Nutzung offensichtlich. Diese Pflicht gilt nicht für gesetzlich zur Aufdeckung, Verhütung,
    Ermittlung oder Verfolgung von Straftaten zugelassene KI-Systeme, wenn geeignete Schutzvorkehrungen
    für die Rechte und Freiheiten Dritter bestehen, es sei denn, diese Systeme stehen der Öffentlichkeit
    zur Anzeige einer Straftat zur Verfügung.
