    gebrachte KI-Modelle mit allgemeinem Verwendungszweck
  absatz: '1'
  buchstabe: null
  offset: 579210
  laenge: 703
  saetze: 2
  beleg: (1)   Unbeschadet der Anwendung des Artikels 5 gemäß Artikel 113 Absatz 3 Buchstabe a werden
    KI-Systeme, bei denen es sich um Komponenten von IT-Großsystemen handelt, die mit den in Anhang X
    aufgeführten Rechtsakten eingerichtet wurden und vor dem 2. August 2027 in Verkehr gebracht oder in
    Betrieb genommen wurden, bis zum 31. Dezember 2030 mit dieser Verordnung in Einklang gebracht. Die
    in dieser Verordnung festgelegten Anforderungen werden bei der Bewertung jedes IT-Großsystems, das
    mit den in Anhang X aufgeführten Rechtsakten eingerichtet wurde, berücksichtigt, wobei die Bewertung
    entsprechend den Vorgaben der jeweiligen Rechtsakte und bei Ersetzung oder Änderung dieser Rechtsakte
    erfolgt.
