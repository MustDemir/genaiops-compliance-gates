  absatz: '2'
  buchstabe: null
  offset: 412525
  laenge: 729
  saetze: 2
  beleg: (2)   In hinreichend begründeten dringenden Fällen aus außergewöhnlichen Gründen der öffentlichen
    Sicherheit oder in Fällen einer konkreten, erheblichen und unmittelbaren Gefahr für das Leben oder
    die körperliche Unversehrtheit natürlicher Personen können Strafverfolgungsbehörden oder Katastrophenschutzbehörden
    ein bestimmtes Hochrisiko-KI-System ohne die in Absatz 1 genannte Genehmigung in Betrieb nehmen, sofern
    diese Genehmigung während der Verwendung oder im Anschluss daran unverzüglich beantragt wird. Falls
    die Genehmigung gemäß Absatz 1 abgelehnt wird, wird Verwendung des Hochrisiko-KI-Systems mit sofortiger
    Wirkung eingestellt und sämtliche Ergebnisse und Ausgaben dieser Verwendung werden unverzüglich verworfen.
