  absatz: '4'
  buchstabe: null
  offset: 386164
  laenge: 901
  saetze: 4
  beleg: (4)   Hat eine notifizierende Behörde hinreichenden Grund zu der Annahme, dass eine notifizierte
    Stelle die in Artikel 31 festgelegten Anforderungen nicht mehr erfüllt oder dass sie ihren Pflichten
    nicht nachkommt, so untersucht die notifizierende Behörde den Sachverhalt unverzüglich und mit äußerster
    Sorgfalt. In diesem Zusammenhang teilt sie der betreffenden notifizierten Stelle die erhobenen Einwände
    mit und gibt ihr die Möglichkeit, dazu Stellung zu nehmen. Kommt die notifizierende Behörde zu dem
    Schluss, dass die notifizierte Stelle die in Artikel 31 festgelegten Anforderungen nicht mehr erfüllt
    oder dass sie ihren Pflichten nicht nachkommt, schränkt sie die Benennung gegebenenfalls ein, setzt
    sie aus oder widerruft sie, je nach Schwere der Nichterfüllung dieser Anforderungen oder Pflichtverletzung.
    Sie informiert die Kommission und die anderen Mitgliedstaaten unverzüglich darüber.
