- id: Art. 26 Abs. 10
  artikel: '26'
  artikel_titel: Pflichten der Betreiber von Hochrisiko-KI-Systemen
  absatz: '10'
  buchstabe: null
  offset: 363413
  laenge: 3210
  saetze: 11
  beleg: (10)   Unbeschadet der Richtlinie (EU) 2016/680 beantragt der Betreiber eines Hochrisiko-KI-Systems
    zur nachträglichen biometrischen Fernfernidentifizierung im Rahmen von Ermittlungen zur gezielten
    Suche einer Person, die der Begehung einer Straftat verdächtigt wird oder aufgrund einer solchen verurteilt
    wurde, vorab oder unverzüglich, spätestens jedoch binnen 48 Stunden bei einer Justizbehörde oder einer
    Verwaltungsbehörde, deren Entscheidung bindend ist und einer justiziellen Überprüfung unterliegt,
    die Genehmigung für die Nutzung dieses Systems, es sei denn, es wird zur erstmaligen Identifizierung
    eines potenziellen Verdächtigen auf der Grundlage objektiver und nachprüfbarer Tatsachen, die in unmittelbarem
    Zusammenhang mit der Straftat stehen, verwendet. Jede Verwendung ist auf das für die Ermittlung einer
    bestimmten Straftat unbedingt erforderliche Maß zu beschränken. Wird die gemäß Unterabsatz 1 beantragte
    Genehmigung abgelehnt, so wird die Verwendung des mit dieser beantragten Genehmigung verbundenen Systems
    zur nachträglichen biometrischen Fernidentifizierung mit sofortiger Wirkung eingestellt und werden
    die personenbezogenen Daten, die im Zusammenhang mit der Verwendung des Hochrisiko-KI-Systems stehen,
    für die die Genehmigung beantragt wurde, gelöscht. In keinem Fall darf ein solches Hochrisiko-KI-System
    zur nachträglichen biometrischen Fernidentifizierung zu Strafverfolgungszwecken in nicht zielgerichteter
    Weise und ohne jeglichen Zusammenhang mit einer Straftat, einem Strafverfahren, einer tatsächlichen
    und bestehenden oder tatsächlichen und vorhersehbaren Gefahr einer Straftat oder der Suche nach einer
    bestimmten vermissten Person verwendet werden. Es muss sichergestellt werden, dass die Strafverfolgungsbehörden
    keine ausschließlich auf der Grundlage der Ausgabe solcher Systeme zur nachträglichen biometrischen
    Fernidentifizierung beruhende Entscheidung, aus der sich eine nachteilige Rechtsfolge für eine Person
    ergibt, treffen. Dieser Absatz gilt unbeschadet des Artikels 9 der Verordnung (EU) 2016/679 und des
    Artikels 10 der Richtlinie (EU) 2016/680 für die Verarbeitung biometrischer Daten. Unabhängig vom
    Zweck oder Betreiber wird jede Verwendung solcher Hochrisiko-KI-Systeme in der einschlägigen Polizeiakte
    dokumentiert und der zuständigen Marktüberwachungsbehörde und der nationalen Datenschutzbehörde auf
    Anfrage zur Verfügung gestellt, wovon die Offenlegung sensibler operativer Daten im Zusammenhang mit
    der Strafverfolgung ausgenommen ist. Dieser Unterabsatz berührt nicht die den Aufsichtsbehörden durch
    die Richtlinie (EU) 2016/680 übertragenen Befugnisse. Die Betreiber legen den zuständigen Marktüberwachungsbehörden
    und den nationalen Datenschutzbehörden Jahresberichte über ihre Verwendung von Systemen zur nachträglichen
    biometrischen Fernidentifizierung vor, wovon die Offenlegung sensibler operativer Daten im Zusammenhang
    mit der Strafverfolgung ausgenommen ist. Die Berichte können eine Zusammenfassung sein, damit sie
    mehr als einen Einsatz abdecken. Die Mitgliedstaaten können im Einklang mit dem Unionsrecht strengere
    Rechtsvorschriften für die Verwendung von Systemen zur nachträglichen biometrischen Fernidentifizierung
    erlassen.
  adressat: betreiber
  pflicht: Der Betreiber eines Hochrisiko-KI-Systems zur nachtraeglichen biometrischen Fernidentifizierung
    zu Strafverfolgungszwecken holt vor (im Ausnahmefall unverzueglich binnen 48 Stunden nach) der Nutzung
    eine gerichtliche/verwaltungsbehoerdliche Genehmigung ein, beschraenkt die Nutzung auf das Erforderliche,
    loescht bei Ablehnung die erhobenen Daten, dokumentiert jede Nutzung in der Polizeiakte und legt den
    Behoerden Jahresberichte vor.
