  buchstabe: null
  offset: 448907
  laenge: 1147
  saetze: 5
  beleg: (7)   Die zuständigen Behörden stellen den Anbietern und zukünftigen Anbietern, die am KI-Reallabor
    teilnehmen, Leitfäden zu regulatorischen Erwartungen und zur Erfüllung der in dieser Verordnung festgelegten
    Anforderungen und Pflichten zur Verfügung. Die zuständige Behörde legt dem Anbieter oder zukünftigen
    Anbieter des KI-Systems auf dessen Anfrage einen schriftlichen Nachweis für die im Reallabor erfolgreich
    durchgeführten Tätigkeiten vor. Außerdem legt die zuständige Behörde einen Abschlussbericht vor, in
    dem sie die im Reallabor durchgeführten Tätigkeiten, deren Ergebnisse und die gewonnenen Erkenntnisse
    im Einzelnen darlegt. Die Anbieter können diese Unterlagen nutzen, um im Rahmen des Konformitätsbewertungsverfahrens
    oder einschlägiger Marktüberwachungstätigkeiten nachzuweisen, dass sie dieser Verordnung nachkommen.
    In diesem Zusammenhang werden die Abschlussberichte und die von der zuständigen nationalen Behörde
    vorgelegten schriftlichen Nachweise von den Marktüberwachungsbehörden und den notifizierten Stellen
    im Hinblick auf eine Beschleunigung der Konformitätsbewertungsverfahren in angemessenem Maße positiv
    gewertet.
