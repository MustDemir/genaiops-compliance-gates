  adressat: anbieter
  pflicht: Bei der Entwicklung von Hochrisiko-KI-Systemen ohne trainierte KI-Modelle gelten Abs. 2-5 nur
    fuer Testdatensaetze.
  scope: out
  scope_grund: 'ANHANG-M.3-HYPOTHESE GEPRUEFT (Ticket-Auftrag T-12 Lauf 1), NICHT BESTAETIGT: Die Masterarbeit
    (Anhang M.3) haelt fest, dass fuer Betreiber, die Foundation Models ueber API nutzen, ''nur Abs. 6
    einschlaegig'' sei. Der Wortlaut (auch in der durch VO (EU) 2026/1744 geaenderten Fassung, s. omnibus-Feld)
    adressiert jedoch durchgaengig die ''ENTWICKLUNG von Hochrisiko-KI-Systemen'' - eine Handlung des
    Anbieters (Art. 3 Nr. 3: wer entwickelt/entwickeln laesst UND in Verkehr bringt/in Betrieb nimmt),
    nicht des Betreibers. Ein Betreiber, der ein Foundation Model lediglich ueber API konsumiert, ''entwickelt''
    im Sinne dieser Norm nichts und wird von Abs. 6 - wie von Art. 10 insgesamt - gar nicht erst adressiert
    (es sei denn, die API-Integration selbst begruendet einen Rollenaufstieg zum Anbieter nach Art. 25,
    HANDBUCH 4.4 K2/K3). Ergebnis: scope: out wie der Rest von Art. 10; die Anhang-M.3-Aussage duerfte
    auf einer verkuerzten Lesart beruhen (moeglicherweise verwechselt mit der Anwendungslogik von Abs.
    6 als SCHWELLENWERT dafuer, WELCHE Anbieter-Pruefungen im Trainingsfall entfallen - nicht damit, dass
    der Betreiber selbst geprueft wird). PO-Entscheidung: Anhang M.3 der Masterarbeit an dieser Stelle
    korrigieren oder Gegenargument nachreichen.'
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: geaendert durch VO (EU) 2026/1744 Art. 1 Nr. 9 lit. c - verweist zusaetzlich auf Art. 4a Abs.
    1 statt (wie zuvor) auf den gestrichenen Abs. 5; die durch Abs. 2-4 gesetzte Grundregel ('nur fuer
    Testdatensaetze') bleibt inhaltlich unveraendert (geprüft am verfügenden Teil, docs/legal/OJ_L_202601744_DE.pdf).
  requirement: []
