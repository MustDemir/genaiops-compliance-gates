- id: Art. 25 Abs. 2
  artikel: '25'
  artikel_titel: Verantwortlichkeiten entlang der KI-Wertschöpfungskette
  absatz: '2'
  buchstabe: null
  offset: 355671
  laenge: 862
  saetze: 3
  beleg: (2)   Unter den in Absatz 1 genannten Umständen gilt der Anbieter, der das KI-System ursprünglich
    in Verkehr gebracht oder in Betrieb genommen hatte, nicht mehr als Anbieter dieses spezifischen KI-Systems
    für die Zwecke dieser Verordnung. Dieser Erstanbieter arbeitet eng mit neuen Anbietern zusammen, stellt
    die erforderlichen Informationen zur Verfügung und sorgt für den vernünftigerweise zu erwartenden
    technischen Zugang und sonstige Unterstützung, die für die Erfüllung der in dieser Verordnung festgelegten
    Pflichten, insbesondere in Bezug auf die Konformitätsbewertung von Hochrisiko-KI-Systemen, erforderlich
    sind. Dieser Absatz gilt nicht in Fällen, in denen der Erstanbieter eindeutig festgelegt hat, dass
    sein KI-System nicht in ein Hochrisiko-KI-System umgewandelt werden darf und daher nicht der Pflicht
    zur Übergabe der Dokumentation unterliegt.
  adressat: betreiber
  pflicht: Wird der Betreiber durch lit. a-c zum neuen Anbieter, muss der urspruengliche Anbieter (Erstanbieter)
    mit ihm kooperieren, Informationen, technischen Zugang und Unterstuetzung fuer die Konformitaetsbewertung
    bereitstellen - ausser der Erstanbieter hat den Uebergang zum Hochrisiko-System ausdruecklich ausgeschlossen.
  scope: in
  scope_grund: null
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: 'GEAENDERT durch VO (EU) 2026/1744 Art. 1 Nr. 12 lit. a: UAbs. 2 zaehlt die Kooperationspflicht
    seit der Aenderung explizit in drei Elemente auf - a) Bereitstellung technischer Unterlagen fuer die
    Art.-16-Bewertung, b) Unterrichtung ueber bekannte Einschraenkungen/Fehlerarten, c) gezielter technischer
    Zugang auch zu Test-/Validierungszwecken (vorher nur allgemein ''Informationen... technischer Zugang...
    Unterstuetzung''). Der Carve-out-Satz wird zugleich erweitert: er befreit nun ausdruecklich von der
    Pflicht zur Zusammenarbeit MIT NEUEN ANBIETERN UND zur Uebergabe der Dokumentation (vorher nur von
    der Uebergabepflicht allein). Beide Fassungen sind inhaltlich in dieselbe Richtung, die neue ist praeziser
    und breiter im Carve-out.'
  requirement: []
  gate:
