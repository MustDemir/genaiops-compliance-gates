  buchstabe: null
  offset: 452890
  laenge: 799
  saetze: 3
  beleg: (12)   Die am KI-Reallabor beteiligten Anbieter und zukünftigen Anbieter bleiben nach geltendem
    Recht der Union und nationalem Haftungsrecht für Schäden haftbar, die Dritten infolge der Erprobung
    im Reallabor entstehen. Sofern die zukünftigen Anbieter den spezifischen Plan und die Bedingungen
    für ihre Beteiligung beachten und der Anleitung durch die zuständigen nationalen Behörden in gutem
    Glauben folgen, werden jedoch von den Behörden keine Geldbußen für Verstöße gegen diese Verordnung
    verhängt. In Fällen, in denen andere zuständige Behörden, die für anderes Unionsrecht und nationales
    Recht zuständig sind, aktiv an der Beaufsichtigung des KI-Systems im Reallabor beteiligt waren und
    Anleitung für die Einhaltung gegeben haben, werden im Hinblick auf dieses Recht keine Geldbußen verhängt.
