- id: Art. 26 Abs. 5
  artikel: '26'
  artikel_titel: Pflichten der Betreiber von Hochrisiko-KI-Systemen
  absatz: '5'
  buchstabe: null
  offset: 359967
  laenge: 1384
  saetze: 5
  beleg: (5)   Die Betreiber überwachen den Betrieb des Hochrisiko-KI-Systems anhand der Betriebsanleitung
    und informieren gegebenenfalls die Anbieter gemäß Artikel 72. Haben Betreiber Grund zu der Annahme,
    dass die Verwendung gemäß der Betriebsanleitung dazu führen kann, dass dieses Hochrisiko-KI-System
    ein Risiko im Sinne des Artikels 79 Absatz 1 birgt, so informieren sie unverzüglich den Anbieter oder
    Händler und die zuständige Marktüberwachungsbehörde und setzen die Verwendung dieses Systems aus.
    Haben die Betreiber einen schwerwiegenden Vorfall festgestellt, informieren sie auch unverzüglich
    zuerst den Anbieter und dann den Einführer oder Händler und die zuständigen Marktüberwachungsbehörden
    über diesen Vorfall. Kann der Betreiber den Anbieter nicht erreichen, so gilt Artikel 73 entsprechend.
    Diese Pflicht gilt nicht für sensible operative Daten von Betreibern von KI-Systemen, die Strafverfolgungsbehörden
    sind. Bei Betreibern, die Finanzinstitute sind und gemäß den Rechtsvorschriften der Union über Finanzdienstleistungen
    Anforderungen in Bezug auf ihre Regelungen oder Verfahren der internen Unternehmensführung, unterliegen,
    gilt die in Unterabsatz 1 festgelegte Überwachungspflicht als erfüllt, wenn die Vorschriften über
    Regelungen, Verfahren oder Mechanismen der internen Unternehmensführung gemäß einschlägigem Recht
    über Finanzdienstleistungen eingehalten werden.
  adressat: betreiber
  pflicht: Der Betreiber ueberwacht den Betrieb des Hochrisiko-KI-Systems anhand der Betriebsanleitung;
    erkennt er ein Risiko im Sinne von Art. 79 Abs. 1, informiert er unverzueglich Anbieter/Haendler und
    die zustaendige Marktueberwachungsbehoerde und setzt die Verwendung aus; stellt er einen schwerwiegenden
    Vorfall fest, informiert er unverzueglich zuerst den Anbieter, dann Einfuehrer/Haendler und die zustaendigen
    Behoerden (bei Unerreichbarkeit des Anbieters gilt Art. 73 entsprechend); Sonderregeln gelten fuer
    Strafverfolgungsbehoerden (Ausnahme fuer sensible operative Daten) und Finanzinstitute (Erfuellung
    durch bestehende Governance-Vorschriften).
  scope: in
  scope_grund: null
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: unveraendert - VO (EU) 2026/1744 Art. 1 aendert Art. 25 und Art. 27, Art. 26 ist in der Aenderungsliste
    nicht enthalten (geprüft am verfügenden Teil, docs/legal/OJ_L_202601744_DE.pdf).
  requirement:
  - R009
  gate:
  - G-OPS-02
  befund: teilabdeckung
  befund_grund: 'BAUVERBOT-KONTEXT (HANDBUCH 6.1): dieser Lauf liest und erfasst Abs. 5 nur, baut nichts
    - die Meldekaskade bleibt gesperrt, bis Art. 26 Abs. 5 und Art. 73 EUR-Lex-abgeglichen sind; mit dieser
    Zeile ist genau dieser Abgleich (fuer Abs. 5) erstmals im Wortlaut gefuehrt (Art. 73 folgt in Lauf
    2). G-OPS-02 prueft heute drei Pod-Annotationen (incident-response-configured, incident-contact, rollback-mechanism,
    alle E-0) plus C-02..C-05 gegen governance/incident_thresholds.yaml (Fristen, Beweissicherung). Nicht
    abgedeckt: (1) die eigentliche UEBERWACHUNG des Betriebs anhand der Betriebsanleitung als solche -
    kein Gate prueft, dass ueberwacht WIRD, nur dass ein Incident-Prozess deklariert ist; (2) die Risikoerkennung
    nach Art. 79 Abs. 1 mit Aussetzungspflicht - existiert nicht; (3) die REIHENFOLGE der Meldekette (zuerst
    Anbieter, dann Einfuehrer/Haendler, dann Behoerde) - C-01 prueft nur ''incident-contact'' pauschal,
    nicht die Reihenfolge; (4) der Ausweichfall ''Anbieter nicht erreichbar -> Art. 73 entsprechend'';
    (5) die Sonderregeln fuer Strafverfolgungsbehoerden/Finanzinstitute. Die triggers ''start_deadline''
    und ''open_incident'' sind in G-OPS-02 explizit als declared_only gefuehrt - die Luecke ist im Gate
    selbst bereits benannt, nicht neu.'
  po_bestaetigt: false
- id: Art. 26 Abs. 6
  artikel: '26'
  artikel_titel: Pflichten der Betreiber von Hochrisiko-KI-Systemen
  absatz: '6'
  buchstabe: null
  offset: 361351
  laenge: 797
  saetze: 2
