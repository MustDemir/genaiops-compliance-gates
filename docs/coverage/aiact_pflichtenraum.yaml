  laenge: 10617
  saetze: 37
  beleg: 'c) die in Anhang IV genannte technische Dokumentation. 4.3. Die technische Dokumentation wird
    von der notifizierten Stelle geprüft. Sofern es relevant ist und beschränkt auf das zur Wahrnehmung
    ihrer Aufgaben erforderliche Maß erhält die notifizierte Stelle uneingeschränkten Zugang zu den verwendeten
    Trainings-, Validierungs- und Testdatensätzen, gegebenenfalls und unter Einhaltung von Sicherheitsvorkehrungen
    auch über API oder sonstige einschlägige technische Mittel und Instrumente, die den Fernzugriff ermöglichen.
    4.4. Bei der Prüfung der technischen Dokumentation kann die notifizierte Stelle vom Anbieter weitere
    Nachweise oder die Durchführung weiterer Tests verlangen, um eine ordnungsgemäße Bewertung der Konformität
    des KI-Systems mit den in Kapitel III Abschnitt 2 festgelegten Anforderungen zu ermöglichen. Ist die
    notifizierte Stelle mit den vom Anbieter durchgeführten Tests nicht zufrieden, so führt sie gegebenenfalls
    unmittelbar selbst angemessene Tests durch. 4.5. Sofern es für die Bewertung der Konformität des Hochrisiko-KI-Systems
    mit den in Kapitel III Abschnitt 2 festgelegten Anforderungen notwendig ist, und nachdem alle anderen
    sinnvollen Möglichkeiten zur Überprüfung der Konformität ausgeschöpft sind oder sich als unzureichend
    erwiesen haben, wird der notifizierten Stelle auf begründeten Antrag Zugang zu den Trainingsmodellen
    und trainierten Modellen des KI-Systems, einschließlich seiner relevanten Parameter, gewährt. Ein
    solcher Zugang unterliegt dem bestehenden EU-Recht zum Schutz von geistigem Eigentum und Geschäftsgeheimnissen.
    4.6. Die Entscheidung der notifizierten Stelle wird dem Anbieter oder dessen Bevollmächtigten mitgeteilt.
    Die Mitteilung enthält die Ergebnisse der Bewertung der technischen Dokumentation und die begründete
    Bewertungsentscheidung. Erfüllt das KI-System die Anforderungen in Kapitel III Abschnitt 2, so stellt
    die notifizierte Stelle eine Unionsbescheinigung über die Bewertung der technischen Dokumentation
    aus. Diese Bescheinigung enthält den Namen und die Anschrift des Anbieters, die Ergebnisse der Prüfung,
    etwaige Bedingungen für ihre Gültigkeit und die für die Identifizierung des KI-Systems notwendigen
    Daten. Die Bescheinigung und ihre Anhänge enthalten alle zweckdienlichen Informationen für die Beurteilung
    der Konformität des KI-Systems und gegebenenfalls für die Kontrolle des KI-Systems während seiner
    Verwendung. Erfüllt das KI-System die in Kapitel III Abschnitt 2 festgelegten Anforderungen nicht,
    so verweigert die notifizierte Stelle die Ausstellung einer Unionsbescheinigung über die Bewertung
    der technischen Dokumentation und informiert den Antragsteller darüber, wobei sie ihre Verweigerung
    ausführlich begründet. Erfüllt das KI-System nicht die Anforderung in Bezug auf die verwendeten Trainingsdaten,
    so muss das KI-System vor der Beantragung einer neuen Konformitätsbewertung erneut trainiert werden.
    In diesem Fall enthält die begründete Bewertungsentscheidung der notifizierten Stelle, mit der die
    Ausstellung der Unionsbescheinigung über die Bewertung der technischen Dokumentation verweigert wird,
    besondere Erläuterungen zu den zum Trainieren des KI-Systems verwendeten Qualitätsdaten und insbesondere
    zu den Gründen für die Nichtkonformität. 4.7. Jede Änderung des KI-Systems, die sich auf die Konformität
    des KI-Systems mit den Anforderungen oder auf seine Zweckbestimmung auswirken könnte, bedarf der Bewertung
    durch die notifizierte Stelle, die die Unionsbescheinigung über die Bewertung der technischen Dokumentation
    ausgestellt hat. Der Anbieter informiert die notifizierte Stelle über seine Absicht, eine der oben
    genannten Änderungen vorzunehmen, oder wenn er auf andere Weise Kenntnis vom Eintreten solcher Änderungen
    erhält. Die notifizierte Stelle bewertet die beabsichtigten Änderungen und entscheidet, ob diese Änderungen
    eine neue Konformitätsbewertung gemäß Artikel 43 Absatz 4 erforderlich machen oder ob ein Nachtrag
    zu der Unionsbescheinigung über die Bewertung der technischen Dokumentation ausgestellt werden könnte.
    In letzterem Fall bewertet die notifizierte Stelle die Änderungen, teilt dem Anbieter ihre Entscheidung
    mit und stellt ihm, sofern die Änderungen genehmigt wurden, einen Nachtrag zu der Unionsbescheinigung
    über die Bewertung der technischen Dokumentation aus. 5.   Überwachung des genehmigten Qualitätsmanagementsystems
    5.1. Mit der unter Nummer 3 genannten Überwachung durch die notifizierte Stelle soll sichergestellt
    werden, dass der Anbieter sich ordnungsgemäß an die Anforderungen und Bedingungen des genehmigten
    Qualitätsmanagementsystems hält. 5.2. Zu Bewertungszwecken gewährt der Anbieter der notifizierten
    Stelle Zugang zu den Räumlichkeiten, in denen die Konzeption, die Entwicklung und das Testen der KI-Systeme
    stattfindet. Außerdem übermittelt der Anbieter der notifizierten Stelle alle erforderlichen Informationen.
    5.3. Die notifizierte Stelle führt regelmäßig Audits durch, um sicherzustellen, dass der Anbieter
    das Qualitätsmanagementsystem pflegt und anwendet, und übermittelt ihm einen Prüfbericht. Im Rahmen
    dieser Audits kann die notifizierte Stelle die KI-Systeme, für die eine Unionsbescheinigung über die
    Bewertung der technischen Dokumentation ausgestellt wurde, zusätzlichen Tests unterziehen. ANHANG
    VIII Bei der Registrierung des Hochrisiko-KI-Systems gemäß Artikel 49 bereitzustellende Informationen
    Abschnitt A — Von Anbietern von Hochrisiko-KI-Systemen gemäß Artikel 49 Absatz 1 bereitzustellende
    Informationen Für Hochrisiko-KI-Systeme, die gemäß Artikel 49 Absatz 1 zu registrieren sind, werden
    folgende Informationen bereitgestellt und danach auf dem neuesten Stand gehalten: 1. der Name, die
    Anschrift und die Kontaktdaten des Anbieters; 2. bei Vorlage von Informationen durch eine andere Person
    im Namen des Anbieters: der Name, die Anschrift und die Kontaktdaten dieser Person; 3. gegebenenfalls
    der Name, die Anschrift und die Kontaktdaten des Bevollmächtigten; 4. der Handelsname des KI-Systems
    und etwaige zusätzliche eindeutige Angaben, die die Identifizierung und Rückverfolgbarkeit des KI-Systems
    ermöglichen; 5. eine Beschreibung der Zweckbestimmung des KI-Systems und der durch dieses KI-System
    unterstützten Komponenten und Funktionen; 6. eine grundlegende und knappe Beschreibung der vom System
    verwendeten Informationen (Daten, Eingaben) und seiner Betriebslogik; 7. der Status des KI-Systems
    (in Verkehr/in Betrieb; nicht mehr in Verkehr/in Betrieb, zurückgerufen); 8. die Art, die Nummer und
    das Ablaufdatum der von der notifizierten Stelle ausgestellten Bescheinigung und gegebenenfalls Name
    oder Identifizierungsnummer dieser notifizierten Stelle; 9. gegebenenfalls eine gescannte Kopie der
    in Nummer 8 genannten Bescheinigung; 10. alle Mitgliedstaaten, in denen das KI-System in Verkehr gebracht,
    in Betrieb genommen oder in der Union bereitgestellt wurde; 11. eine Kopie der in Artikel 47 genannten
    EU-Konformitätserklärung; 12. elektronische Betriebsanleitungen; dies gilt nicht für Hochrisiko-KI-Systeme
    in den Bereichen Strafverfolgung oder Migration, Asyl und Grenzkontrolle gemäß Anhang III Nummern
    1, 6 und 7; 13. Eine URL-Adresse für zusätzliche Informationen (fakultativ). Abschnitt B — Von Anbietern
    von Hochrisiko-KI-Systemen gemäß Artikel 49 Absatz 2 bereitzustellende Informationen Für KI-Systeme,
    die gemäß Artikel 49 Absatz 2 zu registrieren sind, werden folgende Informationen bereitgestellt und
    danach auf dem neuesten Stand gehalten: 1. der Name, die Anschrift und die Kontaktdaten des Anbieters;
    2. bei Vorlage von Informationen durch eine andere Person im Namen des Anbieters: Name, Anschrift
    und Kontaktdaten dieser Person; 3. gegebenenfalls der Name, die Anschrift und die Kontaktdaten des
    Bevollmächtigten; 4. der Handelsname des KI-Systems und etwaige zusätzliche eindeutige Angaben, die
    die Identifizierung und Rückverfolgbarkeit des KI-Systems ermöglichen; 5. eine Beschreibung der Zweckbestimmung
    des KI-Systems; 6. die Bedingung oder Bedingungen gemäß Artikel 6 Absatz 3, aufgrund derer das KI-System
    nicht als Hoch-Risiko-System eingestuft wird; 7. eine kurze Zusammenfassung der Gründe, aus denen
    das KI-System in Anwendung des Verfahrens gemäß Artikel 6 Absatz 3 nicht als Hoch-Risiko-System eingestuft
    wird; 8. der Status des KI-Systems (in Verkehr/in Betrieb; nicht mehr in Verkehr/in Betrieb, zurückgerufen)
    9. alle Mitgliedstaaten, in denen das KI-System in der Union in Verkehr gebracht, in Betrieb genommen
    oder bereitgestellt wurde. Abschnitt C — Von Betreibern von Hochrisiko-KI-Systemen gemäß Artikel 49
    Absatz 3 bereitzustellende Informationen Für Hochrisiko-KI-Systeme, die gemäß Artikel 49 Absatz 3
    zu registrieren sind, werden folgende Informationen bereitgestellt und danach auf dem neuesten Stand
    gehalten: 1. der Name, die Anschrift und die Kontaktdaten des Betreibers; 2. der Name, die Anschrift
    und die Kontaktdaten der Person, die im Namen des Betreibers Informationen übermittelt; 3. die URL
    des Eintrags des KI-Systems in der EU-Datenbank durch seinen Anbieter; 4. eine Zusammenfassung der
    Ergebnisse der gemäß Artikel 27 durchgeführten Grundrechte-Folgenabschätzung; 5. gegebenenfalls eine
    Zusammenfassung der im Einklang mit Artikel 35 der Verordnung (EU) 2016/679 oder Artikel 27 der Richtlinie
    (EU) 2016/680 gemäß Artikel 26 Absatz 8 der vorliegenden Verordnung durchgeführten Datenschutz-Folgenabschätzung.
    ANHANG IX Bezüglich Tests unter Realbedingungen gemäß Artikel 60 bei der Registrierung von in Anhang
    III aufgeführten Hochrisiko-KI-Systemen bereitzustellende Informationen Bezüglich Tests unter Realbedingungen,
    die gemäß Artikel 60 zu registrieren sind, werden folgende Informationen bereitgestellt und danach
    auf dem aktuellen Stand gehalten: 1. eine unionsweit einmalige Identifizierungsnummer des Tests unter
    Realbedingungen; 2. der Name und die Kontaktdaten des Anbieters oder zukünftigen Anbieters und der
    Betreiber, die an dem Test unter Realbedingungen teilgenommen haben; 3. eine kurze Beschreibung des
    KI-Systems, seine Zweckbestimmung und sonstige zu seiner Identifizierung erforderliche Informationen;
    4. eine Übersicht über die Hauptmerkmale des Plans für den Test unter Realbedingungen; 5. Informationen
    über die Aussetzung oder den Abbruch des Tests unter Realbedingungen. ANHANG X Rechtsvorschriften
    der Union über IT-Großsysteme im Raum der Freiheit, der Sicherheit und des Rechts 1.   Schengener
