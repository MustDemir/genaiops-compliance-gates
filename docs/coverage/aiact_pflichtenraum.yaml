  beleg: (6)   Das Büro für Künstliche Intelligenz und KI-Gremium überwachen und bewerten regelmäßig die
    Verwirklichung der Ziele der Praxisleitfäden durch die Beteiligten und deren Beitrag zur ordnungsgemäßen
    Anwendung dieser Verordnung. Das Büro für Künstliche Intelligenz und das KI-Gremium bewerten, ob die
    Praxisleitfäden die in den Artikeln 53 und 55 vorgesehenen Pflichten abdecken, und überwachen und
    bewerten regelmäßig die Verwirklichung von deren Zielen. Sie veröffentlichen ihre Bewertung der Angemessenheit
    der Praxisleitfäden. Die Kommission kann im Wege eines Durchführungsrechtsakts einen Praxisleitfaden
    genehmigen und ihm in der Union allgemeine Gültigkeit verleihen. Dieser Durchführungsrechtsakt wird
    gemäß dem in Artikel 98 Absatz 2 genannten Prüfverfahren erlassen.
