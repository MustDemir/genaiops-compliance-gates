- id: Art. 9 Abs. 1
  artikel: '9'
  artikel_titel: Risikomanagementsystem
  absatz: '1'
  buchstabe: null
  offset: 312275
  laenge: 125
  saetze: 1
  beleg: (1)   Für Hochrisiko-KI-Systeme wird ein Risikomanagementsystem eingerichtet, angewandt, dokumentiert
    und aufrechterhalten.
  adressat: anbieter
  pflicht: Fuer Hochrisiko-KI-Systeme wird ein Risikomanagementsystem eingerichtet, angewandt, dokumentiert
    und aufrechterhalten.
  scope: out
  scope_grund: 'ANBIETERPFLICHT - HAUPTBEFUND FUER ART. 9 (gilt sinngemaess fuer alle Abs./lit. dieses
    Artikels, dort jeweils kurz referenziert). Art. 9 steht in Kapitel III Abschnitt 2 (''Anforderungen
    an Hochrisiko-KI-Systeme''); die Pflicht, diese Anforderungen zu erfuellen, liegt nach Art. 16 lit.
    a beim Anbieter. Der Wortlaut selbst nennt in Abs. 9 und Abs. 10 explizit ''die Anbieter'' bzw. ''Bei
    Anbietern''; Abs. 1-8 sind impersonal (''wird eingerichtet'') formuliert, adressieren aber denselben
    Akteur. Im Zukauf-Regelfall K1 (HANDBUCH 4.4: ''Zukauf (DEPLOYER, Regelfall)'') trifft diese konkrete
    Pflicht NICHT den Betreiber; sie durchschlaegt nur mittelbar (Art. 26 Abs. 1: Verwendung gemaess Betriebsanleitung,
    die das Ergebnis dieses Prozesses widerspiegelt) oder unmittelbar in den Rollenaufstiegs-Konstellationen
    K2/K3 (Eigenentwicklung/wesentliche Anpassung), in denen der Betreiber selbst zum Anbieter wird. SPANNUNG
    ZUM BESTAND, PO-ENTSCHEIDUNG NOETIG: R001 (role: deployer) fuehrt ''Art. 9'' als eu_ai_act_refs, linked_gates
    G-PRE-01/G-PRE-03; G-PRE-03/C-01 verlangt vom BETREIBER ein eigenes ''risk_management''-Artefakt mit
    Risikoregister und Mitigation je Risiko - inhaltlich eine Spiegelung von Art. 9 Abs. 2 lit. a/b/d,
    aber am Betreiber statt am Anbieter ansetzend. Das ist entweder (a) eine bewusste ''business ready''-Uebererfuellung
    ueber die gesetzliche Anbieterpflicht hinaus (HANDBUCH 2.1 erlaubt das ausdruecklich), oder (b) eine
    Verwechslung der Adressatenrolle - strukturell identisch mit dem bereits dokumentierten Befund bei
    G-DEP-01 zu Art. 10/11 (''OFFENER BEFUND, Rollenabgrenzung'', G-DEP-01 notes, 2026-08-15), hier zum
    ersten Mal auf R001/Art. 9 selbst angewandt. Diese Zeile entscheidet das NICHT; scope: out spiegelt
    die wortlautgetreue Adressierung (Anbieter), das R001-Verhaeltnis ist im PR-Bericht als zentrale offene
    Frage vorgemerkt.'
  verifikation: VERIFIZIERT
  hypothese_grund: null
  omnibus: 'unveraendert - Art. 9 ist in der Aenderungsliste des Art. 1 der VO (EU) 2026/1744 nicht enthalten
