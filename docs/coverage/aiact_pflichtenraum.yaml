- id: Art. 57 Abs. 1
  artikel: '57'
  artikel_titel: KI-Reallabore
  absatz: '1'
  buchstabe: null
  offset: 446135
  laenge: 677
  saetze: 4
  beleg: (1)   Die Mitgliedstaaten sorgen dafür, dass ihre zuständigen Behörden mindestens ein KI-Reallabor
    auf nationaler Ebene einrichten, das bis zum 2. August 2026 einsatzbereit sein muss. Dieses Reallabor
    kann auch gemeinsam mit den zuständigen Behörden anderer Mitgliedstaaten eingerichtet werden. Die
    Kommission kann technische Unterstützung, Beratung und Instrumente für die Einrichtung und den Betrieb
    von KI-Reallaboren bereitstellen. Die Verpflichtung nach Unterabsatz 1 kann auch durch Beteiligung
    an einem bestehenden Reallabor erfüllt werden, sofern eine solche Beteiligung die nationale Abdeckung
    der teilnehmenden Mitgliedstaaten in gleichwertigem Maße gewährleistet.
