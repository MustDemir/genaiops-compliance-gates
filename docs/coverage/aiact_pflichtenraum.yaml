  beleg: (4)   Die Mitgliedstaaten stellen sicher, dass die in den Absätzen 1 und 2 genannten zuständigen
    Behörden ausreichende Mittel bereitstellen, um diesem Artikel wirksam und zeitnah nachzukommen. Gegebenenfalls
    arbeiten die zuständigen nationalen Behörden mit anderen einschlägigen Behörden zusammen und können
