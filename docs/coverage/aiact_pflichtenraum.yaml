- id: Art. 70 Abs. 1
  artikel: '70'
  artikel_titel: Benennung von zuständigen nationalen Behörden und zentrale Anlaufstelle
  absatz: '1'
  buchstabe: null
  offset: 495180
  laenge: 779
  saetze: 4
  beleg: (1)   Jeder Mitgliedstaat muss für die Zwecke dieser Verordnung mindestens eine notifizierende
    Behörde und mindestens eine Marktüberwachungsbehörde als zuständige nationale Behörden einrichten
    oder benennen. Diese zuständigen nationalen Behörden üben ihre Befugnisse unabhängig, unparteiisch
    und unvoreingenommen aus, um die Objektivität ihrer Tätigkeiten und Aufgaben zu gewährleisten und
    die Anwendung und Durchführung dieser Verordnung sicherzustellen. Die Mitglieder dieser Behörden haben
    jede Handlung zu unterlassen, die mit ihren Aufgaben unvereinbar ist. Sofern diese Grundsätze gewahrt
    werden, können die betreffenden Tätigkeiten und Aufgaben gemäß den organisatorischen Erfordernissen
    des Mitgliedstaats von einer oder mehreren benannten Behörden wahrgenommen werden.
