  beleg: (2)   Mit dem System zur Beobachtung nach dem Inverkehrbringen müssen sich die einschlägigen
    Daten zur Leistung der Hochrisiko-KI-Systeme, die von den Anbietern oder den Betreibern bereitgestellt
    oder aus anderen Quellen erhoben werden können, über ihre gesamte Lebensdauer hinweg aktiv und systematisch
