  beleg: (15)   Die zuständigen nationalen Behörden unterrichten das Büro für Künstliche Intelligenz und
    das KI-Gremium über die Einrichtung eines Reallabors und können sie um Unterstützung und Anleitung
    bitten. Das Büro für Künstliche Intelligenz veröffentlicht eine Liste der geplanten und bestehenden
