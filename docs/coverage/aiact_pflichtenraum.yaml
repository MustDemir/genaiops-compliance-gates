    zu Strafverfolgungszwecken im Hinblick auf die in Absatz 1 Unterabsatz 1 Buchstabe h des vorliegenden
    Artikels genannten Ziele notwendige und verhältnismäßige Schutzvorkehrungen und Bedingungen für die
