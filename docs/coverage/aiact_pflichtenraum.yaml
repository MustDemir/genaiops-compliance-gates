  saetze: 8
  beleg: 'h) ergriffene Cybersicherheitsmaßnahmen; 3. Detaillierte Informationen über die Überwachung,
    Funktionsweise und Kontrolle des KI-Systems, insbesondere in Bezug auf Folgendes: die Fähigkeiten
    und Leistungsgrenzen des Systems, einschließlich der Genauigkeitsgrade bei bestimmten Personen oder
    Personengruppen, auf die es bestimmungsgemäß angewandt werden soll, sowie des in Bezug auf seine Zweckbestimmung
    insgesamt erwarteten Maßes an Genauigkeit; angesichts der Zweckbestimmung des KI-Systems vorhersehbare
    unbeabsichtigte Ergebnisse und Quellen von Risiken in Bezug auf Gesundheit und Sicherheit sowie Grundrechte
    und Diskriminierung; die nach Artikel 14 erforderlichen Maßnahmen der menschlichen Aufsicht, einschließlich
    der technischen Maßnahmen, die getroffen wurden, um den Betreibern die Interpretation der Ausgaben
    von KI-Systemen zu erleichtern; gegebenenfalls Spezifikationen zu Eingabedaten; 4. Darlegungen zur
    Eignung der Leistungskennzahlen für das spezifische KI-System; 5. Detaillierte Beschreibung des Risikomanagementsystems
    gemäß Artikel 9; 6. Beschreibung einschlägiger Änderungen, die der Anbieter während des Lebenszyklus
    an dem System vorgenommen hat; 7. Aufstellung der vollständig oder teilweise angewandten harmonisierten
    Normen, deren Fundstellen im Amtsblatt der Europäischen Union veröffentlicht wurden; falls keine solchen
    harmonisierten Normen angewandt wurden, eine detaillierte Beschreibung der Lösungen, mit denen die
    in Kapitel III Abschnitt 2 festgelegten Anforderungen erfüllt werden sollen, mit einer Aufstellung
    anderer angewandter einschlägiger Normen und technischer Spezifikationen; 8. Kopie der EU-Konformitätserklärung
    gemäß Artikel 47; 9. Detaillierte Beschreibung des Systems zur Bewertung der Leistung des KI-Systems
    in der Phase nach dem Inverkehrbringen gemäß Artikel 72, einschließlich des in Artikel 72 Absatz 3
    genannten Plans für die Beobachtung nach dem Inverkehrbringen ANHANG V EU-Konformitätserklärung Die
    EU-Konformitätserklärung gemäß Artikel 47 enthält alle folgenden Angaben: 1. Name und Art des KI-Systems
    und etwaige zusätzliche eindeutige Angaben, die die Identifizierung und Rückverfolgbarkeit des KI-Systems
    ermöglichen; 2. Name und Anschrift des Anbieters und gegebenenfalls seines Bevollmächtigten; 3. Erklärung
    darüber, dass der Anbieter die alleinige Verantwortung für die Ausstellung der EU-Konformitätserklärung
    gemäß Artikel 47 trägt; 4. Versicherung, dass das betreffende KI-System der vorliegenden Verordnung
    sowie gegebenenfalls weiteren einschlägigen Rechtsvorschriften der Union, in denen die Ausstellung
    der EU-Konformitätserklärung gemäß Artikel 47 vorgesehen ist, entspricht; 5. wenn ein KI-System die
    Verarbeitung personenbezogener Daten erfordert, eine Erklärung darüber, dass das KI-System den Verordnungen
    (EU) 2016/679 und (EU) 2018/1725 sowie der Richtlinie (EU) 2016/680 entspricht; 6. Verweise auf die
    verwendeten einschlägigen harmonisierten Normen oder sonstigen gemeinsamen Spezifikationen, für die
    die Konformität erklärt wird; 7. gegebenenfalls Name und Identifizierungsnummer der notifizierten
    Stelle, Beschreibung des durchgeführten Konformitätsbewertungsverfahrens und Identifizierungsnummer
    der ausgestellten Bescheinigung; 8. Ort und Datum der Ausstellung der Erklärung, den Namen und die
    Funktion des Unterzeichners sowie Angabe, für wen oder in wessen Namen diese Person unterzeichnet
    hat, eine Unterschrift. ANHANG VI Konformitätsbewertungsverfahren auf der Grundlage einer internen
    Kontrolle 1. Das Konformitätsbewertungsverfahren auf der Grundlage einer internen Kontrolle ist das
    Konformitätsbewertungsverfahren gemäß den Nummern 2, 3 und 4. 2. Der Anbieter überprüft, ob das bestehende
    Qualitätsmanagementsystem den Anforderungen des Artikels 17 entspricht. 3. Der Anbieter prüft die
    in der technischen Dokumentation enthaltenen Informationen, um zu beurteilen. ob das KI-System den
    einschlägigen grundlegenden Anforderungen in Kapitel III Abschnitt 2 entspricht. 4. Der Anbieter überprüft
    ferner, ob der Entwurfs- und Entwicklungsprozess des KI-Systems und seine Beobachtung nach dem Inverkehrbringen
    gemäß Artikel 72 mit der technischen Dokumentation im Einklang stehen. ANHANG VII Konformität auf
    der Grundlage einer Bewertung des Qualitätsmanagementsystems und einer Bewertung der technischen Dokumentation
    1.   Einleitung Die Konformität auf der Grundlage einer Bewertung des Qualitätsmanagementsystems und
    einer Bewertung der technischen Dokumentation entspricht dem Konformitätsbewertungsverfahren gemäß
