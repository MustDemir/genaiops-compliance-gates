  saetze: 2
  beleg: (6)   Notifizierte Stellen werden so organisiert und geführt, dass bei der Ausübung ihrer Tätigkeit
    Unabhängigkeit, Objektivität und Unparteilichkeit gewahrt sind. Von den notifizierten Stellen werden
    eine Struktur und Verfahren dokumentiert und umgesetzt, die ihre Unparteilichkeit gewährleisten und
    sicherstellen, dass die Grundsätze der Unparteilichkeit in ihrer gesamten Organisation, von allen
    Mitarbeitern und bei allen Bewertungstätigkeiten gefördert und angewandt werden.
