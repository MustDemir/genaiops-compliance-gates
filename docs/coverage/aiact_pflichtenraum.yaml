- id: Art. 14 Abs. 1
  artikel: '14'
  artikel_titel: Menschliche Aufsicht
  absatz: '1'
  buchstabe: null
  offset: 328910
  laenge: 245
  saetze: 1
  beleg: (1)   Hochrisiko-KI-Systeme werden so konzipiert und entwickelt, dass sie während der Dauer ihrer
    Verwendung — auch mit geeigneten Instrumenten einer Mensch-Maschine-Schnittstelle — von natürlichen
