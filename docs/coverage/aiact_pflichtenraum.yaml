    „Profiling“ das Profiling im Sinne von Artikel 4 Nummer 4 der Verordnung (EU) 2016/679; 53. „Plan
    für einen Test unter Realbedingungen“ ein Dokument, in dem die Ziele, die Methodik, der geografische,
    bevölkerungsbezogene und zeitliche Umfang, die Überwachung, die Organisation und die Durchführung
    eines Tests unter Realbedingungen beschrieben werden; 54. „Plan für das Reallabor“ ein zwischen dem
    teilnehmenden Anbieter und der zuständigen Behörde vereinbartes Dokument, in dem die Ziele, die Bedingungen,
    der Zeitrahmen, die Methodik und die Anforderungen für die im Reallabor durchgeführten Tätigkeiten
    beschrieben werden; 55. „KI-Reallabor“ einen kontrollierten Rahmen, der von einer zuständigen Behörde
    geschaffen wird und den Anbieter oder zukünftige Anbieter von KI-Systemen nach einem Plan für das
    Reallabor einen begrenzten Zeitraum und unter regulatorischer Aufsicht nutzen können, um ein innovatives
    KI-System zu entwickeln, zu trainieren, zu validieren und — gegebenenfalls unter Realbedingungen —
