  beleg: (4) Bei der Prüfung einer voraussichtlichen Beeinträchtigung der öffentlichen Ordnung oder Sicherheit
    nach Absatz 1 kann insbesondere berücksichtigt werden, ob 1. der Hersteller unmittelbar oder mittelbar
    von der Regierung, einschließlich sonstiger staatlicher Stellen oder Streitkräfte, eines Drittstaates
    kontrolliert wird oder zur Zusammenarbeit mit staatlichen Stellen oder Streitkräften eines Drittstaates
    verpflichtet ist oder von dem Drittstaat hierzu verpflichtet werden kann, 2. der Hersteller an Aktivitäten
    beteiligt war oder ist, die geeignet waren oder sind, nachteilige Auswirkungen auf die öffentliche
    Ordnung oder Sicherheit der Bundesrepublik Deutschland oder eines anderen Mitgliedstaates der Europäischen
    Union, der Europäischen Freihandelsassoziation oder des Nordatlantikvertrages oder auf deren Einrichtungen
    zu haben, 3. hinreichende Anhaltspunkte dafür bestehen, dass der Hersteller aus sonstigen Gründen
    nicht vertrauenswürdig ist, 4. der Einsatz der kritischen Komponente im Einklang mit den sicherheitspolitischen
    Interessen der Bundesrepublik Deutschland, der Europäischen Union oder des Nordatlantikvertrages steht.
