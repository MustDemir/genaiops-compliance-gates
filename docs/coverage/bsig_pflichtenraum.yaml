- uid: § 55 Abs. 5@153918
  id: § 55 Abs. 5
  artikel: § 55
  artikel_titel: Freiwilliges IT-Sicherheitskennzeichen
  absatz: '5'
  buchstabe: null
  offset: 153918
  laenge: 695
  saetze: 3
  beleg: (5) Das Bundesamt erteilt die Freigabe des IT-Sicherheitskennzeichens für das jeweilige Produkt,
    wenn 1. das Produkt zu einer der Produktkategorien gehört, die das Bundesamt durch im Bundesanzeiger
    veröffentlichte Allgemeinverfügung bekannt gegeben hat, 2. die Herstellererklärung plausibel und durch
    die beigefügten Unterlagen ausreichend belegt ist und 3. die gegebenenfalls erhobene Verwaltungsgebühr
    beglichen wurde. Die Erteilung der Freigabe erfolgt schriftlich und innerhalb einer angemessenen Frist,
    die in der Rechtsverordnung nach § 56 Absatz 2 bestimmt wird. Den genauen Ablauf des Antragsverfahrens
    und die beizufügenden Unterlagen regelt die Rechtsverordnung nach § 56 Absatz 2.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
