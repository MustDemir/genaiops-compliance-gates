- uid: § 2 lit. c@5758
  id: § 2 lit. c
  artikel: § 2
  artikel_titel: Begriffsbestimmungen
  absatz: '-'
  buchstabe: c
  offset: 5758
  laenge: 2661
  saetze: 1
  beleg: c) nicht voraussetzt, dass aa) der Internet-Datenverkehr zwischen zwei beliebigen teilnehmenden
    autonomen Systemen über ein drittes autonomes System läuft oder bb) den betreffenden Datenverkehr
    verändert oder diesen anderweitig beeinträchtigt; 21. „Kommunikationstechnik des Bundes“ Informationstechnik,
    die von einer oder mehreren Einrichtungen der Bundesverwaltung oder im Auftrag einer oder mehrerer
    Einrichtungen der Bundesverwaltung betrieben wird und der Kommunikation oder dem Datenaustausch innerhalb
    einer Einrichtung der Bundesverwaltung, der Einrichtungen der Bundesverwaltung untereinander oder
    der Einrichtungen der Bundesverwaltung mit Dritten dient; nicht als „Kommunikationstechnik des Bundes“
    gelten die Kommunikationstechnik des Bundesverfassungsgerichts, der Bundesgerichte, soweit sie nicht
    öffentlich-rechtliche Verwaltungsaufgaben wahrnehmen, des Bundestages, des Bundesrates, des Bundespräsidenten
    und des Bundesrechnungshofes, soweit sie ausschließlich in deren eigener Zuständigkeit betrieben wird;
    22. „kritische Anlage“ eine Anlage im Sinne des § 2 Nummer 3 des KRITIS-Dachgesetzes; 23. „kritische
    Komponenten“ IKT-Produkte, die in einer Rechtsverordnung aufgrund von § 56 Absatz 6 als kritische
    Komponenten bestimmt werden; 24. „kritische Dienstleistung“ eine Dienstleistung im Sinne des § 2 Nummer
    4 des KRITIS-Dachgesetzes; 25. „Managed Security Service Provider“ oder „MSSP“ ein Managed Service
    Provider, der Unterstützung für Tätigkeiten im Zusammenhang mit dem Risikomanagement im Bereich der
    Cybersicherheit durchführt oder erbringt; 26. „Managed Service Provider“ oder „MSP“ ein Anbieter von
    Diensten im Zusammenhang mit der Installation, der Verwaltung, dem Betrieb oder der Wartung von IKT-Produkten,
    -Netzen, -Infrastruktur, -Anwendungen oder jeglicher anderer Netz- und Informationssysteme durch Unterstützung
    oder aktive Verwaltung in den Räumlichkeiten der Kunden oder aus der Ferne; 27. „NIS-2-Richtlinie“
    die Richtlinie (EU) 2022/2555 in der jeweils geltenden Fassung; 28. „Online-Marktplatz“ ein Dienst
    nach § 312l Absatz 3 des Bürgerlichen Gesetzbuchs; 29. „Online-Suchmaschine“ ein digitaler Dienst
    nach Artikel 2 Nummer 5 der Verordnung (EU) 2019/1150; 30. „Plattform für Dienste sozialer Netzwerke“
    eine Plattform, auf der Endnutzer mit unterschiedlichen Geräten insbesondere durch Chats, Posts, Videos
    und Empfehlungen miteinander in Kontakt treten und kommunizieren sowie Inhalte teilen und entdecken
    können; 31. „Protokolldaten“ Steuerdaten eines informationstechnischen Protokolls zur Datenübertragung,
    die a) zur Gewährleistung der Kommunikation zwischen Empfänger und Sender notwendig sind und
