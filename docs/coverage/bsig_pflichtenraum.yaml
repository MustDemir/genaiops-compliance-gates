  absatz: '2'
  buchstabe: null
  offset: 99533
  laenge: 674
  saetze: 3
  beleg: (2) Ist eine Sensibilisierung der Öffentlichkeit erforderlich, um einen erheblichen Sicherheitsvorfall
    zu verhindern oder zu bewältigen, oder liegt die Offenlegung des erheblichen Sicherheitsvorfalls anderweitig
    im öffentlichen Interesse, so kann das Bundesamt nach Anhörung der betreffenden Einrichtung diese
    dazu verpflichten, die Öffentlichkeit über den erheblichen Sicherheitsvorfall zu informieren. Das
    Bundesamt kann entsprechend der Voraussetzungen nach Satz 1 die Öffentlichkeit auch selbst informieren.
    Handelt es sich bei der betreffenden Einrichtung um eine Einrichtung der Bundesverwaltung, gilt für
