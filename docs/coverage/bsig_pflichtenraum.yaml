  beleg: (1) Das Bundesamt führt zur Information von Verbrauchern über die IT-Sicherheit von Produkten
    bestimmter vom Bundesamt festgelegter Produktkategorien ein einheitliches IT-Sicherheitskennzeichen
    ein. Das IT-Sicherheitskennzeichen trifft keine Aussage über die den Datenschutz betreffenden Eigenschaften
    eines Produktes.
  adressat: null
