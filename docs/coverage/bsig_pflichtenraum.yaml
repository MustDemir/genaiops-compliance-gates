  beleg: '(1) Eine Einrichtung der in § 60 Absatz 1 Satz 1 genannten Einrichtungsart ist verpflichtet,
    spätestens drei Monate, nachdem sie als eine der vorgenannten Einrichtungen gelten, dem Bundesamt
    die folgenden Angaben zu übermitteln: 1. Name der Einrichtung; 2. einschlägiger Sektor, Branche und
    Einrichtungsart wie in Anlage 1 bestimmt; 3. Anschrift der Hauptniederlassung in der Europäischen
    Union nach § 60 Absatz 2 und ihrer sonstigen Niederlassungen in der Europäischen Union oder, falls
    sie nicht in der Europäischen Union niedergelassen ist, Anschrift ihres nach § 60 Absatz 3 benannten
    Vertreters; 4. aktuelle Kontaktdaten, einschließlich E-Mail-Adressen und Telefonnummern der Einrichtung
    und soweit erforderlich, ihres nach § 60 Absatz 3 benannten Vertreters; 5. die Mitgliedstaaten der
