  artikel_titel: Wiederherstellung der Sicherheit oder Funktionsfähigkeit informationstechnischer Systeme
    in herausgehobenen Fällen
  absatz: '4'
  buchstabe: null
  offset: 48437
  laenge: 599
  saetze: 3
  beleg: (4) Das Bundesamt darf Informationen, von denen es im Rahmen dieser Vorschrift Kenntnis erlangt,
    nur mit Einwilligung des Ersuchenden weitergeben, es sei denn, die Informationen lassen keine Rückschlüsse
    auf die Identität des Ersuchenden zu oder die Informationen können entsprechend § 8 Absatz 6 und 7
    übermittelt werden. Zugang zu den in Verfahren nach Absatz 1 geführten Akten wird Dritten nicht gewährt.
    Hiervon sind erforderliche Informationsaustausche zwischen dem Bundesamt und dem Bundesamt für Bevölkerungsschutz
    und Katastrophenhilfe nach § 3 Absatz 7 des KRITIS-Dachgesetzes ausgenommen.
