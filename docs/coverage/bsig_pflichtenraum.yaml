  artikel: § 35
  artikel_titel: Unterrichtungspflichten
  absatz: '1'
  buchstabe: null
  offset: 97768
  laenge: 550
  saetze: 3
  beleg: (1) Im Fall eines erheblichen Sicherheitsvorfalls kann das Bundesamt besonders wichtigen Einrichtungen
    und wichtigen Einrichtungen anordnen, die Empfänger ihrer Dienste unverzüglich über diesen erheblichen
    Sicherheitsvorfall zu unterrichten, der die Erbringung des jeweiligen Dienstes beeinträchtigen könnte.
    Das Bundesamt setzt die für die Einrichtung zuständige Aufsichtsbehörde des Bundes über Anweisungen
    nach Satz 1 in Kenntnis. Die Unterrichtung nach Satz 1 kann auch durch eine Veröffentlichung auf der
    Internetseite der Einrichtung erfolgen.
