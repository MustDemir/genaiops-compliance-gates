- uid: § 61 Abs. 3@162216
  id: § 61 Abs. 3
  artikel: § 61
  artikel_titel: Aufsichts- und Durchsetzungsmaßnahmen für besonders wichtige Einrichtungen
  absatz: '3'
  buchstabe: null
  offset: 162216
  laenge: 1293
  saetze: 5
  beleg: (3) Das Bundesamt kann auch gegenüber anderen besonders wichtigen Einrichtungen frühestens drei
    Jahre nach Inkrafttreten dieses Gesetzes die Vorlage von Nachweisen über die Erfüllung einzelner oder
    aller der in Absatz 1 genannten Verpflichtungen anordnen. Soweit das Bundesamt von seinem Recht nach
    Absatz 1 Gebrauch gemacht hat, kann es hierbei auch die Übermittlung der Ergebnisse der durchgeführten
    Audits, Prüfungen oder Zertifizierungen einschließlich der dabei aufgedeckten Sicherheitsmängel sowie
    die Vorlage der Dokumentation, die der Überprüfung zugrunde gelegt wurde, verlangen. Es kann bei Sicherheitsmängeln
    die Vorlage eines geeigneten Mängelbeseitigungsplans im Einvernehmen mit der zuständigen Aufsichtsbehörde
    des Bundes oder der sonst zuständigen Aufsichtsbehörde verlangen. Das Bundesamt kann die Vorlage eines
    geeigneten Nachweises über die erfolgte Mängelbeseitigung verlangen. Abweichend von Satz 1 kann das
    Bundesamt gegenüber zugelassenen Krankenhäusern nach § 108 des Fünften Buches Sozialgesetzbuch frühestens
    fünf Jahre nach Inkrafttreten dieses Gesetzes die Vorlage von Nachweisen über die Erfüllung einzelner
    oder aller der in Absatz 1 genannten Verpflichtungen anordnen, soweit nicht durch Rechtsverordnung
    nach § 56 Absatz 6 ein früherer Zeitpunkt bestimmt wird.
