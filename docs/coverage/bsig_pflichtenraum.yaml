  offset: 30245
  laenge: 747
  saetze: 4
  beleg: (7) Die Befugnisse nach den Absätzen 1 bis 3 gelten im Geschäftsbereich des Bundesministeriums
    der Verteidigung nicht für die Kontrolle der Informations- und Kommunikationstechnik, die von den
    Streitkräften für ihre Zwecke oder dem Militärischen Abschirmdienst genutzt wird. Nicht ausgenommen
    ist die Informations- und Kommunikationstechnik von Dritten, insbesondere von IT-Dienstleistern, soweit
    sie nicht ausschließlich für die Zwecke der Streitkräfte betrieben wird. Die Bestimmungen für die
    Schnittstellen der Kommunikationstechnik des Bundes bleiben von den Sätzen 1 und 2 unberührt. Näheres
    regelt eine Verwaltungsvereinbarung zwischen dem Bundesministerium für Digitales und Staatsmodernisierung
    und dem Bundesministerium der Verteidigung.
