- uid: § 55 Abs. 6@148172
  id: § 55 Abs. 6
  artikel: § 55
  artikel_titel: Freiwilliges IT-Sicherheitskennzeichen
  absatz: '6'
  buchstabe: null
  offset: 148172
  laenge: 742
  saetze: 5
  beleg: (6) Hat das Bundesamt die Freigabe erteilt, ist das Etikett des IT-Sicherheitskennzeichens auf
    dem jeweiligen Produkt oder auf dessen Umverpackung anzubringen, sofern dies nach der Beschaffenheit
    des Produktes möglich ist. Das IT-Sicherheitskennzeichen kann auch elektronisch veröffentlicht werden.
    Wenn nach der Beschaffenheit des Produktes das Anbringen nicht möglich ist, muss die Veröffentlichung
    des IT-Sicherheitskennzeichens elektronisch erfolgen. Das Etikett des IT-Sicherheitskennzeichens verweist
    auf eine Internetseite des Bundesamtes, auf der die Herstellererklärung und die Sicherheitsinformationen
    abrufbar sind. Das genaue Verfahren und die Gestaltung des Verweises sind in der Rechtsverordnung
    nach § 56 Absatz 2 festzulegen.
