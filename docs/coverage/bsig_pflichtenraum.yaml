  saetze: 3
  beleg: (8) Das Bundesamt kann prüfen, ob die Anforderungen an die Freigabe des IT-Sicherheitskennzeichens
    für ein Produkt eingehalten werden. Werden bei der Prüfung Abweichungen von der abgegebenen Herstellererklärung
    oder Schwachstellen festgestellt, kann das Bundesamt die geeigneten Maßnahmen zum Schutz des Vertrauens
    der Verbraucher in das IT-Sicherheitskennzeichen treffen, insbesondere 1. Informationen über die Abweichungen
    oder Schwachstellen in geeigneter Weise in der Sicherheitsinformation veröffentlichen oder 2. die
