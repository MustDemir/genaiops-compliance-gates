  buchstabe: null
  offset: 166407
  laenge: 840
  saetze: 3
  beleg: (9) Sofern besonders wichtige Einrichtungen den Anordnungen des Bundesamtes nach diesem Gesetz
    trotz Fristsetzung nicht nachkommen, kann das Bundesamt dies der jeweils zuständigen Aufsichtsbehörde
    mitteilen. Die zuständige Aufsichtsbehörde kann, wenn ein Zusammenhang zwischen Durchsetzungsmaßnahme
    und Anordnung besteht, als letztes Mittel 1. die dieser Einrichtung erteilte Genehmigung nach dem
    jeweiligen Fachrecht vorübergehend ganz oder teilweise aussetzen und 2. unzuverlässigen Geschäftsleitungen
    die Ausübung der Tätigkeit, zu der sie berufen sind (§ 2 Nummer 13), vorübergehend untersagen. Die
    Aussetzung nach Satz 2 Nummer 1 und die Untersagung nach Satz 2 Nummer 2 sind nur solange zulässig,
    bis die besonders wichtige Einrichtung den Anordnungen des Bundesamtes nachkommt, wegen deren Nichtbefolgung
    sie ausgesprochen wurden.
