    Weltraum betreffende Einrichtungen, die der Kontrolle des Startes, Fluges oder der eventuellen Landung
    von Weltraumgegenständen dienen; 4. „Cloud-Computing-Dienst“ ein digitaler Dienst, der auf Abruf die
    Verwaltung eines skalierbaren und elastischen Pools gemeinsam nutzbarer Rechenressourcen sowie den
    umfassenden Fernzugang zu diesem Pool ermöglicht, auch wenn die Rechenressourcen auf mehrere Standorte
    verteilt sind; 5. „Content Delivery Network“ oder „CDN“ eine Gruppe geographisch verteilter, zusammengeschalteter
    Server, mitsamt der hierfür erforderlichen Infrastruktur, die mit dem Internet verbunden sind, und
    der Bereitstellung digitaler Inhalte und Dienste für Internetnutzer im Auftrag von Inhalte- und Diensteanbietern
    dienen, mit dem Ziel der Gewährleistung einer hohen Verfügbarkeit, Zugänglichkeit oder Zustellung
    mit möglichst niedriger Latenz; 6. „Cyberbedrohung“ eine Cyberbedrohung nach Artikel 2 Nummer 8 der
