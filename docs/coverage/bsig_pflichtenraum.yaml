    bestellen jeweils eine Informationssicherheitsbeauftragte oder einen Informationssicherheitsbeauftragten
    des Ressorts, der oder dem unter Berücksichtigung der Belange des IT-Betriebs die Steuerung und Überwachung
    des Informationssicherheitsmanagements innerhalb des Ressorts beziehungsweise innerhalb der obersten
    Bundesbehörde und ihres Geschäftsbereichs obliegt, und bestimmen mindestens eine zur Vertretung berechtigte
    Person. Der oder die Informationssicherheitsbeauftragte des Ressorts wirkt auf die Umsetzung der Informationssicherheit
    in seinem oder ihrem Ressort hin.
