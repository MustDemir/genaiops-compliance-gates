- uid: § 8 Abs. 1@31653
  id: § 8 Abs. 1
  artikel: § 8
  artikel_titel: Abwehr von Schadprogrammen und Gefahren für die Kommunikationstechnik des Bundes
  absatz: '1'
  buchstabe: null
  offset: 31653
  laenge: 1415
  saetze: 5
  beleg: (1) Das Bundesamt darf zur Abwehr von Gefahren für die Kommunikationstechnik des Bundes 1. Protokolldaten,
    die beim Betrieb von Kommunikationstechnik des Bundes anfallen, erheben und automatisiert auswerten,
    soweit dies zum Erkennen, Eingrenzen oder Beseitigen von Störungen oder Fehlern bei der Kommunikationstechnik
    des Bundes oder von Angriffen auf die Informationstechnik des Bundes erforderlich ist, 2. die an den
    Schnittstellen der Kommunikationstechnik des Bundes anfallenden Daten automatisiert auswerten, soweit
    dies für die Erkennung und Abwehr von Schadprogrammen und sonstigen erheblichen Gefahren für die Kommunikationstechnik
    des Bundes erforderlich ist. Sofern nicht die nachfolgenden Absätze eine weitere Verwendung gestatten,
    müssen die automatisierte Auswertung dieser Daten und deren anschließende vollständige und nicht wiederherstellbare
    Löschung unverzüglich erfolgen. Die Verwendungsbeschränkungen gelten nicht für Protokolldaten, sofern
    diese weder personenbezogene noch dem Fernmeldegeheimnis unterliegende Daten beinhalten. Die Einrichtungen
    der Bundesverwaltung sind verpflichtet, das Bundesamt bei Maßnahmen nach Satz 1 zu unterstützen und
    hierbei den Zugang des Bundesamtes zu einrichtungsinternen Protokolldaten nach Satz 1 Nummer 1 sowie
    zu Schnittstellendaten nach Satz 1 Nummer 2 sicherzustellen. Protokolldaten der Bundesgerichte dürfen
    nur in deren Einvernehmen erhoben werden.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
  verifikation: null
