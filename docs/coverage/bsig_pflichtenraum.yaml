- uid: § 8 Abs. 6@38253
  id: § 8 Abs. 6
  artikel: § 8
  artikel_titel: Abwehr von Schadprogrammen und Gefahren für die Kommunikationstechnik des Bundes
  absatz: '6'
  buchstabe: null
  offset: 38253
  laenge: 1311
  saetze: 2
  beleg: (6) Das Bundesamt kann die nach Absatz 4 verwendeten personenbezogenen Daten an die Strafverfolgungsbehörden
    zur Verfolgung einer mittels eines Schadprogramms oder im Rahmen einer sonstigen erheblichen Gefahr
    für die Kommunikationstechnik des Bundes begangenen Straftat nach den §§ 202a, 202b, 303a oder 303b
    des Strafgesetzbuches übermitteln. Es kann diese Daten ferner übermitteln 1. an die Polizeien des
    Bundes und der Länder zur Abwehr einer Gefahr für die öffentliche Sicherheit, die unmittelbar von
    einem Schadprogramm ausgeht, 2. an das Bundesamt für Verfassungsschutz zur Unterrichtung über Tatsachen,
    die sicherheitsgefährdende oder geheimdienstliche Tätigkeiten für eine fremde Macht erkennen lassen,
    sowie an den Militärischen Abschirmdienst, wenn sich diese Tätigkeiten gegen Personen, Dienststellen
    oder Einrichtungen im Geschäftsbereich des Bundesministeriums der Verteidigung richten, 3. an den
    Bundesnachrichtendienst zur Unterrichtung über Tatsachen, die einen internationalen kriminellen, terroristischen
    oder staatlichen Angriff mittels Schadprogrammen oder vergleichbarer schädlich wirkender informationstechnischer
    Mittel auf die Vertraulichkeit, Integrität oder Verfügbarkeit von IT-Systemen in Fällen von erheblicher
    Bedeutung mit Bezug zur Bundesrepublik Deutschland erkennen lassen.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
