  artikel_titel: Ausnahmebescheid
  absatz: '2'
  buchstabe: null
  offset: 101065
  laenge: 661
  saetze: 2
  beleg: (2) Einrichtungen, die 1. in den Bereichen nationale Sicherheit, öffentliche Sicherheit, Verteidigung
    oder Strafverfolgung, einschließlich der Verhütung, Ermittlung, Aufdeckung und Verfolgung von Straftaten,
    (relevante Bereiche) tätig sind oder Dienste erbringen oder 2. ausschließlich für Behörden, die Aufgaben
    in relevanten Bereichen erfüllen, tätig sind oder Dienste erbringen, können für diese Tätigkeiten
    oder Dienste von den Risikomanagementmaßnahmen nach § 30 und den Meldepflichten nach § 32 befreit
    werden. Die Sicherheit in der Informationstechnik dieser Einrichtungen muss in diesen Fällen anderweitig
    gewährleistet sein und beaufsichtigt werden.
