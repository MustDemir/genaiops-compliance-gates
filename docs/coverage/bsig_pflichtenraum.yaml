  saetze: 1
  beleg: c) des Bundesnachrichtendienstes bei der Wahrnehmung seiner gesetzlichen Aufgaben; die Unterstützung
    darf nur gewährt werden, soweit sie erforderlich ist, um Tätigkeiten zu verhindern oder zu erforschen,
    die gegen die Sicherheit in der Informationstechnik gerichtet sind oder unter Nutzung der Informationstechnik
    erfolgen; die Unterstützungsersuchen sind durch das Bundesamt aktenkundig zu machen; 19. die zuständigen
    Stellen der Länder in Fragen der Abwehr von Gefahren für die Sicherheit in der Informationstechnik
    auf deren Ersuchen unterstützen; 20. Einrichtungen der Bundesverwaltung, die Länder sowie Hersteller,
    Vertreiber und Anwender in Fragen der Sicherheit in der Informationstechnik, insbesondere unter Berücksichtigung
    der möglichen Folgen fehlender oder unzureichender Sicherheitsvorkehrungen, beraten, informieren und
    warnen; 21. Verbraucherschutz und Verbraucherinformation im Bereich der Sicherheit in der Informationstechnik,
    insbesondere Beratung und Warnung von Verbrauchern in Fragen der Sicherheit in der Informationstechnik
    unter Berücksichtigung der möglichen Folgen fehlender oder unzureichender Sicherheitsvorkehrungen;
    22. geeignete Kommunikationsstrukturen zur Krisenfrüherkennung, Krisenreaktion und Krisenbewältigung
    aufbauen sowie Zusammenarbeit zum Schutz der Sicherheit in der Informationstechnik kritischer Anlagen
    im Verbund mit der Privatwirtschaft koordinieren; 23. Aufgaben als zentrale Stelle im Bereich der
    Sicherheit in der Informationstechnik im Hinblick auf die Zusammenarbeit mit den zuständigen Stellen
    im Ausland, unbeschadet besonderer Zuständigkeiten anderer Stellen; 24. Aufgaben nach § 40 als zentrale
    Stelle für die Sicherheit in der Informationstechnik besonders wichtiger Einrichtungen und wichtiger
    Einrichtungen einschließlich des Ersuchens und Erbringens von Amtshilfe nach Artikel 37 der NIS-2-Richtinie;
    25. bei der Wiederherstellung der Sicherheit oder Funktionsfähigkeit informationstechnischer Systeme
    in herausgehobenen Fällen nach § 11 unterstützen; 26. Empfehlungen für Identifizierungs- und Authentisierungsverfahren
    und Bewertung dieser Verfahren im Hinblick auf die Informationssicherheit erarbeiten; 27. einen Stand
    der Technik von sicherheitstechnischen Anforderungen an IT-Produkte, unter Berücksichtigung bestehender
    Normen und Standards sowie unter Einbeziehung der betroffenen Wirtschaftsverbände, beschreiben und
    veröffentlichen; 28. mit nationalen Computer-Notfallteams von Drittländern oder gleichwertigen Stellen
    von Drittländern kooperieren sowie diese Teams oder Stellen unterstützen; Einsätze des Bundesamtes
    in Drittländern dürfen nicht gegen den Willen des Staates erfolgen, auf dessen Hoheitsgebiet die Maßnahme
    stattfinden soll; die Entscheidung über einen Einsatz des Bundesamtes in Drittländern trifft das Bundesministerium
    des Innern im Einvernehmen mit dem Auswärtigen Amt; 29. mit der Bundesanstalt für Finanzdienstleistungsaufsicht
    kooperieren und Informationen austauschen, soweit dies für ihre Aufgabenerfüllung erforderlich ist,
    insbesondere in Bezug auf die ergriffenen Maßnahmen gemäß der Verordnung (EU) 2022/2554; die Bundesanstalt
    für Finanzdienstleistungsaufsicht übermittelt an das Bundesamt die für dessen Aufgabenerfüllung erforderlichen
    Informationen.
