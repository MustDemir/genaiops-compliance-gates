  artikel_titel: Zertifizierung
  absatz: '2'
  buchstabe: null
  offset: 139223
  laenge: 1046
  saetze: 4
  beleg: (2) Für bestimmte Produkte oder Leistungen kann beim Bundesamt eine Sicherheits- oder Personenzertifizierung
    oder eine Zertifizierung als IT-Sicherheitsdienstleister beantragt werden. Die Anträge werden in der
    zeitlichen Reihenfolge ihres Eingangs bearbeitet; hiervon kann abgewichen werden, wenn das Bundesamt
    wegen der Anzahl und des Umfangs anhängiger Prüfungsverfahren eine Prüfung in angemessener Zeit nicht
    durchführen kann und an der Erteilung eines Zertifikats ein öffentliches Interesse besteht. Der Antragsteller
    hat dem Bundesamt diejenigen Unterlagen vorzulegen und die Auskünfte zu erteilen, deren Kenntnis für
    die Prüfung und Bewertung der Produkte und Leistungen oder der Eignung der Person sowie für die Erteilung
    des Zertifikats erforderlich ist. Ein Zertifikat nach Satz 1 darf nur dann für ein Produkt, eine Leistung,
    eine Person oder einen IT-Sicherheitsdienstleister verwendet werden, wenn das Bundesamt ein entsprechendes
    Zertifikat erteilt hat und dieses nicht aufgehoben wurde oder auf andere Weise ungültig geworden ist.
