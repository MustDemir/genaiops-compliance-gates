    Anlaufstellen der anderen betroffenen Mitgliedstaaten der Europäischen Union weiterzuleiten, 3. wenn
    ein erheblicher Sicherheitsvorfall zwei oder mehr Mitgliedstaaten der Europäischen Union betrifft,
    die anderen betroffenen Mitgliedstaaten und die Agentur der Europäischen Union für Cybersicherheit
    über den erheblichen Sicherheitsvorfall zu unterrichten, wobei die Art der gemäß § 32 Absatz 2 erhaltenen
    Informationen mitzuteilen und das wirtschaftliche Interesse der Einrichtung sowie die Vertraulichkeit
    der bereitgestellten Informationen zu wahren ist.
