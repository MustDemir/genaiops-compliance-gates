  artikel: § 13
  artikel_titel: Warnungen
  absatz: '3'
  buchstabe: null
  offset: 56130
  laenge: 1098
  saetze: 4
  beleg: (3) Zur Erfüllung seiner Aufgaben nach § 3 Absatz 1 Satz 2 Nummer 20 und 21 kann das Bundesamt
    die Öffentlichkeit unter Nennung der Bezeichnung und des Herstellers des betroffenen Produkts und
    Dienstes 1. vor Schwachstellen in informationstechnischen Produkten und Diensten und vor Schadprogrammen
    warnen, wenn hinreichende Anhaltspunkte dafür vorliegen, dass Gefahren für die Sicherheit in der Informationstechnik
    hiervon ausgehen, oder 2. Sicherheitsmaßnahmen sowie den Einsatz bestimmter informationstechnischer
    Produkte und Dienste empfehlen. Stellen sich die an die Öffentlichkeit gegebenen Informationen im
    Nachhinein als falsch heraus oder stellen sich die zugrunde liegenden Umstände als unzutreffend wiedergegeben
    heraus, ist dies unverzüglich öffentlich bekannt zu machen. Warnungen nach Satz 1 sind sechs Monate
    nach der Veröffentlichung zu entfernen, wenn nicht weiterhin hinreichende Anhaltspunkte dafür vorliegen,
    dass Gefahren für die Sicherheit in der Informationstechnik bestehen. Wird eine Warnung nach Satz
    3 nicht entfernt, so ist diese Entscheidung regelmäßig zu überprüfen.
