- uid: § 11 Abs. 3@47625
  id: § 11 Abs. 3
  artikel: § 11
  artikel_titel: Wiederherstellung der Sicherheit oder Funktionsfähigkeit informationstechnischer Systeme
    in herausgehobenen Fällen
  absatz: '3'
  buchstabe: null
  offset: 47625
  laenge: 812
  saetze: 5
  beleg: (3) Das Bundesamt darf bei Maßnahmen nach Absatz 1 personenbezogene oder dem Fernmeldegeheimnis
    unterliegende Daten verarbeiten, soweit dies zur Wiederherstellung der Sicherheit oder Funktionsfähigkeit
    des betroffenen informationstechnischen Systems erforderlich und angemessen ist. Die Daten sind unverzüglich
    zu löschen, sobald sie für die Wiederherstellung der Sicherheit oder Funktionsfähigkeit des informationstechnischen
    Systems nicht mehr benötigt werden. Wenn die Daten in Fällen des Absatzes 4 an eine andere Behörde
    zur Erfüllung von deren gesetzlichen Aufgaben weitergegeben worden sind, darf das Bundesamt die Daten
    abweichend von Satz 2 bis zur Beendigung der Unterstützung dieser Behörden weiterverarbeiten. Eine
    Nutzung zu anderen Zwecken ist unzulässig. § 8 Absatz 8 ist entsprechend anzuwenden.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
  verifikation: null
  hypothese_grund: null
