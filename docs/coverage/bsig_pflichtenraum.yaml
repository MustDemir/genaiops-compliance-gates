  id: § 55 Abs. 2
  artikel: § 55
  artikel_titel: Freiwilliges IT-Sicherheitskennzeichen
  absatz: '2'
  buchstabe: null
  offset: 145147
  laenge: 345
  saetze: 1
  beleg: (2) Das IT-Sicherheitskennzeichen besteht aus 1. einer Zusicherung des Herstellers oder Diensteanbieters,
    dass das Produkt für eine festgelegte Dauer bestimmte IT-Sicherheitsanforderungen erfüllt (Herstellererklärung),
    und 2. einer Information des Bundesamtes über sicherheitsrelevante IT-Eigenschaften des Produktes
    (Sicherheitsinformation).
  adressat: null
  pflicht: null
  scope: null
