  laenge: 867
  saetze: 4
  beleg: (2) Die Hersteller betroffener Produkte sind rechtzeitig vor Veröffentlichung der Warnungen zu
    informieren. Diese Informationspflicht besteht nicht, 1. wenn hierdurch die Erreichung des mit der
    Maßnahme verfolgten Zwecks gefährdet würde oder 2. wenn berechtigterweise davon ausgegangen werden
    kann, dass der Hersteller an einer vorherigen Benachrichtigung kein Interesse hat. Soweit entdeckte
    Schwachstellen oder Schadprogramme nicht allgemein bekannt werden sollen, um eine Weiterverbreitung
    oder rechtswidrige Ausnutzung zu verhindern oder weil das Bundesamt gegenüber Dritten zur Vertraulichkeit
    verpflichtet ist, kann es den Kreis der zu warnenden Personen einschränken. Kriterien für die Auswahl
    des zu warnenden Personenkreises nach Satz 3 sind insbesondere die besondere Gefährdung bestimmter
    Einrichtungen oder die besondere Zuverlässigkeit des Empfängers.
