  buchstabe: null
  offset: 137500
  laenge: 892
  saetze: 1
  beleg: (2) Die Technische Richtlinie nach Absatz 1 kann insbesondere Vorgaben enthalten über 1. den
    Inhalt und das Format der Konformitätserklärung, 2. Nachweise und Verfahren, die die Angaben der Konformitätserklärung
    belegen, 3. die Bedingungen für die Aufrechterhaltung, Fortführung und Verlängerung der Konformitätserklärung,
    4. die Verwendung eines vom Bundesamt bereitgestellten Kennzeichens und Siegels sowie die Bedingungen
    für deren Verwendung, 5. die Meldung und Behandlung erkannter Schwachstellen des IKT-Produktes, IKT-Dienstes
    oder IKT-Prozesses oder der IT-Sicherheitsdienstleistung, 6. die Bereitstellung von Informationen
    auf der Internetseite des Bundesamtes über die Konformitätserklärung, dessen Aussteller und das IKT-Produkt,
    den -Dienst, den -Prozess, die Person oder die IT-Sicherheitsdienstleistung oder 7. die Befristung
    der Geltungsdauer der Konformitätserklärung.
