- uid: § 49 Abs. 2@130511
  id: § 49 Abs. 2
  artikel: § 49
  artikel_titel: Pflicht zum Führen einer Datenbank
  absatz: '2'
  buchstabe: null
  offset: 130511
  laenge: 560
  saetze: 2
  beleg: '(2) Die Datenbank hat die erforderlichen Angaben zu enthalten, anhand derer die Inhaber der
    Domain-Namen und die Kontaktstellen, die die Domain-Namen im Rahmen der TLD verwalten, identifiziert
    und kontaktiert werden können. Diese Angaben müssen Folgendes umfassen: 1. den Domain-Namen; 2. das
    Datum der Registrierung; 3. den Namen des Domain-Inhabers, seine E-Mail-Adresse und Telefonnummer;
    4. die Kontakt-E-Mail-Adresse und die Telefonnummer der Anlaufstelle, die den Domain-Namen verwaltet,
    falls diese sich von denen des Domain-Inhabers unterscheiden.'
  adressat: null
  pflicht: null
  scope: null
