  absatz: '6'
  buchstabe: null
  offset: 143020
  laenge: 1190
  saetze: 2
  beleg: (6) Das Bundesamt kann von ihm ausgestellte Cybersicherheitszertifikate oder durch eine Konformitätsbewertungsstelle,
    der eine Befugnis nach Absatz 2 erteilt wurde, nach Artikel 56 Absatz 6 der Verordnung (EU) 2019/881
    ausgestellte Cybersicherheitszertifikate widerrufen oder EU-Konformitätserklärungen im Sinne der Verordnung
    (EU) 2019/881 für ungültig erklären, 1. sofern diese Zertifikate oder EU-Konformitätserklärungen die
    Anforderungen nach der Verordnung (EU) 2019/881 oder eines europäischen Schemas für die Cybersicherheitszertifizierung
    nach Artikel 54 der Verordnung (EU) 2019/881 nicht erfüllen oder 2. wenn das Bundesamt die Erfüllung
    nach Nummer 1 nicht feststellen kann, weil der Inhaber des europäischen Cybersicherheitszertifikats
    oder der Aussteller der EU-Konformitätserklärung seinen Mitwirkungspflichten nach Absatz 3 nicht nachgekommen
    ist oder weil er das Bundesamt bei der Wahrnehmung seiner Befugnisse nach Absatz 4 oder im Falle eines
    Inhabers eines europäischen Cybersicherheitszertifikats auch nach Absatz 5 behindert hat. Widerrufene
    Cybersicherheitszertifikate oder für ungültig erklärte EU-Konformitätserklärungen nach Satz 1 dürfen
    nicht verwendet werden.
