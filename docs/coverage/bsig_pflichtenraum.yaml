  offset: 161204
  laenge: 859
  saetze: 2
  beleg: (6) Das Bundesministerium des Innern kann durch Rechtsverordnungen, die nicht der Zustimmung
    des Bundesrates bedürfen, für jeweils einen der in § 2 Nummer 24 aufgeführten Sektoren im Einvernehmen
    mit dem in § 41 Absatz 1 für den jeweiligen Sektor genannten Bundesministerium kritische Komponenten
    im Sinne des § 2 Nummer 23 bestimmen. In der Rechtsverordnung kann eine Komponente als kritische Komponente
    bestimmt werden, wenn 1. es sich bei der Komponente um ein IKT-Produkt handelt, 2. die Komponente
    in kritischen Anlagen eingesetzt wird, 3. die Komponente eine kritische Funktion realisiert und 4.
    eine Störung der Verfügbarkeit, Integrität, Authentizität oder Vertraulichkeit der Komponente zu einer
    Beeinträchtigung der Funktionsfähigkeit kritischer Anlagen oder zu anderen Beeinträchtigungen der
    öffentlichen Ordnung oder Sicherheit führen könnte.
