- uid: § 11 Abs. 1@46425
  id: § 11 Abs. 1
  artikel: § 11
  artikel_titel: Wiederherstellung der Sicherheit oder Funktionsfähigkeit informationstechnischer Systeme
    in herausgehobenen Fällen
  absatz: '1'
  buchstabe: null
  offset: 46425
  laenge: 885
  saetze: 3
  beleg: (1) Handelt es sich bei einer Beeinträchtigung der Sicherheit oder Funktionsfähigkeit eines informationstechnischen
    Systems einer Einrichtung der Bundesverwaltung oder einer besonders wichtigen Einrichtung oder einer
    wichtigen Einrichtung um einen herausgehobenen Fall, so kann das Bundesamt auf Ersuchen der betroffenen
    Einrichtung oder des betroffenen Betreibers oder einer anderen für die Einrichtung oder den Betreiber
    zuständigen Behörde die Maßnahmen treffen, die zur Wiederherstellung der Sicherheit oder Funktionsfähigkeit
    des betroffenen informationstechnischen Systems erforderlich sind. Soweit das Bundesamt erste Maßnahmen
    zur Schadensbegrenzung und Sicherstellung des Notbetriebes vor Ort ergreift, werden hierfür keine
    Gebühren oder Auslagen für die Tätigkeit des Bundesamtes erhoben. Hiervon unberührt bleiben etwaige
    Kosten für die Hinzuziehung qualifizierter Dritter.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
  verifikation: null
  hypothese_grund: null
  omnibus: null
  requirement: *id001
  gate: *id002
  befund: null
  befund_grund: null
