  beleg: (5) Die §§ 30, 31, 32, 35, 36, 38, 39, 61 und 62 gelten nicht für besonders wichtige Einrichtungen
    und wichtige Einrichtungen, die 1. ein öffentliches Telekommunikationsnetz betreiben oder öffentlich
    zugängliche Telekommunikationsdienste erbringen oder 2. Energieversorgungsnetze, Energieanlagen oder
    digitale Energiedienste nach dem Energiewirtschaftsgesetz betreiben und den Regelungen der §§ 5c bis
    5e des Energiewirtschaftsgesetzes unterliegen. Satz 1 gilt nicht für die dort aufgeführten besonders
    wichtigen und wichtigen Einrichtungen, soweit sie über die in Satz 1 Nummer 1 und 2 genannten Anlagen
    hinaus weitere kritische Anlagen nach § 2 Nummer 22 betreiben oder aufgrund weiterer Tätigkeiten einer
    der in Anlage 1 oder 2 bestimmten Einrichtungsarten zuzuordnen sind. Satz 2 gilt für alle informationstechnischen
    Systeme, die für den Betrieb der weiteren kritischen Anlagen erforderlich sind. Im Fall, dass der
    Betrieb einer Energieanlage nach Satz 1 Nummer 2 einer in Satz 1 aufgeführten besonders wichtigen
    und wichtigen Einrichtung im Hinblick auf die gesamte Geschäftstätigkeit dieser Einrichtung eine Nebentätigkeit
    darstellt, findet dieser Absatz keine Anwendung.
