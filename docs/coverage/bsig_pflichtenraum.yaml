    Telekommunikationsgesetzes und Nutzungsdaten nach § 2 Absatz 2 Nummer 3 des Telekommunikation-Digitale-Dienste-Datenschutz-Gesetzes
    enthalten; 32. „Protokollierungsdaten“ Aufzeichnungen über technische Ereignisse oder Zustände innerhalb
    informationstechnischer Systeme; 33. „qualifizierter Vertrauensdienst“ ein qualifizierter Vertrauensdienst
    nach Artikel 3 Nummer 17 der Verordnung (EU) Nr. 910/2014 34. „qualifizierter Vertrauensdiensteanbieter“
    ein qualifizierter Vertrauensdiensteanbieter nach Artikel 3 Nummer 20 der Verordnung (EU) Nr. 910/2014;
    35. „Rechenzentrumsdienst“ ein Dienst, der Strukturen umfasst, die dem vorrangigen Zweck der zentralen
    Unterbringung, der Zusammenschaltung und dem Betrieb von IT- oder Netzwerkausrüstungen dienen, und
    die Datenverarbeitungsdienste erbringen, mitsamt allen benötigten Anlagen und Infrastrukturen, insbesondere
    für die Stromverteilung und die Umgebungskontrolle; 36. „Schadprogramme“ Programme und sonstige informationstechnische
    Routinen und Verfahren, die dazu dienen, unbefugt Daten zu nutzen oder zu löschen oder unbefugt auf
    sonstige informationstechnische Abläufe einzuwirken; 37. „Schnittstellen der Kommunikationstechnik
    des Bundes“ sicherheitsrelevante Netzwerkübergänge innerhalb der Kommunikationstechnik des Bundes
    sowie zwischen dieser und der Informationstechnik der einzelnen Einrichtungen der Bundesverwaltung,
    der Informationstechnik von Gruppen von Einrichtungen der Bundesverwaltung oder der Informationstechnik
    Dritter; nicht als „Schnittstellen der Kommunikationstechnik des Bundes“ gelten die Komponenten an
    den Netzwerkübergängen, die in eigener Zuständigkeit der in Nummer 21 genannten Gerichte und Verfassungsorgane
    betrieben werden; 38. „Schwachstelle“ eine Eigenschaft von IKT-Produkten oder IKT-Diensten, die von
    Dritten ausgenutzt werden kann, um sich gegen den Willen des Berechtigten Zugang zu den IKT-Produkten
    oder IKT-Diensten zu verschaffen oder die Funktion der IKT-Produkte oder IKT-Dienste zu beeinflussen;
    39. „Sicherheit in der Informationstechnik“ die Einhaltung bestimmter Sicherheitsstandards, die die
    Verfügbarkeit, Integrität oder Vertraulichkeit von Informationen betreffen, durch Sicherheitsvorkehrungen
    a) in informationstechnischen Systemen, Komponenten oder Prozessen oder
