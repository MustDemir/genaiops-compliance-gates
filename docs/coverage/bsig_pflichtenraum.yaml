- uid: § 60 Abs. 2@165988
  id: § 60 Abs. 2
  artikel: § 60
  artikel_titel: Zentrale Zuständigkeit in der Europäischen Union für bestimmte Einrichtungsarten
  absatz: '2'
  buchstabe: null
  offset: 165988
  laenge: 731
  saetze: 3
  beleg: (2) Als Hauptniederlassung in der Europäischen Union im Sinne von Absatz 1 gilt derjenige Mitgliedstaat
    der Europäischen Union, in dem die Entscheidungen der Einrichtung im Zusammenhang mit den Maßnahmen
    zum Cybersicherheitsrisikomanagement vorwiegend getroffen werden. Kann ein solcher Mitgliedstaat nicht
    bestimmt werden oder werden solche Entscheidungen nicht in der Europäischen Union getroffen, so gilt
    als Hauptniederlassung der Mitgliedstaat, in dem die Cybersicherheitsmaßnahmen durchgeführt werden.
    Kann ein solcher Mitgliedstaat nicht bestimmt werden, so gilt als Hauptniederlassung der Mitgliedstaat,
    in dem die betreffende Einrichtung die Niederlassung mit der höchsten Beschäftigtenzahl in der Europäischen
    Union hat.
