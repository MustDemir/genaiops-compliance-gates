    von kritischen Komponenten eines Herstellers im Benehmen mit dem Bundesministerium für Wirtschaft
    und Energie im Sektor Energie, dem Bundesministerium für Wirtschaft und Energie sowie dem Bundesministerium
    für Forschung, Technologie und Raumfahrt im Sektor Weltraum, dem Bundesministerium für Digitales und
    Staatsmodernisierung in den Sektoren Informationstechnik und Telekommunikation, dem Bundesministerium
