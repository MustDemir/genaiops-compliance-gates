  artikel_titel: Anordnungen von Maßnahmen des Bundesamtes gegenüber Anbietern von Telekommunikationsdiensten
  absatz: '1'
  buchstabe: null
  offset: 62925
  laenge: 1200
  saetze: 6
  beleg: (1) Zur Abwehr erheblicher Gefahren für die in Absatz 3 genannten Schutzgüter kann das Bundesamt
    anordnen, dass ein Anbieter von öffentlich zugänglichen Telekommunikationsdiensten im Sinne des Telekommunikationsgesetzes
    1. die in § 169 Absatz 6 und 7 des Telekommunikationsgesetzes bezeichneten Maßnahmen trifft oder 2.
    technische Befehle zur Bereinigung von einem konkret benannten Schadprogramm an betroffene informationstechnische
    Systeme verteilt, sofern und soweit der Anbieter von öffentlich zugänglichen Telekommunikationsdiensten
    dazu technisch in der Lage und es ihm wirtschaftlich zumutbar ist. Vor der Anordnung der Maßnahmen
    nach Satz 1 Nummer 1 oder 2 durch das Bundesamt ist die Bundesnetzagentur ins Benehmen zu setzen.
    Vor der Anordnung der Maßnahme nach Satz 1 Nummer 2 durch das Bundesamt ist zusätzlich Einvernehmen
    mit der oder dem Bundesbeauftragten für den Datenschutz und die Informationsfreiheit herzustellen.
    Die Daten, auf die mit der Maßnahme nach Satz 1 Nummer 2 zugegriffen werden soll, sind in der Anordnung
    zu benennen. § 8 Absatz 8 Satz 2 bis 8 gilt entsprechend. Widerspruch und Anfechtungsklage gegen die
    Anordnungen nach Satz 1 haben keine aufschiebende Wirkung.
