- uid: § 44 Abs. 1@118261
  id: § 44 Abs. 1
  artikel: § 44
  artikel_titel: Vorgaben des Bundesamtes
  absatz: '1'
  buchstabe: null
  offset: 118261
  laenge: 1110
  saetze: 7
  beleg: (1) Die Einrichtungen der Bundesverwaltung müssen Mindestanforderungen zum Schutz der in der
    Bundesverwaltung verarbeiteten Informationen erfüllen. Die Mindestanforderungen ergeben sich aus den
    BSI-Standards und dem Grundschutzkompendium (IT-Grundschutz) sowie aus den Mindeststandards für die
    Sicherheit in der Informationstechnik des Bundes (Mindeststandards) in den jeweils geltenden Fassungen.
    Die jeweils geltenden Fassungen werden auf der Internetseite des Bundesamtes veröffentlicht. Die Mindeststandards
    legt das Bundesamt im Benehmen mit den Ressorts und weiteren obersten Bundesbehörden fest. Der IT-Grundschutz
    und die Mindeststandards werden durch das Bundesamt regelmäßig evaluiert und entsprechend dem Stand
    der Technik sowie unter Berücksichtigung der Erfahrungen aus der Praxis und aus der Beratung und Unterstützung
    nach Absatz 3 fortentwickelt; dabei wird der Umsetzungsaufwand soweit möglich minimiert. Das Bundesamt
    wird den IT-Grundschutz bis zum 1. Januar 2026 modernisieren und fortentwickeln. Für die Verpflichtung
    nach Satz 1 gelten die Ausnahmen nach § 7 Absatz 6 und 7 entsprechend.
  adressat: null
