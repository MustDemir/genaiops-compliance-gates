- uid: § 30 Abs. 1@82603
  id: § 30 Abs. 1
  artikel: § 30
  artikel_titel: Risikomanagementmaßnahmen besonders wichtiger Einrichtungen und wichtiger Einrichtungen
  absatz: '1'
  buchstabe: null
  offset: 82603
  laenge: 879
  saetze: 3
  beleg: (1) Besonders wichtige Einrichtungen und wichtige Einrichtungen sind verpflichtet, geeignete,
    verhältnismäßige und wirksame technische und organisatorische Maßnahmen, die in Absatz 2 konkretisiert
    werden, zu ergreifen, um Störungen der Verfügbarkeit, Integrität und Vertraulichkeit der informationstechnischen
    Systeme, Komponenten und Prozesse, die sie für die Erbringung ihrer Dienste nutzen, zu vermeiden und
    Auswirkungen von Sicherheitsvorfällen möglichst gering zu halten. Bei der Bewertung der Verhältnismäßigkeit
    der Maßnahmen nach Satz 1 sind das Ausmaß der Risikoexposition, die Größe der Einrichtung, die Umsetzungskosten
    und die Eintrittswahrscheinlichkeit und Schwere von Sicherheitsvorfällen sowie ihre gesellschaftlichen
    und wirtschaftlichen Auswirkungen zu berücksichtigen. Die Einhaltung der Verpflichtung nach Satz 1
    ist durch die Einrichtungen zu dokumentieren.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
  verifikation: null
  hypothese_grund: null
  omnibus: null
  requirement: *id001
  gate: *id002
  befund: null
  befund_grund: null
- uid: § 30 Abs. 2@83482
  id: § 30 Abs. 2
  artikel: § 30
  artikel_titel: Risikomanagementmaßnahmen besonders wichtiger Einrichtungen und wichtiger Einrichtungen
  absatz: '2'
  buchstabe: null
  offset: 83482
  laenge: 1565
  saetze: 2
  beleg: '(2) Maßnahmen nach Absatz 1 sollen den Stand der Technik einhalten, die einschlägigen europäischen
    und internationalen Normen berücksichtigen und müssen auf einem gefahrenübergreifenden Ansatz beruhen.
    Die Maßnahmen müssen zumindest Folgendes umfassen: 1. Konzepte in Bezug auf die Risikoanalyse und
    auf die Sicherheit in der Informationstechnik, 2. Bewältigung von Sicherheitsvorfällen, 3. Aufrechterhaltung
    des Betriebs, wie Backup-Management und Wiederherstellung nach einem Notfall, und Krisenmanagement,
    4. Sicherheit der Lieferkette einschließlich sicherheitsbezogener Aspekte der Beziehungen zu unmittelbaren
    Anbietern oder Diensteanbietern, 5. Sicherheitsmaßnahmen bei Erwerb, Entwicklung und Wartung von informationstechnischen
    Systemen, Komponenten und Prozessen, einschließlich Management und Offenlegung von Schwachstellen,
    6. Konzepte und Verfahren zur Bewertung der Wirksamkeit von Risikomanagementmaßnahmen im Bereich der
    Sicherheit in der Informationstechnik, 7. grundlegende Schulungen und Sensibilisierungsmaßnahmen im
    Bereich der Sicherheit in der Informationstechnik, 8. Konzepte und Prozesse für den Einsatz von kryptographischen
    Verfahren, 9. Erstellung von Konzepten für die Sicherheit des Personals, die Zugriffskontrolle und
    für die Verwaltung von IKT-Systemen, -Produkten und -Prozessen, 10. Verwendung von Lösungen zur Multi-Faktor-Authentifizierung
    oder kontinuierlichen Authentifizierung, gesicherte Sprach-, Video- und Textkommunikation sowie gegebenenfalls
    gesicherte Notfallkommunikationssysteme innerhalb der Einrichtung.'
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
  verifikation: null
  hypothese_grund: null
  omnibus: null
  requirement: *id001
