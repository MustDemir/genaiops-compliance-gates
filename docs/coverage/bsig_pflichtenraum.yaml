- uid: § 8 Abs. 4@35831
  id: § 8 Abs. 4
  artikel: § 8
  artikel_titel: Abwehr von Schadprogrammen und Gefahren für die Kommunikationstechnik des Bundes
  absatz: '4'
  buchstabe: null
  offset: 35831
  laenge: 1761
  saetze: 7
  beleg: (4) Eine über die Absätze 1 und 2 hinausgehende Verwendung personenbezogener Daten ist nur zulässig,
    wenn bestimmte Tatsachen den Verdacht begründen, dass 1. diese Daten ein Schadprogramm enthalten,
    2. diese Daten durch ein Schadprogramm übermittelt wurden, 3. diese Daten im Zusammenhang mit einer
    sonstigen erheblichen Gefahr für die Kommunikationstechnik des Bundes stehen oder 4. sich aus diesen
    Daten Hinweise auf ein Schadprogramm oder eine sonstige erhebliche Gefahr für die Kommunikationstechnik
    des Bundes ergeben können, und soweit die Datenverarbeitung erforderlich ist, um den Verdacht zu bestätigen
    oder zu widerlegen. Im Falle der Bestätigung des Verdachts ist die weitere Verarbeitung personenbezogener
    Daten zulässig, soweit dies erforderlich ist 1. zur Abwehr des Schadprogramms der sonstigen erheblichen
    Gefahren für die Kommunikationstechnik des Bundes, 2. zur Abwehr von Gefahren, die von dem aufgefundenen
    Schadprogramm ausgehen, oder 3. zur Erkennung und Abwehr anderer Schadprogramme oder Gefahren für
    die Kommunikationstechnik des Bundes. Ein Schadprogramm kann beseitigt oder in seiner Funktionsweise
    gehindert werden. Es dürfen die erforderlichen technischen Maßnahmen getroffen werden, um eine sonstige
    erhebliche Gefahr für die Kommunikationstechnik des Bundes zu beseitigen. Das Bundesamt kann die Daten
    an die betroffene Einrichtung der Bundesverwaltung übermitteln, soweit dies für eine Verwendung nach
    den Sätzen 1 bis 4 erforderlich ist. Die nicht automatisierte Verwendung der Daten nach den Sätzen
    1 und 2 darf nur durch einen Bediensteten des Bundesamtes mit der Befähigung zum Richteramt angeordnet
    werden. Die Anordnung nach Satz 4 muss die daraus erwachsenden Übermittlungsbefugnisse nach Absatz
    6 berücksichtigen.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
