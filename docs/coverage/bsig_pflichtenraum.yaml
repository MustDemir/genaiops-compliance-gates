  saetze: 1
  beleg: (2) Ein herausgehobener Fall nach Absatz 1 liegt insbesondere dann vor, wenn es sich um einen
    Angriff von besonderer technischer Qualität handelt oder wenn die zügige Wiederherstellung der Sicherheit
    oder Funktionsfähigkeit des betroffenen informationstechnischen Systems von besonderem öffentlichem
    Interesse ist.
