- uid: § 55 Abs. 3@145492
  id: § 55 Abs. 3
  artikel: § 55
  artikel_titel: Freiwilliges IT-Sicherheitskennzeichen
  absatz: '3'
  buchstabe: null
  offset: 145492
  laenge: 1226
  saetze: 4
  beleg: (3) Die IT-Sicherheitsanforderungen, auf die sich die Herstellererklärung bezieht, ergeben sich
    aus einer Norm oder einem Standard oder aus einer branchenabgestimmten IT-Sicherheitsvorgabe, die
    die jeweilige Produktkategorie umfasst, sofern das Bundesamt in einem Verfahren, das durch Rechtsverordnung
    nach § 56 Absatz 2 geregelt wird, festgestellt hat, dass die Norm oder der Standard oder die branchenabgestimmte
    IT-Sicherheitsvorgabe geeignet ist, ausreichende IT-Sicherheitsanforderungen für die Produktkategorie
    abzubilden. Ein Anspruch auf diese Feststellung besteht nicht. Liegt keine Feststellung nach Satz
    1 vor, ergeben sich die IT-Sicherheitsvorgaben aus einer vom Bundesamt veröffentlichten Technischen
    Richtlinie, die die jeweilige Produktkategorie umfasst, sofern das Bundesamt eine solche Richtlinie
    bereits veröffentlicht hat. Wird ein Produkt von mehr als einer oder einem bestehenden, als geeignet
    festgestellten Norm, Standard, branchenabgestimmten IT-Sicherheitsvorgabe oder Technischen Richtlinie
    umfasst, richten sich die Anforderungen nach der oder dem jeweils spezielleren bestehenden, als geeignet
    festgestellten Norm, Standard, branchenabgestimmten IT-Sicherheitsvorgabe oder Technischen Richtlinie.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
  verifikation: null
  hypothese_grund: null
  omnibus: null
  requirement: *id001
  gate: *id002
  befund: null
  befund_grund: null
- uid: § 55 Abs. 4@146718
  id: § 55 Abs. 4
  artikel: § 55
  artikel_titel: Freiwilliges IT-Sicherheitskennzeichen
  absatz: '4'
  buchstabe: null
  offset: 146718
  laenge: 759
  saetze: 6
  beleg: (4) Das IT-Sicherheitskennzeichen darf nur dann für ein Produkt verwendet werden, wenn das Bundesamt
    das IT-Sicherheitskennzeichen für dieses Produkt freigegeben hat. Das Bundesamt prüft die Freigabe
    des IT-Sicherheitskennzeichens für ein Produkt auf Antrag des Herstellers oder Diensteanbieters. Dem
    Antrag sind die Herstellererklärung zu dem Produkt sowie alle Unterlagen beizufügen, die die Angaben
    in der Herstellererklärung belegen. Das Bundesamt bestätigt den Eingang des Antrags und prüft die
    Plausibilität der Herstellererklärung anhand der beigefügten Unterlagen. Die Plausibilitätsprüfung
    kann auch durch einen vom Bundesamt beauftragten qualifizierten Dritten erfolgen. Für die Antragsbearbeitung
    kann das Bundesamt eine Verwaltungsgebühr erheben.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
  verifikation: null
  hypothese_grund: null
  omnibus: null
  requirement: *id001
  gate: *id002
  befund: null
  befund_grund: null
- uid: § 55 Abs. 5@147477
  id: § 55 Abs. 5
  artikel: § 55
  artikel_titel: Freiwilliges IT-Sicherheitskennzeichen
  absatz: '5'
  buchstabe: null
  offset: 147477
  laenge: 695
  saetze: 3
  beleg: (5) Das Bundesamt erteilt die Freigabe des IT-Sicherheitskennzeichens für das jeweilige Produkt,
    wenn 1. das Produkt zu einer der Produktkategorien gehört, die das Bundesamt durch im Bundesanzeiger
    veröffentlichte Allgemeinverfügung bekannt gegeben hat, 2. die Herstellererklärung plausibel und durch
    die beigefügten Unterlagen ausreichend belegt ist und 3. die gegebenenfalls erhobene Verwaltungsgebühr
    beglichen wurde. Die Erteilung der Freigabe erfolgt schriftlich und innerhalb einer angemessenen Frist,
    die in der Rechtsverordnung nach § 56 Absatz 2 bestimmt wird. Den genauen Ablauf des Antragsverfahrens
    und die beizufügenden Unterlagen regelt die Rechtsverordnung nach § 56 Absatz 2.
