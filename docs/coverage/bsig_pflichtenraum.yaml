- uid: § 3 Abs. 1@12979
  id: § 3 Abs. 1
  artikel: § 3
  artikel_titel: Aufgaben des Bundesamtes
  absatz: '1'
  buchstabe: null
  offset: 12979
  laenge: 4263
  saetze: 2
  beleg: '(1) Das Bundesamt fördert die Sicherheit in der Informationstechnik. Hierzu nimmt es folgende
    wichtige im öffentlichen Interesse liegende Aufgaben wahr: 1. Gefahren für die Sicherheit in der Informationstechnik
    des Bundes abwehren; 2. Informationen über Sicherheitsrisiken und Sicherheitsvorkehrungen sammeln
    und auswerten und die gewonnenen Erkenntnisse anderen Stellen zur Verfügung stellen, soweit dies zur
    Erfüllung ihrer Aufgaben erforderlich ist, und Dritten zur Verfügung stellen, soweit dies zur Wahrung
    ihrer Sicherheitsinteressen erforderlich ist; 3. Aufgaben in der Kooperationsgruppe und im CSIRTs-Netzwerk
    nach den Artikeln 14 und 15 der NIS-2-Richtlinie wahrnehmen; 4. Sicherheitsrisiken bei der Anwendung
    der Informationstechnik sowie Entwicklung von Sicherheitsvorkehrungen untersuchen, insbesondere von
    informationstechnischen Verfahren und Geräten für die Sicherheit in der Informationstechnik (IT-Sicherheitsprodukte),
    soweit dies zur Erfüllung von Aufgaben des Bundes erforderlich ist, einschließlich der Forschung im
    Rahmen seiner gesetzlichen Aufgaben; 5. Kriterien, Verfahren und Werkzeuge für die Prüfung und Bewertung
    der Sicherheit von informationstechnischen Systemen oder Komponenten und für die Prüfung und Bewertung
    der Konformität im Bereich der IT-Sicherheit entwickeln; 6. Peer Reviews nach Artikel 19 der NIS-2-Richtlinie
    durchführen; 7. Sicherheitsanforderungen für die Kommunikationsinfrastruktur der ressortübergreifenden
    Kommunikationsnetze sowie weiterer staatlicher Kommunikationsinfrastrukturen des Bundes im Benehmen
    mit den jeweiligen Betreibern festlegen sowie die Einhaltung dieser Sicherheitsanforderungen überprüfen;
    8. Sicherheit von informationstechnischen Systemen oder Komponenten prüfen und bewerten sowie Sicherheitszertifikate
    erteilen; 9. Aufgaben und Befugnisse nach Artikel 58 Absatz 7 und 8 der Verordnung (EU) 2019/881 als
    nationale Behörde für die Cybersicherheitszertifizierung wahrnehmen; 10. Konformität im Bereich der
    IT-Sicherheit von informationstechnischen Systemen und Komponenten mit technischen Richtlinien des
    Bundesamtes prüfen und bestätigen; 11. informationstechnische Systeme oder Komponenten, die für die
    Verarbeitung amtlich geheim gehaltener Informationen nach § 4 des Sicherheitsüberprüfungsgesetzes
    im Bereich des Bundes oder bei Unternehmen im Rahmen von Aufträgen des Bundes eingesetzt werden sollen,
    prüfen, bewerten und zulassen; 12. Schlüsseldaten und Betrieb von Krypto- und Sicherheitsmanagementsystemen
    für informationssichernde Systeme des Bundes herstellen, die im Bereich des staatlichen Geheimschutzes
    oder auf Anforderung der betroffenen Behörde auch in anderen Bereichen eingesetzt werden; 13. bei
    organisatorischen und technischen Sicherheitsmaßnahmen unterstützen und beraten sowie technische Prüfungen
    zum Schutz amtlich geheim gehaltener Informationen nach § 4 des Sicherheitsüberprüfungsgesetzes gegen
    die Kenntnisnahme durch Unbefugte durchführen; 14. sicherheitstechnische Anforderungen an die einzusetzende
    Informationstechnik des Bundes und an die Eignung von Auftragnehmern im Bereich von Informationstechnik
    des Bundes mit besonderem Schutzbedarf entwickeln; 15. IT-Sicherheitsprodukte und IT-Sicherheitsdienstleistungen
    für Einrichtungen der Bundesverwaltung bereitstellen; 16. die für die Sicherheit in der Informationstechnik
    zuständigen Stellen des Bundes, insbesondere soweit sie Beratungs- oder Kontrollaufgaben wahrnehmen,
    unterstützen; dies gilt vorrangig für die Bundesbeauftragte oder den Bundesbeauftragten für den Datenschutz
    und die Informationsfreiheit, deren oder dessen Unterstützung im Rahmen der Unabhängigkeit erfolgt,
    die ihr oder ihm bei der Erfüllung ihrer oder seiner Aufgaben nach der Verordnung (EU) 2016/679 und
    dem Bundesdatenschutzgesetz zusteht; 17. Einrichtungen der Bundesverwaltung in Fragen der Informationssicherheit,
    einschließlich der Behandlung von Sicherheitsvorfällen, beraten und unterstützen sowie konkrete, praxisnahe
    Hilfsmittel zur Umsetzung von Informationssicherheitsvorgaben, insbesondere zur Umsetzung der Vorgaben
    nach den §§ 30 und 44, bereitstellen; 18. Unterstützung a) der Polizeien und Strafverfolgungsbehörden
