  offset: 29079
  laenge: 614
  saetze: 4
  beleg: (5) Das Bundesamt führt vor der Finalisierung des Prüfberichts eine Sachverhaltsklärung mit der
    geprüften Einrichtung durch. Mit der Mitteilung soll das Bundesamt Vorschläge zur Verbesserung der
    Informationssicherheit, insbesondere zur Beseitigung der festgestellten Mängel, verbinden. Für die
