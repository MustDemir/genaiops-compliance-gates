  laenge: 1911
  saetze: 3
  beleg: b) andere natürliche oder juristische Personen durch erhebliche materielle oder immaterielle
    Schäden beeinträchtigt hat oder beeinträchtigen kann, sofern durch die Rechtsverordnung nach § 56
    Absatz 5 keine konkretisierende Begriffsbestimmung erfolgt; 12. „Forschungseinrichtung“ eine Einrichtung,
    deren primäres Ziel es ist, angewandte Forschung oder experimentelle Entwicklung im Hinblick auf die
    Nutzung der Ergebnisse dieser Forschung für kommerzielle Zwecke durchzuführen; Bildungseinrichtungen
    gelten nicht als Forschungseinrichtungen; 13. „Geschäftsleitung“ eine natürliche Person, die nach
    Gesetz, Satzung oder Gesellschaftsvertrag zur Führung der Geschäfte und zur Vertretung einer besonders
    wichtigen Einrichtung oder wichtigen Einrichtung berufen ist; Leiterinnen und Leiter von Einrichtungen
    der Bundesverwaltung nach § 29 gelten nicht als Geschäftsleitung; 14. „IKT-Dienst“ ein IKT-Dienst
    nach Artikel 2 Nummer 13 der Verordnung (EU) 2019/881; 15. „IKT-Produkt“ ein IKT-Produkt nach Artikel
    2 Nummer 12 der Verordnung (EU) 2019/881; 16. „IKT-Prozess“ ein IKT-Prozess nach Artikel 2 Nummer
    14 der Verordnung (EU) 2019/881; 17. „Informationssicherheit“ der angemessene Schutz der Vertraulichkeit,
    Integrität und Verfügbarkeit von Informationen; 18. „Informationstechnik“ ein technisches Mittel zur
    Verarbeitung von Informationen; 19. „Institutionen der Sozialen Sicherung“ Körperschaften gemäß §
    29 des Vierten Buches Sozialgesetzbuch, Arbeitsgemeinschaften gemäß § 94 des Zehnten Buches Sozialgesetzbuch,
    die Deutsche Gesetzliche Unfallversicherung e. V. sowie die Deutsche Post AG, soweit sie mit der Berechnung
    oder Auszahlung von Sozialleistungen betraut ist; 20. „Internet Exchange Point“ oder „IXP“ eine Infrastruktur,
    die a) die Zusammenschaltung von mehr als zwei unabhängigen autonomen Systemen ermöglicht, die in
    erster Linie zum Austausch von Internet-Datenverkehr genutzt wird,
