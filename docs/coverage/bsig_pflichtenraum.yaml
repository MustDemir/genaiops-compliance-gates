- uid: § 60 Abs. 1@158289
  id: § 60 Abs. 1
  artikel: § 60
  artikel_titel: Zentrale Zuständigkeit in der Europäischen Union für bestimmte Einrichtungsarten
  absatz: '1'
  buchstabe: null
  offset: 158289
  laenge: 663
  saetze: 2
  beleg: (1) Abweichend von § 59 ist das Bundesamt für DNS-Diensteanbieter, Top Level Domain Name Registries,
    Domain-Name-Registry-Dienstleister, Anbieter von Cloud-Computing-Diensten, Anbieter von Rechenzentrumsdiensten,
    Betreiber von Content Delivery Networks, Managed Service Provider, Managed Security Service Provider
    sowie für Anbieter von Online-Marktplätzen, Online-Suchmaschinen oder Plattformen für Dienste sozialer
    Netzwerke nur dann zuständig, wenn diese ihre Hauptniederlassung in der Europäischen Union in der
    Bundesrepublik Deutschland haben. Ist dies der Fall, so ist das Bundesamt für die Einrichtung in der
    gesamten Europäischen Union zentral zuständig.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
  verifikation: null
