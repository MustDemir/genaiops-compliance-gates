  buchstabe: null
  offset: 127393
  laenge: 1076
  saetze: 5
  beleg: (3) Die Informationssicherheitsbeauftragten der Einrichtungen der Bundesverwaltung sind für den
    Aufbau und die Aufrechterhaltung des Informationssicherheitsprozesses ihrer Einrichtung zuständig.
    Sie erstellen ein Informationssicherheitskonzept, das mindestens die Vorgaben des Bundesamtes nach
    § 44 Absatz 1 erfüllt. Sie wirken auf die operative Umsetzung des Informationssicherheitskonzepts
    hin und kontrollieren die Umsetzung innerhalb der Einrichtung. Die Informationssicherheitsbeauftragten
    beraten die Leitung der Einrichtung der Bundesverwaltung in allen Fragen der Informationssicherheit
    und unterrichten die Leitung der Einrichtung der Bundesverwaltung sowie den jeweils zuständigen Informationssicherheitsbeauftragten
    oder die jeweils zuständige Informationssicherheitsbeauftragte des Ressorts regelmäßig sowie anlassbezogen
    über ihre Tätigkeit, über den Stand der Informationssicherheit innerhalb der Einrichtung, über die
    Mittel- und Personalausstattung sowie über Sicherheitsvorfälle. Ihre Berichts- und Beratungsaufgaben
    erfüllen sie unabhängig und weisungsfrei.
