  artikel: § 7
  artikel_titel: Kontrolle der Kommunikationstechnik des Bundes, Betretensrechte
  absatz: '1'
  buchstabe: null
  offset: 26933
  laenge: 948
  saetze: 2
  beleg: (1) Das Bundesamt ist befugt, die Sicherheit der Kommunikationstechnik des Bundes und ihrer Komponenten,
    einschließlich technischer Infrastrukturen, die zum Betrieb der Kommunikationstechnik des Bundes erforderlich
    sind, zu kontrollieren. Es kann hierzu 1. die Bereitstellung der zur Erfüllung der Aufgaben nach §
    3 Absatz 1 Satz 2 Nummer 1 und 20 erforderlichen Informationen, insbesondere zu technischen Details,
    zu Strategien, Planungen und Regelungen mit Bezug zur Kommunikationstechnik des Bundes einschließlich
    Aufbau- und Ablauforganisation verlangen sowie 2. Unterlagen und Datenträger des Betreibers der jeweiligen
    Kommunikationstechnik des Bundes oder eines mit Betriebsleistungen beauftragten Dritten einsehen und
    die unentgeltliche Herausgabe von Kopien dieser Unterlagen und Dokumente, auch in elektronischer Form,
    verlangen, soweit nicht Geheimschutzinteressen oder überwiegende Sicherheitsinteressen des Betreibers
    entgegenstehen.
