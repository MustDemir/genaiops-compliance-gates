- uid: § 12 Abs. 1@50822
  id: § 12 Abs. 1
  artikel: § 12
  artikel_titel: Bestandsdatenauskunft
  absatz: '1'
  buchstabe: null
  offset: 50822
  laenge: 1246
  saetze: 2
  beleg: (1) Das Bundesamt darf zur Erfüllung seiner gesetzlichen Aufgabe nach § 3 Absatz 1 Satz 1 Nummer
    1, 2, 20, 24 oder 25 von demjenigen, der geschäftsmäßig Telekommunikationsdienste erbringt oder daran
    mitwirkt, über Bestandsdaten gemäß § 3 Nummer 6 des Telekommunikationsgesetzes und über die nach §
    172 des Telekommunikationsgesetzes erhobenen Daten (§ 174 Absatz 1 Satz 1 des Telekommunikationsgesetzes)
    Auskunft verlangen. Die Auskunft nach Satz 1 darf nur verlangt werden zum Schutz der Versorgung der
    Bevölkerung in den Sektoren des § 2 Nummer 24 oder der öffentlichen Sicherheit, um damit eine Beeinträchtigung
    der Sicherheit oder Funktionsfähigkeit informationstechnischer Systeme einer besonders wichtigen Einrichtung
    oder wichtigen Einrichtung abzuwenden, wenn Tatsachen den Schluss auf ein wenigstens seiner Art nach
    konkretisiertes und zeitlich absehbares Geschehen zulassen, das auf die informationstechnischen Systeme
    bestimmbarer Infrastrukturen oder Unternehmen abzielen wird, und wenn die in die Auskunft aufzunehmenden
    Daten im Einzelfall erforderlich sind, um die Betroffenen nach Absatz 4 vor dieser Beeinträchtigung
    zu warnen, über diese Beeinträchtigung zu informieren oder bei der Beseitigung zu beraten oder zu
    unterstützen.
  adressat: null
