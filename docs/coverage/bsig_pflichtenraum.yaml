  id: § 8 Abs. 7
  artikel: § 8
  artikel_titel: Abwehr von Schadprogrammen und Gefahren für die Kommunikationstechnik des Bundes
  absatz: '7'
  buchstabe: null
  offset: 40412
  laenge: 1770
  saetze: 6
  beleg: (7) Für sonstige Zwecke kann das Bundesamt die Daten nach Absatz 4 Satz 1 übermitteln 1. an die
    Strafverfolgungsbehörden zur Verfolgung einer Straftat von auch im Einzelfall erheblicher Bedeutung,
    insbesondere einer in § 100a Absatz 2 der Strafprozessordnung bezeichneten Straftat, 2. an die Polizeien
    des Bundes und der Länder zur Abwehr einer Gefahr für den Bestand oder die Sicherheit des Staates
    oder Leib, Leben oder Freiheit einer Person oder Sachen von bedeutendem Wert, deren Erhalt im öffentlichen
    Interesse geboten ist, 3. an die Verfassungsschutzbehörden des Bundes und der Länder sowie an den
    Militärischen Abschirmdienst, wenn tatsächliche Anhaltspunkte für Bestrebungen in der Bundesrepublik
    Deutschland vorliegen, die durch Anwendung von Gewalt oder darauf gerichtete Vorbereitungshandlungen
    gegen die in § 3 Absatz 1 des Bundesverfassungsschutzgesetzes oder § 1 Absatz 1 des MAD-Gesetzes genannten
    Schutzgüter gerichtet sind, 4. an den Bundesnachrichtendienst, wenn tatsächliche Anhaltspunkte für
    den Verdacht bestehen, dass jemand Straftaten nach § 3 Absatz 1 Nummer 8 des Artikel 10-Gesetzes plant,
    begeht oder begangen hat und dies von außen- und sicherheitspolitischer Bedeutung für die Bundesrepublik
    Deutschland ist. Die Übermittlung nach Satz 2 Nummer 1 und 2 bedarf der vorherigen gerichtlichen Zustimmung.
    Für das Verfahren nach Satz 2 Nummer 1 und 2 gelten die Vorschriften des Gesetzes über das Verfahren
    in Familiensachen und in den Angelegenheiten der freiwilligen Gerichtsbarkeit entsprechend. Zuständig
    ist das Amtsgericht, in dessen Bezirk das Bundesamt seinen Sitz hat. Die Übermittlung nach Satz 2
    Nummer 3 und 4 erfolgt nach Anordnung des Bundesministeriums des Innern. Die §§ 9 bis 16 des Artikel
    10-Gesetzes gelten entsprechend.
