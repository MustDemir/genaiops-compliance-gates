- uid: § 53 Abs. 1@136065
  id: § 53 Abs. 1
  artikel: § 53
  artikel_titel: Konformitätsbewertung und Konformitätserklärung
  absatz: '1'
  buchstabe: null
  offset: 136065
  laenge: 1435
  saetze: 4
  beleg: (1) Das Bundesamt kann für die vom Bundesamt in einer Technischen Richtlinie festgelegten Anforderungen
    und Vorgaben zulassen, dass ein Hersteller oder Anbieter von IKT-Produkten, IKT-Diensten und IKT-Prozessen,
    die keine Verbraucherprodukte nach § 55 sind, sowie eine Person oder ein IT-Sicherheitsdienstleister
    eine Selbstbewertung seiner oder ihrer Konformität vornimmt. Der Hersteller oder Anbieter von IKT-Produkten,
    IKT-Diensten und IKT-Prozessen, die Person oder der IT-Sicherheitsdienstleister kann unter den Voraussetzungen
    von Satz 1 eine Konformitätserklärung ausstellen, die bestätigt, dass er oder sie die in der Technischen
    Richtlinie festgelegten Anforderungen erfüllt. Durch die Ausstellung der Konformitätserklärung übernimmt
    der Hersteller oder Anbieter der IKT-Produkte, IKT-Dienste und IKT-Prozesse, die Person oder der IT-Sicherheitsdienstleister
    (Aussteller) die Verantwortung dafür, dass das IKT-Produkt, der IKT-Dienst, der IKT-Prozess, die Person
    oder die IT-Sicherheitsdienstleistung den in der Technischen Richtlinie festgelegten Anforderungen
    entspricht. Eine Erklärung nach Satz 3 darf nur dann für ein IKT-Produkt, einen IKT-Dienst und IKT-Prozess,
    eine Person oder einen IT-Sicherheitsdienstleister verwendet werden, wenn der Hersteller, der Anbieter,
    die Person oder der IT-Sicherheitsdienstleisters diese ausgestellt hat und sie weder widerrufen noch
    nach Absatz 5 Nummer 3 für ungültig erklärt wurde.
