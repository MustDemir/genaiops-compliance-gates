    Naturschutz und nukleare Sicherheit und dem Bundesministerium für Digitales und Staatsmodernisierung
    welche durch eine besonders wichtige Einrichtung oder eine wichtige Einrichtung eingesetzten Produkte,
    Dienste oder Prozesse gemäß § 30 Absatz 6 über eine Cybersicherheitszertifizierung verfügen müssen,
    da sie für die Erbringung der Dienste der Einrichtung maßgeblich sind und Art und Ausmaß der Risikoexposition
    der Einrichtung einen verpflichtenden Einsatz von zertifizierten Produkten, Diensten oder Prozessen
    in diesem Bereich erforderlich machen.
