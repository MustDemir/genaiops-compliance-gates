  saetze: 1
  beleg: (3) Das Bundesministerium des Innern bestimmt durch Rechtsverordnung, die nicht der Zustimmung
    des Bundesrates bedarf, im Einvernehmen mit dem Bundesministerium für Wirtschaft und Energie, dem
    Bundesministerium der Finanzen, dem Bundesministerium der Justiz und für Verbraucherschutz, dem Bundesministerium
    für Arbeit und Soziales, dem Bundesministerium der Verteidigung, dem Bundesministerium für Landwirtschaft,
    Ernährung und Heimat, dem Bundesministerium für Gesundheit, dem Bundesministerium für Verkehr, dem
    Bundesministerium für Forschung, Technologie und Raumfahrt, dem Bundesministerium für Umwelt, Klimaschutz,
    Naturschutz und nukleare Sicherheit und dem Bundesministerium für Digitales und Staatsmodernisierung
    welche durch eine besonders wichtige Einrichtung oder eine wichtige Einrichtung eingesetzten Produkte,
    Dienste oder Prozesse gemäß § 30 Absatz 6 über eine Cybersicherheitszertifizierung verfügen müssen,
    da sie für die Erbringung der Dienste der Einrichtung maßgeblich sind und Art und Ausmaß der Risikoexposition
    der Einrichtung einen verpflichtenden Einsatz von zertifizierten Produkten, Diensten oder Prozessen
    in diesem Bereich erforderlich machen.
