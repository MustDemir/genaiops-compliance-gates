  artikel: § 9
  artikel_titel: Verarbeitung von Protokollierungsdaten der Kommunikationstechnik des Bundes
  absatz: '1'
  buchstabe: null
  offset: 44367
  laenge: 662
  saetze: 1
  beleg: (1) Das Bundesamt darf zur Abwehr von Gefahren für die Kommunikationstechnik des Bundes und ihrer
    Komponenten, einschließlich technischer Infrastrukturen, die zum Betrieb der Kommunikationstechnik
    des Bundes erforderlich sind, Protokollierungsdaten, die durch den Betrieb von Kommunikationstechnik
    des Bundes anfallen, verarbeiten, soweit dies zum Erkennen, Eingrenzen oder Beseitigen von Störungen,
    Fehlern oder Sicherheitsvorfällen in der Kommunikationstechnik des Bundes oder von Angriffen auf die
    Informationstechnik des Bundes erforderlich ist und Geheimschutzinteressen oder überwiegende Sicherheitsinteressen
    der betroffenen Stellen nicht entgegenstehen.
