  saetze: 3
  beleg: (5) Hat das Bundesamt ein Amtshilfeersuchen eines anderen Mitgliedstaats der Europäischen Union
    zu einer Einrichtung der in Absatz 1 Satz 1 genannten Einrichtungsart erhalten, so ist das Bundesamt
    befugt, innerhalb der Grenzen dieses Ersuchens geeignete Aufsichts- und Durchsetzungsmaßnahmen in
    Bezug auf die betreffende Einrichtung zu ergreifen, die in der Bundesrepublik Deutschland Dienste
    anbietet oder eine informationstechnisches System, eine informationstechnische Komponente oder einen
    informationstechnischen Prozess betreibt. Satz 1 gilt entsprechend bei Amtshilfeersuchen eines anderen
    Mitgliedstaats der Europäischen Union, der für eine Einrichtung in der gesamten Europäischen Union
    zuständig ist, wenn die Einrichtung in der Bundesrepublik Deutschland Dienste anbietet oder ein informationstechnisches
    System, eine informationstechnische Komponente oder einen informationstechnischen Prozess betreibt.
