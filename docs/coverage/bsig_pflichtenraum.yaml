- uid: § 55 Abs. 4@153159
  id: § 55 Abs. 4
  artikel: § 55
  artikel_titel: Freiwilliges IT-Sicherheitskennzeichen
  absatz: '4'
  buchstabe: null
  offset: 153159
  laenge: 759
  saetze: 6
  beleg: (4) Das IT-Sicherheitskennzeichen darf nur dann für ein Produkt verwendet werden, wenn das Bundesamt
    das IT-Sicherheitskennzeichen für dieses Produkt freigegeben hat. Das Bundesamt prüft die Freigabe
    des IT-Sicherheitskennzeichens für ein Produkt auf Antrag des Herstellers oder Diensteanbieters. Dem
    Antrag sind die Herstellererklärung zu dem Produkt sowie alle Unterlagen beizufügen, die die Angaben
    in der Herstellererklärung belegen. Das Bundesamt bestätigt den Eingang des Antrags und prüft die
    Plausibilität der Herstellererklärung anhand der beigefügten Unterlagen. Die Plausibilitätsprüfung
    kann auch durch einen vom Bundesamt beauftragten qualifizierten Dritten erfolgen. Für die Antragsbearbeitung
    kann das Bundesamt eine Verwaltungsgebühr erheben.
  adressat: null
  pflicht: null
  scope: null
  scope_grund: null
  verifikation: null
