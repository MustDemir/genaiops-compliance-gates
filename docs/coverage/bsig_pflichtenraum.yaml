  artikel: § 33
  artikel_titel: Registrierungspflicht
  absatz: '1'
  buchstabe: null
  offset: 93725
  laenge: 1058
  saetze: 1
  beleg: '(1) Besonders wichtige Einrichtungen und wichtige Einrichtungen sowie Domain-Name-Registry-Dienstleister
    sind verpflichtet, spätestens drei Monate, nachdem sie erstmals oder erneut als eine der vorgenannten
    Einrichtungen gelten oder Domain-Name-Registry-Dienste anbieten, dem Bundesamt über eine gemeinsam
    vom Bundesamt und dem Bundesamt für Bevölkerungsschutz und Katastrophenhilfe eingerichtete Registrierungsmöglichkeit
    folgende Angaben zu übermitteln: 1. Name der Einrichtung, einschließlich der Rechtsform und falls
    einschlägig der Handelsregisternummer, 2. Anschrift und aktuelle Kontaktdaten, einschließlich E-Mail-Adresse,
    öffentliche IP-Adressbereiche und Telefonnummern, 3. relevanter in Anlage 1 oder 2 genannter Sektor
    oder falls einschlägig Branche, 4. Auflistung derjenigen Mitgliedstaaten der Europäischen Union, in
    denen die Einrichtung Dienste der in Anlage 1 oder 2 genannten Einrichtungsarten erbringt, und 5.
    die für die Tätigkeiten, aufgrund derer die Registrierung erfolgt, zuständigen Aufsichtsbehörden des
    Bundes und der Länder.'
