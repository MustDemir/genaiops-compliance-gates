- uid: § 8 Abs. 2@33916
  id: § 8 Abs. 2
  artikel: § 8
  artikel_titel: Abwehr von Schadprogrammen und Gefahren für die Kommunikationstechnik des Bundes
  absatz: '2'
  buchstabe: null
  offset: 33916
  laenge: 1406
  saetze: 6
  beleg: (2) Protokolldaten nach Absatz 1 Satz 1 Nummer 1 dürfen über den für die automatisierte Auswertung
    nach Absatz 1 Satz 1 Nummer 1 erforderlichen Zeitraum hinaus, längstens jedoch für 18 Monate, gespeichert
    werden, soweit tatsächliche Anhaltspunkte dafür bestehen, dass diese im Falle der Bestätigung eines
    Verdachts nach Absatz 4 Satz 2 zur Abwehr von Gefahren, die von dem gefundenen Schadprogramm ausgehen,
    oder zur Erkennung und Abwehr anderer Schadprogramme oder sonstiger erheblicher Gefahren für die Kommunikationstechnik
    des Bundes erforderlich sein können. Durch organisatorische und technische Maßnahmen ist sicherzustellen,
    dass eine Auswertung der nach diesem Absatz gespeicherten Daten nur automatisiert erfolgt und dass
    ein Zugriff auf Daten, die länger als drei Monate gespeichert sind, nur bei Vorliegen tatsächlicher
    Erkenntnisse über die Betroffenheit des Bundes mit einem Schadprogramm oder einer sonstigen erheblichen
    Gefahr für die Kommunikationstechnik des Bundes erfolgt. Die Daten sind zu pseudonymisieren, soweit
    dies automatisiert möglich ist. Eine nicht automatisierte Verarbeitung ist nur nach Maßgabe der nachfolgenden
    Absätze zulässig. Soweit hierzu die Wiederherstellung pseudonymisierter Protokolldaten erforderlich
    ist, muss diese durch die Präsidentin oder den Präsidenten des Bundesamtes oder die Vertretung im
    Amt angeordnet werden. Die Entscheidung ist zu dokumentieren.
