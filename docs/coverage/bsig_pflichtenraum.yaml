- uid: § 37 Abs. 1@100231
  id: § 37 Abs. 1
  artikel: § 37
  artikel_titel: Ausnahmebescheid
  absatz: '1'
  buchstabe: null
  offset: 100231
  laenge: 834
  saetze: 2
  beleg: (1) Das Bundesministerium des Innern kann auf Vorschlag des Bundeskanzleramtes, des Bundesministeriums
    der Justiz und für Verbraucherschutz, des Bundesministeriums für Verteidigung, des Bundesministeriums
    der Finanzen, der Ministerien für Inneres und der Justiz der Länder oder auf eigenes Betreiben eine
    besonders wichtige Einrichtung oder eine wichtige Einrichtung von Verpflichtungen nach diesem Gesetz
    nach Maßgabe des Absatzes 2 teilweise befreien (einfacher Ausnahmebescheid) oder nach Maßgabe des
    Absatzes 3 insgesamt befreien (erweiterter Ausnahmebescheid), sofern die Einrichtung Vorgaben einhält,
    die den Verpflichtungen nach diesem Gesetz gleichwertig sind. Die Entscheidung nach Satz 1 erfolgt
    mit dem jeweils zuständigen Ressort im Einvernehmen, im Fall der Ministerien für Inneres und der Justiz
    der Länder im Benehmen.
  adressat: null
  pflicht: null
  scope: null
