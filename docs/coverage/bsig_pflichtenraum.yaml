  id: § 2 lit. b
  artikel: § 2
  artikel_titel: Begriffsbestimmungen
  absatz: '-'
  buchstabe: b
  offset: 10904
  laenge: 2282
  saetze: 2
  beleg: b) bei der Anwendung informationstechnischer Systeme, Komponenten oder Prozesse; 40. „Sicherheitsvorfall“
    ein Ereignis, das die Verfügbarkeit, Integrität oder Vertraulichkeit gespeicherter, übermittelter
    oder verarbeiteter Daten oder der Dienste, die über informationstechnische Systeme, Komponenten und
    Prozesse angeboten werden oder zugänglich sind, beeinträchtigt; 41. „Systeme zur Angriffserkennung“
    durch technische Werkzeuge und organisatorische Einbindung unterstützte Prozesse zur Erkennung von
    Angriffen auf informationstechnische Systeme; wobei die Angriffserkennung durch Abgleich der in einem
    informationstechnischen System verarbeiteten Daten mit Informationen und technischen Mustern, die
    auf Angriffe hindeuten, erfolgt; 42. „Top Level Domain Name Registry“ eine natürliche oder juristische
    Person, die die Registrierung von Internet-Domain-Namen innerhalb einer spezifischen Top Level Domain
    (TLD) verwaltet und betreibt, einschließlich des Betriebs ihrer Namenserver, der Pflege ihrer Datenbanken
    und der Verteilung von TLD-Zonendateien über die Namenserver, unabhängig davon, ob der Betrieb durch
    die natürliche oder juristische Person selbst erfolgt oder ausgelagert wird; keine „Top Level Domain
    Name Registry“ sind Register, die TLD-Namen nur für eigene Zwecke verwenden; 43. „Vertrauensdienst“
    ein Vertrauensdienst nach Artikel 3 Nummer 16 der Verordnung (EU) Nr. 910/2014; 44. „Vertrauensdiensteanbieter“
    ein Vertrauensdiensteanbieter nach Artikel 3 Nummer 19 der Verordnung (EU) Nr. 910/2014; 45. „weltraumgestützte
    Dienste“ Dienste, die den Sektor Weltraum betreffen, die auf Daten und Informationen beruhen, die
    entweder von Weltraumgegenständen erzeugt oder über diese weitergegeben werden und deren Störung zu
    breiteren Kaskadeneffekten, die weitreichende und langanhaltende negative Auswirkungen auf die Erbringung
    von Diensten im gesamten Binnenmarkt haben können, führen kann; 46. „Zertifizierung“ die Feststellung
    einer Zertifizierungsstelle, dass ein Produkt, ein Prozess, ein System, ein Schutzprofil (Sicherheitszertifizierung),
    eine Person (Personenzertifizierung) oder ein IT-Sicherheitsdienstleister bestimmte Anforderungen
