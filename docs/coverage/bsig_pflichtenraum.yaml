  beleg: (2) Soweit erforderlich, kann das Bundesamt für Untersuchungen nach Absatz 1 Satz 1 von Herstellern
    informationstechnischer Produkte und Systeme alle notwendigen Auskünfte, insbesondere auch zu technischen
    Details, verlangen. In dem Auskunftsverlangen gibt das Bundesamt die Rechtsgrundlage, den Zweck des
    Auskunftsverlangens und die benötigten Auskünfte an und legt eine angemessene Frist für die Übermittlung
