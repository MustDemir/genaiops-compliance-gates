  saetze: 4
  beleg: (2) Wird durch Abfragen gemäß Absatz 1 Satz 1 eine bekannte Schwachstelle oder ein anderes Sicherheitsrisiko
    eines informationstechnischen Systems erkannt, informiert das Bundesamt als allgemeine Meldestelle
    für die Sicherheit in der Informationstechnik nach § 5 darüber unverzüglich die für das informationstechnische
    System Verantwortlichen. Gehört das informationstechnische System zu einer Einrichtung der Bundesverwaltung,
    sind zugleich die Informationssicherheitsbeauftragten der betroffenen Einrichtung der Bundesverwaltung
    nach § 45 und des übergeordneten Ressorts nach § 46 zu informieren. Das Bundesamt soll dabei auf bestehende
    Möglichkeiten zur Abhilfe des Sicherheitsrisikos hinweisen. Sind dem Bundesamt die Verantwortlichen
    nicht bekannt oder ist ihre Identifikation nur mit unverhältnismäßigem Aufwand oder über eine Bestandsdatenabfrage
    nach § 12 möglich, so ist hilfsweise der betreibende Dienstleister des jeweiligen Netzes oder Systems
    unverzüglich zu benachrichtigen, wenn überwiegende Sicherheitsinteressen nicht entgegenstehen.
