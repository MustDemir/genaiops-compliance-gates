  saetze: 1
  beleg: (8) Das Bundesamt kann gegenüber besonders wichtigen Einrichtungen anordnen, 1. die natürlichen
    oder juristischen Personen, für die sie Dienste erbringen oder Tätigkeiten ausüben und die potenziell
    von einer erheblichen Cyberbedrohung betroffen sind, über die Art der Bedrohung und mögliche Abwehr-
    oder Abhilfemaßnahmen zu unterrichten, die diese Personen als Reaktion auf die Bedrohung ergreifen
    können, und 2. Informationen zu Verstößen gegen die in Absatz 1 genannten Verpflichtungen nach durch
    das Bundesamt bestimmten Vorgaben öffentlich bekannt zu machen.
