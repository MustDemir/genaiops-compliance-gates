- uid: § 15 Abs. 1@59882
  id: § 15 Abs. 1
  artikel: § 15
  artikel_titel: Detektion von Angriffsmethoden und von Sicherheitsrisiken für die Netz- und IT-Sicherheit
  absatz: '1'
  buchstabe: null
  offset: 59882
  laenge: 954
  saetze: 3
  beleg: (1) Das Bundesamt kann im Rahmen seiner Aufgaben nach § 3 Absatz 1 Satz 2 Nummer 1 zur Detektion
    von bekannten Schwachstellen und anderen Sicherheitsrisiken Abfragen an den Schnittstellen öffentlich
    erreichbarer informationstechnischer Systeme zu öffentlichen Telekommunikationsnetzen durchführen,
    1. um festzustellen, ob diese Schnittstellen unzureichend geschützt und dadurch in ihrer Sicherheit
    oder Funktionsfähigkeit gefährdet sein können, oder 2. wenn die Einrichtungen der Bundesverwaltung,
    der besonders wichtigen oder der wichtigen Einrichtungen die entsprechenden Einrichtungen darum ersuchen.
    Erlangt das Bundesamt dabei Informationen, die durch Artikel 10 des Grundgesetzes geschützt sind,
    darf es diese nur zum Zwecke der Übermittlung nach § 8 Absatz 6 und 7 verarbeiten. Sofern die Voraussetzungen
    des § 8 Absatz 6 und 7 nicht vorliegen, sind Informationen, die durch Artikel 10 des Grundgesetzes
    geschützt sind, unverzüglich zu löschen.
