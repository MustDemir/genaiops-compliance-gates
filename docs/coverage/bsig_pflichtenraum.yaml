    in herausgehobenen Fällen
  absatz: '5'
  buchstabe: null
  offset: 49036
  laenge: 666
  saetze: 5
  beleg: (5) Das Bundesamt kann sich bei Maßnahmen nach Absatz 1 mit der Einwilligung des Ersuchenden
    der Hilfe qualifizierter Dritter bedienen, wenn dies zur rechtzeitigen oder vollständigen Wiederherstellung
    der Sicherheit oder Funktionsfähigkeit des betroffenen informationstechnischen Systems erforderlich
    ist. Die hierdurch entstehenden Kosten hat der Ersuchende zu tragen. Das Bundesamt kann den Ersuchenden
    auch auf qualifizierte Dritte verweisen. Das Bundesamt und vom Ersuchenden oder vom Bundesamt nach
    Satz 1 beauftragte Dritte können einander bei Maßnahmen nach Absatz 1 mit der Einwilligung des Ersuchenden
    Daten übermitteln. Hierfür gilt Absatz 3 entsprechend.
