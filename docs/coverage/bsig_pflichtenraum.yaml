    Verfahren, einschließlich Überprüfungsverfahren, vorzuhalten, mit denen sichergestellt wird, dass
    die Datenbank genaue und vollständige Angaben enthält. Sie haben diese Vorgaben und Verfahren bis
    zum 6. März 2026 öffentlich zugänglich zu machen.
