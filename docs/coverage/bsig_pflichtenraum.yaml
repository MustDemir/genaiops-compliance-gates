- uid: § 61 Abs. 5@171008
  id: § 61 Abs. 5
  artikel: § 61
  artikel_titel: Aufsichts- und Durchsetzungsmaßnahmen für besonders wichtige Einrichtungen
  absatz: '5'
  buchstabe: null
  offset: 171008
  laenge: 928
  saetze: 4
  beleg: (5) Das Bundesamt kann bei besonders wichtigen Einrichtungen die Einhaltung der Anforderungen
    nach diesem Gesetz überprüfen. Es kann sich bei der Durchführung der Überprüfung eines qualifizierten
    unabhängigen Dritten bedienen. Die besonders wichtige Einrichtung hat dem Bundesamt und den in dessen
    Auftrag handelnden Personen zum Zweck der Überprüfung das Betreten der Geschäfts- und Betriebsräume
    während der üblichen Betriebszeiten zu gestatten und auf Verlangen die in Betracht kommenden Aufzeichnungen,
    Schriftstücke und sonstigen Unterlagen in geeigneter Weise vorzulegen, Auskunft zu erteilen und die
    erforderliche Unterstützung zu gewähren. Für die Überprüfung erhebt das Bundesamt Gebühren und Auslagen
    bei der jeweiligen besonders wichtigen Einrichtung nur, sofern das Bundesamt aufgrund von Anhaltspunkten
    tätig geworden ist, die berechtigte Zweifel an der Einhaltung der Anforderungen nach § 30 Absatz 1
    begründeten.
