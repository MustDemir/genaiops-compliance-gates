  saetze: 6
  beleg: (8) Besonders wichtige Einrichtungen und ihre Branchenverbände können branchenspezifische Sicherheitsstandards
    zur Gewährleistung der Anforderungen nach Absatz 1 vorschlagen. Diese vorgeschlagenen Sicherheitsstandards
    müssen Durchführungsrechtsakte der Europäischen Kommission so berücksichtigen, dass sie nicht im Widerspruch
    zu den dort genannten Anforderungen stehen sowie darin enthaltene Vorgaben nicht unterschritten werden.
    Das Bundesamt stellt auf Antrag fest, ob die vorgeschlagenen Sicherheitsstandards branchenspezifisch
    und geeignet sind, die Anforderungen nach Absatz 1 zu gewährleisten und veröffentlicht diese auf seiner
    Internetseite. Die Feststellung erfolgt 1. im Einvernehmen mit dem Bundesamt für Bevölkerungsschutz
    und Katastrophenhilfe; 2. im Einvernehmen mit der zuständigen Aufsichtsbehörde des Bundes. Im Sektor
    Gesundheitswesen ist, soweit keine zuständige Aufsichtsbehörde des Bundes besteht, abweichend von
    Satz 4 Nummer 2 das Benehmen mit dem Bundesministerium für Gesundheit herzustellen. Aus Gründen des
    öffentlichen Interesses werden für die Feststellung keine Gebühren oder Auslagen für die Tätigkeit
    des Bundesamtes erhoben.
