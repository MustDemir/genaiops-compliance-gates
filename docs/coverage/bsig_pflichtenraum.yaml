    2024 verstößt, indem er vorsätzlich oder fahrlässig 1. entgegen Artikel 55 Absatz 1 eine dort genannte
    Angabe nicht, nicht richtig, nicht vollständig oder nicht binnen eines Monats nach Ausstellung zugänglich
    macht oder 2. entgegen Artikel 56 Absatz 8 Satz 1 eine Information nicht, nicht richtig, nicht vollständig
    oder nicht unverzüglich nach Feststellung einer Sicherheitslücke oder Unregelmäßigkeit gibt.
