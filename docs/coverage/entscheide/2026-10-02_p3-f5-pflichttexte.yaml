# PO-Entscheid vom 02.10.2026 — P3-F5 a: Sammelbestaetigung der 19 Pflichttexte aus A-W13
#
# Nachweis: docs/coverage/review/11-paket-3b-element-matrix.md Teil 9 (Frage P3-F5) und Teil 10.
#
# A-W13 (Review 11 Teil 9): T-15 Teil 2 schnitt Unterabsaetze hinter Aufzaehlungen als eigene
# Einheiten, zog aber den Pflichttext des letzten Glieds nicht nach. 19 Texte sind neu und sagen
# nur, was ihr eigener Beleg sagt. Wie P3-F2: bestaetigt ist der TEXT, nicht Befund und
# Einordnung der Zeile - deshalb 'bestaetigt: false'. Jeder Eintrag setzt den Text woertlich;
# aendert ihn spaeter jemand, meldet PO_DECISIONS_APPLIED das. Damit sind auch die 11
# umschriebenen Reste gehalten, die NORM_UNITS_MATCH_EXTRACTOR als Zeichenfolge nicht sieht.

