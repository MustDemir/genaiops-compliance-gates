# ── Schritt 2b, E6: Omnibus-Feld berichtigt ──────────────────────────────────

  - beleg: 2b E6 (Omnibus-Feld, Art. 4 auf den neuen Wortlaut)
    raum: aiact
    ids: [Art. 4]
    setze:
      pflicht: >-
        Anbieter und Betreiber ergreifen Massnahmen, um die Entwicklung der KI-Kompetenz
        ihres Personals und anderer in ihrem Auftrag mit Betrieb und Nutzung befasster
        Personen zu unterstuetzen (Art. 4 Abs. 1 n.F.); ein bestimmtes Kompetenzniveau
        muessen sie nicht garantieren.
      omnibus: >-
        geaendert durch VO (EU) 2026/1744 Art. 1 Nr. 5 - Art. 4 neu gefasst. Abs. 1
        schwaecht die Pflicht ab: statt 'sicherzustellen, dass ... ueber ein ausreichendes
        Mass an KI-Kompetenz verfuegen' nun 'ergreifen Massnahmen, um die Entwicklung der
