# PO-Entscheide vom 23.09.2026 — Schritt 2a, 2b (E1–E8) und T-14.1
#
# Nachweis der Entscheide: docs/coverage/review/01-schritt-2a-nicht-einschlaegig.md,
# 02-schritt-2b-luecken.md (Teil 7 und Tabelle "PO-Entscheide bisher") und
# 03-gegenpruefung-omnibus-art26-out.md. Diese Datei schreibt nichts Neues fest — sie
# ist die maschinenlesbare Form dessen, was dort entschieden ist.
#
# Eingetragen mit tools/legal/po_entscheide.py (T-14.5, PO-Festlegung P-4 vom
# 28.09.2026). PO_DECISIONS_APPLIED haelt den Pflichtenraum dagegen: jedes Feld hier
# steht so im Pflichtenraum, und jede Zeile mit po_bestaetigt: true hat hier einen
# Eintrag mit bestaetigt: true.
#
# Regeln des Eintrags:
#   * Ein Entscheid gilt fuer die Kennungen, die er nennt. Ist eine Einheit nach dem
#     Entscheid feiner geschnitten worden (T-14.1, T-14.3), gilt er fuer den Teil,
#     den er benennt ('Art. 26 Abs. 5 Satz 2 (nach Teilung)'), nicht fuer die
#     Geschwister. Ausnahme: E4 ist eine Regel je Artikel und gilt fuer alle
#     heutigen Einheiten der genannten Artikel.
#   * bestaetigt: true nur, wo scope, befund und verifikation einer Zeile entschieden
#     sind. Wo nur ein Feld entschieden ist (etwa verifikation nach E4 bei einer
#     Teilabdeckung, die erst 2c klaert), bleibt po_bestaetigt false.
#   * Wird eine Zeile 'out', entfallen befund und befund_grund: der Befund fragt nur
#     bei scope 'in' (T-13, Raster).

entschieden: '2026-09-23'
eingetragen: '2026-09-28'
eintraege:

# ── Schritt 2a: die 22 nicht_einschlaegig neu eingeordnet ────────────────────

  - beleg: 2a Gruppe A (Bereichsausnahme Anhang III Nr. 2)
    raum: aiact
    ids: [Art. 27 Abs. 1, Art. 27 Abs. 1 lit. a, Art. 27 Abs. 1 lit. b, Art. 27 Abs. 1 lit. c,
          Art. 27 Abs. 1 lit. d, Art. 27 Abs. 1 lit. e, Art. 27 Abs. 1 lit. f, Art. 27 Abs. 2,
          Art. 27 Abs. 3, Art. 27 Abs. 4]
    setze:
      scope: out
      scope_grund: >-
        Bereichsausnahme: Art. 27 Abs. 1 nimmt Hochrisiko-KI-Systeme aus, die in dem in
        Anhang III Nummer 2 aufgefuehrten Bereich verwendet werden sollen; lit. a-f und
        Abs. 2-4 setzen die Pflicht aus Abs. 1 voraus. Die DSFA bleibt ueber Art. 26 Abs. 9.
      befund: null
      befund_grund: null
    bestaetigt: true

  - beleg: 2a Gruppe A (Bereichsausnahme Anhang III Nr. 2)
    raum: aiact
    ids: [Art. 49 Abs. 3]
    setze:
      scope: out
      scope_grund: >-
        Bereichsausnahme ('mit Ausnahme der in Anhang III Nummer 2 aufgefuehrten
        Hochrisiko-KI-Systeme') und Adressat Behoerden.
      befund: null
      befund_grund: null
    bestaetigt: true

  - beleg: 2a Gruppe A (Adressat Behoerde)
    raum: aiact
    ids: [Art. 71 Abs. 3]
    setze:
      scope: out
      scope_grund: Adressat - Dateneingabe durch Betreiber, die Behoerden sind.
      befund: null
      befund_grund: null
    bestaetigt: true

  - beleg: 2a Gruppe A (Bereichsausnahme Anhang III Nr. 2)
    raum: aiact
    ids: [Art. 86 Abs. 1]
    setze:
      scope: out
      scope_grund: >-
        Bereichsausnahme Art. 86 Abs. 1 ('mit Ausnahme der in Nummer 2 des genannten
        Anhangs aufgefuehrten Systeme').
      befund: null
      befund_grund: null
    bestaetigt: true

  - beleg: 2a Gruppe B (anderer Betreibertyp)
    raum: aiact
    ids: [Art. 26 Abs. 8]
    setze:
      scope: out
      scope_grund: Adressat - Betreiber, die Organe, Einrichtungen oder sonstige Stellen der Union sind.
      befund: null
      befund_grund: null
    bestaetigt: true

  - beleg: 2a Gruppe B (anderer Betreibertyp)
    raum: aiact
    ids: [Art. 26 Abs. 10]
    setze:
      scope: out
      scope_grund: >-
        Adressat - Betreiber eines Systems zur nachtraeglichen biometrischen
        Fernidentifizierung zu Strafverfolgungszwecken.
      befund: null
      befund_grund: null
    bestaetigt: true

  - beleg: 2a Gruppe C (anderer Systemtyp)
    raum: aiact
    ids: [Art. 14 Abs. 5]
    setze:
      scope: out
      scope_grund: Systemtyp - gilt nur fuer Hochrisiko-KI-Systeme nach Anhang III Nr. 1 lit. a (biometrische Fernidentifizierung).
      befund: null
      befund_grund: null
    bestaetigt: true

  - beleg: 2a Gruppe C (anderer Systemtyp)
    raum: aiact
    ids: [Art. 73 Abs. 10]
    setze:
      scope: out
      scope_grund: Systemtyp - gilt nur fuer Medizinprodukte nach VO (EU) 2017/745 und 2017/746.
      befund: null
      befund_grund: null
    bestaetigt: true

  - beleg: 2a Gruppe D (Verbote Art. 5 als Luecke, P1)
    raum: aiact
    ids: [Art. 5 Abs. 1 lit. e, Art. 5 Abs. 1 lit. f, Art. 5 Abs. 1 lit. g]
    setze:
      befund: luecke
      befund_grund: >-
        Das Verbot trifft jede Verwendung, auch durch den Betreiber - kein Adressat- oder
        Ausnahme-out. Ob das eigene System es tut, ist eine Tatsachenfrage ueber das
        System, keine Normfrage; genau dafuer sind Gates da. Massnahme: ein
        Art.-5-Screening in G-PRE-01 fuer alle Verbote (P1).
    bestaetigt: true

  - beleg: 2a Gruppe E (bedingte Pflicht)
    raum: aiact
    ids: [Art. 60 Abs. 4 lit. h, Art. 60 Abs. 4 lit. j]
    setze:
      scope: out
      scope_grund: >-
        Bedingte Pflicht: entsteht nur bei freiwilliger Teilnahme an einem Test unter
        Realbedingungen nach Art. 60, die der Regelfall (Zukauf) nicht vorsieht -
        Wiedervorlage, sobald eine Teilnahme geplant ist.
      befund: null
      befund_grund: null
    bestaetigt: true

# ── Schritt 2b, E1: sieben Zeilen umklassifiziert ────────────────────────────

  - beleg: 2b E1 (steuernd, Massnahme P0)
    raum: aiact
    ids: [Art. 111 Abs. 2 Satz 1]
    setze:
      befund: nicht_einschlaegig
      befund_grund: >-
        Steuernd: Anwendbarkeitsregel. Fuer Hochrisiko-KI-Systeme, die vor dem Beginn der
        Anwendung von Kapitel III (Anhang III: 2. Dezember 2027, Art. 113 Abs. 3 lit. c
        Ziff. i n.F.) in Betrieb genommen wurden, gilt die Verordnung nur nach erheblicher
        Veraenderung der Konzeption. Keine eigene pruefbare Pflicht; ob das eigene System
        darunter faellt, prueft die Massnahme P0 (G-PRE-01, Kopplung an G-OPS-06/C-25b).
    bestaetigt: true

  - beleg: 2b E1 (Erlaubnis)
    raum: aiact
    ids: [Art. 73 Abs. 5]
    setze:
      befund: nicht_einschlaegig
      befund_grund: >-
        Erlaubnis ('kann ... einen unvollstaendigen Erstbericht vorlegen'), keine Pflicht.
        Designvorgabe fuer G-OPS-02: ein Erstbericht muss moeglich sein.
    bestaetigt: true

  - beleg: 2b E1 (anderer Systemtyp)
    raum: aiact
    ids: [Art. 50 Abs. 3, Art. 50 Abs. 4, Art. 50 Abs. 5]
    setze:
      scope: out
      scope_grund: >-
        Systemtyp - Abs. 3 und 4 gelten nur fuer Emotionserkennung, biometrische
        Kategorisierung und Deepfakes; Abs. 5 regelt die Form der Informationen nach
        Abs. 1-4.
      befund: null
      befund_grund: null
    bestaetigt: true

  - beleg: 2b E1 (Adressat Anbieter)
    raum: aiact
    ids: [Art. 49 Abs. 5]
    setze:
      scope: out
      scope_grund: >-
        Adressat Anbieter - die Registrierung nimmt der Anbieter vor (Art. 49 Abs. 1);
        fuer den Betreiber erst relevant, wenn er selbst Anbieter wird (K2/K3).
      befund: null
      befund_grund: null
      verifikation: HYPOTHESE
      hypothese_grund: >-
        Dass die nationale Registrierung nach Abs. 5 beim Anbieter liegt, ist aus
        Art. 49 Abs. 1 abgeleitet; Abs. 5 selbst nennt keinen Adressaten.
    bestaetigt: true

  - beleg: 2b E1 (in, P6)
    raum: aiact
    ids: [Art. 79 Abs. 2]
    setze:
      adressat: betreiber
      scope: in
      scope_grund: >-
        'Die betreffenden Akteure arbeiten ... mit der Marktueberwachungsbehoerde
        zusammen' - Akteur umfasst den Betreiber (Art. 3 Nr. 8).
      befund: luecke
      befund_grund: >-
        Kooperationspflicht der Akteure bei der Bewertung eines Risikos durch die
        Marktueberwachungsbehoerde; kein Requirement und kein Gate bildet sie ab (P6).
      verifikation: HYPOTHESE
      hypothese_grund: >-
        Art. 79 Abs. 2 nennt 'Akteure', nicht den Betreiber; dass er gemeint ist, folgt
        aus der Begriffsbestimmung in Art. 3 Nr. 8, nicht aus Art. 79 selbst.
    bestaetigt: true

