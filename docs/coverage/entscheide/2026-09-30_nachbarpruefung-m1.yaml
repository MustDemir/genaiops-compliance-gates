# PO-Entscheid vom 30.09.2026 — M1a: eine Nachbarpruefung ist keine Pruefung des Elements
#
# Nachweis: docs/coverage/review/07-element-matrix.md (Teil 2 Matrix, Teil 3 Folgen,
# Teil 4 Frage M1) und docs/coverage/review/09-paket-2-omnibus.md Teil 7 (Entscheid).
#
# M1a (streng): Teilabdeckung nur, wenn mindestens ein Element der Pflicht selbst geprueft
# wird (eine Regel schlaegt an, wenn es fehlt oder falsch ist). Prueft ein Gate nur etwas
# Verwandtes, ist die Pflicht eine Luecke; das Gate steht als Hinweis in 'nachbar_gate'
# (M2a), nicht in 'gate'. Grund: Der Pruef-Agent (Paket 9) darf nur urteilen, was eine
# Regel wirklich prueft - ein verwandter Check wuerde sonst eine Pflicht 'teilweise
# decken', die er nicht prueft.
#
# Die neun Zeilen stehen in Review 07 Teil 3. Ziff. ii und iii hatte der PO in T-14.1 als
# Teilabdeckung bestaetigt, die uebrigen in 2c (F1); dieser Entscheid ersetzt das.
# Art. 15 Abs. 3 und Abs. 4 UAbs. 1 Satz 1, 2 folgen, sobald F4 den Anker klaert.
# Die Nachbarn sind die aus der Matrix (Review 07 Teil 2, Zeichen ≈), nicht die bisherigen
# Eintraege im Feld 'gate'.

entschieden: '2026-09-30'
