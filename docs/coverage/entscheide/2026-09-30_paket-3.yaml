# PO-Entscheide vom 30.09.2026 — Paket 3a (T-15): P3-F1 und P3-F2
#
# Nachweis: docs/coverage/review/10-paket-3-werkzeug.md Teil 3 (Fragen) und Teil 4 (Entscheide).
#
# P3-F1 a: Art. 9 Abs. 5 UAbs. 3 ist Risikomanagement des Anbieters. Der Betreiber ist
# Massstab ("die vom Betreiber erwartet werden koennen"), nicht Empfaenger oder Zweck -
# kein Durchschlag (a) nach 2b E4, wie A-F1. Im Audit legt der Anbieter den Beleg vor
# (technische Dokumentation, Anhang IV Nr. 5). Die Betreiberseite - Nutzung nach der
# Betriebsanleitung, kompetente Aufsichtspersonen, Schulung - tragen Art. 26 Abs. 1, 2 und
# Art. 9 Abs. 5 lit. c; die Zeilen bleiben, wie sie sind. Rechtspruefung offen (HYPOTHESE).
#
# P3-F2 a (Sammelbestaetigung): Der Pflichttext jeder Zeile, deren Text der Neuschnitt in
# T-15 Teil 2 geaendert hat (M-B2, A-W11), ist bestaetigt. Der Eintrag setzt genau diesen
# Text; aendert ihn spaeter jemand, meldet PO_DECISIONS_APPLIED das. 'bestaetigt: false',
# weil der PO den Text bestaetigt hat, nicht Befund und Einordnung der Zeile: wo diese
# schon bestaetigt sind, bleibt es dabei (ODER-Verknuepfung in po_entscheide.py); wo nicht
# (Art. 15 Abs. 4, Art. 6 Abs. 3 lit. d), kommen sie mit IN-1 bzw. F4.
# Umfang: 17 Zeilen. Review 10 nannte "13 Saetze"; tatsaechlich sind es 15 Saetze (Art. 111
# Abs. 2 Satz 1 und 2 AI Act, beide 'out' und ersetzt, zaehlten nicht mit) und die zwei
# Glieder Art. 9 Abs. 5 lit. c und Art. 6 Abs. 3 lit. d. Gemessen: Zeilen gleicher uid,
# deren 'pflicht' sich zwischen 5925160 und 6462364 geaendert hat.

entschieden: '2026-09-30'
eintraege:

  - beleg: P3-F1 a (Review 10) - Betreiber ist Massstab, nicht Empfaenger; kein Durchschlag
    raum: aiact
    ids: [Art. 9 Abs. 5 UAbs. 3]
    setze:
      scope: out
      befund: null
      befund_grund: null
      requirement: []
      gate: []
      hypothese_grund: >-
        Durchschlag verneint (PO P3-F1 a, 30.09.2026): der Betreiber ist Massstab der
        Risikominimierung des Anbieters, nicht Empfaenger oder Zweck; Auslegung wie A-F1.
        Beleg im Audit legt der Anbieter vor (Anhang IV Nr. 5). Rechtspruefung offen.
    bestaetigt: true

