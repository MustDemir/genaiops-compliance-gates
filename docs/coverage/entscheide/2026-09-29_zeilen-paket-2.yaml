# PO-Entscheide vom 29.09.2026 zu Paket 2 (Review 09 Teil 3, Antworten Teil 6)
#
# Nachweis: docs/coverage/review/09-paket-2-omnibus.md Teil 6.
#
# P2-F1 a: Aenderungsanweisungen des Omnibus sind out; bewertet wird die n.F.-Zeile.
# P2-F5 a: Omnibus Art. 4 (Inkrafttreten 27.07.2026) ist out.
# P2-F2 a: die bestaetigten Einordnungen von Art. 4, Art. 25 Abs. 2 und Art. 111 Abs. 2
#          Satz 1 gelten fuer ihre Neufassungen weiter (Sammelbestaetigung). Art. 111 Abs. 2
#          Satz 2 war nicht bestaetigt (S3-1) und bleibt Vorschlag; Art. 25 Abs. 2 lit. a-c
#          sind neu und laufen in Paket 3 (P2-B1).
# P2-F3 a: Art. 25 Abs. 2 ist ganz ersetzt - steht schon in
#          2026-09-29_ueberholt-durch-omnibus.yaml.
# P2-F4 c: Art. 4a Abs. 1 und lit. a-f bleiben out (bedingte Pflicht, 2c). Die Wiedervorlage
#          wird maschinell: ein Manifest-Feld special_categories_for_bias und ein Check, der
#          meldet, sobald es true ist (Bau Paket 5). Gedanke des PO: Bedingungsparameter je
#          Anwendungsfall, wie die Rollenparameter aus SPEC-03 - eine andere Branche setzt
#          den Schalter, statt den Pflichtenraum umzubauen.
# R-2 HIGH: OMNIBUS_SUPERSEDED_UNITS_OUT - eine unbewertete Neufassung ist eine unbekannte
#          Luecke, und aus ihr wuerde der Pruef-Agent ein falsches 'konform' machen.

