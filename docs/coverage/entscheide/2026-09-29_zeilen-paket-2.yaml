  - beleg: P2-F2 a (bestaetigte Einordnung gilt fuer die Neufassung weiter)
    raum: omnibus
    ids: [Art. 4 Abs. 1 n.F., Art. 25 Abs. 2 n.F., Art. 111 Abs. 2 Satz 1 n.F.]
    bestaetigt: true

  - beleg: P2-F4 c (bedingte Pflicht out, Wiedervorlage ueber Bedingungsparameter, Bau Paket 5)
    raum: omnibus
    ids:
      - Art. 4a Abs. 1 n.F.
      - Art. 4a Abs. 1 lit. a n.F.
      - Art. 4a Abs. 1 lit. b n.F.
      - Art. 4a Abs. 1 lit. c n.F.
      - Art. 4a Abs. 1 lit. d n.F.
      - Art. 4a Abs. 1 lit. e n.F.
      - Art. 4a Abs. 1 lit. f n.F.
    setze:
      scope: out
      scope_grund: >-
        Adressat (T-13 Schritt 1): Anbieter von Hochrisiko-KI-Systemen (Art. 10 Abs. 2 lit. f, g).
        Den Betreiber binden die Bedingungen nur ueber Abs. 2 lit. b, wenn er die Erlaubnis nutzt,
        besondere Kategorien personenbezogener Daten zur Bias-Erkennung zu verarbeiten - eine
        bedingte Pflicht (2c); fuer Redispatch nicht vorgesehen (PO 29.09.2026, P2-F4 c).
        Wiedervorlage maschinell: Manifest-Feld special_categories_for_bias, ein Check meldet
        diese Einheiten, sobald es true ist (Bau Paket 5).
      hypothese_grund: >-
        Durchschlag verneint, weil Abs. 2 lit. b die Bedingungen nur fuer den Fall der Nutzung
        der Erlaubnis anordnet. Dass der Betreiber sie fuer Redispatch nicht nutzt, hat der PO
        festgestellt (P2-F4 c); Auslegung bleibt die Einordnung als bedingte Pflicht.
    bestaetigt: true
