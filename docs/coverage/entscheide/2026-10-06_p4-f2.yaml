    raum: aiact
    ids: [Art. 3 Nr. 3]
    setze:
      pflicht: 'Begriff ''Anbieter'': natuerliche oder juristische Person, Behoerde, Einrichtung oder sonstige Stelle, die ein KI-System oder ein KI-Modell mit allgemeinem Verwendungszweck entwickelt oder entwickeln laesst und es unter eigenem Namen oder eigener Handelsmarke in Verkehr bringt oder das KI-System so in Betrieb nimmt, entgeltlich oder unentgeltlich.'
