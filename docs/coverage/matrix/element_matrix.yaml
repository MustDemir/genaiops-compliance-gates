    - {gate: G-OPS-06, check: C-25b, feld: change_event.substantial_modification.modified}
    - {gate: G-OPS-06, check: C-25c, feld: change_event.purpose_change.changed}
  - element: Folge - Anbieterpflichten nach Art. 16
    status: ungeprueft

- raum: aiact
  id: Art. 25 Abs. 1 lit. a
  elemente:
  - element: eigener Name oder eigene Marke auf einem bereits in Verkehr gebrachten Hochrisiko-System
    status: geprueft
    regeln:
    - {gate: G-OPS-06, check: C-25a, feld: change_event.system_already_on_market}
    - {gate: G-OPS-06, check: C-25a, feld: change_event.rebranding.own_name_or_trademark_applied}

- raum: aiact
  id: Art. 25 Abs. 1 lit. b
  elemente:
  - element: wesentliche Veraenderung, System bleibt Hochrisiko
    status: geprueft
    regeln:
    - {gate: G-OPS-06, check: C-25b, feld: change_event.substantial_modification.modified}
    - {gate: G-OPS-06, check: C-25b, feld: change_event.substantial_modification.remains_high_risk_art6}

- raum: aiact
  id: Art. 25 Abs. 1 lit. c
