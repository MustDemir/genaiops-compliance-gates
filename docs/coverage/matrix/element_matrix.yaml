    - {gate: G-OPS-06, check: C-25c, feld: change_event.purpose_change.after}

# ── Art. 26 – Betreiberpflichten ─────────────────────────────────────────────────────────

- raum: aiact
  id: Art. 26 Abs. 1
  elemente:
  - element: technische und organisatorische Massnahmen, die die Verwendung nach der Anleitung
      (und nach Abs. 3 und 6) sicherstellen
    status: nachbar
    regeln:
    - {gate: G-DEP-04, check: C-01, feld: conformity_assessment.provider_documentation_received}
    - {gate: G-DEP-04, check: C-01, feld: conformity_assessment.ce_marking_verified}

- raum: aiact
  id: Art. 26 Abs. 2
  elemente:
  - element: menschliche Aufsicht natuerlichen Personen uebertragen
    status: geprueft
    regeln:
    - {gate: G-OPS-01, check: C-01, feld: human_oversight.oversight_roles}
    - {gate: G-PRE-05, check: C-01, feld: human_oversight.human_oversight_lead}
  - element: Eskalationsweg fuer die Aufsichtspersonen (Teil der Unterstuetzung)
    status: geprueft
    regeln:
    - {gate: G-OPS-01, check: C-01, feld: human_oversight.escalation_procedure}
  - element: Kompetenz, Ausbildung, Befugnis und die uebrige Unterstuetzung
    status: nachbar
    hinweis: C-A7 verlangt einen Wirksamkeitsnachweis nur, wenn die Art.-6-Einstufung eine
      menschliche Kontrolle behauptet (SHOULD).
    regeln:
    - {gate: G-PRE-01, check: C-A7, feld: art6_assessment.arm_b_failure_impact.human_control_effectiveness_evidence_ref}

- raum: aiact
  id: Art. 26 Abs. 4
  elemente:
  - element: Eingabedaten entsprechen der Zweckbestimmung und sind ausreichend repraesentativ
    status: nachbar
    hinweis: G-DEP-01 prueft Trainingsdaten des Anbieters, nicht Eingabedaten des Betreibers.
    regeln:
    - {gate: G-DEP-01, check: C-01, feld: data_provenance.sources}

- raum: aiact
  id: Art. 26 Abs. 5 UAbs. 1 Satz 1
  elemente:
  - element: Betrieb anhand der Betriebsanleitung ueberwachen
    status: geprueft
    regeln:
    - {gate: G-OPS-01, check: C-01, feld: human_oversight.intervention_capability.real_time_monitoring}
    - {gate: G-OPS-03, check: C-03, feld: drift_measurement.measured_at}
    - {gate: G-OPS-03, check: C-04, feld: drift_measurement.psi_score}
  - element: gegebenenfalls die Anbieter nach Art. 72 informieren
    status: ungeprueft

- raum: aiact
  id: Art. 26 Abs. 5 UAbs. 1 Satz 2
  elemente:
  - element: bei Grund zur Annahme eines Risikos nach Art. 79 Abs. 1 unverzueglich Anbieter oder
      Haendler und Marktueberwachungsbehoerde informieren
    status: ungeprueft
  - element: Verwendung aussetzen
    status: nachbar
    hinweis: Die Stopptaste ist dokumentiert; das Aussetzen bei Risiko ist keine Regel.
    regeln:
    - {gate: G-PRE-05, check: C-01, feld: human_oversight.intervention_capability.kill_switch}

- raum: aiact
  id: Art. 26 Abs. 5 UAbs. 1 Satz 3
  elemente:
  - element: Meldeprozess fuer schwerwiegende Vorfaelle mit benannter Stelle eingerichtet
    status: geprueft
    regeln:
    - {gate: G-OPS-02, check: C-01, feld: 'annotations[genaiops.io/incident-response-configured]'}
    - {gate: G-OPS-02, check: C-01, feld: 'annotations[genaiops.io/incident-contact]'}
  - element: unverzueglich zuerst den Anbieter, dann Einfuehrer oder Haendler und die Behoerden
      informieren (Reihenfolge)
    status: ungeprueft

- raum: aiact
  id: Art. 26 Abs. 5 UAbs. 1 Satz 4
  elemente:
  - element: Fristen des Art. 73 deklariert
    status: geprueft
    regeln:
    - {gate: G-OPS-02, check: C-04, feld: 'deadlines[].hours'}
  - element: Ausloeser - Anbieter nicht erreichbar
    status: ungeprueft

- raum: aiact
  id: Art. 26 Abs. 6
  hinweis: Satz 2 (Betreiber, die Finanzinstitute sind) trifft den Netzbetreiber nicht und ist kein
    Element dieser Zeile.
  elemente:
  - element: automatisch erzeugte Protokolle aufbewahren
