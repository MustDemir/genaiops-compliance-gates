    regeln:
    - {gate: G-DEP-06, check: C-01, feld: logging_configuration.log_accessibility}

- raum: aiact
  id: Art. 26 Abs. 7
  elemente:
  - element: Arbeitnehmervertreter und betroffene Arbeitnehmer vor Inbetriebnahme informieren
    status: ungeprueft

- raum: aiact
  id: Art. 26 Abs. 11
  vorbehalt:
    frage: Q11
    grund: PO P3-F4 b (01.10.2026) - die Zeile bleibt Teilabdeckung mit G-DEP-03, bis Q11 klaert,
      ob Abs. 11 fuer Redispatch gilt; abgeleitet waere sie Luecke.
  elemente:
  - element: betroffene natuerliche Personen informieren, dass sie der Verwendung unterliegen
    status: nachbar
    hinweis: ai_content_labeling ist Art. 50 - den nimmt Abs. 11 ausdruecklich aus ("unbeschadet").
      Ob Abs. 11 fuer Redispatch gilt, bleibt Q11.
    regeln:
    - {gate: G-DEP-03, check: C-01, feld: transparency.ai_content_labeling.enabled}

# ── Art. 73 – Meldung schwerwiegender Vorfaelle (fuer den Betreiber ueber Art. 26 Abs. 5 Satz 4) ─

- raum: aiact
  id: Art. 73 Abs. 1
  elemente:
  - element: Meldeprozess mit benannter Stelle eingerichtet
    status: geprueft
    regeln:
    - {gate: G-OPS-02, check: C-01, feld: 'annotations[genaiops.io/incident-response-configured]'}
    - {gate: G-OPS-02, check: C-01, feld: 'annotations[genaiops.io/incident-contact]'}
  - element: schwerwiegende Vorfaelle der zustaendigen Behoerde melden (Meldung selbst)
    status: ungeprueft
  - element: fuer den Betreiber nur, wenn der Anbieter nicht erreichbar ist
    status: ungeprueft

- raum: aiact
  id: Art. 73 Abs. 2 UAbs. 1 Satz 1
  elemente:
  - element: spaetestens 15 Tage (360 h)
    status: geprueft
    regeln:
    - {gate: G-OPS-02, check: C-04, feld: 'deadlines[].hours'}
  - element: unmittelbar nach Feststellung des Zusammenhangs; Fristbeginn bei Kenntnis des Betreibers
    status: ungeprueft

- raum: aiact
  id: Art. 73 Abs. 2 UAbs. 2 Satz 1
  elemente:
  - element: Meldezeitraum nach Schwere gestuft
    status: geprueft
    regeln:
    - {gate: G-OPS-02, check: C-04, feld: 'deadlines[].id'}
    - {gate: G-OPS-02, check: C-04, feld: 'deadlines[].hours'}

- raum: aiact
  id: Art. 73 Abs. 3
  elemente:
  - element: weitverbreiteter Verstoss oder Vorfall nach Art. 3 Nr. 49 lit. b - spaetestens 2 Tage (48 h)
    status: geprueft
    regeln:
    - {gate: G-OPS-02, check: C-04, feld: 'deadlines[].hours'}

- raum: aiact
  id: Art. 73 Abs. 4
  elemente:
  - element: Tod einer Person - spaetestens 10 Tage (240 h)
    status: geprueft
    regeln:
    - {gate: G-OPS-02, check: C-04, feld: 'deadlines[].hours'}

- raum: aiact
  id: Art. 73 Abs. 5
  elemente:
  - element: unvollstaendiger Erstbericht moeglich (Erlaubnis, keine Pflicht)
    status: ungeprueft

- raum: aiact
  id: Art. 73 Abs. 9
  elemente:
  - element: Meldung auf Vorfaelle nach Art. 3 Nr. 49 lit. c reduziert
    status: geprueft
    regeln:
    - {gate: G-OPS-02, check: C-02, feld: deployer_context.ai_act_scope_reduced_to}
  - element: Bedingung - der Anbieter unterliegt gleichwertigen Meldepflichten
    status: ungeprueft

# ── Omnibus: Art. 25 Abs. 2 n.F. (P2-B1) ─────────────────────────────────────────────────

- raum: omnibus
  id: Art. 25 Abs. 2 n.F.
  elemente:
  - element: Erstanbieter arbeitet eng mit dem neuen Anbieter zusammen (Zusage belegt)
    status: geprueft
    regeln:
    - {gate: G-OPS-06, check: C-25d, feld: change_event.evidence.cooperation_commitment_ref}
  - element: erforderliche Informationen uebergeben (Uebergabebeleg liegt vor)
    status: geprueft
    regeln:
    - {gate: G-OPS-06, check: C-25d, feld: change_event.evidence.provider_handover_record}
  - element: technischer Zugang und sonstige Unterstuetzung
    status: ungeprueft

- raum: omnibus
  id: Art. 25 Abs. 2 lit. a n.F.
  elemente:
  - element: technische Unterlagen, ausreichend fuer die Bewertung nach Art. 16
    status: nachbar
    hinweis: Behaelter - C-25d verlangt den Uebergabebeleg, sieht aber nicht hinein (wie Ziff. vii;
      PO P3-F3 a, 01.10.2026).
    regeln:
    - {gate: G-OPS-06, check: C-25d, feld: change_event.evidence.provider_handover_record}

- raum: omnibus
  id: Art. 25 Abs. 2 lit. b n.F.
  elemente:
  - element: Unterrichtung ueber bekannte Einschraenkungen und Fehlerarten
    status: nachbar
    hinweis: Behaelter - C-25d verlangt den Uebergabebeleg, sieht aber nicht hinein (wie Ziff. vii;
      PO P3-F3 a, 01.10.2026).
    regeln:
    - {gate: G-OPS-06, check: C-25d, feld: change_event.evidence.provider_handover_record}

- raum: omnibus
  id: Art. 25 Abs. 2 lit. c n.F.
  elemente:
  - element: gezielter technischer Zugang, auch zu Test- und Validierungszwecken
    status: nachbar
    hinweis: Behaelter - C-25d verlangt den Uebergabebeleg, sieht aber nicht hinein (wie Ziff. vii;
      PO P3-F3 a, 01.10.2026).
    regeln:
    - {gate: G-OPS-06, check: C-25d, feld: change_event.evidence.provider_handover_record}

- raum: omnibus
  id: Art. 25 Abs. 2 UAbs. 4 n.F.
  elemente:
  - element: Ausnahme belegt - der Erstanbieter hat die Umwandlung in ein Hochrisiko-System
      eindeutig ausgeschlossen
    status: geprueft
    regeln:
    - {gate: G-OPS-06, check: C-25d, feld: change_event.evidence.initial_provider_excluded_high_risk_conversion}
    - {gate: G-OPS-06, check: C-25d, feld: change_event.evidence.initial_provider_exclusion_ref}
