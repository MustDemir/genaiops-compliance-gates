- uid: § 5d Abs. 3@9210
  id: § 5d Abs. 3
  artikel: § 5d
  artikel_titel: Dokumentations-, Melde-, Registrierungspflicht
  absatz: '3'
  buchstabe: null
  offset: 9210
  laenge: 1555
  saetze: 1
  beleg: '(3) Der Betreiber nach § 5c Absatz 1 Satz 1 Nummer 1 bis 3 ist verpflichtet, der Meldestelle
    nach § 32 des BSI-Gesetzes folgende Informationen zu melden: 1. unverzüglich, spätestens jedoch innerhalb
    von 24 Stunden nach Kenntniserlangung von einem erheblichen Sicherheitsvorfall nach § 2 Nummer 11
    des BSI-Gesetzes: eine frühe Erstmeldung, in der angegeben wird, ob der Verdacht besteht, dass der
    erhebliche Sicherheitsvorfall auf eine rechtswidrige oder eine böswillige Handlung zurückzuführen
    ist oder dass er grenzüberschreitende Auswirkungen haben könnte, 2. unverzüglich, spätestens jedoch
    innerhalb von 72 Stunden nach Kenntniserlangung von einem erheblichen Sicherheitsvorfall nach § 2
    Nummer 11 des BSI-Gesetzes: eine Meldung über den erheblichen Sicherheitsvorfall, in der die in Nummer
    1 genannten Informationen bestätigt oder aktualisiert werden und in der eine erste Bewertung des erheblichen
    Sicherheitsvorfalls vorgenommen wird, einschließlich der Bewertung seines Schweregrads und seiner
    Auswirkungen und einschließlich der Angabe der Kompromittierungsfaktoren, 3. auf Ersuchen des Bundesamtes
    für Sicherheit in der Informationstechnik eine Zwischenmeldung über relevante Statusaktualisierungen,
    4. spätestens einen Monat nach Übermittlung der Meldung des erheblichen Sicherheitsvorfalls nach §
    2 Nummer 11 des BSI-Gesetzes eine Abschlussmeldung, die Folgendes enthält: a) eine ausführliche Beschreibung
    des erheblichen Sicherheitsvorfalls nach § 2 Nummer 11 des BSI-Gesetzes, einschließlich seines Schweregrads
    und seiner Auswirkungen,'
