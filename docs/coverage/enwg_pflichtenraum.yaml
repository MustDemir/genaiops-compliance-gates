- uid: § 32 Abs. 1@17392
  id: § 32 Abs. 1
  artikel: § 32
  artikel_titel: Absatz 2 bis 5 und § 36 des BSI-Gesetzes sind entsprechend anzuwenden. Bei Meldungen
    nach diesem Absatz trifft das Bundesamt für Sicherheit in der Informationstechnik Maßnahmen nach §
    36 des BSI-Gesetzes im Benehmen mit der Bundesnetzagentur.
  absatz: '1'
  buchstabe: null
  offset: 17392
  laenge: 1297
  saetze: 5
  beleg: (1) Betreiber von Energieversorgungsnetzen sind verpflichtet, ein sicheres, zuverlässiges und
    leistungsfähiges Energieversorgungsnetz diskriminierungsfrei zu betreiben, zu warten und bedarfsgerecht
    zu optimieren, zu verstärken und auszubauen, soweit es wirtschaftlich zumutbar ist; dabei sind die
    Erfordernisse im Verkehrs-, Wärme-, Industrie- und Strombereich zu beachten, die sich ergeben, um
    Treibhausgasneutralität zu ermöglichen. Betreiber von Energieversorgungsnetzen haben insbesondere
    die Aufgaben nach den §§ 12 bis 16a zu erfüllen. Sie nehmen diese Aufgaben für ihr Energieversorgungsnetz
    in eigener Verantwortung wahr. Sie kooperieren und unterstützen sich bei der Wahrnehmung dieser Aufgaben;
    dies ist insbesondere für Maßnahmen anzuwenden, die sich auf das Netz eines anderen Betreibers von
    Energieversorgungsnetzen auswirken können. Die Verpflichtungen sind auch anzuwenden im Rahmen der
    Wahrnehmung der wirtschaftlichen Befugnisse der Leitung des vertikal integrierten Unternehmens und
    seiner Aufsichtsrechte nach § 7a Absatz 4 Satz 3. Der Ausbau eines L-Gasversorgungsnetzes ist nicht
    bedarfsgerecht im Sinne von Satz 1, wenn er auf Grund von Netzanschlüssen erfolgen muss, zu deren
    Einräumung der Betreiber des L-Gasversorgungsnetzes nicht nach den §§ 17 und 18 verpflichtet war.
