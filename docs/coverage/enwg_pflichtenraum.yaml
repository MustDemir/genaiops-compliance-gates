- uid: § 5c Abs. 2@1383
  id: § 5c Abs. 2
  artikel: § 5c
  artikel_titel: IT-Sicherheit im Anlagen- und im Netzbetrieb, Festlegungskompetenz
  abschnitt: null
  absatz: '2'
  nummer: null
