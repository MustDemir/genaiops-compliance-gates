- uid: § 11 Abs. 2@1512
  id: § 11 Abs. 2
  artikel: § 11
  artikel_titel: Betrieb von Energieversorgungsnetzen; Verordnungsermächtigung
  absatz: '2'
  buchstabe: null
  offset: 1512
  laenge: 2776
  saetze: 9
  beleg: (2) Für einen bedarfsgerechten, wirtschaftlich zumutbaren Ausbau der Elektrizitätsversorgungsnetze
    nach Absatz 1 Satz 1 können Betreiber von Elektrizitätsversorgungsnetzen den Berechnungen für ihre
    Netzplanung die Annahme zugrunde legen, dass die prognostizierte jährliche Stromerzeugung je unmittelbar
    an ihr Netz angeschlossener Anlage zur Erzeugung von elektrischer Energie aus Windenergie an Land
    oder solarer Strahlungsenergie um bis zu 3 Prozent reduziert werden darf (Spitzenkappung). Betreiber
    von Elektrizitätsversorgungsnetzen, die für ihre Netzplanung eine Spitzenkappung zugrunde gelegt haben,
    müssen dies 1. auf ihrer Internetseite veröffentlichen, 2. dem Betreiber des vorgelagerten Elektrizitätsversorgungsnetzes,
    dem Betreiber des Übertragungsnetzes, der Bundesnetzagentur sowie der zuständigen Landesregulierungsbehörde
    unverzüglich mitteilen und 3. im Rahmen der Netzplanung für einen sachkundigen Dritten nachvollziehbar
    dokumentieren. Die Dokumentation nach Satz 2 Nummer 3 muss der Bundesnetzagentur, der zuständigen
    Landesregulierungsbehörde, dem Betreiber des vorgelagerten Elektrizitätsversorgungsnetzes, dem Betreiber
    des Übertragungsnetzes, einem Einspeisewilligen sowie einem an das Netz angeschlossenen Anlagenbetreiber
    auf Verlangen unverzüglich vorgelegt werden. Die §§ 13 und 14 und § 11 des Erneuerbare-Energien-Gesetzes
    bleiben unberührt. Ein Betreiber des Elektrizitätsversorgungsnetzes, der Kosten für die Reduzierung
    der Einspeisung von mehr als 3 Prozent der jährlichen Stromerzeugung einer Anlage zur Erzeugung von
    Strom aus erneuerbaren Energien, Grubengas oder Kraft-Wärme-Kopplung bei der Ermittlung seiner Netzentgelte
    in Ansatz bringt, muss der Bundesnetzagentur sowie der zuständigen Landesregulierungsbehörde den Umfang
    der und die Ursachen für die Reduzierung der Einspeisung mitteilen und im Fall einer Spitzenkappung
    die Dokumentation nach Satz 2 Nummer 3 vorlegen. (2a) Die Betreiber von Übertragungsnetzen sind verpflichtet,
    Handelstransaktionen innerhalb des Gebiets der Bundesrepublik Deutschland ohne Kapazitätsvergabe in
    der Weise zu ermöglichen, dass das Gebiet der Bundesrepublik Deutschland eine einheitliche Stromgebotszone
    bildet. Sie dürfen insbesondere nicht einseitig eine Kapazitätsvergabe einführen, die zu einer einseitigen
    Aufteilung der einheitlichen deutschen Stromgebotszone führen würde. Sobald für einen Betreiber eines
    Übertragungsnetzes erkennbar wird, dass die Erfüllung der Pflicht nach Satz 1 und die Einhaltung des
    Verbots nach Satz 2 unmöglich zu werden drohen, hat er dies der Bundesnetzagentur unverzüglich in
    Textform anzuzeigen. § 20 Absatz 2 sowie die Artikel 14 bis 17 der Verordnung (EU) 2019/943 in der
    Fassung vom 13. Juni 2024 und die Verordnung (EU) 2015/1222 bleiben unberührt.
