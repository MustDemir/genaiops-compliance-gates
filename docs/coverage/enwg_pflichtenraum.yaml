- uid: § 5d Abs. 5@13407
  id: § 5d Abs. 5
  artikel: § 5d
  artikel_titel: Dokumentations-, Melde-, Registrierungspflicht
  abschnitt: null
  absatz: '5'
  nummer: null
  unterabsatz: null
  buchstabe: null
  ziffer: null
  offset: 13407
  laenge: 2758
  saetze: 12
  beleg: (5) Das Bundesamt für Sicherheit in der Informationstechnik hat die Hinweise oder Informationen
    nach Absatz 2 und solche Meldungen über Sicherheitsvorfälle nach § 32 des BSI-Gesetzes, bei denen
    das Bundesamt für Sicherheit in der Informationstechnik Kenntnis von einer Relevanz für die Energieversorgungssicherheit
    und die Erfüllung der Zwecke und Ziele nach § 1 erlangt, unverzüglich an die Bundesnetzagentur weiterzuleiten.
    Die Bundesnetzagentur führt unverzüglich eine Bewertung der Auswirkungen des nach Satz 1 übermittelten
    Sicherheitsvorfalls auf die Energieversorgungssicherheit durch und übermittelt ihre Ergebnisse an
    das Bundesamt für Sicherheit in der Informationstechnik. Die Bundesnetzagentur kann von dem betroffenen
    Unternehmen die Herausgabe der zur Bewertung der Auswirkungen des Sicherheitsvorfalls auf die Energieversorgungssicherheit
    notwendigen Informationen, einschließlich personenbezogener Daten, verlangen. Sie ist befugt, zur
    Bewertung der Auswirkungen des Sicherheitsvorfalls auf die Energieversorgungssicherheit erforderliche
    personenbezogene Daten zu erheben, zu speichern und zu verwenden. Das betroffene Unternehmen hat der
    Bundesnetzagentur die zur Bewertung der Auswirkungen des Sicherheitsvorfalls auf die Energieversorgungssicherheit
    notwendigen Informationen, einschließlich personenbezogener Daten, zu übermitteln. Die Bundesnetzagentur
    kann bei der Durchführung der Bewertung nach Satz 2 die Betreiber von Übertragungs-, von Fernleitungs-
    sowie von Verteilernetzen einbeziehen und ist befugt, ihnen die hierzu erforderlichen personenbezogenen
    Daten zu übermitteln. Die Betreiber von Übertragungs-, von Fernleitungs- sowie von Verteilernetzen
    sind befugt, die ihnen nach Satz 5 zum dort genannten Zweck übermittelten personenbezogenen Daten
    zu erheben, zu speichern und zu verwenden. Nach Erstellung der Bewertung sind die hierzu gespeicherten
    und verwendeten personenbezogenen Daten von der Bundesnetzagentur und den Betreibern von Übertragungs-,
    von Fernleitungs- sowie von Verteilernetzen unverzüglich zu löschen. Das Bundesamt für Sicherheit
    in der Informationstechnik berücksichtigt die Bewertung der Bundesnetzagentur bei der Erfüllung der
    Aufgaben nach § 40 Absatz 3 Nummer 2 des BSI-Gesetzes. Das Bundesamt für Sicherheit in der Informationstechnik
    und die Bundesnetzagentur haben jeweils sicherzustellen, dass die unbefugte Offenbarung der ihnen
    nach Satz 1 zur Kenntnis gelangten Hinweise und Meldungen ausgeschlossen wird. Zugang zu den Akten
    des Bundesamtes für Sicherheit in der Informationstechnik sowie zu den Akten der Bundesnetzagentur
    in Angelegenheiten nach § 5c Absatz 1 bis 5 und den Absätzen 1 bis 4 sowie dieses Absatzes wird nicht
    gewährt. § 29 des Verwaltungsverfahrensgesetzes bleibt unberührt.
