- uid: § 32 Abs. 4@11443
  id: § 32 Abs. 4
  artikel: § 32
  artikel_titel: Absatz 2 bis 5 und § 36 des BSI-Gesetzes sind entsprechend anzuwenden. Bei Meldungen
    nach diesem Absatz trifft das Bundesamt für Sicherheit in der Informationstechnik Maßnahmen nach §
    36 des BSI-Gesetzes im Benehmen mit der Bundesnetzagentur.
  absatz: '4'
  buchstabe: null
  offset: 11443
  laenge: 1964
  saetze: 7
  beleg: (4) Der Betreiber eines Energieversorgungsnetzes, der keine besonders wichtige Einrichtung nach
    § 28 Absatz 1 des BSI-Gesetzes oder keine wichtige Einrichtung nach § 28 Absatz 2 des BSI-Gesetzes
    ist, ist verpflichtet, spätestens bis zum Ablauf des 6. März 2026 dem Bundesamt für Sicherheit in
    der Informationstechnik die Angaben nach § 33 Absatz 1 Nummer 1 bis 4 des BSI-Gesetzes zur Registrierung
    zu übermitteln. § 33 Absatz 2 bis 5 des BSI-Gesetzes ist für den in Satz 1 genannten Betreiber entsprechend
    anzuwenden mit der Maßgabe, dass das Bundesamt für Sicherheit in der Informationstechnik die Registrierung
    auch selbst vornehmen und eine Kontaktstelle benennen kann, wenn der Betreiber seine Pflicht zur Registrierung
    nicht erfüllt. Nimmt das Bundesamt für Sicherheit in der Informationstechnik eine solche Registrierung
    selbst vor, so informiert es sowohl den betreffenden Betreiber als auch die Bundesnetzagentur darüber
    und übermittelt die damit verbundenen Kontaktdaten. Jeder Betreiber hat sicherzustellen, dass er über
    die von ihm benannte oder durch die durch das Bundesamt für Sicherheit in der Informationstechnik
    festgelegte Kontaktstelle jederzeit erreichbar ist. Für den Betreiber eines Energieversorgungsnetzes,
    der eine besonders wichtige Einrichtung nach § 28 Absatz 1 des BSI-Gesetzes oder eine wichtige Einrichtung
    nach § 28 Absatz 2 des BSI-Gesetzes ist und für Betreiber nach § 5c Absatz 1 Satz 1 Nummer 2 und 3
    ist § 33 des BSI-Gesetzes auch mit den in den Sätzen 2 bis 4 enthaltenen Maßgaben anzuwenden. Das
    Bundesamt für Sicherheit in der Informationstechnik übermittelt die durch die Registrierung der Betreiber
    nach § 5c Absatz 1 Satz 1 Nummer 1 bis 3 erhaltenen Daten sowie jede Änderung der Registrierungen
    unverzüglich an die Bundesnetzagentur. Die Übermittlung von Informationen durch das Bundesamt für
    Sicherheit in der Informationstechnik nach § 40 Absatz 3 Nummer 4 Buchstabe a des BSI-Gesetzes erfolgt
    an diese Kontaktstelle.
