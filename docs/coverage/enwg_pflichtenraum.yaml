  saetze: 8
  beleg: 3. im Rahmen der Netzplanung für einen sachkundigen Dritten nachvollziehbar dokumentieren. Die
    Dokumentation nach Satz 2 Nummer 3 muss der Bundesnetzagentur, der zuständigen Landesregulierungsbehörde,
    dem Betreiber des vorgelagerten Elektrizitätsversorgungsnetzes, dem Betreiber des Übertragungsnetzes,
    einem Einspeisewilligen sowie einem an das Netz angeschlossenen Anlagenbetreiber auf Verlangen unverzüglich
    vorgelegt werden. Die §§ 13 und 14 und § 11 des Erneuerbare-Energien-Gesetzes bleiben unberührt. Ein
    Betreiber des Elektrizitätsversorgungsnetzes, der Kosten für die Reduzierung der Einspeisung von mehr
    als 3 Prozent der jährlichen Stromerzeugung einer Anlage zur Erzeugung von Strom aus erneuerbaren
    Energien, Grubengas oder Kraft-Wärme-Kopplung bei der Ermittlung seiner Netzentgelte in Ansatz bringt,
    muss der Bundesnetzagentur sowie der zuständigen Landesregulierungsbehörde den Umfang der und die
    Ursachen für die Reduzierung der Einspeisung mitteilen und im Fall einer Spitzenkappung die Dokumentation
    nach Satz 2 Nummer 3 vorlegen. (2a) Die Betreiber von Übertragungsnetzen sind verpflichtet, Handelstransaktionen
    innerhalb des Gebiets der Bundesrepublik Deutschland ohne Kapazitätsvergabe in der Weise zu ermöglichen,
    dass das Gebiet der Bundesrepublik Deutschland eine einheitliche Stromgebotszone bildet. Sie dürfen
    insbesondere nicht einseitig eine Kapazitätsvergabe einführen, die zu einer einseitigen Aufteilung
    der einheitlichen deutschen Stromgebotszone führen würde. Sobald für einen Betreiber eines Übertragungsnetzes
    erkennbar wird, dass die Erfüllung der Pflicht nach Satz 1 und die Einhaltung des Verbots nach Satz
    2 unmöglich zu werden drohen, hat er dies der Bundesnetzagentur unverzüglich in Textform anzuzeigen.
    § 20 Absatz 2 sowie die Artikel 14 bis 17 der Verordnung (EU) 2019/943 in der Fassung vom 13. Juni
    2024 und die Verordnung (EU) 2015/1222 bleiben unberührt.
