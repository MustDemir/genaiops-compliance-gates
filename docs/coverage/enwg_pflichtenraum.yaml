- uid: § 11 Abs. 3@4288
  id: § 11 Abs. 3
  artikel: § 11
  artikel_titel: Betrieb von Energieversorgungsnetzen; Verordnungsermächtigung
  absatz: '3'
  buchstabe: null
  offset: 4288
  laenge: 1220
  saetze: 4
  beleg: (3) In Rechtsverordnungen über die Regelung von Vertrags- und sonstigen Rechtsverhältnissen nach
    § 17 Absatz 3 oder nach § 18 Absatz 3 können auch Regelungen zur Haftung der Betreiber von Energieversorgungsnetzen
    aus Vertrag und unerlaubter Handlung für Sach- und Vermögensschäden, die ein Kunde durch Unterbrechung
    der Energieversorgung oder durch Unregelmäßigkeiten in der Energieversorgung erleidet, getroffen werden.
    Die Bundesregierung wird ermächtigt, durch Rechtsverordnung mit Zustimmung des Bundesrates die Haftung
    der Betreiber von Energieversorgungsnetzen aus Vertrag und unerlaubter Handlung für Sach- oder Vermögensschäden,
    die ein Netznutzer durch Störungen der Netznutzung erleidet, zu regeln. In Rechtsverordnungen nach
    Satz 1 oder 2 kann die Haftung insbesondere auf vorsätzliche oder grob fahrlässige Verursachung beschränkt
    und der Höhe nach begrenzt werden. Soweit es zur Vermeidung unzumutbarer wirtschaftlicher Risiken
    des Netzbetriebs im Zusammenhang mit Verpflichtungen nach § 13 Absatz 2, § 13b Absatz 5 und § 13f
    Absatz 1, auch in Verbindung mit § 14, und § 16 Absatz 2 und 2a, auch in Verbindung mit § 16a, erforderlich
    ist, kann die Haftung darüber hinaus vollständig ausgeschlossen werden.
