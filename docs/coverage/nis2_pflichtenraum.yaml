- uid: Art. 12 Abs. 2@193271
  id: Art. 12 Abs. 2
  artikel: '12'
  artikel_titel: Koordinierte Offenlegung von Schwachstellen und eine europäische Schwachstellendatenbank
  absatz: '2'
  buchstabe: null
  offset: 193271
  laenge: 873
  saetze: 4
  beleg: '(2)   Die ENISA entwickelt und pflegt nach Absprache mit der Kooperationsgruppe eine europäische
    Schwachstellendatenbank. Zu diesem Zweck führt die ENISA geeignete Informationssysteme, Konzepte und
    Verfahren ein, pflegt diese und trifft die erforderlichen technischen und organisatorischen Maßnahmen,
    um die Sicherheit und Integrität der europäischen Schwachstellendatenbank zu gewährleisten, damit
    insbesondere Einrichtungen, unabhängig davon, ob sie in den Anwendungsbereich dieser Richtlinie fallen,
    und deren Anbieter von Netz- und Informationssystemen auf freiwilliger Basis öffentlich bekannte Schwachstellen
    in IKT-Produkten oder -Diensten offenlegen und registrieren können. Allen Interessenträgern wird Zugang
    zu den Informationen über die Schwachstellen gewährt, die in der europäischen Schwachstellendatenbank
    enthalten sind. Diese Datenbank umfasst Folgendes:'
