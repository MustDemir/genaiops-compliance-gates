  artikel: '40'
  artikel_titel: Überprüfung
  absatz: '-'
  buchstabe: null
  offset: 280628
  laenge: 796
  saetze: 4
  beleg: Bis zum 17. Oktober 2027 und danach alle 36 Monate überprüft die Kommission die Anwendung dieser
    Richtlinie und erstattet dem Europäischen Parlament und dem Rat Bericht. In dem Bericht wird insbesondere
    die Relevanz der Größe der betreffenden Einrichtungen, und der Sektoren, der Teilsektoren und der
    Arten der in den Anhängen I und II genannten Einrichtung für das Funktionieren der Wirtschaft und
    Gesellschaft in Bezug auf die Cybersicherheit bewertet. Zu diesem Zweck berücksichtigt die Kommission
    im Hinblick auf die weitere Förderung der strategischen und operativen Zusammenarbeit die Berichte
    der Kooperationsgruppe und des CSIRTs-Netzwerks über die auf strategischer und operativer Ebene gemachten
    Erfahrungen. Dem Bericht ist erforderlichenfalls ein Gesetzgebungsvorschlag beizufügen.
