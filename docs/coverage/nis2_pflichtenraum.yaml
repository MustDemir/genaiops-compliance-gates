- uid: Art. 32 Abs. 6@260422
  id: Art. 32 Abs. 6
  artikel: '32'
  artikel_titel: Aufsichts- und Durchsetzungsmaßnahmen in Bezug auf wesentliche Einrichtungen
  absatz: '6'
  buchstabe: null
  offset: 260422
  laenge: 813
  saetze: 3
  beleg: (6)   Die Mitgliedstaaten stellen sicher, dass jede natürliche Person, die für eine wesentliche
    Einrichtung verantwortlich ist oder auf der Grundlage ihrer Vertretungsbefugnis, der Befugnis, im
    Namen der Einrichtung Entscheidungen zu treffen, oder ihrer Kontrollbefugnis über die Einrichtung
    als Vertreterin der wesentlichen Einrichtung handelt, befugt ist zu gewährleisten, dass die Einrichtung
