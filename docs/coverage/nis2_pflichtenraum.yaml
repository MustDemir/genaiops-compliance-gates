- uid: Art. 4 Abs. 1@160012
  id: Art. 4 Abs. 1
  artikel: '4'
  artikel_titel: Sektorspezifische Rechtsakte der Union
  absatz: '1'
  buchstabe: null
  offset: 160012
  laenge: 868
  saetze: 2
  beleg: (1)   Wenn wesentliche oder wichtige Einrichtungen gemäß sektorspezifischen Rechtsakten der Union
    entweder Maßnahmen zum Cybersicherheitsrisikomanagement ergreifen oder erhebliche Sicherheitsvorfälle
    melden müssen und wenn die entsprechenden Anforderungen in ihrer Wirkung den in dieser Richtlinie
    festgelegten Verpflichtungen zumindest gleichwertig sind, finden die einschlägigen Bestimmungen dieser
    Richtlinie, einschließlich der Bestimmungen über Aufsicht und Durchsetzung in Kapitel VII, keine Anwendung
    auf solche Einrichtungen. Wenn die sektorspezifischen Rechtsakte der Union nicht für alle in den Anwendungsbereich
