- uid: Art. 23 Abs. 1@225849
  id: Art. 23 Abs. 1
  artikel: '23'
  artikel_titel: Berichtspflichten
  absatz: '1'
  buchstabe: null
  offset: 225849
  laenge: 1361
  saetze: 6
  beleg: (1)   Jeder Mitgliedstaat stellt sicher, dass wesentliche und wichtige Einrichtungen ihrem CSIRT
    oder gegebenenfalls ihrer zuständigen Behörde gemäß Absatz 4 unverzüglich über jeden Sicherheitsvorfall
    unterrichten, der erhebliche Auswirkungen auf die Erbringung ihrer Dienste gemäß Absatz 3 (erheblicher
    Sicherheitsvorfall) hat. Gegebenenfalls unterrichten die betreffenden Einrichtungen die Empfänger
    ihrer Dienste unverzüglich über diese erheblichen Sicherheitsvorfälle, die die Erbringung des jeweiligen
    Dienstes beeinträchtigen könnten. Jeder Mitgliedstaat stellt sicher, dass diese Einrichtungen unter
    anderem alle Informationen übermitteln, die es dem CSIRT oder gegebenenfalls der zuständigen Behörde
    ermöglichen zu ermitteln, ob der Sicherheitsvorfall grenzübergreifende Auswirkungen hat. Mit der bloßen
    Meldung wird keine höhere Haftung der meldenden Einrichtung begründet. Melden die betreffenden Einrichtungen
    der zuständigen Behörde einen erheblichen Sicherheitsvorfall gemäß Unterabsatz 1, so stellt der Mitgliedstaat
    sicher, dass diese zuständige Behörde die Meldung nach Eingang an das CSIRT weiterleitet. Im Falle
    eines grenz- oder sektorenübergreifenden erheblichen Sicherheitsvorfalls stellen die Mitgliedstaaten
    sicher, dass ihre zentralen Anlaufstellen rechtzeitig einschlägige Informationen erhalten, die gemäß
    Absatz 4 gemeldet wurden.
