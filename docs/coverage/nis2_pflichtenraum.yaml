  beleg: f) Anforderung von Nachweisen für die Umsetzung der Cybersicherheitskonzepte, z. B. der Ergebnisse
    von von einem qualifizierten Prüfer durchgeführten Sicherheitsprüfungen und der entsprechenden zugrunde
    liegenden Nachweise. Die in Unterabsatz 1 Buchstabe b genannten gezielten Sicherheitsprüfungen stützen
    sich auf Risikobewertungen, die von der zuständigen Behörde oder der geprüften Einrichtung durchgeführt
    werden, oder auf sonstige verfügbare risikobezogene Informationen. Die Ergebnisse gezielter Sicherheitsprüfungen
    sind der zuständigen Behörde zur Verfügung zu stellen. Die Kosten einer solchen gezielten Sicherheitsprüfung,
    die von einer unabhängigen Stelle durchgeführt wird, sind von der geprüften Einrichtung zu tragen,
    es sei denn, die zuständige Behörde trifft in hinreichend begründeten Fällen eine anderslautende Entscheidung.
