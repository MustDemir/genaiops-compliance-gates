  offset: 272788
  laenge: 762
  saetze: 3
  beleg: (8)   Sieht die Rechtsordnung eines Mitgliedstaats keine Geldbußen vor, so stellt dieser Mitgliedstaat
    sicher, dass dieser Artikel so angewandt wird, dass die Geldbuße von der zuständigen Behörde in die
    Wege geleitet und von den zuständigen nationalen Gerichten verhängt wird, wobei sicherzustellen ist,
    dass diese Rechtsbehelfe wirksam sind und die gleiche Wirkung wie die von den zuständigen Behörden
    verhängten Geldbußen haben. In jedem Fall müssen die verhängten Geldbußen wirksam, verhältnismäßig
    und abschreckend sein. Der betreffende Mitgliedstaat teilt der Kommission bis zum 17. Oktober 2024
    die Rechtsvorschriften, die er aufgrund dieses Absatzes erlässt, sowie unverzüglich alle nachfolgenden
    Änderungsgesetze oder Änderungen dieser Vorschriften mit.
