  beleg: (1)   Die Mitgliedstaaten können wesentliche und wichtige Einrichtungen dazu verpflichten, spezielle
    IKT-Produkte, -Dienste und -Prozesse zu verwenden, die von der wesentlichen oder wichtigen Einrichtung
    entwickelt oder von Dritten beschafft werden und die im Rahmen europäischer Schemata für die Cybersicherheitszertifizierung,
    die gemäß Artikel 49 der Verordnung (EU) 2019/881 angenommen wurden, zertifiziert sind, um die Erfüllung
    bestimmter in Artikel 21 genannter Anforderungen nachzuweisen. Darüber hinaus fördern die Mitgliedstaaten,
    dass wesentliche und wichtige Einrichtungen qualifizierte Vertrauensdienste nutzen.
