  absatz: '2'
  buchstabe: null
  offset: 235898
  laenge: 789
  saetze: 3
  beleg: (2)   Die Kommission ist befugt, gemäß Artikel 38 delegierte Rechtsakte zu erlassen, um diese
    Richtlinie dadurch zu ergänzen, dass ausgeführt wird, welche Kategorien wesentlicher und wichtiger
    Einrichtungen verpflichtet sind, bestimmte zertifizierte IKT-Produkte, -Dienste und -Prozesse zu nutzen
    oder ein Zertifikat im Rahmen eines gemäß Artikel 49 der Verordnung (EU) 2019/881 erlassenen europäischen
    Schemas für die Cybersicherheitszertifizierung zu erlangen. Diese delegierten Rechtsakte werden erlassen,
    wenn ein unzureichendes Niveau der Cybersicherheit festgestellt wurde, und umfassen eine Umsetzungsfrist.
    Vor dem Erlass solcher delegierten Rechtsakte nimmt die Kommission eine Folgenabschätzung vor und
    führt Konsultationen gemäß Artikel 56 der Verordnung (EU) 2019/881 durch.
