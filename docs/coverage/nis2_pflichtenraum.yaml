    natürlichen Personen, die auf Geschäftsführungs- bzw. Vorstandsebene oder Ebene des rechtlichen Vertreters
    für Leitungsaufgaben in dieser wesentlichen Einrichtung zuständig sind, vorübergehend untersagen,
    Leitungsaufgaben in dieser Einrichtung wahrzunehmen. Die gemäß diesem Absatz verhängten vorübergehenden
    Aussetzungen oder Verbote werden nur so lange angewandt, bis die betreffende Einrichtung die erforderlichen
    Maßnahmen ergreift, um die Mängel zu beheben oder die Anforderungen der zuständigen Behörde, wegen
    deren Nichterfüllung die Durchsetzungsmaßnahmenverhängt wurden, zu erfüllen. Für die Verhängung solcher
    vorübergehenden Aussetzungen oder Verbote muss es angemessene Verfahrensgarantien geben, die den allgemeinen
    Grundsätzen des Unionsrechts und der Charta, einschließlich des Rechts auf einen wirksamen Rechtsbehelf
    und ein unparteiisches Gericht, der Unschuldsvermutung und der Verteidigungsrechte, entsprechen. Die
    in diesem Absatz vorgesehenen Durchsetzungsmaßnahmen finden keine Anwendung auf Einrichtungen der
    öffentlichen Verwaltung, die dieser Richtlinie unterliegen.
