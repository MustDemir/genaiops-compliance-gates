- uid: Art. 23 Abs. 11@233917
  id: Art. 23 Abs. 11
  artikel: '23'
  artikel_titel: Berichtspflichten
  absatz: '11'
  buchstabe: null
  offset: 233917
  laenge: 1268
  saetze: 5
  beleg: (11)   Die Kommission kann Durchführungsrechtsakte erlassen, in denen die Art der Angaben, das
    Format und das Verfahren für Meldungen gemäß Absatz 1 dieses Artikels und Artikel 30 sowie einer gemäß
    Absatz 2 dieses Artikels übermittelten Mitteilung näher bestimmt werden. Bis zum 17. Oktober 2024
    erlässt die Kommission in Bezug auf DNS-Diensteanbieter, TLD-Namenregister, Cloud-Computing-Dienstleister,
    Anbieter von Rechenzentrumsdiensten, Betreiber von Inhaltszustellnetzen, Anbieter von verwalteten
    Diensten, Anbieter von verwalteten Sicherheitsdiensten sowie Anbieter von Online-Marktplätzen, Online-Suchmaschinen
    und Plattformen für Dienste sozialer Netzwerke Durchführungsrechtsakte, in denen näher bestimmt wird,
    in welchen Fällen ein Sicherheitsvorfall als erheblich im Sinne von Absatz 3 anzusehen ist. Die Kommission
    kann solche Durchführungsrechtsakte in Bezug auf andere wesentliche und wichtige Einrichtungen erlassen.
    Die Kommission tauscht sich mit der Kooperationsgruppe gemäß Artikel 14 Absatz 4 Buchstabe e über
    die in den Unterabsätzen 1 und 2 dieses Absatzes genannten Entwürfe von Durchführungsrechtsakten aus
    und arbeitet mit ihr zusammen. Diese Durchführungsrechtsakte werden gemäß dem in Artikel 39 Absatz
    2 genannten Prüfverfahren erlassen.
