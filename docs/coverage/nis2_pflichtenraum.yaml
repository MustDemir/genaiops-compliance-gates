  beleg: (5)   Bis zum 17. Oktober 2024 erlässt die Kommission Durchführungsrechtsakte zur Festlegung
    der technischen und methodischen Anforderungen an die in Absatz 2 genannten Maßnahmen in Bezug auf
    DNS-Diensteanbieter, TLD-Namenregister, Cloud-Computing-Dienstleister, Anbieter von Rechenzentrumsdiensten,
    Betreiber von Inhaltszustellnetzen, Anbieter von verwalteten Diensten, Anbieter von verwalteten Sicherheitsdiensten,
    Anbieter von Online-Marktplätzen, Online-Suchmaschinen und Plattformen für Dienste sozialer Netzwerke
    und Vertrauensdiensteanbieter. Die Kommission kann Durchführungsrechtsakte erlassen, in denen die
    technischen und methodischen Anforderungen sowie erforderlichenfalls die sektoralen Anforderungen
    der in Absatz 2 genannten Maßnahmen in Bezug auf andere als die in Unterabsatz 1 des vorliegenden
    Absatzes genannten wesentlichen und wichtigen Einrichtungen festgelegt werden. Bei der Ausarbeitung
    der in den Unterabsätzen 1 und 2 des vorliegenden Absatzes genannten Durchführungsrechtsakte orientiert
    sich die Kommission so weit wie möglich an europäischen und internationalen Normen sowie einschlägigen
    technischen Spezifikationen. Die Kommission tauscht sich mit der Kooperationsgruppe und der ENISA
    über die Entwürfe von Durchführungsrechtsakten gemäß Artikel 14 Absatz 4 Buchstabe e aus und arbeitet
    mit ihnen zusammen. Diese Durchführungsrechtsakte werden gemäß dem in Artikel 39 Absatz 2 genannten
    Prüfverfahren erlassen.
