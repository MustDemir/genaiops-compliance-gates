  beleg: (2)   Die Mitgliedstaaten bearbeiten die in Absatz 1 des vorliegenden Artikels genannten Meldungen
    nach dem in Artikel 23 vorgesehenen Verfahren. Die Mitgliedstaaten können Pflichtmeldungen vorrangig
    vor freiwilligen Meldungen bearbeiten. Erforderlichenfalls übermitteln die CSIRTs und gegebenenfalls
    die zuständigen Behörden den zentralen Anlaufstellen die Informationen über die gemäß diesem Artikel
    eingegangenen Meldungen, wobei sie die Vertraulichkeit und den angemessenen Schutz der von der meldenden
    Einrichtung übermittelten Informationen sicherstellen. Unbeschadet der Verhütung, Ermittlung, Aufdeckung
    und Verfolgung von Straftaten dürfen die freiwilligen Meldungen nicht dazu führen, dass der meldenden
    Einrichtung zusätzliche Verpflichtungen auferlegt werden, die nicht für sie gegolten hätten, wenn
    sie die Meldung nicht übermittelt hätte.
