  buchstabe: null
  offset: 232842
  laenge: 653
  saetze: 3
  beleg: (9)   Die zentrale Anlaufstelle legt der ENISA alle drei Monate einen zusammenfassenden Bericht
    vor, der anonymisierte und aggregierte Daten zu erheblichen Sicherheitsvorfällen, erheblichen Cyberbedrohungen
    und Beinahe-Vorfällen enthält, die gemäß Absatz 1 des vorliegenden Artikels und Artikel 30 gemeldet
    wurden. Um zur Bereitstellung vergleichbarer Informationen beizutragen, kann die ENISA technische
    Leitlinien zu den Parametern der in den zusammenfassenden Bericht aufzunehmenden Angaben verabschieden.
    Die ENISA unterrichtet die Kooperationsgruppe und das CSIRTs-Netzwerk alle sechs Monate über ihre
    Erkenntnisse zu den eingegangenen Meldungen.
