  offset: 215959
  laenge: 1106
  saetze: 5
  beleg: (6)   Die Peer Reviews umfassen physische oder virtuelle Besuche am Standort sowie abseits des
    Standorts den Austausch von Informationen. Im Einklang mit dem Grundsatz der guten Zusammenarbeit
    stellt der Mitgliedstaat, der Gegenstand der Peer Review ist, den benannten Sachverständigen für Cybersicherheit
    die für die Bewertung erforderlichen Informationen zur Verfügung, vorbehaltlich der Rechtsvorschriften
    der Union oder der Mitgliedstaaten über den Schutz vertraulicher oder als Verschlusssache eingestufter
    Informationen und der Wahrung grundlegender Funktionen des Staates wie der nationalen Sicherheit.
    Die Kooperationsgruppe entwickelt in Zusammenarbeit mit der Kommission und der ENISA geeignete Verhaltenskodizes
    zur Untermauerung der Arbeitsmethoden der benannten Sachverständigen für Cybersicherheit. Sämtliche
    durch die Peer Review erlangten Informationen dürfen nur zu diesem Zweck verwendet werden. Die an
    der Peer Review beteiligten Sachverständigen für Cybersicherheit geben keine sensiblen oder vertraulichen
    Informationen, die im Laufe der Peer Review erlangt wurden, an Dritte weiter.
