    für das Cyberkrisenmanagement meldet jeder Mitgliedstaat der Kommission die Identität seiner Behörde
    und eventueller späterer Änderungen daran. Die Mitgliedstaaten übermitteln der Kommission und dem
    Europäischen Netzwerk der Verbindungsorganisationen für Cyberkrisen (EU-CyCLONe) einschlägige die
    Anforderungen nach Absatz 4 betreffende Informationen über ihre nationalen Pläne für die Reaktion
    auf Cybersicherheitsvorfälle großen Ausmaßes und Krisen innerhalb von drei Monaten nach dem Erlass
    dieser Pläne. Die Mitgliedstaaten können Informationen ausnehmen, wenn und soweit dies für ihre nationale
    Sicherheit erforderlich ist.
