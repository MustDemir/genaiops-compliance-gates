  artikel: '21'
  artikel_titel: Risikomanagementmaßnahmen im Bereich der Cybersicherheit
  absatz: '1'
  buchstabe: null
  offset: 219962
  laenge: 1149
  saetze: 3
  beleg: (1)   Die Mitgliedstaaten stellen sicher, dass wesentliche und wichtige Einrichtungen geeignete
    und verhältnismäßige technische, operative und organisatorische Maßnahmen ergreifen, um die Risiken
    für die Sicherheit der Netz- und Informationssysteme, die diese Einrichtungen für ihren Betrieb oder
    für die Erbringung ihrer Dienste nutzen, zu beherrschen und die Auswirkungen von Sicherheitsvorfällen
    auf die Empfänger ihrer Dienste und auf andere Dienste zu verhindern oder möglichst gering zu halten.
    Die in Unterabsatz 1 genannten Maßnahmen müssen unter Berücksichtigung des Stands der Technik und
    gegebenenfalls der einschlägigen europäischen und internationalen Normen sowie der Kosten der Umsetzung
    ein Sicherheitsniveau der Netz- und Informationssysteme gewährleisten, das dem bestehenden Risiko
    angemessen ist. Bei der Bewertung der Verhältnismäßigkeit dieser Maßnahmen sind das Ausmaß der Risikoexposition
    der Einrichtung, die Größe der Einrichtung und die Wahrscheinlichkeit des Eintretens von Sicherheitsvorfällen
    und deren Schwere, einschließlich ihrer gesellschaftlichen und wirtschaftlichen Auswirkungen, gebührend
    zu berücksichtigen.
