  beleg: (3)   Hat eine in Absatz 1 Buchstabe b genannte Einrichtung keine Niederlassung in der Union,
    bietet aber Dienste innerhalb der Union an, muss sie einen Vertreter in der Union benennen. Der Vertreter
    muss in einem der Mitgliedstaaten niedergelassen sein, in denen die Dienste angeboten werden. Es wird
    davon ausgegangen, dass eine solche Einrichtung der Zuständigkeit des Mitgliedstaats unterliegt, in
    dem der Vertreter niedergelassen ist. Wurde in der Union kein Vertreter im Sinne dieses Absatzes benannt,
    kann jeder Mitgliedstaat, in dem die Einrichtung Dienste erbringt, gegen die Einrichtung rechtliche
    Schritte wegen des Verstoßes gegen diese Richtlinie einleiten.
