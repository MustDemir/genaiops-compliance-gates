  offset: 231336
  laenge: 658
  saetze: 3
  beleg: (6)   Gegebenenfalls und insbesondere, wenn der erhebliche Sicherheitsvorfall zwei oder mehr
    Mitgliedstaaten betrifft, unterrichtet das CSIRT, die zuständige Behörde oder die zentrale Anlaufstelle
    unverzüglich die anderen betroffenen Mitgliedstaaten und die ENISA über den erheblichen Sicherheitsvorfall.
    Diese Informationen umfassen die Art der gemäß Absatz 4 erhaltenen Informationen. Dabei wahren das
    CSIRT, die zuständige Behörde oder die zentrale Anlaufstelle im Einklang mit dem Unionsrecht oder
    dem einzelstaatlichen Recht die Sicherheit und das wirtschaftliche Interesse der Einrichtung sowie
    die Vertraulichkeit der bereitgestellten Informationen.
