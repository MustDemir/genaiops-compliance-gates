  saetze: 5
  beleg: '(1)   Die Kooperationsgruppe wird bis zum 17. Januar 2025 mit Unterstützung der Kommission und
    der ENISA und gegebenenfalls des CSIRTs-Netzwerks die Methode und die organisatorischen Aspekte der
    Peer Reviews festlegen, um aus gemeinsamen Erfahrungen zu lernen, das gegenseitige Vertrauen zu stärken,
    ein hohes gemeinsames Cybersicherheitsniveau zu erreichen und die für die Umsetzung dieser Richtlinie
    erforderlichen Cybersicherheitsfähigkeiten und -konzepte der Mitgliedstaaten zu verbessern. Die Teilnahme
    an Peer Reviews ist freiwillig. Die Peer Reviews werden von Sachverständigen für Cybersicherheit durchgeführt.
    Die Sachverständigen für Cybersicherheit werden von mindestens zwei Mitgliedstaaten benannt, die sich
    von dem überprüften Mitgliedstaat unterscheiden. Die Peer Reviews erstrecken sich mindestens auf einen
    der folgenden Punkte:'
