  id: Art. 16 Abs. 2
  artikel: '16'
  artikel_titel: Das Europäische Netzwerk der Verbindungsorganisationen für Cyberkrisen (EU-CyCLONe)
  absatz: '2'
  buchstabe: null
  offset: 208713
  laenge: 900
  saetze: 4
  beleg: (2)   EU-CyCLONe setzt sich aus den Vertretern der Behörden der Mitgliedstaaten für das Cyberkrisenmanagement
    sowie in Fällen, in denen ein potenzieller oder andauernder Cybersicherheitsvorfall großen Ausmaßes
    erhebliche Auswirkungen auf unter den Anwendungsbereich dieser Richtlinie fallende Dienste und Tätigkeiten
    hat oder wahrscheinlich haben wird, der Kommission zusammen. In anderen Fällen nimmt die Kommission
    als Beobachterin an den Tätigkeiten des EU-CyCLONe teil. Die ENISA führt die Sekretariatsgeschäfte
    des EU-CyCLONe, unterstützt den sicheren Informationsaustausch und stellt die Instrumente bereit,
    die für die Förderung der Zusammenarbeit zwischen den Mitgliedstaaten zur Gewährleistung eines sicheren
    Informationsaustauschs erforderlich sind. Gegebenenfalls kann das EU-CyCLONe Vertreter der maßgeblichen
    Interessenträger einladen, an seinen Arbeiten als Beobachter teilzunehmen.
