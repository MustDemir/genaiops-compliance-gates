- uid: Art. 12 Abs. 1 lit. c@192415
  id: Art. 12 Abs. 1 lit. c
  artikel: '12'
  artikel_titel: Koordinierte Offenlegung von Schwachstellen und eine europäische Schwachstellendatenbank
  absatz: '1'
  buchstabe: c
  offset: 192415
  laenge: 856
  saetze: 4
  beleg: c) Zeitpläne für die Offenlegung auszuhandeln und das Vorgehen bei Schwachstellen zu koordinieren,
    die mehrere Einrichtungen betreffen. Die Mitgliedstaaten stellen sicher, dass natürliche oder juristische
    Personen dem als Koordinator benannten CSIRT eine Schwachstelle, auf Wunsch anonym, melden können.
    Das als Koordinator benannte CSIRT stellt sicher, dass in Bezug auf die gemeldete Schwachstelle sorgfältige
    Folgemaßnahmen durchgeführt werden, und sorgen für die Anonymität der die Schwachstelle meldenden
    natürlichen oder juristischen Person. Wenn die gemeldete Schwachstelle erhebliche Auswirkungen auf
    Einrichtungen in mehreren Mitgliedstaaten haben könnte, arbeitet das als Koordinator benannte CSIRT
    jedes betreffenden Mitgliedstaats gegebenenfalls mit den anderen als Koordinatoren benannten CSIRTs
    innerhalb des CSIRTs-Netzwerks zusammen.
