  buchstabe: null
  offset: 152606
  laenge: 935
  saetze: 3
  beleg: (8)   Zu diesem Zweck können die Mitgliedstaaten bestimmte Einrichtungen, die in den Bereichen
    nationale Sicherheit, öffentliche Sicherheit, Verteidigung oder Strafverfolgung tätig sind, einschließlich
    der Verhütung, Ermittlung, Aufdeckung und Verfolgung von Straftaten, oder die Dienste ausschließlich
    für die in Absatz 7 dieses Artikels genannten Einrichtungen der öffentlichen Verwaltung erbringen,
    von den in Artikel 21 oder 23 festgelegten Verpflichtungen in Bezug auf diese Tätigkeiten oder Dienste
    ausnehmen. In solchen Fällen gelten die in Kapitel VII genannten Aufsichts- und Durchsetzungsmaßnahmen
    nicht für diese spezifischen Tätigkeiten oder Dienste. Wenn die Einrichtungen ausschließlich Tätigkeiten
    der in diesem Absatz genannten Art ausüben oder entsprechende Dienste erbringen, können die Mitgliedstaaten
    auch beschließen, diese Einrichtungen von den in den Artikeln 3 und 27 festgelegten Verpflichtungen
    auszunehmen.
