  offset: 185759
  laenge: 630
  saetze: 3
  beleg: (7)   Die CSIRTs können Kooperationsbeziehungen mit nationalen Computer-Notfallteams von Drittländern
    aufnehmen. Als Teil solcher Kooperationsbeziehungen erleichtern die Mitgliedstaaten den wirksamen,
    effizienten und sicheren Informationsaustausch mit diesen nationalen Computer-Notfallteams von Drittländern,
    wobei sie einschlägige Protokolle für den Informationsaustausch, einschließlich des Traffic Light
    Protocol, verwendet. Die CSIRTs können mit nationalen Computer-Notfallteams von Drittländern einschlägige
    Informationen, einschließlich personenbezogener Daten im Einklang mit dem Datenschutzrecht der Union,
    austauschen.
