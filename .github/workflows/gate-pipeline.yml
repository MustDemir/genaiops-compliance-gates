# ================================================================
# GenAIOps Compliance Gates — CI/CD Pipeline (16 Quality Gates)
# ================================================================
# Operationalizes Compliance-as-Code (D_CAC_AAC_DIFF):
#   EU AI Act Art. 9–15 → R001–R014 → Rego Policies → Pipeline Enforcement
#
# Triggered on: push to main, pull_request to main
#
# Test Layers (Shift-Left, fail-fast ordering):
#   Layer 1 — Rego Unit Tests (OPA): alle Policies unter policies/.
#             Runs BEFORE any Gate-Conftest-Check. Any failure aborts the
#             pipeline immediately → prevents Conftest from evaluating
#             policies whose rule-semantics are broken.
#   Layer 2 — Gate Conftest Checks: 17 gates against scenario fixtures.
#   Layer 3 — Evidence + Hash-Chain: audit-trail integrity.
#
# Pre-Deployment Gates (5):
#   G-PRE-01: Risk Classification        (R001, Art.9)   — HYBRID
#   G-PRE-02: Zweckbestimmung            (R012, Art.27)  — HYBRID
#   G-PRE-03: Risk Management Complete   (R001, Art.9)   — HYBRID
#   G-PRE-04: Security Baseline          (R003, Art.15)  — AUTO
#   G-PRE-05: Governance Approval        (R004, Art.14)  — HYBRID
#
# Deployment Gates (6):
#   G-DEP-01: Data Provenance            (R002, Art.11; R006, Art.10 — Co-Mapping) — AUTO
#   G-DEP-02: Safety Metrics             (R003, Art.15)  — AUTO
#   G-DEP-03: Transparency Docs          (R007, Art.13)  — HYBRID
#   G-DEP-04: Conformity Verification    (R011, Art.26.1) — AUTO
#   G-DEP-05: Bias Assessment            (R013, Art.10)  — AUTO
#   G-DEP-06: Logging Configuration      (R014, Art.12)  — AUTO
#
# Operations Gates (5):
#   G-OPS-01: Human Oversight            (R008, Art.14)  — HYBRID
#   G-OPS-02: Incident Process           (R009, Art.26)  — AUTO
#   G-OPS-03: Monitoring Configuration   (R010, Art.72)  — AUTO
#   G-OPS-04: Cybersecurity Operations   (R003, Art.15)  — AUTO
#   G-OPS-05: Evidence Completeness      (R005, Art.15)  — AUTO
#
# Evidence: Every gate result → Evidence Store (S4) with hash chain
# Traceability: Commit-SHA as image tag (DP2)
# ================================================================

name: GenAIOps Quality Gate Pipeline

# Branches: `main` wurde am 15.08.2026 zugunsten der Domain-Trennung
# entfernt (domain_netzbetrieb = Weiterentwicklung, domain_Healthcare =
# publizierter Thesis-Stand). Ein Trigger auf [main] loest seitdem nie aus.
#
# Paths: gate-definitions/, requirements/, tests/ und tools/ fehlten hier
# bisher — Aenderungen an Gate-Definitionen, Requirements oder der
# Testsuite haben die Pipeline also NIE ausgeloest, auch nicht auf main.
# Das war der stillere der beiden Fehler.
on:
  push:
    branches: [domain_netzbetrieb, domain_Healthcare]
    paths:
      - 'scenarios/**'
      - 'policies/**'
      - 'gate-definitions/**'
      - 'requirements/**'
      - 'evidence-store/**'
      - 'pipeline/**'
      - 'monitoring/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
  pull_request:
    branches: [domain_netzbetrieb, domain_Healthcare]
    paths:
      - 'scenarios/**'
      - 'policies/**'
      - 'gate-definitions/**'
      - 'requirements/**'
      - 'evidence-store/**'
      - 'pipeline/**'
      - 'tests/**'
      - 'tools/**'
      - 'monitoring/**'
  workflow_dispatch:  # Manual trigger for demo/walkthrough

# Least privilege als Workflow-Default. Ohne diesen Block erbt jeder Job die
# Repository-Voreinstellung, die je nach Einstellung Schreibrechte auf contents
# und packages umfasst — fuer einen Workflow, der Images nach ghcr.io pusht,
# ist das mehr als noetig. quality-gates liest nur; build-and-push hebt sich
# die packages:write-Rechte selbst an (siehe dort).
permissions:
  contents: read

env:
  SCENARIO_DIR: scenarios/healthcare-ambient-ai-scribe
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ambient-ai-scribe
  # PoC: SQLite for Evidence Store (production → PostgreSQL)
  EVIDENCE_DB: /tmp/evidence_pipeline.db

jobs:
  # ────────────────────────────────────────────────────────
  # Job 1: Quality Gate Checks (S2 + S3) — der gesamte Gate-Katalog
  # ────────────────────────────────────────────────────────
  quality-gates:
    # SPEC-04b Teil 1: kein Zaehlstand im Namen. Eine Zahl im Label wird zur
    # Behauptung, sobald sich der Katalog aendert — und niemand haelt sie
    # gegen das Ergebnis.
    name: "Quality Gate Checks"
    runs-on: ubuntu-latest
    outputs:
      gate_result: ${{ steps.gate-summary.outputs.result }}
      gates_pass: ${{ steps.gate-summary.outputs.gates_pass }}
      gates_total: ${{ steps.gate-summary.outputs.gates_total }}
      rego_tests: ${{ steps.rego-unit-tests.outputs.count }}
      pipeline_run_id: ${{ steps.init.outputs.pipeline_run_id }}
      # The signing job records G-OPS-05 and never sees eval_results.json.
      # It receives the measured mode rather than deriving one of its own:
      # a second derivation would not measure, it would guess (B-21).
      runtime_mode: ${{ steps.measure.outputs.runtime_mode }}

    steps:
      # ── Setup ──
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Initialize pipeline run
        id: init
        run: |
          PIPELINE_RUN_ID="pipeline-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"
          echo "pipeline_run_id=$PIPELINE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "::notice::Pipeline Run ID: $PIPELINE_RUN_ID"
          echo "::notice::Commit SHA: $GITHUB_SHA"

      - name: Install OPA + Conftest
        run: |
          # ── Install OPA binary (for Rego unit tests, Layer 1) ──
          OPA_VERSION="1.15.2"
          wget -q "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" -O opa \
            || { echo "::error::Failed to download OPA v${OPA_VERSION}"; exit 1; }
          chmod +x opa
          sudo mv opa /usr/local/bin/
          opa version
          echo "::notice::OPA v${OPA_VERSION} installed"

          # ── Install Conftest (Policy-as-Code tool for CI, Layer 2) ──
          CONFTEST_VERSION="0.56.0"
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            || { echo "::error::Failed to download Conftest v${CONFTEST_VERSION}"; exit 1; }
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/
          conftest --version
          echo "::notice::Conftest v${CONFTEST_VERSION} installed"

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        # PyYAML ist nicht optional. gate_orchestrator.load_gate_required_inputs()
        # gibt ohne yaml eine WARNUNG aus und liefert ein leeres Dict zurueck —
        # die Anwesenheitspflicht aus SPEC-04b waere in der CI still abgeschaltet
        # gewesen, waehrend die Gate-Definitionen sie deklarieren. Genau diese
        # Kombination (Deklaration ja, Mechanismus nein) ist der wiederkehrende
        # Fehler, den SPEC-04b beseitigt.
        run: pip install psycopg2-binary PyYAML

      # ════════════════════════════════════════════════════════
      # Gate runner function (reusable across all 17 gates)
      # Separates stdout (JSON) from stderr (diagnostics).
      # Distinguishes Policy-FAIL (violations found) from
      # Tool-FAIL (Conftest crash, missing policy, syntax error).
      # ════════════════════════════════════════════════════════
      - name: "Prepare the gate runner"
        run: |
          # The runner is a tracked file, not a heredoc: G-OPS-05 runs in the
          # signing job (see there), and two copies of an evaluator drift.
          chmod +x pipeline/ci/run_gate.sh
          echo "gate runner: pipeline/ci/run_gate.sh"
      - name: "Rego Unit Tests (Layer 1 — OPA, fail-fast)"
        id: rego-unit-tests
        run: |
          echo "::group::Rego Unit Tests (OPA)"
          echo "   Runner: tests/run_all_rego_tests.sh"
          echo ""

          # Die Ausgabe wird MITGELESEN, nicht nachtraeglich behauptet.
          # Bis 2026-08-25 stand hier "173/173 green" als fester Text,
          # waehrend der Runner 187/187 meldete — dieselbe Fehlerklasse wie
          # gate_result.all_passed: eine Zahl, die niemand gegen das
          # Ergebnis haelt. Waere die Testzahl gefallen, haette die
          # Pipeline weiterhin "173/173 green" ausgegeben.
          set -o pipefail
          if ./tests/run_all_rego_tests.sh --quiet | tee /tmp/rego-out.txt; then
            COUNT=$(grep -oE "PASS: [0-9]+/[0-9]+" /tmp/rego-out.txt | tail -1 | grep -oE "[0-9]+/[0-9]+" || true)
            if [ -z "$COUNT" ]; then
              echo "::error::Runner meldete keinen Zaehlstand — ohne gelesene Zahl wird hier keine behauptet."
              exit 1
            fi
            echo "✅ Rego Unit Tests PASS — $COUNT (vom Runner gemeldet)"
            echo "result=PASS" >> "$GITHUB_OUTPUT"
            echo "count=${COUNT%%/*}" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Rego Unit Tests FAIL — pipeline aborted before Gate-Checks"
            echo "::error::Rego rule-semantics broken. Fix unit tests before re-running pipeline."
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "::endgroup::"

      # ════════════════════════════════════════════════════════
      # PRE-DEPLOYMENT GATES (5)
      # ════════════════════════════════════════════════════════

      - name: "Gate G-PRE-01: Risk Classification (R001, Art.9) [HYBRID]"
        id: g-pre-01
        run: |
          echo "::group::G-PRE-01 Risk Classification"
          bash pipeline/ci/run_gate.sh G-PRE-01 \
            "$SCENARIO_DIR/fixtures/app_documentation.json" \
            "policies/pre-deployment/policy_risk_classification.rego" \
            "genaiops.pre_deployment.risk_classification"
          echo "::endgroup::"

      - name: "Gate G-PRE-04: Security Baseline (R003, Art.15) [AUTO]"
        id: g-pre-04
        run: |
          echo "::group::G-PRE-04 Security Baseline"
          bash pipeline/ci/run_gate.sh G-PRE-04 \
            "$SCENARIO_DIR/fixtures/deployment_compliant.yaml" \
            "policies/pre-deployment/policy_security_baseline.rego" \
            "genaiops.pre_deployment.security_baseline"
          echo "::endgroup::"

      - name: "Gate G-PRE-05: Governance Approval (R004, Art.14) [HYBRID]"
        id: g-pre-05
        run: |
          echo "::group::G-PRE-05 Governance Approval"
          bash pipeline/ci/run_gate.sh G-PRE-05 \
            "$SCENARIO_DIR/fixtures/app_documentation.json" \
            "policies/pre-deployment/policy_governance_approval.rego" \
            "genaiops.pre_deployment.governance_approval"
          echo "::endgroup::"

      - name: "Gate G-PRE-02: Zweckbestimmung (R012, Art.27) [HYBRID]"
        id: g-pre-02
        run: |
          echo "::group::G-PRE-02 Zweckbestimmung"
          bash pipeline/ci/run_gate.sh G-PRE-02 \
            "$SCENARIO_DIR/fixtures/app_documentation.json" \
            "policies/pre-deployment/policy_purpose_declaration.rego" \
            "genaiops.pre_deployment.purpose_declaration"
          echo "::endgroup::"

      - name: "Gate G-PRE-03: Risikomanagement-Vollstaendigkeit (R001, Art.9) [HYBRID]"
        id: g-pre-03
        run: |
          echo "::group::G-PRE-03 Risikomanagement-Vollstaendigkeit"
          bash pipeline/ci/run_gate.sh G-PRE-03 \
            "$SCENARIO_DIR/fixtures/app_documentation.json" \
            "policies/pre-deployment/policy_risk_management_complete.rego" \
            "genaiops.pre_deployment.risk_management_complete"
          echo "::endgroup::"

      # ════════════════════════════════════════════════════════
      # DEPLOYMENT GATES (6)
      # ════════════════════════════════════════════════════════

      - name: "Gate G-DEP-01: Data Provenance (R002, Art.11; R006, Art.10) [AUTO]"
        id: g-dep-01
        run: |
          echo "::group::G-DEP-01 Data Provenance"
          bash pipeline/ci/run_gate.sh G-DEP-01 \
            "$SCENARIO_DIR/fixtures/data_documentation_provenance_pass.json" \
            "policies/pre-deployment/policy_data_provenance_documented.rego" \
            "genaiops.pre_deployment.data_provenance_documented"
          echo "::endgroup::"

      # ════════════════════════════════════════════════════════
      # MESSUNG — die Anwendung laeuft, bevor ueber sie geurteilt wird
      # ════════════════════════════════════════════════════════
      # SPEC-04b Teil 2. Bis hierher las G-DEP-02 eine eingecheckte Datei:
      # das Dokument wurde zwar von eval_runner.py erzeugt, aber auf einem
      # Entwicklerrechner, nicht in der Pipeline, die es prueft.
      #
      # Kein Kubernetes noetig. E-3 braucht eine LAUFENDE ANWENDUNG mit
      # /metrics, keinen Cluster — nur E-2 (data.inventory, readyReplicas)
      # braucht wirklich einen. Ein Container mit -p 8080:8080 genuegt.
      - name: "Start the application under test"
        id: app
        run: |
          echo "::group::Build and start ambient-ai-scribe"
          docker build -q -t scribe:ci "$SCENARIO_DIR"
          docker run -d --name scribe-ci -p 8080:8080 \
            -e MODEL_VERSION="ci-${GITHUB_SHA::8}" \
            -e PIPELINE_ID="${{ steps.init.outputs.pipeline_run_id }}" \
            scribe:ci

          # Bereitschaft wird ABGEFRAGT, nicht abgewartet. Ein festes sleep
          # ist eine Annahme ueber die Startzeit, und Annahmen sind genau
          # das, was hier ueberall ersetzt wird.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "App ready after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::App did not become healthy within 30s"
              docker logs scribe-ci
              exit 1
            fi
            sleep 1
          done
          echo "::endgroup::"

      - name: "Measure: produce the evaluation document"
        id: measure
        run: |
          echo "::group::eval_runner — measured latency and throughput"
          python3 "$SCENARIO_DIR/eval/eval_runner.py" \
            --app-url http://localhost:8080 \
            --requests 50 \
            --output /tmp/eval_results.json

          # runtime_mode MUSS mock sein: MOCK_MODE steht fest im App-Code,
          # es laeuft kein echtes Modell. Ein "live" aus dem Runner waere
          # ein Befund, kein Fortschritt — deshalb wird darauf geprueft.
          MODE=$(python3 -c "import json;print(json.load(open('/tmp/eval_results.json'))['evaluation']['runtime_mode'])")
          echo "runtime_mode: $MODE"
          if [ "$MODE" != "mock" ]; then
            echo "::error::runtime_mode is '$MODE' — the CI runs no real model, so anything but 'mock' means the mode was not established correctly."
            exit 1
          fi
          # B-21: measured, checked — and until T-08 dropped on the way to the
          # evidence record. It is handed on from here instead, as a step and
          # job output, so every record and the signed manifest carry the mode
          # the run was actually measured in.
          echo "runtime_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: "Compare produced document against the checked-in fixture"
        run: |
          echo "::group::Structure comparison"
          # Verglichen wird die STRUKTUR, nicht die Werte — die
          # unterscheiden sich zwangslaeufig, das ist der Beleg dafuer,
          # dass gemessen wurde. Weicht die Struktur ab, ist die
          # eingecheckte Fixture veraltet.
          python3 - <<'PYCMP'
          import json, os, sys

          def shape(node, prefix=""):
              keys = set()
              if isinstance(node, dict):
                  for k, v in node.items():
                      keys.add(prefix + k)
                      keys |= shape(v, prefix + k + ".")
              return keys

          produced = json.load(open("/tmp/eval_results.json"))
          fixture = json.load(open(os.environ["SCENARIO_DIR"] + "/fixtures/eval_results.json"))
          missing = shape(fixture) - shape(produced)
          extra = shape(produced) - shape(fixture)
          if missing:
              print(f"::warning::checked-in fixture has fields the runner no longer produces: {sorted(missing)}")
          if extra:
              print(f"::warning::runner produces fields the checked-in fixture lacks — regenerate it: {sorted(extra)}")
          if "gate_result" in shape(produced):
              print("::error::gate_result reappeared — a candidate must not bring its own report card")
              sys.exit(1)
          print("Structure comparison done.")
          PYCMP
          echo "::endgroup::"

      # ── Drift: im Runner gemessen, nicht aus einer Fixture gelesen ──
      #
      # SPEC-04b Teil 3.1. Nach dem Lastlauf oben traegt die Anwendung
      # Histogramm-Beobachtungen. Daraus wird eine Baseline gezogen, ein
      # zweites Lastprofil gefahren und dagegen gemessen.
      #
      # Was diese Messung ZEIGT und was nicht, ehrlich benannt:
      #  - Sie ist echt. Die Zahlen stammen aus /metrics einer laufenden
      #    Anwendung, nicht aus einer eingecheckten Datei. Das ist der
      #    Unterschied, um den es in SPEC-04b geht: C-03 (Frist) und C-05
      #    (Provenance) werden hier zum ersten Mal an einem Dokument
      #    geprueft, das in DIESER Pipeline entstanden ist.
      #  - Sie zeigt KEINE Drift — lokal gegen dieselbe Anwendung mit
      #    PSI 0.000000 nachgemessen. Das ist kein Mangel, sondern die
      #    Bauart: das Prometheus-Histogramm ist
      #    kumulativ ueber die Prozesslaufzeit, die "aktuelle" Verteilung
      #    enthaelt die Baseline also mit und kann sich nur verduennen.
      #    Zweitens antwortet der Mock in
      #    Sub-Millisekunden, weitgehend unabhaengig von der Textlaenge
      #    (B-09). Ein gemessenes "keine Drift" ist ein gueltiges Ergebnis.
      #  - Dass das Gate bei Drift BLOCKIEREN wuerde, beweist diese Messung
      #    nicht. Das beweist der Negativfall-Job weiter unten. Ein gruener
      #    Durchlauf zeigt nur, dass nichts blockiert hat.
      - name: "Measure: drift against a second load profile"
        id: drift
        run: |
          echo "::group::Drift measurement (G-OPS-03 input)"
          python3 monitoring/drift_detector.py \
            --init-baseline \
            --source http://localhost:8080/metrics \
            --baseline /tmp/drift_baseline.json

          # Zweites Lastprofil mit anderen Textlaengen, damit die Verteilung
          # sich bewegen KANN. Ob sie es tut, ist das Messergebnis und wird
          # hier nicht vorweggenommen.
          for LEN in 40 400 4000 40000; do
            TEXT=$(python3 -c "print('a' * $LEN)")
            for _ in 1 2 3 4 5; do
              python3 - "$TEXT" <<'PYPOST'
          import json, sys, urllib.request
          req = urllib.request.Request(
              "http://localhost:8080/transcribe",
              data=json.dumps({"text": sys.argv[1]}).encode(),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req, timeout=30).read()
          PYPOST
            done
          done

          # Exit 1 heisst "Drift erkannt" — ein gueltiges Messergebnis, ueber
          # das Rego urteilt, nicht der Detektor. Nur Exit 2 heisst "es wurde
          # nicht gemessen", und das bricht ab: SPEC-04 hat den stillen
          # Fallback entfernt, der an dieser Stelle eine Zahl erfunden hat.
          set +e
          python3 monitoring/drift_detector.py \
            --source http://localhost:8080/metrics \
            --baseline /tmp/drift_baseline.json \
            --measurement-out /tmp/drift_measurement.json
          RC=$?
          set -e
          if [ "$RC" = "2" ]; then
            echo "::error::Drift measurement failed — no document was written, and there is no fallback distribution."
            exit 1
          fi

          # provenance MUSS "derived" sein, und das ist keine Formalie.
          # Die Provenance folgt der QUELLE, nicht der Rechnung: ein
          # Live-Scrape ergibt "derived" (gemessene Buckets, gerechnete
          # Kennzahl), eine Fixture-Datei ergibt "declared". Ein "declared"
          # an dieser Stelle hiesse, die Pipeline hat eine eingecheckte
          # Datei durchgereicht und nichts beobachtet — genau der Zustand,
          # den SPEC-04b beendet. C-05 wuerde darauf warnen; hier wird es
          # zum Abbruch, weil der Runner keinen Grund hat, aus einer Datei
          # zu lesen.
          PROV=$(python3 -c "import json;print(json.load(open('/tmp/drift_measurement.json'))['drift_measurement']['provenance'])")
          SRC=$(python3 -c "import json;print(json.load(open('/tmp/drift_measurement.json'))['drift_measurement']['source'])")
          echo "provenance: $PROV   source: $SRC"
          if [ "$PROV" != "derived" ]; then
            echo "::error::drift measurement provenance is '$PROV', expected 'derived' — nothing was scraped from the running app."
            exit 1
          fi
          case "$SRC" in
            http://localhost:8080/*) ;;
            *) echo "::error::drift measurement source is '$SRC' — it did not come from the app under test."; exit 1 ;;
          esac
          echo "::endgroup::"

      # ── Das Schwellenwert-Dokument fuer G-OPS-02 ──
      # In YAML autoriert (es traegt Rechtsgrundlagen als Kommentare), von
      # Rego als JSON gelesen. Die Konvertierung ist ein Erzeugungsschritt,
      # kein Nebenprodukt.
      - name: "Prepare: incident thresholds document"
        run: |
          echo "::group::incident_thresholds.yaml -> JSON (G-OPS-02 input)"
          python3 -c "
          import json, yaml
          with open('governance/incident_thresholds.yaml') as f: data = yaml.safe_load(f)
          with open('/tmp/incident_thresholds.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False, default=str)
          print('written: /tmp/incident_thresholds.json')
          "
          echo "::endgroup::"

      # ── Anwesenheitspflicht, in der Umgebung die zaehlt ──
      #
      # SPEC-04b Teil 3.2 hat required_inputs im Orchestrator erzwungen. Die
      # CI faehrt den Orchestrator nicht, sie ruft conftest je Gate direkt —
      # also galt die Erzwingung genau hier nicht. G-OPS-02 und G-OPS-03
      # deklarieren seither ein Pflichtdokument, die Pipeline hat keines
      # angefordert und ist gruen geworden. Deklaration vorhanden, Mechanismus
      # nicht: derselbe Fehlertyp, eine Ebene weiter aussen.
      #
      # Das Skript prueft NUR Anwesenheit und Lesbarkeit. Die Frische prueft
      # C-03 in Rego. Zwei Fragen, zwei Zustaendigkeiten.
      - name: "Enforce required inputs (SPEC-04b Teil 3.2)"
        run: |
          echo "::group::required_inputs"
          python3 pipeline/ci_required_inputs.py --out-dir /tmp \
            --supplied G-OPS-03:drift_measurement=/tmp/drift_measurement.json \
            --supplied G-OPS-02:incident_thresholds=/tmp/incident_thresholds.json
          echo "::endgroup::"
      - name: "Gate G-DEP-02: Safety Metrics (R003, Art.15) [AUTO]"
        id: g-dep-02
        run: |
          echo "::group::G-DEP-02 Safety Metrics"
          # Geprueft wird das ERZEUGTE Dokument, nicht die Fixture.
          bash pipeline/ci/run_gate.sh G-DEP-02 \
            "/tmp/eval_results.json" \
            "policies/deployment/policy_safety_metrics.rego" \
            "genaiops.deployment.safety_metrics"
          echo "::endgroup::"

      - name: "Gate G-DEP-03: Transparency Docs (R007, Art.13) [HYBRID]"
        id: g-dep-03
        run: |
          echo "::group::G-DEP-03 Transparency Docs"
          bash pipeline/ci/run_gate.sh G-DEP-03 \
            "$SCENARIO_DIR/fixtures/app_documentation_transparency_pass.json" \
            "policies/deployment/policy_transparency_docs_present.rego" \
            "genaiops.deployment.transparency_docs_present"
          echo "::endgroup::"

      - name: "Gate G-DEP-04: Konformitaets-Eingangspruefung (R011, Art.26.1) [AUTO]"
        id: g-dep-04
        run: |
          echo "::group::G-DEP-04 Konformitaets-Eingangspruefung"
          bash pipeline/ci/run_gate.sh G-DEP-04 \
            "$SCENARIO_DIR/fixtures/app_documentation.json" \
            "policies/deployment/policy_conformity_verified.rego" \
            "genaiops.deployment.conformity_verified"
          echo "::endgroup::"

      - name: "Gate G-DEP-05: Bias Assessment (R013, Art.10) [AUTO]"
        id: g-dep-05
        run: |
          echo "::group::G-DEP-05 Bias Assessment"
          bash pipeline/ci/run_gate.sh G-DEP-05 \
            "$SCENARIO_DIR/fixtures/model_documentation_bias_pass.json" \
            "policies/pre-deployment/policy_bias_assessment_complete.rego" \
            "genaiops.pre_deployment.bias_assessment_complete"
          echo "::endgroup::"

      - name: "Gate G-DEP-06: Logging Configuration (R014, Art.12) [AUTO]"
        id: g-dep-06
        run: |
          echo "::group::G-DEP-06 Logging Configuration"
          bash pipeline/ci/run_gate.sh G-DEP-06 \
            "$SCENARIO_DIR/fixtures/app_documentation.json" \
            "policies/deployment/policy_logging_configured.rego" \
            "genaiops.deployment.logging_configured"
          echo "::endgroup::"

      # ════════════════════════════════════════════════════════
      # OPERATIONS GATES (5)
      # ════════════════════════════════════════════════════════

      - name: "Gate G-OPS-01: Human Oversight (R008, Art.14) [HYBRID]"
        id: g-ops-01
        run: |
          echo "::group::G-OPS-01 Human Oversight"
          bash pipeline/ci/run_gate.sh G-OPS-01 \
            "$SCENARIO_DIR/fixtures/app_documentation.json" \
            "policies/operations/policy_human_oversight_operational.rego" \
            "genaiops.operations.human_oversight_operational"
          echo "::endgroup::"

      - name: "Gate G-OPS-02: Incident Process (R009, Art.26) [AUTO]"
        id: g-ops-02
        run: |
          echo "::group::G-OPS-02 Incident Process"
          bash pipeline/ci/run_gate.sh G-OPS-02 \
            "$SCENARIO_DIR/fixtures/deployment_incident_pass.json" \
            "policies/operations/policy_incident_process_exists.rego" \
            "genaiops.operations.incident_process_exists"
          echo "::endgroup::"

      - name: "Gate G-OPS-03: Monitoring Config (R010, Art.72) [AUTO]"
        id: g-ops-03
        run: |
          echo "::group::G-OPS-03 Monitoring Configuration"
          bash pipeline/ci/run_gate.sh G-OPS-03 \
            "$SCENARIO_DIR/fixtures/deployment_compliant.yaml" \
            "policies/operations/policy_monitoring_configured.rego" \
            "genaiops.operations.monitoring_configured"
          echo "::endgroup::"

      - name: "Gate G-OPS-04: Cybersecurity-Operations (R003, Art.15) [AUTO]"
        id: g-ops-04
        run: |
          echo "::group::G-OPS-04 Cybersecurity-Operations"
          bash pipeline/ci/run_gate.sh G-OPS-04 \
            "$SCENARIO_DIR/fixtures/app_documentation.json" \
            "policies/operations/policy_data_security_controls.rego" \
            "genaiops.operations.data_security_controls"
          echo "::endgroup::"

      - name: "Gate G-OPS-06: Rollenwechsel (R001, Art.25) [HYBRID]"
        id: g-ops-06
        run: |
          echo "::group::G-OPS-06 Rollenwechsel (Art. 25)"
          bash pipeline/ci/run_gate.sh G-OPS-06 \
            "$SCENARIO_DIR/fixtures/art25_benign_change.json" \
            "policies/operations/policy_role_change_monitoring.rego" \
            "genaiops.operations.role_change_monitoring"
          echo "::endgroup::"

      # ════════════════════════════════════════════════════════
      # EVIDENCE RECORDING (S4)
      # ════════════════════════════════════════════════════════

      - name: "Record Evidence — All Gate Results"
        id: evidence
        run: |
          echo "::group::Evidence Store Recording"
          echo "📦 Recording gate results to Evidence Store..."
          echo "   Database: $EVIDENCE_DB (SQLite for PoC)"
          echo ""

          # Fail closed on the mode, too. The CI knows it — the measurement
          # step asserted it — so an empty value here means the hand-over
          # broke, and a record that says "unknown" while the run knew better
          # is exactly the finding this closes (B-21).
          RUNTIME_MODE="${{ steps.measure.outputs.runtime_mode }}"
          if [ -z "$RUNTIME_MODE" ]; then
            echo "::error::No runtime_mode was handed over from the measurement step. The run measured the mode and would record 'unknown' — refusing to write evidence that is weaker than what the run knows."
            exit 1
          fi
          echo "runtime_mode for all records: $RUNTIME_MODE"

          for gate_info in \
            "G-PRE-01:R001:${{ steps.g-pre-01.outputs.result }}:HYBRID:decision_log_gpre01_manual.json" \
            "G-PRE-02:R012:${{ steps.g-pre-02.outputs.result }}:HYBRID:" \
            "G-PRE-03:R001:${{ steps.g-pre-03.outputs.result }}:HYBRID:" \
            "G-PRE-04:R003:${{ steps.g-pre-04.outputs.result }}:AUTO:" \
            "G-PRE-05:R004:${{ steps.g-pre-05.outputs.result }}:HYBRID:decision_log_gpre05_manual.json" \
            "G-DEP-01:R002:${{ steps.g-dep-01.outputs.result }}:AUTO:" \
            "G-DEP-02:R003:${{ steps.g-dep-02.outputs.result }}:AUTO:" \
            "G-DEP-03:R007:${{ steps.g-dep-03.outputs.result }}:HYBRID:decision_log_gdep03_manual.json" \
            "G-DEP-04:R011:${{ steps.g-dep-04.outputs.result }}:AUTO:" \
            "G-DEP-05:R013:${{ steps.g-dep-05.outputs.result }}:AUTO:" \
            "G-DEP-06:R014:${{ steps.g-dep-06.outputs.result }}:AUTO:" \
            "G-OPS-01:R008:${{ steps.g-ops-01.outputs.result }}:HYBRID:" \
            "G-OPS-02:R009:${{ steps.g-ops-02.outputs.result }}:AUTO:" \
            "G-OPS-03:R010:${{ steps.g-ops-03.outputs.result }}:AUTO:" \
            "G-OPS-04:R003:${{ steps.g-ops-04.outputs.result }}:AUTO:" \
            "G-OPS-06:R001:${{ steps.g-ops-06.outputs.result }}:HYBRID:"
          do
            IFS=':' read -r GATE_ID REQ_ID DECISION METHOD DECISION_LOG <<< "$gate_info"
            RESULT_FILE="/tmp/${GATE_ID,,}-result.json"
            EVIDENCE_SOURCE="/tmp/evidence_${GATE_ID,,}.json"
            DECISION_LOG_PATH=""
            if [ -n "$DECISION_LOG" ]; then
              DECISION_LOG_PATH="$SCENARIO_DIR/fixtures/$DECISION_LOG"
            fi

            python3 -c "
          import json
          conftest = {}
          try:
            with open('$RESULT_FILE') as f: conftest = json.load(f)
          except: pass
          decision_log = None
          if '$DECISION_LOG_PATH':
            try:
              with open('$DECISION_LOG_PATH') as f: decision_log = json.load(f)
            except: pass
          evidence = {
            'pipeline_run_id': '${{ steps.init.outputs.pipeline_run_id }}',
            'commit_sha': '$GITHUB_SHA',
            'trigger': '${{ github.event_name }}',
            'actor': '${{ github.actor }}',
            'gate_id': '$GATE_ID',
            'requirement_id': '$REQ_ID',
            'decision': '$DECISION',
            'method': '$METHOD',
            'conftest_output': conftest
          }
          if decision_log:
            evidence['decision_log'] = decision_log
            evidence['manual_reviewer'] = decision_log.get('reviewed_by', 'unknown')
          with open('$EVIDENCE_SOURCE', 'w') as f:
            json.dump(evidence, f)
          "

            python3 evidence-store/scripts/record_evidence.py \
              --sqlite "$EVIDENCE_DB" \
              --gate "$GATE_ID" \
              --method "$METHOD" \
              --runtime-mode "$RUNTIME_MODE" \
              --source "$EVIDENCE_SOURCE" \
              && echo "  ✅ $GATE_ID ($DECISION) [$METHOD] → Evidence recorded" \
              || { echo "::error::$GATE_ID — Evidence recording FAILED"; exit 1; }
          done
          echo "::endgroup::"

      # ── Hash Chain Verification (S4 + DP5) ──
      - name: "Verify Hash Chain Integrity"
        id: hash-chain
        run: |
          echo "::group::Hash Chain Verification"
          echo "🔗 Verifying tamper-proof audit trail (17+ records)..."
          python3 evidence-store/scripts/verify_hash_chain.py \
            --sqlite "$EVIDENCE_DB" \
            && echo "✅ Hash chain VALID — Evidence Store integrity confirmed" \
            || { echo "::error::Hash chain verification FAILED — Evidence Store may be corrupted"; exit 1; }
          echo "::endgroup::"

      # ── Evidence Manifest (SPEC-05 Teil 2) ──
      #
      # The chain was just verified — and this runner is about to be
      # destroyed with $EVIDENCE_DB on it (B-18). The manifest is the
      # document that can leave: chain head, genesis, a digest over the
      # verdicts. Unsigned for now; Teil 3 signs it and uploads it.
      #
      # always(): a blocked pipeline needs its manifest more than a green
      # one does. Evidence that only exists on success cannot document a
      # failure.
      - name: "Build the evidence manifest"
        id: manifest
        if: always()
        run: |
          echo "::group::Evidence Manifest"
          python3 evidence-store/scripts/build_manifest.py \
            --sqlite "$EVIDENCE_DB" \
            --out evidence_manifest.json \
            --commit-sha "$GITHUB_SHA" \
            --runtime-mode "${{ steps.measure.outputs.runtime_mode }}" \
            || { echo "::error::Evidence manifest could not be built"; exit 1; }

          # SPEC-05 Abschnitt 8.1: the manifest DECLARES its context, and a
          # declaration that nobody checks is the failure type this project
          # keeps finding (B-02, B-11, B-12, B-13, B-17). So CI reads the
          # value back and refuses to continue if this run claims to be
          # anything other than a CI run.
          CONTEXT=$(python3 -c "import json;print(json.load(open('evidence_manifest.json'))['evidence_manifest']['signing_context'])")
          if [ "$CONTEXT" != "ci" ]; then
            echo "::error::signing_context is '$CONTEXT', expected 'ci' — a CI run may not present itself as a local one"
            exit 1
          fi
          echo "✅ signing_context asserted: ci"
          echo "::endgroup::"

      # SPEC-05 Teil 3: the manifest leaves the runner. Without this the
      # evidence of a run is a property that comes into being with the job
      # and ends with it (B-18) — verified, and then thrown away.
      # The signing job evaluates G-OPS-05 against the signature and records
      # its verdict, so it needs the chain this run wrote. The database goes
      # with the manifest — a verdict recorded into a different store would
      # be a verdict about nothing.
      - name: "Upload the evidence store"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evidence-store-db
          path: ${{ env.EVIDENCE_DB }}
          if-no-files-found: error
          retention-days: 90

      - name: "Upload the evidence manifest"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evidence-manifest
          path: evidence_manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: "Stop the application under test"
        if: always()
        run: |
          # always(): der Container muss auch dann weg, wenn ein Gate
          # blockiert hat — die Pipeline Decision unten beendet den Job
          # mit exit 1.
          docker rm -f scribe-ci >/dev/null 2>&1 || true

      # ── Gate Summary + Decision ──
      - name: "Pipeline Decision"
        id: gate-summary
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  GenAIOps Quality Gate Pipeline — Gate Summary           ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  Pipeline: ${{ steps.init.outputs.pipeline_run_id }}"
          echo "║  Commit:   ${GITHUB_SHA::8}"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  PRE-DEPLOYMENT:"
          echo "║    G-PRE-01 Risk Classification:  ${{ steps.g-pre-01.outputs.result }}  [HYBRID]"
          echo "║    G-PRE-02 Zweckbestimmung:      ${{ steps.g-pre-02.outputs.result }}  [HYBRID]"
          echo "║    G-PRE-03 Risikomanagement:     ${{ steps.g-pre-03.outputs.result }}  [HYBRID]"
          echo "║    G-PRE-04 Security Baseline:    ${{ steps.g-pre-04.outputs.result }}  [AUTO]"
          echo "║    G-PRE-05 Governance Approval:  ${{ steps.g-pre-05.outputs.result }}  [HYBRID]"
          echo "║  DEPLOYMENT:"
          echo "║    G-DEP-01 Data Provenance:      ${{ steps.g-dep-01.outputs.result }}  [AUTO]"
          echo "║    G-DEP-02 Safety Metrics:       ${{ steps.g-dep-02.outputs.result }}  [AUTO]"
          echo "║    G-DEP-03 Transparency Docs:    ${{ steps.g-dep-03.outputs.result }}  [HYBRID]"
          echo "║    G-DEP-04 Konformitaetspruefung:${{ steps.g-dep-04.outputs.result }}  [AUTO]"
          echo "║    G-DEP-05 Bias Assessment:      ${{ steps.g-dep-05.outputs.result }}  [AUTO]"
          echo "║    G-DEP-06 Logging Config:       ${{ steps.g-dep-06.outputs.result }}  [AUTO]"
          echo "║  OPERATIONS:"
          echo "║    G-OPS-01 Human Oversight:      ${{ steps.g-ops-01.outputs.result }}  [HYBRID]"
          echo "║    G-OPS-02 Incident Process:     ${{ steps.g-ops-02.outputs.result }}  [AUTO]"
          echo "║    G-OPS-03 Monitoring Config:    ${{ steps.g-ops-03.outputs.result }}  [AUTO]"
          echo "║    G-OPS-04 Cybersecurity Ops:    ${{ steps.g-ops-04.outputs.result }}  [AUTO]"
          echo "║    G-OPS-05 Evidence Complete:    evaluated in the signing job  [AUTO]"
          echo "║    G-OPS-06 Rollenwechsel:        ${{ steps.g-ops-06.outputs.result }}  [HYBRID]"
          echo "╠══════════════════════════════════════════════════════════╣"

          GATES=(
            "${{ steps.g-pre-01.outputs.result }}"
            "${{ steps.g-pre-02.outputs.result }}"
            "${{ steps.g-pre-03.outputs.result }}"
            "${{ steps.g-pre-04.outputs.result }}"
            "${{ steps.g-pre-05.outputs.result }}"
            "${{ steps.g-dep-01.outputs.result }}"
            "${{ steps.g-dep-02.outputs.result }}"
            "${{ steps.g-dep-03.outputs.result }}"
            "${{ steps.g-dep-04.outputs.result }}"
            "${{ steps.g-dep-05.outputs.result }}"
            "${{ steps.g-dep-06.outputs.result }}"
            "${{ steps.g-ops-01.outputs.result }}"
            "${{ steps.g-ops-02.outputs.result }}"
            "${{ steps.g-ops-03.outputs.result }}"
            "${{ steps.g-ops-04.outputs.result }}"
            "${{ steps.g-ops-05.outputs.result }}"
            "${{ steps.g-ops-06.outputs.result }}"
          )
          # Gezaehlt, nicht behauptet: die Zahlen stammen aus demselben
          # Array, das die Entscheidung traegt.
          ALL_PASS=true
          PASSED=0
          for g in "${GATES[@]}"; do
            if [ "$g" = "FAIL" ]; then ALL_PASS=false; else PASSED=$((PASSED+1)); fi
          done
          TOTAL=${#GATES[@]}
          echo "gates_pass=$PASSED" >> "$GITHUB_OUTPUT"
          echo "gates_total=$TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$ALL_PASS" = true ]; then
            echo "║  DECISION: ✅ $PASSED/$TOTAL GATES PASSED — Deploy authorized"
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "║  DECISION: ❌ GATE FAILURE — Deploy BLOCKED            ║"
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          fi
          echo "╚══════════════════════════════════════════════════════════╝"

          if [ "$ALL_PASS" = false ]; then
            echo "::error::Quality Gate failure — deployment blocked. Fix violations and re-push."
            exit 1
          fi

  # ────────────────────────────────────────────────────────
  # Job 2: Negativfaelle (SPEC-04b Teil 3.3)
  # ────────────────────────────────────────────────────────
  # Ein gruener Hauptlauf beweist, dass nichts blockiert hat. Er beweist
  # nicht, dass etwas blockieren WUERDE — und genau das ist die Aussage,
  # auf die sich ein Kontrollsystem beruft. Dieser Job zeigt es an drei
  # Faellen, jeder mit Gegenprobe:
  #
  #   1. gemessene Drift  -> G-OPS-03 blockiert (C-04)
  #   2. verfehlte Metrik -> G-DEP-02 blockiert
  #   3. FEHLENDE Messung -> G-OPS-03 blockiert (Anwesenheitspflicht)
  #
  # Die Gegenprobe ist kein Beiwerk. Ein Check, den das Gegenbeispiel nicht
  # brechen kann, ist kein Check (B-16): waere Fall 1 aus einem anderen
  # Grund rot — veraltetes Dokument, falscher Namespace — saehe er identisch
  # aus. Deshalb muss der Normalfall daneben gruen sein.
  #
  # Eigener Job, damit ein erwarteter Fehlschlag den Hauptlauf nicht rot
  # faerbt. Ohne `needs`, damit die Negativfaelle auch dann laufen, wenn der
  # Hauptlauf blockiert — sonst verschwaende gerade der interessante Fall.
  # ────────────────────────────────────────────────────────
  # Job 2: Sign the evidence manifest, keyless — SPEC-05 Teil 3 und 4
  # ────────────────────────────────────────────────────────
  #
  # Keyless has no local equivalent: the signature is issued against the OIDC
  # token of THIS workflow run, so the producer identity is not "who held the
  # key" but "which workflow, in which repository, on which commit". That is
  # the identity E-1 means (HANDBUCH 3.3).
  #
  # The signature states ORIGIN and TIME. It does not state that the signed
  # values are correct — that is what the rules decide, and where the numbers
  # come from was SPEC-04's question (SPEC-05 Abschnitt 13).
  sign-evidence:
    name: "Sign the evidence manifest (keyless)"
    runs-on: ubuntu-latest
    needs: quality-gates
    # always(): a blocked pipeline needs its signed evidence more than a green
    # one does. If quality-gates died before the manifest existed, the
    # download below fails and this job goes red — loudly, rather than
    # skipping in silence.
    if: always()

    # DELIBERATE ELEVATION over the workflow-wide `contents: read`, scoped to
    # this job alone. id-token: write lets the runner request the OIDC token
    # that Sigstore exchanges for a short-lived certificate; without it there
    # is no identity to bind and no keyless signature. No other job gets it.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: "Set up Python 3.11"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      # SHA-pinned like every other action here. A signing chain whose tool is
      # pulled through a movable tag has given up its trust anchor one step
      # earlier (SPEC-05 5.2).
      - name: "Install OPA + Conftest"
        run: |
          CONFTEST_VERSION="0.56.0"
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            || { echo "::error::Failed to download Conftest v${CONFTEST_VERSION}"; exit 1; }
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: "Install Python dependencies"
        run: pip install PyYAML

      - name: "Install cosign"
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: "Download the evidence manifest"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: evidence-manifest

      - name: "Download the evidence store"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: evidence-store-db
          path: /tmp

      - name: "Assert the signing context before signing"
        run: |
          echo "::group::signing_context"
          # SPEC-05 Abschnitt 8.1: the manifest DECLARES its context, and a
          # declaration nobody checks is the failure type this project keeps
          # finding (B-02, B-11, B-12, B-13, B-17). Asserted a second time
          # here, in the job that acts on it: signing a manifest that calls
          # itself local would put a CI signature on a local claim.
          CONTEXT=$(python3 -c "import json;print(json.load(open('evidence_manifest.json'))['evidence_manifest']['signing_context'])")
          if [ "$CONTEXT" != "ci" ]; then
            echo "::error::signing_context is '$CONTEXT', expected 'ci' — a CI run may not present itself as a local one"
            exit 1
          fi
          echo "✅ signing_context asserted: ci"
          echo "::endgroup::"

      - name: "Sign the manifest, keyless"
        run: |
          echo "::group::cosign sign-blob"
          # .sigstore.json is the bundle convention; it carries the
          # certificate and the transparency-log entry alongside the signature.
          cosign sign-blob --yes evidence_manifest.json \
            --bundle evidence_manifest.sigstore.json \
            || { echo "::error::Signing failed — no evidence leaves this run signed"; exit 1; }
          echo "::endgroup::"

      # SPEC-05 Teil 4. Identity-bound, or the call proves nothing: cosign
      # requires SOME identity argument, and the remaining ways to make it
      # worthless are a permissive regexp and the two --insecure-ignore-*
      # flags. None of them appears here, and SIGNATURE_VERIFY_PINS_IDENTITY
      # holds the whole repository to that.
      - name: "Verify the signature, identity-bound"
        run: |
          echo "::group::cosign verify-blob"
          python3 evidence-store/scripts/verify_signature.py \
            --manifest evidence_manifest.json \
            --bundle evidence_manifest.sigstore.json \
            --out signature_verification.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/gate-pipeline.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --workflow-repository "${GITHUB_REPOSITORY}" \
            --workflow-sha "${GITHUB_SHA}" \
            --sqlite "$EVIDENCE_DB" \
            --input-provenance ci-run \
            || { echo "::error::Signature verification failed"; exit 1; }
          echo "::endgroup::"

      # ── G-OPS-05, an dieser Stelle und nicht frueher ──
      #
      # Der ORT wandert, nicht die Zustaendigkeit: G-OPS-05 bleibt ein Gate
      # mit einem Evidence-Record und einem von Rego abgeleiteten Urteil. Es
      # steht hier, weil das Manifest aus der fertigen Kette entsteht — die
      # Signatur also nach dem Gate-Lauf — und weil id-token: write genau
      # einem Job gehoeren soll. Also wandert das Gate zur Signatur, nicht
      # die Rechteerhoehung zum Katalog.
      - name: "Resolve the gate's required inputs"
        run: |
          echo "::group::required_inputs"
          python3 pipeline/ci_required_inputs.py --out-dir /tmp \
            --supplied G-OPS-05:signature_verification=signature_verification.json
          echo "::endgroup::"

      - name: "Gate G-OPS-05: Evidence Completeness (R005, Art.15) [AUTO]"
        id: g-ops-05
        run: |
          echo "::group::G-OPS-05 Evidence Completeness"
          chmod +x pipeline/ci/run_gate.sh
          bash pipeline/ci/run_gate.sh G-OPS-05 \
            "$SCENARIO_DIR/fixtures/deployment_compliant.yaml" \
            "policies/operations/policy_evidence_completeness.rego" \
            "genaiops.operations.evidence_completeness"
          echo "::endgroup::"

      - name: "Record the gate's evidence"
        if: always()
        run: |
          echo "::group::Evidence"
          # SELBSTBEZUGSGRENZE, benannt statt hingenommen: dieser Record
          # entsteht NACH dem Manifest und liegt damit ausserhalb dessen, was
          # signiert wurde. Ein Gate kann seinen eigenen Record nicht
          # mitattestieren, so wenig wie eine Unterschrift sich selbst umfasst.
          # Das ist die Form der Sache, keine Luecke — und es steht in der
          # Gate-Definition und in SPEC-05, damit es niemand fuer ein Versehen
          # haelt (D-32).
          DECISION="${{ steps.g-ops-05.outputs.result }}"
          RUNTIME_MODE="${{ needs.quality-gates.outputs.runtime_mode }}"
          if [ -z "$RUNTIME_MODE" ]; then
            echo "::error::No runtime_mode was handed over from the gate job. This record would say 'unknown' about a run whose mode was measured (B-21)."
            exit 1
          fi
          python3 -c "
          import json
          conftest = {}
          try:
            with open('/tmp/g-ops-05-result.json') as f: conftest = json.load(f)
          except Exception: pass
          verification = {}
          try:
            with open('signature_verification.json') as f: verification = json.load(f)
          except Exception: pass
          evidence = {
            'pipeline_run_id': '${{ needs.quality-gates.outputs.pipeline_run_id }}',
            'commit_sha': '$GITHUB_SHA',
            'trigger': '${{ github.event_name }}',
            'actor': '${{ github.actor }}',
            'gate_id': 'G-OPS-05',
            'requirement_id': 'R005',
            'decision': '$DECISION' or 'FAIL',
            'method': 'AUTO',
            'conftest_output': conftest,
            'signature_verification': verification.get('signature_verification', {}),
          }
          with open('/tmp/evidence_g-ops-05.json', 'w') as f:
            json.dump(evidence, f)
          "
          python3 evidence-store/scripts/record_evidence.py \
            --sqlite "$EVIDENCE_DB" \
            --gate "G-OPS-05" \
            --method "AUTO" \
            --runtime-mode "$RUNTIME_MODE" \
            --source "/tmp/evidence_g-ops-05.json" \
            && echo "  ✅ G-OPS-05 ($DECISION) [AUTO] → Evidence recorded" \
            || { echo "::error::G-OPS-05 — Evidence recording FAILED"; exit 1; }
          echo "::endgroup::"

      - name: "Verify the hash chain once more"
        if: always()
        run: |
          echo "::group::Hash Chain Verification"
          python3 evidence-store/scripts/verify_hash_chain.py --sqlite "$EVIDENCE_DB" \
            && echo "✅ Hash chain VALID — including the record written after signing" \
            || { echo "::error::Hash chain verification FAILED"; exit 1; }
          echo "::endgroup::"

      - name: "Upload the completed evidence store"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evidence-store-db-final
          path: ${{ env.EVIDENCE_DB }}
          if-no-files-found: error
          retention-days: 90

      # Manifest, bundle and the verification document together. The bundle
      # without the manifest proves nothing, and the manifest without the
      # bundle is an unsigned summary — SPEC-05 Abschnitt 1.2 is only answered
      # when both leave the runner.
      - name: "Upload the signed evidence"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evidence-manifest-signed
          path: |
            evidence_manifest.json
            evidence_manifest.sigstore.json
            signature_verification.json
          if-no-files-found: error
          retention-days: 90

      - name: "What this signature says, and what it does not"
        if: always()
        run: |
          echo "The signature states ORIGIN and TIME: this workflow, in this"
          echo "repository, on this commit, asserted this chain head and these"
          echo "verdicts at this moment. It does NOT state that the values are"
          echo "correct — the rules decide that, and where the numbers came"
          echo "from was SPEC-04's question. A compromised CI signs a wrong"
          echo "record flawlessly; what rises is the cost of forgery."
          echo ""
          echo "No gate reads this document yet. SPEC-05 Teil 5 wires it into"
          echo "G-OPS-05; until then the mechanism exists and claims nothing."

  negative-cases:
    name: "Negative Cases — the gates would block"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install Conftest
        run: |
          CONFTEST_VERSION="0.56.0"
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            || { echo "::error::Failed to download Conftest v${CONFTEST_VERSION}"; exit 1; }
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install PyYAML

      - name: "Define expectation helper"
        run: |
          cat > /tmp/expect_gate.sh << 'EXPECTSCRIPT'
          #!/usr/bin/env bash
          # expect_gate.sh <BLOCK|PASS> <label> <input> <policy> <namespace>
          #
          # Prueft die ERWARTUNG, nicht nur den Ausgang. Ein Werkzeugfehler
          # (kaputte Policy, falscher Namespace) meldet ebenfalls null
          # Verstoesse und saehe sonst wie ein bestandener Normalfall aus.
          EXPECT="$1"; LABEL="$2"; INPUT="$3"; POLICY="$4"; NS="$5"
          OUT="/tmp/neg-$(echo "$LABEL" | tr -c 'a-zA-Z0-9' '-').json"

          conftest test "$INPUT" --policy "$POLICY" --namespace "$NS" \
            --no-color --output json > "$OUT" 2>/tmp/neg-stderr.txt

          N=$(python3 -c "
          import json, sys
          try:
            with open('$OUT') as f: data = json.load(f)
          except Exception: print(-1); sys.exit()
          print(sum(len(r.get('failures', [])) for r in data))
          ")

          if [ "$N" = "-1" ]; then
            echo "::error::$LABEL — conftest produced no parsable output (tool error, not a verdict)"
            cat /tmp/neg-stderr.txt
            exit 1
          fi

          if [ "$EXPECT" = "BLOCK" ] && [ "$N" -gt 0 ]; then
            echo "✅ $LABEL — blocked as expected ($N violations)"
            python3 -c "
          import json
          for r in json.load(open('$OUT')):
            for f in r.get('failures', []): print(f'     → {f[\"msg\"]}')
          "
          elif [ "$EXPECT" = "PASS" ] && [ "$N" = "0" ]; then
            echo "✅ $LABEL — passed as expected (counter-check)"
          else
            echo "::error::$LABEL — expected $EXPECT, got $N violations. A gate that does not separate these two cases separates nothing."
            cat "$OUT"
            exit 1
          fi
          EXPECTSCRIPT
          chmod +x /tmp/expect_gate.sh

      # ── Fall 1: gemessene Drift blockiert G-OPS-03 ──
      # Die Fixture wird EXPLIZIT als Quelle benannt. Sie traegt
      # provenance "declared", C-05 warnt sichtbar darauf — ein
      # Fixture-Lauf ist kein Betriebsnachweis, und die Evidenz sagt das.
      - name: "Case 1: measured drift blocks G-OPS-03"
        run: |
          echo "::group::drifted vs. normal"
          for CASE in drifted normal; do
            python3 monitoring/drift_detector.py \
              --source "monitoring/fixtures/current_${CASE}.json" \
              --baseline monitoring/fixtures/baseline_normal.json \
              --measurement-out "/tmp/measurement_${CASE}.json" || true
          done

          /tmp/expect_gate.sh BLOCK "G-OPS-03 with drift" \
            /tmp/measurement_drifted.json \
            policies/operations/policy_monitoring_configured.rego \
            genaiops.operations.monitoring_configured

          /tmp/expect_gate.sh PASS "G-OPS-03 without drift (counter-check)" \
            /tmp/measurement_normal.json \
            policies/operations/policy_monitoring_configured.rego \
            genaiops.operations.monitoring_configured
          echo "::endgroup::"

      # ── Fall 2: verfehlte Sicherheitsmetrik blockiert G-DEP-02 ──
      - name: "Case 2: a missed safety metric blocks G-DEP-02"
        run: |
          echo "::group::eval_results_fail vs. eval_results"
          /tmp/expect_gate.sh BLOCK "G-DEP-02 with failing metrics" \
            "$SCENARIO_DIR/fixtures/eval_results_fail.json" \
            policies/deployment/policy_safety_metrics.rego \
            genaiops.deployment.safety_metrics

          /tmp/expect_gate.sh PASS "G-DEP-02 with passing metrics (counter-check)" \
            "$SCENARIO_DIR/fixtures/eval_results.json" \
            policies/deployment/policy_safety_metrics.rego \
            genaiops.deployment.safety_metrics
          echo "::endgroup::"

      # ── Fall 3: die FEHLENDE Messung blockiert G-OPS-03 ──
      #
      # Der Fall, um den es in SPEC-04b eigentlich geht. C-03 bis C-05 feuern
      # nur, wenn input.drift_measurement existiert — wer das Dokument
      # weglaesst, kommt an drei MUST-Checks vorbei. Rego kann das nicht
      # abfangen: es unterscheidet die Abwesenheit eines Dokuments nicht von
      # der Abwesenheit einer Regel. Deshalb prueft die Ebene, die die Inputs
      # zusammenstellt, und deshalb wird hier geprueft, dass sie es tut.
      - name: "Case 3: an absent measurement blocks G-OPS-03"
        run: |
          echo "::group::required_inputs enforcement"
          # (a) Nichts geliefert -> Befund, der den fehlenden Input benennt
          python3 pipeline/ci_required_inputs.py --out-dir /tmp/neg-absent
          if [ ! -f /tmp/neg-absent/g-ops-03-inputs.fail ]; then
            echo "::error::No finding was written for the absent drift measurement. The enforcement is declared but does not act — the exact failure mode SPEC-04b exists to remove."
            exit 1
          fi
          grep -q "drift_measurement" /tmp/neg-absent/g-ops-03-inputs.fail || {
            echo "::error::The finding does not name the missing input. 'Something is missing' is not an audit trail."
            exit 1
          }
          echo "✅ absent measurement — finding names the input:"
          sed 's/^/     → /' /tmp/neg-absent/g-ops-03-inputs.fail

          # (b) Gegenprobe: geliefert -> kein Befund, und der Input wird
          #     einer Policy MIT Namespace zugeordnet. Ohne diese Haelfte
          #     bestuende die Pruefung auch dann, wenn sie IMMER meldet.
          python3 monitoring/drift_detector.py \
            --source monitoring/fixtures/current_normal.json \
            --baseline monitoring/fixtures/baseline_normal.json \
            --measurement-out /tmp/neg_measurement.json || true
          python3 pipeline/ci_required_inputs.py --out-dir /tmp/neg-present \
            --supplied G-OPS-03:drift_measurement=/tmp/neg_measurement.json
          if [ -f /tmp/neg-present/g-ops-03-inputs.fail ]; then
            echo "::error::A supplied measurement still produced a finding — the check cannot tell present from absent."
            cat /tmp/neg-present/g-ops-03-inputs.fail
            exit 1
          fi
          grep -q "genaiops.operations.monitoring_configured" /tmp/neg-present/g-ops-03-inputs.args || {
            echo "::error::The resolved input carries no namespace. conftest would evaluate only 'main' and report zero violations for any input."
            exit 1
          }
          echo "✅ supplied measurement — resolved to a policy and namespace:"
          sed 's/^/     → /' /tmp/neg-present/g-ops-03-inputs.args
          echo "::endgroup::"

      # ══════════════════════════════════════════════════════════
      # SPEC-05 Abschnitt 11 — die sechs Faelle zur Signatur
      # ══════════════════════════════════════════════════════════
      #
      # Kein Fall signiert. Signieren braucht die OIDC-Identitaet, und die
      # gehoert genau einem Job; VERIFIZIEREN braucht sie nicht. Faelle 4
      # und 5 laufen deshalb gegen eine echte Signatur aus einem echten
      # frueheren Lauf (tests/signature/, Herkunft dort belegt),
      # Faelle 7 und 8 gegen konstruierte Nachweisdokumente, weil die
      # Zustaende, die sie beschreiben, sich nicht ehrlich erzeugen lassen:
      # das tlog-Flag ist repo-weit verboten.
      - name: "Install cosign (verification only, no signing identity)"
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"

      - name: "Case 4: a manifest changed after signing fails verification"
        run: |
          echo "::group::tampered vs. untouched"
          IDENTITY="https://github.com/MustDemir/genaiops-compliance-gates/.github/workflows/gate-pipeline.yml@refs/heads/spec05-signing"

          # (a) the manifest was edited after it was signed
          if python3 evidence-store/scripts/verify_signature.py \
               --manifest tests/signature/tampered_manifest.json \
               --bundle tests/signature/signed_manifest.sigstore.json \
               --out /tmp/neg-tampered.json \
               --certificate-identity "$IDENTITY" \
               --workflow-repository "" --workflow-sha "" \
               --input-provenance fixture; then
            echo "::error::A manifest edited after signing verified successfully. The signature would cover any content — the one thing it must not do."
            exit 1
          fi
          echo "✅ tampered manifest — verification refused it"

          # (b) counter-check: untouched, same bundle, same identity
          python3 evidence-store/scripts/verify_signature.py \
            --manifest tests/signature/signed_manifest.json \
            --bundle tests/signature/signed_manifest.sigstore.json \
            --out /tmp/neg-untouched.json \
            --certificate-identity "$IDENTITY" \
            --workflow-repository "" --workflow-sha "" \
            --input-provenance fixture \
            || { echo "::error::The untouched manifest failed too — then case (a) proves nothing about tampering, only that something is broken."; exit 1; }
          echo "✅ counter-check: the untouched manifest verifies"
          echo "::endgroup::"

      - name: "Case 5: verification against the wrong identity fails"
        run: |
          echo "::group::wrong vs. right identity"
          # (a) a signature from somewhere else must not pass
          if python3 evidence-store/scripts/verify_signature.py \
               --manifest tests/signature/signed_manifest.json \
               --bundle tests/signature/signed_manifest.sigstore.json \
               --out /tmp/neg-wrong-identity.json \
               --certificate-identity "https://github.com/someone-else/other-repo/.github/workflows/build.yml@refs/heads/main" \
               --workflow-repository "" --workflow-sha "" \
               --input-provenance fixture; then
            echo "::error::Verification passed against an identity that did not sign. 'Verified' would mean 'something signed', not 'who signed'."
            exit 1
          fi
          echo "✅ wrong identity — verification refused it"

          # (b) counter-check: the identity that actually signed
          python3 evidence-store/scripts/verify_signature.py \
            --manifest tests/signature/signed_manifest.json \
            --bundle tests/signature/signed_manifest.sigstore.json \
            --out /tmp/neg-right-identity.json \
            --certificate-identity "https://github.com/MustDemir/genaiops-compliance-gates/.github/workflows/gate-pipeline.yml@refs/heads/spec05-signing" \
            --workflow-repository "" --workflow-sha "" \
            --input-provenance fixture \
            || { echo "::error::The correct identity failed as well — case (a) then says nothing about identity."; exit 1; }
          echo "✅ counter-check: the signing identity verifies"
          echo "::endgroup::"

      - name: "Case 6: an absent signature verification blocks G-OPS-05"
        run: |
          echo "::group::required_inputs enforcement"
          # (a) nothing supplied -> a finding that NAMES the missing input
          python3 pipeline/ci_required_inputs.py --out-dir /tmp/neg-nosig
          if [ ! -f /tmp/neg-nosig/g-ops-05-inputs.fail ]; then
            echo "::error::No finding for the absent signature verification. Four MUST checks on E-1 would be skipped by leaving the document out — B-11 and B-17 in one."
            exit 1
          fi
          grep -q "signature_verification" /tmp/neg-nosig/g-ops-05-inputs.fail || {
            echo "::error::The finding does not name the missing input."
            exit 1
          }
          echo "✅ absent signature verification — finding names the input:"
          sed 's/^/     → /' /tmp/neg-nosig/g-ops-05-inputs.fail

          # (b) counter-check: supplied -> resolved to policy and namespace
          python3 pipeline/ci_required_inputs.py --out-dir /tmp/neg-sig \
            --supplied G-OPS-05:signature_verification=tests/signature/verification_valid.json
          if [ -f /tmp/neg-sig/g-ops-05-inputs.fail ]; then
            echo "::error::A supplied document still produced a finding — the enforcement fires on the wrong condition."
            exit 1
          fi
          echo "✅ counter-check: supplied verification resolves"
          sed 's/^/     → /' /tmp/neg-sig/g-ops-05-inputs.args
          echo "::endgroup::"

      - name: "Case 7: a signed head that is not the verified head blocks C-06"
        run: |
          echo "::group::head mismatch vs. match"
          /tmp/expect_gate.sh BLOCK "G-OPS-05/C-06 with a foreign chain head" \
            tests/signature/verification_head_mismatch.json \
            policies/operations/policy_evidence_signature.rego \
            genaiops.operations.evidence_signature

          /tmp/expect_gate.sh PASS "G-OPS-05 with matching heads (counter-check)" \
            tests/signature/verification_valid.json \
            policies/operations/policy_evidence_signature.rego \
            genaiops.operations.evidence_signature
          echo "::endgroup::"

      - name: "Case 8: an unchecked transparency log blocks C-07"
        run: |
          echo "::group::tlog off vs. on"
          /tmp/expect_gate.sh BLOCK "G-OPS-05/C-07 without a log check" \
            tests/signature/verification_tlog_off.json \
            policies/operations/policy_evidence_signature.rego \
            genaiops.operations.evidence_signature

          /tmp/expect_gate.sh PASS "G-OPS-05 with the log checked (counter-check)" \
            tests/signature/verification_valid.json \
            policies/operations/policy_evidence_signature.rego \
            genaiops.operations.evidence_signature
          echo "::endgroup::"

      - name: "Case 9: a CI run that declares itself local is refused"
        run: |
          echo "::group::signing_context local vs. ci"
          # A store of this job's own: the checked-in ones are gitignored, and
          # a case that depends on a file the clone does not have is a case
          # that proves nothing (the failure this job exists to prevent).
          python3 -c "
          import json
          json.dump({'gate_id': 'G-OPS-05', 'requirement_id': 'R005',
                     'decision': 'PASS', 'method': 'AUTO',
                     'pipeline_run_id': 'negative-cases', 'commit_sha': '$GITHUB_SHA'},
                    open('/tmp/neg-evidence.json', 'w'))
          "
          python3 evidence-store/scripts/record_evidence.py \
            --sqlite /tmp/neg-store.db --gate G-OPS-05 --method AUTO \
            --source /tmp/neg-evidence.json >/dev/null

          # (a) build a manifest that calls itself local, then run the same
          #     assertion the pipeline runs. No signing involved.
          python3 evidence-store/scripts/build_manifest.py \
            --sqlite /tmp/neg-store.db \
            --out /tmp/neg-manifest-local.json \
            --signing-context local --quiet
          CONTEXT=$(python3 -c "import json;print(json.load(open('/tmp/neg-manifest-local.json'))['evidence_manifest']['signing_context'])")
          if [ "$CONTEXT" = "ci" ]; then
            echo "::error::A manifest built with --signing-context local reports 'ci'. The declaration would say whatever the reader wants to hear."
            exit 1
          fi
          echo "✅ a local declaration stays local — the assertion in the pipeline exits 1 on this value"

          # (b) counter-check: the same store, declared as a CI run
          python3 evidence-store/scripts/build_manifest.py \
            --sqlite /tmp/neg-store.db \
            --out /tmp/neg-manifest-ci.json \
            --signing-context ci --quiet
          CONTEXT=$(python3 -c "import json;print(json.load(open('/tmp/neg-manifest-ci.json'))['evidence_manifest']['signing_context'])")
          if [ "$CONTEXT" != "ci" ]; then
            echo "::error::A manifest built with --signing-context ci does not report 'ci' — then case (a) proves nothing."
            exit 1
          fi
          echo "✅ counter-check: a CI declaration passes the same assertion"
          echo "::endgroup::"

      - name: "Negative Cases — summary"
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  Negative Cases — each with its counter-check            ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  1  measured drift        → G-OPS-03 blocks              ║"
          echo "║  2  missed safety metric  → G-DEP-02 blocks              ║"
          echo "║  3  absent measurement    → G-OPS-03 blocks              ║"
          echo "║  4  tampered manifest     → verification refuses it      ║"
          echo "║  5  wrong identity        → verification refuses it      ║"
          echo "║  6  absent verification   → G-OPS-05 blocks              ║"
          echo "║  7  foreign chain head    → C-06 blocks                  ║"
          echo "║  8  unchecked tlog        → C-07 blocks                  ║"
          echo "║  9  local claim in CI     → the run is refused           ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo "Each case carries its counter-check: a case that is red for the"
          echo "wrong reason looks exactly like one that is red for the right one."

  # ────────────────────────────────────────────────────────
  # Job 3: Build + Push Docker Image
  # ────────────────────────────────────────────────────────
  # Gebaut wird nur, wenn BEIDES gilt: alle Gates sind gruen, UND die
  # Negativfaelle haben gezeigt, dass die Gates ueberhaupt blockieren
  # koennen.
  #
  # Ohne die zweite Bedingung waere das Erste nichts wert. Ein Katalog, in
  # dem kein Gate mehr rot werden kann — eine kaputte Policy, ein falscher
  # Namespace, eine ins Leere laufende Anwesenheitspflicht — meldet
  # 17/17 PASS und liefert ein Image aus. Genau diese Form von Gruen ist
  # das Gegenteil eines Nachweises, und `needs` ist die Stelle, an der das
  # Kontrollsystem es sich selbst nicht durchgehen laesst.
  #
  # Zur `if`-Bedingung: sie ersetzt die implizite Pruefung auf erfolgreiche
  # `needs` NICHT — ohne Status-Check-Funktion ergaenzt GitHub Actions
  # `success()`. Ein roter Negativfall-Job ueberspringt diesen Job also,
  # auch wenn gate_result 'PASS' meldet.
  build-and-push:
    name: "Build & Push Image"
    runs-on: ubuntu-latest
    # sign-evidence gehoert in needs: sonst entstuende ein Image, dessen
    # Evidenzsignatur nie geprueft wurde — und der Job haengt heute schon
    # an gate_result == PASS, also waere das ein stiller Durchlass.
    needs: [quality-gates, negative-cases, sign-evidence]
    if: needs.quality-gates.outputs.gate_result == 'PASS'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Check for Dockerfile
        id: dockerfile-check
        run: |
          if [ -f "$SCENARIO_DIR/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No Dockerfile — skipping Docker build (gates passed)"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.dockerfile-check.outputs.exists == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: steps.dockerfile-check.outputs.exists == 'true'
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${IMAGE_OWNER}/ambient-ai-scribe"
          docker build \
            -t "${IMAGE_TAG}:${{ github.sha }}" \
            -t "${IMAGE_TAG}:latest" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "genaiops.pipeline.run-id=${{ needs.quality-gates.outputs.pipeline_run_id }}" \
            --label "genaiops.gates.result=PASS" \
            --label "genaiops.gates.count=${{ needs.quality-gates.outputs.gates_total }}" \
            --label "genaiops.gates.passed=${{ needs.quality-gates.outputs.gates_pass }}" \
            "$SCENARIO_DIR"

      - name: Push Docker image
        if: steps.dockerfile-check.outputs.exists == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${IMAGE_OWNER}/ambient-ai-scribe"
          docker push "${IMAGE_TAG}:${{ github.sha }}"
          docker push "${IMAGE_TAG}:latest"
          echo "::notice::Image pushed: ${IMAGE_TAG}:${{ github.sha }}"

      - name: "Pipeline Complete"
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  ✅ GenAIOps Pipeline COMPLETE                          ║"
          echo "║                                                          ║"
          echo "║  Gates:  ${{ needs.quality-gates.outputs.gates_pass }}/${{ needs.quality-gates.outputs.gates_total }} PASS"
          echo "║  Rego:   ${{ needs.quality-gates.outputs.rego_tests }} unit tests"
          echo "║  Evidence: Hash Chain Verified                           ║"
          echo "║                                                          ║"
          echo "║  CDV-Pattern: Contract → Validation → PASS → Deploy     ║"
          echo "╚══════════════════════════════════════════════════════════╝"
